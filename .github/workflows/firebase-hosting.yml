# live 갈래에 올리면 휴대폰 앱(dist/web)을 Firebase 호스팅(https://ardim-jobs.web.app)에 자동으로 올린다.
# 열쇠 파일(서비스 계정 키) 없이, GitHub가 이 저장소에서 온 요청임을 구글에 증명하는 방식(Workload Identity 연동)을 쓴다.
# 구글 쪽 준비: docs/앱_설치_안내.md 의 '자동 올리기 설정' (Cloud Shell 명령 한 번)
name: 앱(Firebase) 배포
on:
  push:
    branches: [live]
    paths: ['dist/web/**', 'firebase.json', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/601957312516/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@ardim-jobs.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firebase 호스팅에 올리기
        run: npx -y firebase-tools@13 deploy --only hosting --project ardim-jobs --non-interactive
