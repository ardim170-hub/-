<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../adapter.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>직업평가 기록지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#17262B; --muted:#5B6A6F; --line:#D2D9D6;
  --accent:#2C6A5B; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6; --warn:#9A5B12; --warn-soft:#F6EAD8; --danger:#A33A2E;
  --b1:#F1F4F2; --b2:#E2ECE8; --b3:#CFE2DA; --b4:#B7D4C8; --b5:#A6CABC; --b6:#90BBAA; --b7:#7BAD99;
  --dot:#17262B; --focus:#2C6A5B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111819; --surface:#192224; --sunk:#141C1E; --ink:#E3EBE9; --muted:#95A5A7; --line:#2B393C;
    --accent:#72B8A5; --accent-ink:#0E1A17; --accent-soft:#1F3631; --warn:#E0A75C; --warn-soft:#3A2C18; --danger:#E57F70;
    --b1:#1A2426; --b2:#1D2D2C; --b3:#213731; --b4:#264337; --b5:#2C513F; --b6:#336049; --b7:#3B7055;
    --dot:#F1F6F4; --focus:#72B8A5; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111819; --surface:#192224; --sunk:#141C1E; --ink:#E3EBE9; --muted:#95A5A7; --line:#2B393C;
  --accent:#72B8A5; --accent-ink:#0E1A17; --accent-soft:#1F3631; --warn:#E0A75C; --warn-soft:#3A2C18; --danger:#E57F70;
  --b1:#1A2426; --b2:#1D2D2C; --b3:#213731; --b4:#264337; --b5:#2C513F; --b6:#336049; --b7:#3B7055;
  --dot:#F1F6F4; --focus:#72B8A5; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 20px}
.top h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .org{color:var(--muted);font-size:13px}
.top .status{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.top .status.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1320px;margin:0 auto;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);padding:18px 14px;background:var(--sunk)}
aside h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 6px 10px}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.clist button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;display:block}
.clist button:hover{background:var(--surface)}
.clist button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.clist .nm{font-weight:600;display:block}
.clist .meta{font-size:12px;color:var(--muted)}
.addbtn{margin-top:12px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:9px;cursor:pointer;color:var(--accent);font-weight:600}
.addbtn:hover{border-color:var(--accent)}
.mselect{display:none}

main{padding:22px 28px 60px;min-width:0}
.empty{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 8px}
.empty .addbtn{width:auto;padding:10px 20px;border-style:solid;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.chead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.chead h2{font-size:26px;margin:0;letter-spacing:-.02em;line-height:1.2}
.chead .sub{color:var(--muted);font-size:13.5px}
.chead .cact{margin-left:auto;display:flex;gap:4px}
.chead .dup{border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;font-size:13px;padding:5px 10px;border-radius:6px;font-weight:600}
.chead .del{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:13px;padding:6px 8px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button .ck{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}

.panel{display:none}
.panel.on{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:84px;line-height:1.65}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"■ ";color:var(--accent)}
.chip[aria-pressed="false"]::before{content:"□ ";color:var(--muted)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.block h3{font-size:15px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block h3 .idx{color:var(--muted);font-weight:500;font-size:13px}
.block .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.sectionlabel{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px}

.stat{display:inline-flex;flex-direction:column;align-items:flex-start;min-width:84px;padding:6px 12px;border-left:2px solid var(--line)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{font-size:11.5px;color:var(--muted)}
.stat.acc{border-left-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:stretch}
.lvl{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:5px;background:var(--accent-soft);color:var(--ink);font-weight:500}
.lvl:empty{display:none}

.pair{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.mini{display:flex;flex-direction:column;gap:3px}
.mini span{font-size:12px;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mrow .left{flex:1 1 360px;min-width:0}
.mrow .right{flex:0 0 auto}

.igrid{overflow-x:auto;margin:4px 0 6px}
.igrid table{border-collapse:collapse;width:100%;min-width:420px}
.igrid th,.igrid td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-size:13.5px}
.igrid th{font-weight:500;color:var(--muted);font-size:12.5px}
.igrid td input{width:74px;padding:5px 7px}
.igrid tfoot td{font-weight:600;border-bottom:0}
.igrid .rl{max-width:250px}

.warnbox{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:13.5px;margin:10px 0}

/* profile */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;overflow-x:auto}
.ptable{min-width:720px}
.prow{display:grid;grid-template-columns:150px 64px minmax(0,1fr);align-items:center;min-height:34px}
.prow + .prow{border-top:1px solid var(--line)}
.prow .pl{font-size:13.5px;font-weight:500;padding-right:8px}
.prow .pl small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;line-height:1.3}
.prow .pv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;padding-right:12px}
.track{position:relative;height:34px}
.band{position:absolute;top:0;bottom:0}
.refline{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed var(--muted);opacity:.7}
.pdot{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px var(--surface)}
.pdot.anim{transition:left .7s cubic-bezier(.2,.8,.2,1)}
.phead{display:grid;grid-template-columns:150px 64px minmax(0,1fr);margin-bottom:4px}
.phead .track{height:auto}
.phead .bl{position:absolute;top:0;font-size:11.5px;color:var(--ink);text-align:center;line-height:1.25;padding:0 2px;word-break:keep-all}
.phead .bl span{display:block;color:var(--muted);font-size:10.5px}
.pfoot{display:grid;grid-template-columns:150px 64px minmax(0,1fr);margin-top:4px}
.pfoot .track{height:28px}
.pfoot .tk{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.pfoot .rf{position:absolute;top:13px;font-size:11px;color:var(--ink);transform:translateX(-50%);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.pdot.anim{transition:none}}

.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--sunk);font-weight:600}

/* report */
.rbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.55;cursor:default}
.secbar{display:flex;justify-content:flex-end;gap:6px;margin:2px 0 4px}
.btn.sm{padding:4px 11px;font-size:12.5px}
.rbar .msg{font-size:13px;color:var(--muted)}
.ro{white-space:pre-wrap;font-size:14px;line-height:1.75;margin:4px 0 6px}
.roempty{color:var(--muted)}
.stale{background:var(--warn-soft);border-left:3px solid var(--warn);padding:6px 10px;border-radius:5px;font-size:13px;margin:6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.block summary{cursor:pointer;font-weight:600;font-size:13.5px}
#aiMsg2:not(:empty),#aiMsg:not(:empty){position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:40;max-width:min(560px,90vw);font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:36px 40px;max-width:860px}
.doc h4{font-size:16px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.doc h4:first-child{margin-top:0}
.doc h5{font-size:14.5px;margin:20px 0 6px}
.doc .desc{font-size:13px;color:var(--muted);margin:0 0 8px}
.doc .fixed{font-size:14px;margin:6px 0}
.doc textarea{border:1px solid transparent;background:var(--sunk);border-radius:5px;padding:8px 10px;min-height:60px;font-size:14px}
.doc textarea:hover{border-color:var(--line)}
.doc .lab{font-size:12px;color:var(--muted);margin:10px 0 3px}
.doc .tbl{margin:8px 0}
.doc .cog td:first-child,.doc .cog th:first-child{width:130px}
.doc .cog td{text-align:left}
.doc .intro{font-size:14px;margin:0 0 16px}

footer.note{max-width:1320px;margin:0 auto;padding:0 28px 30px;color:var(--muted);font-size:12px}
.ask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,20,22,.35);padding:20px}
.ask .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ask p{margin:0 0 16px}
.ask .row{display:flex;justify-content:flex-end;gap:8px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .mselect{display:flex;gap:8px;margin-bottom:14px}
  .mselect select{flex:1}
  .mselect .btn{white-space:nowrap}
  main{padding:16px 14px 48px}
  .doc{padding:22px 16px}
  .top{padding:10px 14px}
  .top .org{display:none}
  .ptable{min-width:520px}
  .prow,.phead,.pfoot{grid-template-columns:104px 50px minmax(0,1fr)}
  .prow .pl{font-size:12.5px}
}
</style>
</head>
<body>
<header class="top">
  <h1>직업평가 기록지</h1>
  <span class="org">화성시아르딤복지관 직업지원팀</span>
  <span class="status" id="status">불러오는 중</span>
</header>
<div class="shell">
  <aside>
    <h2>대상자</h2>
    <ul class="clist" id="clist"></ul>
    <button class="addbtn" id="addBtn" type="button">+ 대상자 추가</button>
  </aside>
  <main id="main"></main>
</div>
<footer class="note">표준점수는 MDS 자동화 양식의 MAND·BGT·HVDT 변환표 기준으로 계산됩니다. 프로그램 배치 수준 구간은 MDS 프로파일 눈금을 따르며, 최종 배치 수준은 평가자가 선택합니다.</footer>

/* ---------- 유틸 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v===''||v==null||isNaN(Number(v))) ? null : Number(v);
const add = (...a) => { const v=a.map(num).filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0) : null; };
const sumObj = o => o ? add(...IK.map(k=>o[k])) : null;
const avg = (...a) => { if(a.some(x=>x==null)) return null; return a.reduce((s,x)=>s+x,0)/a.length; };
const r2 = v => v==null? null : Math.round(v*100)/100;
const fmt = v => v==null? '-' : String(r2(v));
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=='object') a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* 변환표 조회: exact → 정확히 일치, floor → 이하 최대값(엑셀 근사 일치), last → LOOKUP(HVDT 하위검사) */
function lk(key, raw, mode='exact'){
  raw = num(raw); if(raw==null) return null;
  const t = T[key]; if(!t) return null;
  if(mode==='last'){ let v=null; for(const [k,s] of t){ if(k!=null && k<=raw) v=s; } return v==null?0:v; }
  for(const [k,s] of t){ if(k===raw) return s==null?0:s; }
  // 정확히 없으면 이하 최대값, 범위 밖은 끝값
  let best=null, bk=-Infinity, minK=Infinity, minV=null, maxK=-Infinity, maxV=null;
  for(const [k,s] of t){ if(k<=raw && k>bk){bk=k;best=s;} if(k<minK){minK=k;minV=s;} if(k>maxK){maxK=k;maxV=s;} }
  if(raw>maxK) return maxV==null?0:maxV;
  if(best==null) return minV==null?0:minV;
  return best;
}

function ageOf(birth, ref){
  if(!birth) return null; const b=new Date(birth), r=ref?new Date(ref):new Date();
  if(isNaN(b)) return null; let a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth() || (r.getMonth()===b.getMonth() && r.getDate()<b.getDate())) a--; return a;
}
function dotDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${y}. ${m}. ${dd}`; }
function korDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${y}년 ${Number(m)}월 ${Number(dd)}일`; }

/* ---------- 계산 ---------- */
function compute(c){
  const R = {};
  const sex = c.sex==='여' ? 'f' : 'm';
  // BGT
  R.bgtRaw = num(c.bgt?.err); R.bgt = R.bgtRaw==null? null : lk('bgt', R.bgtRaw);
  // HVDT
  R.hv = {};
  for(const h of ['R','L']){
    const s = c.hvdt?.[h] || {};
    const sub = {}; let any=false;
    for(const k of ['shape','size','texture','form']){ const v=num(s[k]); if(v!=null) any=true; sub[k]={raw:v, std: v==null?null:lk('hv_'+k, v, 'last')}; }
    const tot = any ? add(s.shape,s.size,s.texture,s.form) : null;
    R.hv[h] = {sub, raw:tot, std: tot==null? null : lk(h==='R'?'hvdtR':'hvdtL', tot, 'floor')};
  }
  // MAND
  const m = c.mand || {}; const M = {};
  const nutPart = t => num(t)==null? null : 100-num(t);
  M.beads  = {raw: add(m.beads?.R, m.beads?.L)};
  M.thread = {raw: add(m.thread?.O, m.thread?.C)};
  M.tapR = sumObj(m.tap?.R); M.tapL = sumObj(m.tap?.L);
  M.tap    = {raw: add(M.tapR, M.tapL)};
  M.nut    = {raw: add(nutPart(m.nut?.L), nutPart(m.nut?.S))};
  M.slideR = sumObj(m.slide?.R); M.slideL = sumObj(m.slide?.L);
  M.slide  = {raw: add(M.slideR, M.slideL)};
  M.grip   = {raw: add(m.grip?.R, m.grip?.L)};
  M.fnfO = add(sumObj(m.fnf?.OR), sumObj(m.fnf?.OL)); M.fnfC = add(sumObj(m.fnf?.CR), sumObj(m.fnf?.CL));
  M.fnf    = {raw: add(M.fnfO, M.fnfC)};
  M.jump   = {raw: sumObj(m.jump?.X)};
  M.heelF = sumObj(m.heel?.F); M.heelB = sumObj(m.heel?.B);
  M.heel   = {raw: add(M.heelF, M.heelB)};
  M.standO = add(m.stand?.OR, m.stand?.OL); M.standC = add(m.stand?.CR, m.stand?.CL);
  M.stand  = {raw: add(M.standO, M.standC)};
  const tkey = {beads:'beads', thread:'thread', tap:'tap', nut:'nut', slide:'slide', grip:'grip_'+sex, fnf:'fnf', jump:'jump_'+sex, heel:'heel', stand:'stand'};
  for(const k in tkey){ M[k].std = M[k].raw==null? null : lk(tkey[k], M[k].raw); }
  const fineParts = ['beads','thread','tap','nut','slide'].map(k=>M[k].raw);
  const grossParts= ['grip','fnf','jump','heel','stand'].map(k=>M[k].raw);
  M.fine  = {raw: fineParts.every(v=>v!=null) ? add(...fineParts) : null, partial: fineParts.some(v=>v!=null) && !fineParts.every(v=>v!=null)};
  M.gross = {raw: grossParts.every(v=>v!=null) ? add(...grossParts) : null, partial: grossParts.some(v=>v!=null) && !grossParts.every(v=>v!=null)};
  M.fine.std  = M.fine.raw==null?null:lk('fine', M.fine.raw);
  M.gross.std = M.gross.raw==null?null:lk('gross', M.gross.raw);
  M.total = {raw: (M.fine.raw!=null && M.gross.raw!=null) ? M.fine.raw+M.gross.raw : null};
  M.total.std = M.total.raw==null?null:lk('total', M.total.raw);
  M.PC = avg(M.slide.std, M.fnf.std);
  M.MP = avg(M.grip.std, M.jump.std);
  M.KI = avg(M.heel.std, M.stand.std);
  M.BD = avg(M.thread.std, M.nut.std);
  // 손 선호 점수
  const pre = c.hand==='왼손' ? 'Ld_' : 'Rd_';
  const hp = (key, v) => num(v)==null? null : lk(pre+key, v);
  M.hand = {
    beads:{R:num(m.beads?.R), L:num(m.beads?.L), sR:hp('beadsR', m.beads?.R), sL:hp('beadsL', m.beads?.L)},
    tap:  {R:M.tapR, L:M.tapL, sR:hp('tapR', M.tapR), sL:hp('tapL', M.tapL)},
    grip: {R:num(m.grip?.R), L:num(m.grip?.L), sR:hp('gripR_'+sex, m.grip?.R), sL:hp('gripL_'+sex, m.grip?.L)}
  };
  const hs = k => [M.hand[k].sR, M.hand[k].sL];
  M.handAvgR = avg(M.hand.beads.sR, M.hand.tap.sR, M.hand.grip.sR);
  M.handAvgL = avg(M.hand.beads.sL, M.hand.tap.sL, M.hand.grip.sL);
  R.mand = M;
  const hvAvg = avg(R.hv.R.std, R.hv.L.std);
  R.hvAvg = hvAvg;
  // 양손협응
  const b = c.bim || {};
  R.bimTotal = add(...BIM_PARTS.map(p=>b.parts?.[p[0]]));
  return R;
}

let clients = [];          // [{id, ...}]
let current = null;        // id
let currentTab = 'basic';
const store = {mode:'local', col:null}; const remoteSeen = {};
const LS_KEY = 'vocEvalClients.v2';
const saveTimers = {}; const saveChains = {};

function setStatus(t, on){ const s=$('#status'); s.textContent=t; s.classList.toggle('on', !!on); }
function blankClient(){
  return {id:uid(), name:'', disability:'', birth:'', sex:'', hand:'오른손', evalDate:new Date().toISOString().slice(0,10), situation:'-',
    tools:['BGT','기초학습능력평가','다차원양손협응검사','MAND','HVDT'], evaluator:(window.APP_ME||'김주현'),
    cog:{}, bgt:{}, mand:{}, hvdt:{R:{},L:{}}, bim:{parts:{}, pct:{}, limit:'1분 30초'}, obs:'', etc:'', finalLevel:'', report:{}, createdAt:Date.now(), updatedAt:Date.now()};
}
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s? JSON.parse(s) : []; }catch(e){ return []; } }
function mergeLocal(mem){ const loc=loadLocal(); const m=new Map(mem.map(x=>[x.id,x])); for(const l of loc){ const x=m.get(l.id); if(!x || (l.updatedAt||0)>(x.updatedAt||0)) m.set(l.id,l); } return [...m.values()]; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(clients, (k,v)=> k==='_R' ? undefined : v)); return true; }catch(e){ return false; } }

function scheduleSave(c){
  c.updatedAt = Date.now();
  setStatus('저장 중', false);
  clearTimeout(saveTimers[c.id]);
  saveTimers[c.id+'_pending']=true;
  saveTimers[c.id] = setTimeout(()=>{ saveTimers[c.id+'_pending']=false; persist(c); }, 700);
}
function persist(c){
  saveLocal();
  if(store.mode==='db' && (remoteSeen[c.id]||0) > (c.updatedAt||0)){ return; }   // 다른 창의 더 최신 기록을 덮어쓰지 않음
  if(store.mode==='db'){
    const data = JSON.parse(JSON.stringify(c, (k,v)=> k==='_R' ? undefined : v));
    saveChains[c.id] = (saveChains[c.id]||Promise.resolve()).then(()=>store.col.doc(c.id).set(data))
      .then(()=>setStatus('저장됨', true))
      .catch(()=>{ saveLocal(); setStatus('계정 저장에 실패해 이 브라우저에 임시 저장함', false); });
  } else {
    setStatus(saveLocal()? '이 브라우저에 저장됨' : '저장 공간을 쓸 수 없어 새로고침하면 사라집니다', false);
  }
}
async function removeClient(id){
  clients = clients.filter(x=>x.id!==id);
  if(store.mode==='db'){ try{ await store.col.doc(id).delete(); }catch(e){} } else saveLocal();
  current = clients[0]?.id || null; renderAll();
}

async function initStore(){
  clients = loadLocal();
  current = clients[0]?.id || null;
  renderAll();
  setStatus('이 브라우저에 저장됨', false);
  if(!window.claude || typeof window.claude.use!=='function') return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const col = db.collection('data/users/'+id);
    const snap = await col.get();
    while(aiBusy) await new Promise(r=>setTimeout(r,400));   // 작성 중에는 기록을 바꿔치기하지 않음
    clients = loadLocal().length ? mergeLocal(clients) : clients;
    store.mode='db'; store.col=col;
    const remote = snap.docs.filter(d=>d.exists).map(d=>d.data());
    if(remote.length){
      const map = new Map(remote.map(x=>[x.id,x]));
      for(const lc of clients){ const rc=map.get(lc.id); if(!rc || (lc.updatedAt||0) > (rc.updatedAt||0)){ map.set(lc.id, lc); persist(lc); } }
      clients = [...map.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    } else { for(const lc of clients) persist(lc); }
    for(const r of remote) remoteSeen[r.id]=Math.max(remoteSeen[r.id]||0, r.updatedAt||0);
    if(!clients.find(x=>x.id===current)) current = clients[0]?.id || null;
    setStatus('저장됨', true);
    if(!aiBusy) renderAll(); else renderList();
    // 같은 페이지를 여러 창에서 열어도 기록이 서로 맞춰지도록 실시간 동기화
    col.onSnapshot(snap=>{
      let changedCur=false, changedList=false;
      for(const ch of snap.docChanges()){
        const d = ch.doc.exists ? ch.doc.data() : null;
        if(ch.type==='removed' || !d || !d.id) continue;
        remoteSeen[d.id]=Math.max(remoteSeen[d.id]||0, d.updatedAt||0);
        const i = clients.findIndex(x=>x.id===d.id);
        if(i<0){ clients.push(JSON.parse(JSON.stringify(d))); changedList=true; continue; }
        const lc = clients[i];
        if((d.updatedAt||0) > (lc.updatedAt||0) && !(aiBusy && aiCid===d.id) && !saveTimers[d.id+'_pending']){
          clients[i] = JSON.parse(JSON.stringify(d)); changedList=true; if(d.id===current) changedCur=true;
        }
      }
      if(changedList){ clients.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); saveLocal(); }
      if(changedCur && !aiBusy){ renderAll(); setStatus('다른 창에서 바뀐 내용을 불러왔어요', true); }
      else if(changedList) renderList();
    }, ()=>{});
  }catch(e){ /* 로컬 유지 */ }
}

function pBasic(c){

/* 계산 결과를 화면에 반영 */
function refresh(){
  const c=cur(); if(!c) return; const R=compute(c); c._R=R;
  const set=(k,val)=>document.querySelectorAll(`[data-o="${k}"]`).forEach(el=>{ el.textContent = val; });
  const age=ageOf(c.birth,c.evalDate);
  $('#cname') && ($('#cname').textContent = c.name||'이름 없음');
  $('#csub') && ($('#csub').textContent = [c.disability, c.sex, age!=null?`만 ${age}세`:'', c.hand, c.evalDate?`평가일 ${dotDate(c.evalDate)}`:''].filter(Boolean).join(', '));
  set('bgt', fmt(R.bgt)); set('bgtLvl', band(R.bgt));
  const M=R.mand;
  for(const k of ['beads','thread','tap','nut','slide','grip','fnf','jump','heel','stand','fine','gross','total']){ set(`m.${k}.raw`, fmt(M[k].raw)); set(`m.${k}.std`, fmt(M[k].std)); }
  for(const k of ['PC','MP','KI','BD']) set('m.'+k, fmt(M[k]));
  set('mandLvl', band(M.total.std));
  const w=document.querySelector('[data-o="mandWarn"]');
  if(w){ const miss=[]; if(M.fine.partial) miss.push('소근육'); if(M.gross.partial) miss.push('대근육'); w.innerHTML = miss.length? `<div class="warnbox">${miss.join('·')} 소검사 중 비어 있는 항목이 있어 합계와 총점은 모두 입력한 뒤 계산됩니다.</div>`:''; }
  const sums = {tapSum:c.mand?.tap, slideSum:c.mand?.slide, fnfSum:c.mand?.fnf, jumpSum:c.mand?.jump, heelSum:c.mand?.heel};
  for(const [k,o] of Object.entries(sums)){ for(const col of ['R','L','OR','OL','CR','CL','X','F','B']) set(`${k}.${col}`, fmt(sumObj(o?.[col]))); }
  for(const h of ['R','L']){ const H=R.hv[h]; for(const k of ['shape','size','texture','form']) set(`hv.${h}.${k}`, H.sub[k].std==null?'':`표준 ${H.sub[k].std}`); set(`hv.${h}.raw`, fmt(H.raw)); set(`hv.${h}.std`, fmt(H.std)); set(`hv.${h}.lvl`, band(H.std)); }
  set('bimTotal', R.bimTotal==null?'-':`${R.bimTotal}`);
  const lh=document.querySelector('[data-o="levelHint"]');
  if(lh){ const parts=[]; if(R.bgt!=null) parts.push(`BGT ${band(R.bgt)}`); if(R.hvAvg!=null) parts.push(`HVDT ${band(R.hvAvg)}`); if(M.total.std!=null) parts.push(`MAND ${band(M.total.std)}`); lh.textContent = parts.length ? `검사별 배치 수준: ${parts.join(', ')}. 종합해서 선택하세요.` : '점수를 입력하면 검사별 배치 수준이 여기에 표시됩니다.'; }
  // 탭 완료 표시
  const done = {basic:!!(c.name&&c.sex), cog:Object.values(c.cog||{}).some(a=>a&&a.length), bgt:R.bgt!=null, mand:M.total.std!=null, hvdt:R.hv.R.std!=null||R.hv.L.std!=null, bim:R.bimTotal!=null, obs:!!(c.obs||'').trim()};
  document.querySelectorAll('.tabs button').forEach(b=>{ const k=b.dataset.tab; const has=b.querySelector('.ck'); if(done[k] && !has) b.insertAdjacentHTML('beforeend','<span class="ck" aria-label="입력됨"></span>'); if(!done[k] && has) has.remove(); });
}

function profileRows(R, c){
  const rows=[];
  const has = t => (c.tools||[]).includes(t);
  if(has('BGT')||R.bgt!=null) rows.push(['BGT','시각-운동 통합',R.bgt]);
  if(has('HVDT')||R.hv.R.std!=null){ rows.push(['HVDT 오른손','',R.hv.R.std]); rows.push(['HVDT 왼손','',R.hv.L.std]); }
  const M=R.mand;
  if(has('MAND')||M.total.std!=null){
    rows.push(['MAND 소근육','',M.fine.std]); rows.push(['MAND 대근육','',M.gross.std]); rows.push(['MAND 총점','',M.total.std]);
    rows.push(['지속적 통제','PC',M.PC]); rows.push(['근력','MP',M.MP]); rows.push(['운동감각연합','KI',M.KI]); rows.push(['양손민첩성','BD',M.BD]);
  }
  return rows;
}

}

  if(t.dataset.act==='cpPrompt'){ const keys=RSEC.map(s=>s[0]).filter(k=>!TEST_TOOL[k] || (c.tools||[]).includes(TEST_TOOL[k])); const txt=buildPrompt(c, keys); const po=$('#promptOut'); const cm=$('#cpMsg');
    navigator.clipboard.writeText(txt).then(()=>{ cm.textContent='복사했어요. Claude 채팅창에 붙여넣어 보내세요.'; }).catch(()=>{ po.hidden=false; po.value=txt; po.focus(); po.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} cm.textContent= ok? '복사했어요. Claude 채팅창에 붙여넣어 보내세요.' : '아래 상자의 글을 전부 선택해 복사하세요.'; }); return; }
  if(t.dataset.act==='paste'){ const txt=($('#pasteIn')||{}).value||''; if(!txt.trim()){ aiInfo('붙여넣은 내용이 없어요.'); return; } const f=applyPasted(txt); const n=Object.keys(f).length;
    if(!n){ aiInfo('붙여넣은 글에서 칸 표시([[summary]] 같은 줄)를 찾지 못했어요. Claude 답 전체를 그대로 붙여넣어 주세요.'); return; }
    showTab('done', false); document.querySelectorAll('#aiMsg2').forEach(m=>m.textContent=`${Object.keys(f).map(k=>SEC_NAME[k]).join(', ')} 칸을 채웠어요.`); return; }
  if(t.dataset.act==='upd'){ runUpdate(null, t); return; }
  if(t.dataset.upd){ runUpdate([t.dataset.upd], t); return; }
  if(t.dataset.act==='ai'){ runAI(null, t); return; }
  if(t.dataset.ai){ const k=t.dataset.ai; runAI(k==='opinion' ? ['strengths','limits','recommend'] : [k], t); return; }
  if(t.dataset.act==='tpl'){ const g=templateTexts(c); const ks=SCORE_KEYS.filter(k=>g[k]); const filled=ks.some(k=>(c.report?.[k]||'').trim() && c.report[k]!==g[k]);
    (filled ? askConfirm('요약과 검사별 해석 칸을 현재 점수로 새로 채울까요? 이 칸들에 직접 쓴 내용은 바뀝니다.', '새로 채우기') : Promise.resolve(true)).then(ok=>{ if(!ok) return; const cc=cur(); const d=templateFill(cc, ks, true); scheduleSave(cc); renderReport(); $('#aiMsg').textContent = d.length? '현재 점수로 채웠어요.' : '채울 점수가 없어요. 점수를 먼저 입력해 주세요.'; }); return; }
  if(t.dataset.refill){ const cc=cur(); templateFill(cc, [t.dataset.refill], true); scheduleSave(cc); renderReport(); $('#aiMsg').textContent=`${SEC_NAME[t.dataset.refill]} 칸을 현재 점수로 바꿨어요.`; return; }
  if(t.dataset.act==='copy'){ copyReport(); return; }
  if(t.dataset.act==='dl'){ downloadReport(); return; }
});

initStore();
</script>
</body>
</html>
