.glc-pace { position: absolute; left: 0; right: 0; border-top: 2px dashed #172033; z-index: 1; pointer-events: none; }
.glc-pace span { position: absolute; right: 4px; top: -18px; font-size: 10.5px; background: #172033; color: #fff; border-radius: 0; padding: 0 6px; }
.glc-names { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; padding: 16px 8px 0; font-size: 12px; font-weight: 700; text-align: center; }
.gl-htbl { font-size: 13px; }
.gl-htbl th, .gl-htbl td { text-align: center; padding: 6px 8px; white-space: nowrap; }
.gl-htbl tbody th { text-align: left; background: var(--surface-2); font-weight: 700; }
.gl-htbl tr.g-p td { background: #FAFAFF; }
.gl-htbl tr.gap td { padding: 2px; background: var(--line); }
.gl-pill { display: inline-block; min-width: 58px; border-radius: 0; padding: 2px 8px; font-weight: 800; color: #fff; background: #2F9E62; }
.gl-pill.warn { background: #F5A300; }
.gl-pill.low { background: #E5383B; }
.gl-pill.done { background: #1D4ED8; }
.gl-base { border-top: 1px dashed var(--line-strong); padding-top: 10px; }
.gl-base h3 { margin: 0 0 6px; font-size: 14px; }
.gl-btbl tr.how td { white-space: normal; font-size: 11.5px; color: var(--text-2); text-align: left; min-width: 110px; }
.glc { padding-top: 24px; }
/* 출석부: 목표시간 미만 판 · 줄 버튼 */
.at-short { margin: 0 16px 10px; padding: 10px 14px; border: 1.5px solid #FCA5A5; border-radius: 0; background: #FEF2F2; }
.at-short.ok { border-color: #A7E3BF; background: #F0FAF4; }
.at-short-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.at-short-head b { color: #B91C1C; }
.at-short.ok .at-short-head b { color: #1E6B42; }
.at-short-head .chip { margin: 0 0 0 auto; }
.at-short-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; max-height: 220px; overflow: auto; }
.at-short-card { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; text-align: left; padding: 6px 10px; border: 1px solid #FECACA; border-radius: 0; background: #fff; cursor: pointer; font: inherit; font-size: 13px; }
.at-short-card:hover { border-color: #EF4444; box-shadow: 0 2px 6px rgba(239,68,68,.15); }
.at-short-card .gap { color: #B91C1C; font-weight: 800; text-align: right; }
.at-short-card small { grid-column: 1 / -1; color: var(--text-2); font-size: 11px; }
.at-tbl td.hours.short { background: #FECACA; color: #991B1B; font-style: normal; }
.at-short-dot { position: absolute; left: 1px; top: 1px; font-size: 8px; color: #DC2626; }
.at-tbl th.nm .at-rdel { position: static; transform: none; display: inline-block; }
.at-tbl th.nm .at-rbtns { display: none; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); gap: 2px; }
.at-tbl tr:hover th.nm .at-rbtns { display: inline-flex; }
.at-tbl th.nm .at-rfill { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #DBEAFE; color: #1D4ED8; font-weight: 800; line-height: 18px; padding: 0; cursor: pointer; }
.btn-sync { white-space: nowrap; font-weight: 700; }
.btn-sync.spinning { opacity: .7; cursor: progress; }
@media (max-width: 860px) { .btn-sync { padding-inline: 10px; font-size: 13px; } }.prog-mgr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border: 1px dashed var(--line-strong); border-radius: 0; margin-bottom: 10px; }
.prog-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 0; border: 1.5px solid var(--c); color: var(--c); font-weight: 700; font-size: 13px; background: color-mix(in srgb, var(--c) 8%, transparent); }
.prog-chip button { border: 0; background: none; color: var(--c); font-weight: 800; cursor: pointer; padding: 0 0 0 2px; }
.prog-add { display: inline-flex; gap: 4px; margin-left: 4px; }
/* 직업훈련 일정표 (JOB이음터 · 일과놀이반) */
.sched-tabs { margin-bottom: 12px; }
.sched-tabs .chip small { font-weight: 400; opacity: .8; margin-left: 4px; }
.tp { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
@page tp { size: A4 landscape; margin: 8mm; }
/* 현재 접속자 */
.presence { position: relative; }
.presence-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 0; padding: 3px 10px 3px 8px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.presence-dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
.presence-avs { display: inline-flex; }
.presence-avs i, .presence-row > i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #2563EB; color: #fff; font-style: normal; font-size: 11px; font-weight: 800; border: 2px solid var(--surface); margin-left: -6px; }
.presence-avs i:first-child { margin-left: 0; }
.presence-avs i:nth-child(2) { background: #E8590C; } .presence-avs i:nth-child(3) { background: #0E9384; } .presence-avs i:nth-child(4) { background: #7C4DDB; }
.presence-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 1400; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 0; box-shadow: 0 10px 30px rgba(16,24,40,.18); padding: 10px; min-width: 280px; display: flex; flex-direction: column; gap: 6px; }
.presence-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.presence-row > i { margin: 0; }
.presence-row small { display: block; color: var(--text-2); font-size: 11px; }
@media (max-width: 860px) { .presence-btn b, .presence-btn { font-size: 0; gap: 2px; } .presence-btn b { font-size: 12px; } .presence-avs { display: none; } }
/* ---------- 테마: 깔끔한 밝은 화면 + 메뉴마다 고유 색(퍼스널 컬러) ----------
 * 글씨는 순검정 대신 짙은 남회색, 선은 연한 회색, 글씨는 조금 크게.
 * 메뉴 색: --pc 본색 · --ps 연한 바탕 · --pi 글자·버튼용 진한 색 */
.side-nav a[href="#/dashboard"], .bottom-nav a[href="#/dashboard"], body[data-route="dashboard"] { --pc: #4F5BD5; --ps: #EEF0FC; --pi: #3B46B8; }
.side-nav a[href="#/biz"], .bottom-nav a[href="#/biz"], body[data-route="biz"] { --pc: #E8A317; --ps: #FDF5E2; --pi: #9A6400; }
.side-nav a[href="#/map"], .bottom-nav a[href="#/map"], body[data-route="map"] { --pc: #1F9D6B; --ps: #E6F6EF; --pi: #147A52; }
.side-nav a[href="#/cards"], .bottom-nav a[href="#/cards"], body[data-route="cards"] { --pc: #129A9A; --ps: #E3F5F5; --pi: #0D7474; }
.side-nav a[href="#/network"], .bottom-nav a[href="#/network"], body[data-route="network"] { --pc: #5E6B7E; --ps: #EEF1F5; --pi: #434E5F; }
.side-nav a[href="#/schedule"], body[data-route="schedule"] { --pc: #2F7FE0; --ps: #E9F2FD; --pi: #1F62B8; }
.side-nav a[href="#/contacts"], body[data-route="contacts"] { --pc: #E8743B; --ps: #FDEFE7; --pi: #B5501D; }
.side-nav a[href="#/perf"], body[data-route="perf"] { --pc: #8A5CD8; --ps: #F3EEFC; --pi: #6A3DB8; }
.side-nav a[href="#/orders"], body[data-route="orders"] { --pc: #2E9CC9; --ps: #E5F4FA; --pi: #1B7499; }
.side-nav a[href="#/attend"], body[data-route="attend"] { --pc: #D9487A; --ps: #FCEBF1; --pi: #A92D5A; }
.side-nav a[href="#/data"], body[data-route="data"] { --pc: #7A8394; --ps: #F1F3F6; --pi: #555E6E; }
body[data-route] { --accent: var(--pi); --accent-soft: var(--ps); }

body { font-size: 15.5px; line-height: 1.55; letter-spacing: -.005em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--pc, var(--accent)); outline-offset: 2px; }
.view:focus, .view:focus-visible, main:focus-visible { outline: none; }

/* 옆 메뉴: 아이콘은 메뉴 색, 선택된 메뉴는 연한 메뉴 색 바탕 + 왼쪽 색 막대 */
.sidebar { background: #fff; border-right: 1px solid var(--line); }
.brand { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.brand-mark { background: linear-gradient(135deg, #4F5BD5, #2F7FE0); border-radius: 10px; }
.brand-name { color: var(--text); font-weight: 800; font-size: 16px; }
.side-nav { gap: 3px; }
.side-nav a { padding: 8px 10px; font-size: 15px; color: #4A5363; border-radius: 8px; }
.side-nav a svg { width: 30px; height: 30px; padding: 6px; border-radius: 8px; background: var(--ps); color: var(--pi); }
.side-nav a:hover { background: var(--ps); color: var(--text); }
.side-nav a:hover svg { background: #fff; }
.side-nav a.active { background: var(--ps); color: var(--pi); font-weight: 750; }
.side-nav a.active svg { background: var(--pc); color: #fff; box-shadow: none; }
.side-nav a.active::before { display: block; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--pc); }
.side-nav a .count { font-size: 12.5px; }
.side-nav a.active .count { color: var(--pi); }
.side-foot { border-top: 1px solid var(--line); font-size: 12.5px; }
.bottom-nav a.active, .bottom-nav a[aria-current="page"] { color: var(--pi); }

.topbar { background: rgba(255, 255, 255, .94); border-bottom: 1px solid var(--line); }
.search-trigger { border-color: var(--line-strong); border-radius: 8px; height: 42px; font-size: 15px; }
kbd { border-color: var(--line-strong); background: var(--surface-2); color: var(--text-2); border-radius: 4px; }
.scope-select.scoped { border-color: var(--pc); background: var(--ps); color: var(--pi); }
.menu { border: 1px solid var(--line); border-radius: 8px; }

/* 화면 제목: 큰 제목 + 메뉴 색 밑줄, 제목 앞에 메뉴 색 점 */
.page-head { padding: 0 0 14px; background: none; border: 0; border-bottom: 3px solid var(--pc); border-radius: 0; margin-bottom: 22px; align-items: flex-end; }
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -.025em; color: var(--text); display: flex; align-items: center; gap: 10px; }
.page-title::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--pc); flex: none; }
.page-desc { margin-top: 6px; font-size: 14.5px; color: var(--text-2); }
.section-title { font-size: 18.5px; font-weight: 750; letter-spacing: -.015em; color: var(--text); }
.sub { font-size: 13.5px; }
.panel { border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }

.btn { height: 40px; font-size: 14.5px; border-color: var(--line-strong); border-radius: 8px; font-weight: 650; }
.btn:hover { background: var(--surface-2); }
.btn-sm { height: 34px; font-size: 13.5px; }
.btn-primary, #view .btn-primary, .topbar .btn-primary { background: var(--pi, var(--accent)); border-color: var(--pi, var(--accent)); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); background: var(--pi, var(--accent)); }
.btn-ghost { border-color: transparent; }
.input, .select, .textarea { height: 40px; font-size: 15px; border-color: var(--line-strong); border-radius: 6px; }
.textarea { height: auto; }
.input:hover, .select:hover, .textarea:hover { border-color: #9AA3B0; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--pc, var(--accent)); box-shadow: 0 0 0 3px var(--ps, var(--accent-soft)); }
.select.sm, .input.sm { height: 34px; font-size: 14px; }

.badge { border-radius: 999px; font-weight: 650; font-size: 12.5px; }
.badge.outline { border-color: var(--line-strong); color: var(--text-2); }
.chip { border-radius: 999px; border-color: var(--line-strong); color: #3E4756; font-weight: 600; height: 34px; font-size: 14px; }
.chip:hover { border-color: var(--pc); color: var(--pi); }
.chip.on, #view .chip.on { background: var(--pi); border-color: var(--pi); color: #fff; }
.chip-applied { background: var(--ps); color: var(--pi); }
.seg { border-radius: 8px; border-color: var(--line-strong); }
.seg button + button { border-left-color: var(--line-strong); }
.seg button.on { background: var(--pi); }
.qlink { border-radius: 999px; border-color: var(--line-strong); color: var(--text); }
.qlink:hover { border-color: var(--pc); color: var(--pi); }

.kpis { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.kpi { border-right-color: var(--line); }
.kpi-label { color: var(--text-2); font-weight: 650; font-size: 13.5px; }
.kpi-value { font-weight: 800; letter-spacing: -.03em; font-size: 32px; }

table.tbl { font-size: 14.5px; }
.tbl th { color: #4A5363; font-weight: 700; font-size: 13.5px; border-bottom: 1px solid var(--line-strong); background: #FAFBFC; }
.tbl tbody tr:hover td { background: var(--ps, #F7F8FA); }

.drawer { border-left: 0; box-shadow: var(--shadow-lg); }
.dr-head { border-bottom: 1px solid var(--line); border-top: 4px solid var(--pc, var(--accent)); }
.dr-title { font-weight: 800; letter-spacing: -.02em; }
.scrim { background: rgba(30, 37, 48, .32); }
.confirm-panel { border-radius: 12px; border: 0; }
.toast { border-radius: 10px; background: #2A313C; }
.demo-banner { border-radius: 8px; border: 1px solid #F1D9A6; background: #FFF8E8; color: #6B4A0B; }
.prog-mgr, .leaflet-popup-content-wrapper { border-radius: 10px; }
.perf-bar .month-nav b { font-size: 19px; }

/* 실적 세부 목록 (세부사업별 실제 기록) */
.pd { margin-bottom: 14px; }
.pd-grp { border-top: 1px solid var(--line); }
.pd-grp > summary { cursor: pointer; padding: 12px 20px; display: flex; gap: 8px; align-items: baseline; list-style: none; user-select: none; }
.pd-grp > summary::-webkit-details-marker { display: none; }
.pd-grp > summary::before { content: "▸"; color: var(--text-2); width: 12px; transition: transform .15s; }
.pd-grp[open] > summary::before { transform: rotate(90deg); }
.pd-grp > summary:hover { background: var(--surface-2); }
.pd-grp > summary .num { font-weight: 700; color: var(--pi, var(--text)); }
.pd-grp .table-wrap { padding: 0 12px; }
.pd-tbl td { padding: 6px 8px; vertical-align: top; }
.pd-tbl th { padding: 8px; }
.pd-tbl input[type=date] { width: 140px; }
.pd-tbl td:nth-child(2) { min-width: 170px; }
.pd-tbl td:nth-child(3) { width: 42%; }
.pd-tbl .pd-n, .pd-add .pd-n { width: 72px; }
.pd-tbl select { width: auto; max-width: 170px; }
.ct-txt { width: 100%; min-width: 180px; height: auto; min-height: 32px; padding: 5px 8px; resize: vertical; line-height: 1.45; font-size: 13px; field-sizing: content; max-height: 140px; }
.pd-empty { margin: 0; padding: 0 20px 8px 40px; }
.pd-add { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 20px 14px 40px; }
.pd-add .input, .pd-add .select { width: auto; height: 32px; font-size: 13px; }
.pd-add input[type=date] { width: 140px; }
.pd-add .grow { flex: 1 1 200px; }
.pd-out > summary b { color: var(--text-2); }
.ct-date { width: 140px; height: 32px; font-size: 13px; }
.bulk-tbl tr.dup td { opacity: .45; }
/* 사업체·네트워크: 사업체 · 기관 · 명함 탭 */
.hub-tabs { display: flex; gap: 8px; margin: -6px 0 16px; flex-wrap: wrap; }
.hub-tab { --tc: #E8A317; --ts: #FDF5E2; --ti: #9A6400; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: #3E4756; font-weight: 700; font-size: 15.5px; text-decoration: none; }
.hub-tab.hub-network { --tc: #5E6B7E; --ts: #EEF1F5; --ti: #434E5F; }
.hub-tab.hub-cards { --tc: #129A9A; --ts: #E3F5F5; --ti: #0D7474; }
.hub-tab svg { width: 30px; height: 30px; padding: 6px; border-radius: 8px; background: var(--ts); color: var(--ti); fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }

.panel { border-color: #DCE2EA; }
.tbl { font-size: 15px; }

.btn { font-size: 15px; }
.input, .select, .textarea { font-size: 15.5px; }
.sub, .meta { font-size: 14px; }
/* 등록·수정 양식: 왼쪽 회색 이름칸 + 오른쪽 입력칸 (표처럼) */
@media (min-width: 720px) {
  .fsec .frow { grid-template-columns: minmax(0, 1fr) !important; gap: 0 !important; border-top: 2px solid var(--text); }
  .fsec > h3 { border-bottom: 0; padding-bottom: 0; }
  .fsec .field { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 0; border-bottom: 1px solid #E1E6ED; }
  .fsec .field > label { grid-row: 1 / span 4; display: flex; align-items: center; padding: 10px 14px; background: #F4F6F9; font-size: 14.5px; font-weight: 700; color: #2B3440; border-right: 1px solid #E1E6ED; }
  .fsec .field > :not(label) { grid-column: 2; margin: 0 12px; }
  .fsec .field > :nth-child(2) { margin-top: 8px; }
  .fsec .field > :last-child { margin-bottom: 8px; }
  .fsec h3 { font-size: 17px; }
}
@media (max-width: 640px) { .crumb { justify-content: flex-start; } .page-title { font-size: 25px; } }
.tbl:not(.pm-tbl):not(.pt-tbl) > tbody > tr > td:first-child { min-width: 170px; }
@media (min-width: 720px) {
  .fsec .field > :not(label) { width: auto; min-width: 0; justify-self: stretch; box-sizing: border-box; }
  .fsec .field > .input, .fsec .field > .select, .fsec .field > .textarea, .fsec .field > .inline { width: calc(100% - 24px); }
}

/* 복지관 공식 로고 */

.logo-img { height: 46px; width: auto; display: block; }
.logo-tag { display: flex; flex-direction: column; justify-content: center; padding-left: 14px; border-left: 1px solid #D5DBE3; line-height: 1.2; font-size: 12.5px; font-weight: 600; color: #6B7280; white-space: nowrap; }
.logo-tag b { font-size: 17px; font-weight: 850; color: #1F4E9A; letter-spacing: -.02em; }

@media (max-width: 760px) { .logo-img { height: 32px; } .logo-tag { display: none; } }

/* 간단 등록 + 자세히 */
.quick-sec > h3 { font-size: 17px; color: var(--text); }
.quick-sec > h3 .sub { font-weight: 500; margin-left: 6px; }
.more-fields { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.more-fields > summary { cursor: pointer; padding: 12px 14px; font-weight: 750; font-size: 15.5px; list-style: none; }
.more-fields > summary::before { content: "＋ "; color: var(--pi, var(--text-2)); }
.more-fields[open] > summary::before { content: "－ "; }
.more-fields[open] > summary { border-bottom: 1px solid var(--line); }
.more-fields > .fsec { padding: 14px; }
.fill-note { margin-top: 10px; line-height: 1.6; }
.fill-diff { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.input.just-filled { background: #FFF8E1; border-color: #F3C969; }

#syncState.err { cursor: pointer; }
.st-sum { padding: 14px 16px; border-radius: 10px; font-size: 17px; font-weight: 800; margin-bottom: 14px; }
.st-sum.good { background: #E8F6EF; color: #1F7A52; } .st-sum.bad { background: #FDECEF; color: #B4233C; }
.st-sum small { font-size: 14px; font-weight: 500; }
.st-tbl th { white-space: nowrap; }

/* 직원별 고정 색: 이름 앞 점, 표 줄 왼쪽 띠 */
.sdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.sc-row > td:first-child { box-shadow: inset 5px 0 0 var(--sc, transparent); padding-left: 14px; }
.sc-sel { border-left: 5px solid var(--sc, var(--line)) !important; font-weight: 700; min-width: 96px; }
.sc-list { display: flex; flex-direction: column; gap: 8px; }
.sc-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.sc-item.on { border-color: #E8A0AC; background: #FFF5F6; }
.sc-item input { margin-top: 5px; }
.sc-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sc-main b { font-size: 16px; }
.btn-danger.btn-primary { background: #C8364E; border-color: #C8364E; }
.sc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sc-li { box-shadow: inset 4px 0 0 var(--sc, transparent); padding-left: 12px !important; }
.sc-row > th:first-child { box-shadow: inset 5px 0 0 var(--sc, transparent); padding-left: 14px; white-space: nowrap; }
.logo-tag { font-size: 24px; font-weight: 850; color: #1F4E9A; letter-spacing: -.03em; line-height: 1; padding-left: 16px; }
@media (max-width: 1180px) { .logo-tag { font-size: 20px; } }
.mx-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.arc-tree { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 10px 14px; background: #F4F6F9; border: 1px solid #E1E6ED; border-radius: 8px; font-size: 14.5px; }
.arc-tree span { padding: 2px 8px; background: #fff; border: 1px solid #DCE2EA; border-radius: 999px; }

/* 글씨체 통일: 입력 칸·글 상자·고르기 칸도 사이트와 같은 글씨(Pretendard)·같은 크기 */
input, select, textarea, button { font-family: var(--font); }
.input, .select, .textarea, textarea.input { font-family: var(--font); font-size: 15px; color: var(--text); letter-spacing: -0.005em; }
.input.sm, .select.sm, textarea.input.sm { font-size: 14.5px; }
.ct-txt { font-size: 14.5px; line-height: 1.5; padding: 6px 10px; min-height: 36px; }
.input::placeholder, .textarea::placeholder { color: #98A2B3; font-family: var(--font); }
/* 실적표: 사업체 이름과 내용 줄 맞춤 */
.pt-what b.link { font-size: 15px; }
.pt-what .meta { font-size: 13px; }
.pt-tbl td { vertical-align: middle; }
.pt-item { width: 100%; }
.pt-wk { align-self: end; padding-bottom: 10px; white-space: nowrap; }
.sc-move { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
tr.pt-new td { animation: ptNew 2.4s ease-out; }
/* 실적표 직접 입력 줄: 사업체·기관 이름을 굵게 (방문·전화 기록 줄과 같은 모양) */
.pt-place-row { display: flex; align-items: center; gap: 8px; }
.pt-place { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -6px; font: inherit; font-size: 15px; font-weight: 800; color: var(--text); }
.pt-place:hover { border-color: var(--line); }
.pt-place:focus { border-color: var(--accent); background: #fff; outline: none; }
.pt-place::placeholder { font-weight: 500; color: #98A2B3; }
.sec-staff { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
.sec-staff > b { margin-right: 4px; }
.sec-staff-chip { display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-weight: 700; }

/* 담당자별 연락 현황 막대 */
.staff-chart { margin-bottom: 16px; }
.sc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.scb-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--text-2); }
.scb-legend span { display: inline-flex; align-items: center; gap: 6px; }
.scb-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.scb-rows { display: flex; flex-direction: column; gap: 12px; }
.scb-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 70px 230px; gap: 14px; align-items: center; }
.scb-name { font-weight: 800; font-size: 15.5px; white-space: nowrap; }
.scb-track { display: flex; gap: 2px; height: 26px; align-items: stretch; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.scb-seg { display: block; min-width: 4px; }
.scb-seg:first-child { border-radius: 4px 0 0 4px; }
.scb-seg:last-child { border-radius: 0 4px 4px 0; }
.scb-seg:hover { filter: brightness(1.08); }
.scb-zero { align-self: center; padding-left: 10px; font-size: 13px; color: var(--text-2); }
.scb-total { font-size: 14px; color: var(--text-2); white-space: nowrap; }
.scb-total b { font-size: 22px; color: var(--text); margin-right: 2px; }
.scb-meta { font-size: 13px; color: var(--text-2); line-height: 1.45; }
.scb-table { margin-top: 12px; }
.scb-table summary { cursor: pointer; font-weight: 700; color: var(--text-2); font-size: 14px; }
@media (max-width: 900px) { .scb-row { grid-template-columns: 90px minmax(0, 1fr) 60px; } .scb-meta { grid-column: 2 / -1; } }

/* 홍보·방문처 */
.or-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.or-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font: inherit; }
.or-card:hover { border-color: var(--pc, var(--accent)); }
.or-card.on { border-color: var(--pc, var(--accent)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--pc, var(--accent)) 25%, transparent); }
.or-card-t { font-weight: 800; font-size: 15px; }
.or-card b.num { font-size: 26px; line-height: 1; } .or-card b small { font-size: 14px; font-weight: 600; margin-left: 2px; color: var(--text-2); }
.or-bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.or-bar i { display: block; height: 100%; background: #1f9d6b; border-radius: 999px; }
.or-card-s { font-size: 13px; color: var(--text-2); }
.or-sec { margin-bottom: 14px; }
.or-sec-h { padding-bottom: 4px; }
.or-tbl td.clip { max-width: 260px; }
.or-chip { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); font-size: 13px; white-space: nowrap; }
.or-tbl tr.or-done td:first-child { box-shadow: inset 4px 0 0 #1f9d6b; }

/* 실적 대시보드 (기관 실적시트 대시보드처럼) */
.dp { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 18px; overflow: hidden; }
.dp-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 18px; background: #3A4556; color: #fff; }
.dp-title { margin: 0; font-size: 18px; font-weight: 800; color: #fff; }
.dp-ctl { display: flex; align-items: center; gap: 8px; }
.dp-ctl .seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 8px; padding: 3px; }
.dp-ctl .seg button { border: 0; background: transparent; color: #E6EAF0; font: inherit; font-weight: 700; padding: 5px 14px; border-radius: 6px; cursor: pointer; }
.dp-ctl .seg button.on { background: #fff; color: #2B3440; }
.dp-ctl .icon-btn { color: #fff; background: rgba(255,255,255,.12); border: 0; width: 30px; height: 30px; border-radius: 6px; }
.dp-period { min-width: 92px; text-align: center; font-size: 16px; }
.dp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 16px 18px 6px; }
.dp-kpi { border: 1px solid var(--line); border-left: 4px solid #2a78d6; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.dp-kpi.k2 { border-left-color: #eb6834; } .dp-kpi.k3 { border-left-color: #1baf7a; } .dp-kpi.k4 { border-left-color: #6250d6; } .dp-kpi.k5 { border-left-color: #eda100; } .dp-kpi.k6 { border-left-color: #e87ba4; }
.dp-kpi-t { font-size: 13px; color: var(--text-2); font-weight: 700; }
.dp-kpi b { font-size: 28px; font-weight: 850; line-height: 1.1; } .dp-kpi b small { font-size: 14px; margin-left: 2px; color: var(--text-2); font-weight: 600; }
.dp-kpi.done b { color: #1F7A52; } .dp-kpi.low b { color: #B4233C; } .dp-kpi.warn b { color: #9A6A00; }
.dp-kpi-s { font-size: 12.5px; color: var(--text-2); }
.dp-sec-t { padding: 14px 18px 8px; font-weight: 800; font-size: 16px; border-top: 1px solid var(--line); margin-top: 10px; }
.dp-sec-t .sub { font-weight: 500; font-size: 13px; margin-left: 6px; }
.dp-tbl { margin: 0; }
.dp-tbl thead th { background: #3A4556 !important; color: #fff !important; text-align: center; border-color: #4A5568; }
.dp-tbl tbody th { text-align: left; }
.dp-tbl .dp-row { cursor: pointer; } .dp-tbl .dp-row:hover td, .dp-tbl .dp-row:hover th { background: #F4F7FB; }
.dp-tbl .dp-sum th, .dp-tbl .dp-sum td { background: #EEF3FA; font-weight: 800; }
.dp-strong { font-weight: 800; color: #1F4E9A; }
.dp-pc { font-weight: 800; } .dp-pc.done { color: #1F7A52; } .dp-pc.ok { color: #1F5FB0; } .dp-pc.warn { color: #9A6A00; } .dp-pc.low { color: #B4233C; }
.dp-chart { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; padding: 10px 18px 16px; height: 230px; }
.dp-col { display: flex; flex-direction: column; align-items: stretch; gap: 6px; border: 0; background: transparent; cursor: pointer; padding: 0; font: inherit; }
.dp-col-plot { position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
.dp-bar { position: relative; width: 62%; max-width: 46px; background: #2a78d6; border-radius: 4px 4px 0 0; min-height: 0; }
.dp-bar em { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--text); }
.dp-col.on .dp-bar { background: #1c5cab; } .dp-col.future .dp-bar { opacity: .35; }
.dp-col:hover .dp-bar { filter: brightness(1.1); }
.dp-goal { position: absolute; left: 12%; right: 12%; height: 0; border-top: 2px dashed #8A94A6; z-index: 1; }
.dp-col-l { font-size: 12.5px; color: var(--text-2); text-align: center; }
.dp-col.on .dp-col-l { color: var(--text); font-weight: 800; }

/* ---------- 지도 목록: 네이버 지도 '저장' 폴더처럼 ---------- */
.map-folder { border-bottom: 1px solid var(--line); background: var(--surface); }
.map-folder:empty { display: none; }
.mf-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.mf-ic { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; font-size: 16px; }
.mf-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.mf-t > b { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mf-t .sub { font-size: 12.5px; }


.mf-tabs { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; scrollbar-width: none; }
.mf-tabs::-webkit-scrollbar { display: none; }
.mf-tabs button { flex: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); white-space: nowrap; }
.mf-tabs button .num { color: var(--text-2); font-size: 12px; margin-left: 2px; }
.mf-tabs button.on { background: #172033; border-color: #172033; color: #fff; font-weight: 700; }
.mf-tabs button.on .num { color: rgba(255,255,255,.8); }
.mf-month { padding: 0 14px 10px; }
.map-list { position: relative; }
.map-item.pl { grid-template-columns: 12px minmax(0, 1fr) auto; align-items: start; padding: 13px 10px 13px 14px; }
.map-item.pl .mk { background: var(--c); }
.pl-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.pl-top .name { font-size: 15px; font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pl-cat { flex: none; font-size: 12.5px; color: var(--text-2); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-addr { font-size: 13px; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; font-size: 12px; }
.pl-tag { border: 1px solid var(--line-strong); padding: 0 6px; color: var(--text-2); }
.pl-tag.hot { border-color: #172033; color: #172033; font-weight: 700; }
.pl-tag.or { border-color: #7C4DDB; color: #7C4DDB; }
.pl-tag.warn { border-color: var(--danger); color: var(--danger); }
.pl-staff { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); white-space: nowrap; }
.pl-solo { border: 0; background: transparent; cursor: pointer; font-size: 15px; padding: 2px 4px; opacity: .35; }
.map-item.pl:hover .pl-solo, .map-item.pl.on .pl-solo { opacity: .9; }
.map-item.pl.on { background: #EEF4FF; box-shadow: inset 4px 0 0 #1D4ED8; }
.leaflet-marker-icon.mk-hov { z-index: 999 !important; filter: drop-shadow(0 0 5px rgba(29, 78, 216, .85)); transform-origin: center; }
.route-box.mini { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 8px 12px; font-size: 12.5px; }
.route-box.mini > b { font-size: 13px; }
.mf-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 1px; }
.mf-sort { display: inline-flex; gap: 2px; }
.mf-sort button { border: 0; background: none; padding: 2px 6px; font: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.mf-sort button.on { color: var(--text); font-weight: 800; }
.mf-sort button + button::before { content: ''; }

/* ---------- 실적: 연인원 / 실인원 / 횟수 ---------- */
.pm-tri-tbl th.c { text-align: center; border-bottom: 1px solid var(--line); }
.pm-tri-tbl thead tr:first-child th.c:nth-child(3) { background: #F2F6FF; }
.pm-tri-tbl td:nth-child(5), .pm-tri-tbl td:nth-child(6), .pm-tri-tbl td:nth-child(7) { background: #F7F9FF; }
.pt-ppl { margin: 4px 0; font-size: 13.5px; }
.dp-ys { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-2); }

/* ---------- 대시보드: 실시간 코칭 ---------- */
.dpc { margin: 14px 0 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 14px 16px; }
.dpc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.dpc-head h3 { margin: 0; font-size: 17px; }
.dpc-head h3 .sub { font-size: 12.5px; font-weight: 500; }
.dpc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dpc-i { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border-left: 4px solid #9AA3B2; background: var(--surface-2); }
.dpc-i.bad { border-left-color: #D92D20; background: #FEF3F2; }
.dpc-i.warn { border-left-color: #E8590C; background: #FFF6ED; }
.dpc-i.info { border-left-color: #2563EB; background: #EFF4FF; }
.dpc-i.good { border-left-color: #2F9E62; background: #ECFDF3; }
.dpc-i b { font-size: 14.5px; }
.dpc-i p { margin: 3px 0 0; font-size: 13.5px; color: var(--text-2); line-height: 1.55; }
.dpc-i p b { font-size: inherit; color: var(--text); }
.dpc-act { margin-top: 8px; gap: 6px; }
.dpc-more { margin-top: 8px; }
.dpc-more summary { cursor: pointer; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.dpc-ai { margin-bottom: 10px; padding: 12px 14px; border: 1px solid #C7B8F5; background: #F6F3FF; }
.dpc-ai-t { margin-top: 6px; font-size: 14px; line-height: 1.65; }

/* ---------- 연락이력: 완료 / 진행중 / 실패 ---------- */
.oc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 0 16px 10px; }
.oc-bar .chips { margin: 0; }
.oc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.oc-dot.done { background: #2F9E62; } .oc-dot.going { background: #2563EB; } .oc-dot.fail { background: #D92D20; }

/* ---------- 연락이력: 미등록(연락만 한 곳) → 등록 ---------- */

.reg-box { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
.reg-btn { padding: 2px 8px; font-size: 12px; }

/* ---------- 실적 대시보드: 그림 위주 ---------- */
.dp-kpi.click { cursor: pointer; text-align: left; font: inherit; background: #fff; position: relative; transition: box-shadow .15s, transform .15s; }
.dp-kpi.click:hover { box-shadow: 0 4px 14px rgba(16,24,40,.12); transform: translateY(-1px); }
.dp-kpi-go { position: absolute; right: 10px; top: 10px; font-size: 11.5px; color: var(--text-2); }
.dp-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 6px 18px 14px; }
.dp-ic { display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-top: 4px solid #9AA3B2; border-radius: 12px; padding: 12px 14px 10px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
.dp-ic:hover { box-shadow: 0 6px 18px rgba(16,24,40,.12); transform: translateY(-2px); }
.dp-ic.t-done { border-top-color: #1F7A52; } .dp-ic.t-ok { border-top-color: #2a78d6; } .dp-ic.t-warn { border-top-color: #C77700; } .dp-ic.t-low { border-top-color: #C4314B; }

.dp-ic-tag.done { background: #E3F4EC; color: #1F7A52; } .dp-ic-tag.ok { background: #E6F0FB; color: #1c5cab; } .dp-ic-tag.warn { background: #FDF1DD; color: #8A5300; } .dp-ic-tag.low { background: #FBE7EB; color: #B4233C; }
.dp-spark { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 38px; align-items: end; border-bottom: 1px solid var(--line); }
.dp-spark i { position: relative; display: block; background: #A9C7EC; border-radius: 2px 2px 0 0; min-height: 0; }
.dp-spark i.on { background: #2a78d6; }
.dp-spark i.off { background: #E3E7ED; }
.dp-spark i s { position: absolute; left: -1px; right: -1px; height: 0; border-top: 2px solid #3A4556; }
.dp-chart-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dp-tables { margin: 4px 18px 16px; border: 1px solid var(--line); border-radius: 10px; padding: 0 0 8px; }

.dp-tables .dp-sec-t { padding-left: 14px; }
.dp-sum-top { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.dp-sum-n { font-size: 34px; font-weight: 850; }
.dp-dr-h { margin: 18px 0 8px; font-size: 15.5px; }
.dp-cum-svg { width: 100%; height: auto; display: block; }
.dp-chart-sm { height: 150px; padding: 6px 0 4px; gap: 4px; }
.dp-chart-sm .dp-col { cursor: default; }
.dp-hbs { display: grid; gap: 8px; }
.dp-hb { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dp-hb.click { cursor: pointer; border-radius: 6px; } .dp-hb.click:hover { background: #F4F7FB; }
.dp-hb-l { font-weight: 700; font-size: 13.5px; display: flex; flex-direction: column; }
.dp-hb-l small { font-weight: 500; color: var(--text-2); font-size: 11.5px; }
.dp-hb-t { position: relative; height: 14px; background: #EEF1F5; border-radius: 7px; overflow: visible; }
.dp-hb-t i { display: block; height: 100%; border-radius: 7px; }
.dp-hb-pace { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed #3A4556; }
.dp-hb-v { font-size: 13px; white-space: nowrap; }
.dp-hb-v em { font-style: normal; font-weight: 800; margin-left: 4px; }
.dp-hb-v em.done { color: #1F7A52; } .dp-hb-v em.ok { color: #1c5cab; } .dp-hb-v em.warn { color: #8A5300; } .dp-hb-v em.low { color: #B4233C; }
@media (max-width: 600px) { .dp-hb { grid-template-columns: 90px minmax(0, 1fr); } .dp-hb-v { grid-column: 2; } .dp-items { padding: 6px 12px 12px; } }
.dp-cum-svg, .dp-chart-sm, .dp-hbs, .dp-sum-top, .dp-dr-h { flex: none; }
.dp-hb-l.row { flex-direction: row; align-items: center; gap: 2px; }
@media (max-width: 600px) {
  .dp-items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .dp-ic { padding: 10px; gap: 6px; }
  .dp-ic-name { font-size: 13.5px; }
  .dp-ic-mid { flex-direction: column; align-items: flex-start; gap: 6px; }
  .dp-ic-mid .dp-ring { width: 52px; height: 52px; }
  .dp-ic-num > b { font-size: 22px; }
}
/* ---------- 실적: 목표 바로 입력 ---------- */

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* 공통 유틸: 날짜, 문자열, 포맷 */
window.U = (() => {
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => fmt(new Date());
  const parse = s => {
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  /** b - a (일) */
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  function dday(s) {
    const n = diffDays(today(), s);
    if (n === 0) return { label: '오늘', tone: 'warn', n };
    if (n > 0) return { label: `D-${n}`, tone: n <= 3 ? 'accent' : 'outline', n };
    return { label: `${-n}일 지남`, tone: 'danger', n };
  }
  function ago(s) {
    if (!isDate(s)) return '';
    const n = diffDays(s, today());
    if (n < 0) return `${-n}일 후`;
    if (n === 0) return '오늘';
    if (n === 1) return '어제';
    if (n < 30) return `${n}일 전`;
    if (n < 365) return `${Math.floor(n / 30)}개월 전`;
    return `${Math.floor(n / 365)}년 전`;
  }
  const md = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}.${pad(d.getDate())}`; };
  const dateKo = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
  const dateDot = s => isDate(s) ? s.replace(/-/g, '.') : '';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('ko-KR');
  const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);
  const norm = s => String(s ?? '').toLowerCase().replace(/[\s\-().]/g, '');
  /** 회사 이름 비교용: (주)·㈜·주식회사 같은 회사 형태 표기를 지우고 norm (norm이 괄호를 먼저 지우므로 순서가 중요) */
  const orgKey = s => norm(String(s ?? '').replace(/[(（]\s*(주|유|재|사|합|의)\s*[)）]|㈜|주식회사|유한회사|유한책임회사|재단법인|사단법인|합자회사|의료법인|사회복지법인/g, ''));

  /** 검색어를 강조 표시 (이스케이프 후) */
  function hl(text, q) {
    const t = esc(text);
    if (!q) return t;
    const i = String(text ?? '').toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t;
    const raw = String(text);
    return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + q.length)) + '</mark>' + esc(raw.slice(i + q.length));
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  /** 엑셀 날짜(숫자·Date·문자열)를 YYYY-MM-DD로 */

      return pick(PRE) + pick(INDUSTRIES[ind].suf) + int(2, 9);
    };
    const place = () => {
      const a = pick(AREAS);

        };

        // 담당자 명함
        if (si >= 1 && stage !== '보류' || (stage === '보류' && rnd() < .7)) {

          for (let j = 0; j < n; j++) {
            addCard({

              title: j === 0 ? pick(['인사팀장', '관리부장', '총무과장', '공장장', '실장', '대표']) : pick(['주임', '대리', '매니저']),
              phone: `031-${int(350, 379)}-${d4()}`, mobile: `010-${d4()}-${d4()}`, email: `contact${cardN + 1}@example.com`,

      ['복지기관', '해솔 지역아동센터', '청소년 직업체험 프로그램 협력', '소식지 교환'],
      ['교육기관', '다온 특수학교 (예시)', '전공과 학생 현장실습처 연계', '학부모 대상 취업 설명회'],
      ['교육기관', '봉담 평생학습관', '직업훈련 강좌 공동 운영', '강좌 안내문 게시'],

      ['기업·경제단체', '화성 서부 산업단지 협의회', '입주 기업 대상 장애인 고용 설명회', '협의회 소식지 게재'],

      ['언론·홍보', '화성 생활정보 소식지 (예시)', '복지관 취업 성공 사례 기사 게재', '분기별 기사 게재'],
      ['언론·홍보', '지역 공동체 라디오 (예시)', '인터뷰 출연, 채용 캠페인', '캠페인 방송'],

      ['후원·자원봉사', '청명 기업 봉사 모임', '직무 멘토링 자원봉사', '봉사자 모집 공동 홍보'],
      ['의료기관', '동탄 재활의원 (예시)', '취업 전 건강 상담 협력', '대기실 리플릿 비치'],
      ['의료기관', '서부 정신건강 상담센터 (예시)', '정신장애 당사자 취업 연계 사례 협력', '공동 캠페인'],

      ['공공기관', '동탄 청년 일자리 지원 창구', '청년 장애인 구직 연계', '청년 대상 설명회'],

})();

  function toRow(col, x) {

  /** 좌표가 없으면 주소에서 읍·면·동을 찾아 그 중심에 대략 표시 */
  function place(x) {
    const has = x.lat != null && x.lng != null && x.lat !== '' && !isNaN(x.lat) && !isNaN(x.lng);
    if (!x.area && has) x.area = D.areaAt(+x.lat, +x.lng);
    if (!x.area && x.address) x.area = D.detectArea(x.address);
    if (!has && D.AREA_BY_NAME[x.area]) { x.lat = D.AREA_BY_NAME[x.area].lat; x.lng = D.AREA_BY_NAME[x.area].lng; x.approx = true; }
    return x;
  }

  /* ---------- 로컬 저장 (IndexedDB) ---------- */
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function readRaw() {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(KEY);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => rej(q.error);
      });
    } catch (e) {
      try { return JSON.parse(localStorage.getItem(DB_NAME) || 'null'); } catch { return null; }
    }
  }
  async function writeRaw(v) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, KEY);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } catch (e) {
      localStorage.setItem(DB_NAME, JSON.stringify(v));
    }
  }
  let saveTimer = null;

    if (REMOTE) return;

    saveTimer = setTimeout(async () => {
      try { await writeRaw(state); }
      catch (e) { App.toast('저장하지 못했습니다. 저장 공간이 부족할 수 있어요. 명함 사진을 줄이거나 엑셀로 백업하세요.', 'error'); }
    }, 150);
  }

  /* ---------- 공유 모드 (구글 Apps Script) ---------- */
  const sync = { status: REMOTE ? 'loading' : 'local', at: null, error: null };
  const syncListeners = new Set();

    if (!REMOTE) return Promise.resolve();

    pending++;
    setSync('saving');
    return call(fn, ...args)
      .then(r => {
        if (--pending === 0) setSync('saved');
        // 일정은 저장됐지만 구글 캘린더 반영이 안 된 경우 (1분에 한 번만 알림)
        if (r && r.calErr && Date.now() - calWarnAt > 60000) { calWarnAt = Date.now(); App.toast('일정은 저장했지만 구글 캘린더에는 못 넣었어요: ' + r.calErr, 'error'); }
        return r;
      })
      .catch(err => {
        pending--;
        setSync('error', err);
        if (!quiet) App.toast('구글 시트에 저장하지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요. (' + (err && err.message || err) + ')', 'error');
        throw err;
      });
  }
  /* ---------- 보낼 기록 보관함 ----------
   * 등록·수정·삭제는 먼저 이 컴퓨터(보관함)에 적어 두고 구글 시트로 보낸다.
   * 인터넷이 끊기거나 서버가 잠깐 막혀도 지워지지 않고, 다시 연결되면 자동으로 다시 보낸다 */
  const OUTBOX = 'ardim.outbox.v1';
  let outbox = []; try { outbox = JSON.parse(localStorage.getItem(OUTBOX) || '[]') || []; } catch { outbox = []; }
  const saveOutbox = () => { try { localStorage.setItem(OUTBOX, JSON.stringify(outbox)); } catch {} };
  let flushing = false, retryT = null, tries = 0, warned = false;
  const PERMANENT = /권한이 없습니다|사용자 명단|데이터 관리 화면에서만|관리자만/;
  function queueApply(ops) {
    if (!REMOTE || !ops.length) return Promise.resolve();
    outbox.push({ ops, at: Date.now() });
    saveOutbox();
    flush();
    return Promise.resolve();
  }
  async function flush() {

    while (outbox.length) {

        if (warned) { warned = false; App.toast('보관해 둔 기록을 구글 시트에 모두 저장했어요.'); }

  const SHEET_COL = () => Object.fromEntries(COLS.map(c => [SHEETS[c][0], c]));
  function applyOutbox(next) {
    if (!outbox.length) return next;
    const sc = SHEET_COL();
    outbox.forEach(({ ops }) => ops.forEach(o => {
      const col = sc[o.sheet]; if (!col || !next[col]) return;
      if (o.op === 'del') { next[col] = next[col].filter(x => x.id !== o.id); return; }
      const rec = fromRow(col, o.row || {}); rec.id = o.id;

    const { isDemo: _demo, ...rest } = st;
    next.settings = {
      ...rest,
      orgName: st.orgName || '', cityMapUrl: st.cityMapUrl ?? null, links: st.links || null, vworldKey: st.vworldKey || '', vworldDomain: st.vworldDomain || '', perfByProgram: st.perfByProgram || null,
      admins: st.admins || '', members: st.members || '', perms: st.perms || '',
      staff: (res.sheets[STAFF_SHEET[0]] || []).map(r => ({ name: r['이름'], program: r['소속 사업'] || '' })),
    };
    next.isDemo = st.isDemo === 'Y';
    aiServer = !!res.ai;

    // 설정은 항목을 빠짐없이 보낸다 (직원은 따로 '직원' 시트). 글자가 아닌 값은 JSON 글자로
    const settings = {};
