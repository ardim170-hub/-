  const releaseGrid = () => { G.active = false; };
  window.addEventListener('pointerup', () => { if (G.down) { G.down = false; focusEd(); } });
  window.addEventListener('pointercancel', () => { G.down = false; });
  window.addEventListener('pointerdown', ev => { if (!ev.target.closest('#atWrap, .at-brush')) G.active = false; }, true);

  /** 기본 시간으로 빈 칸 채우기 (참여 기간 안의 평일만, 공휴일은 공가) */
  function fillMonth(pids) {
    const m = ui.month, mt = meta(m), hol = new Set(mt.holidays.map(Number));
    const recs = [];
    let n = 0;
    (pids ? people().filter(p => pids.includes(p.id)) : gridList()).forEach(p => {
      const days = daysOf(p.id, m);
      const s = normDate(p.start), en = normDate(p.end);
      let changed = false;
      for (let d = 1; d <= dim(m); d++) {
        const w = wd(m, d); if (w === 0 || w === 6) continue;
        const ds = dstr(m, d);
        if ((s && /^\d{4}-/.test(s) && ds < s) || (en && /^\d{4}-/.test(en) && ds > en)) continue;
        if (days[d]) continue;
        const bh = baseHours(p, m, d);
        days[d] = hol.has(d) ? `${bh}|공` : String(bh);
        changed = true; n++;
      }
      if (changed) { const r = recOf(p.id, m); recs.push({ ...(r ? { id: r.id } : {}), pid: p.id, month: m, days: JSON.stringify(days) }); }
    });
    if (recs.length) S.putMany('att', recs);
    return n;
  }
  function saveMeta(holText, base, goal) {
    const m = ui.month;
    const holidays = String(holText || '').split(/[,\s]+/).map(Number).filter(d => d >= 1 && d <= dim(m));
    const r = recOf('_', m);
    S.putMany('att', [{ ...(r ? { id: r.id } : {}), pid: '_', month: m, days: JSON.stringify({ holidays, base: Number(base) || meta(m).weekdays, goal: Number(goal) || GOAL_HOURS }) }]);
  }

  /* ---------- 참여자 ---------- */
  function addPerson() {
    const m = ui.month;
    const no = S.get().jobPeople.reduce((a, p) => Math.max(a, Number(p.no) || 0), 0) + 1;
    ui.showPeople = true;
    return S.upsert('jp', { no: String(no), name: '', type: '복지형', sub: '참여형', start: `${m}-01`, end: '', pattern: DEFAULT_PATTERN.참여형, staff: S.me() });
  }
  function pasteCommit(text, type, sub) {
    const lines = String(text || '').split(/\r?\n/).map(l => l.split('\t').map(x => x.trim())).filter(l => l[0]);
    let no = S.get().jobPeople.reduce((a, p) => Math.max(a, Number(p.no) || 0), 0);
    const have = new Set(S.get().jobPeople.map(p => p.name + '|' + normDate(p.birth)));
    const fresh = lines.filter(([name, birth]) => !have.has(name + '|' + normDate(birth))).map(([name, birth, start, end]) => ({ no: String(++no), name, type, sub, birth: normDate(birth), start: normDate(start) || `${ui.month}-01`, end: normDate(end), pattern: DEFAULT_PATTERN[sub], staff: S.me() }));
    if (fresh.length) S.upsertMany('jp', fresh);
    return { added: fresh.length, skipped: lines.length - fresh.length };
  }
  function removePerson(id) {
    const undo1 = S.remove('jp', id);
    const recs = S.get().attends.filter(a => a.pid === id).map(a => a.id);
    const undo2 = recs.length ? S.removeMany('att', recs) : null;
    return undo1 ? () => { undo1(); undo2 && undo2(); } : null;
  }

  /* ---------- 엑셀 출석부 불러오기 ---------- */
  const FILL = { '92D050': '공', '00B0F0': '특', '36A0F8': '특', B850D8: '병', BC8FDD: '병', '7030A0': '병', '000000': '결' };
  /** 표(엑셀 시트 또는 붙여넣은 글)에서 출석부를 찾는다.
   *  G = { r0, r1, c0, c1, txt(r,c), fill(r,c), top(r,c) } — top은 합쳐진 칸(구분)의 값 */
  function parseGrid(G, year, sheet, hol) {
    const found = [];
    for (let r = G.r0; r <= G.r1; r++) {
      let nameCol = -1;
      for (let c = G.c0; c <= Math.min(G.c1, 15); c++) if (G.txt(r, c).replace(/\s/g, '') === '성명') { nameCol = c; break; }
      if (nameCol < 0) continue;
      // 머리줄: 이 줄 또는 다음 줄에 "1일".."31일", 이 줄에 "9월". 요약 칸(결근·병가 등)도 찾아 둔다
      const head = {}; let month = 0;
      for (const rr of [r, r + 1]) for (let c = nameCol; c <= G.c1; c++) {
        const t = G.txt(rr, c).replace(/\s/g, '');
        if (rr === r && /^\d{1,2}월$/.test(t)) month = +t.replace('월', '');
        if (/생년/.test(t)) head.birth = c; if (/시작/.test(t)) head.start = c; if (/종료|포기/.test(t)) head.end = c;
        if (ST_BY_LABEL[t]) head[ST_BY_LABEL[t]] = c;
      }
      const dayCol = {};
      for (const rr of [r, r + 1]) for (let c = nameCol; c <= G.c1; c++) { const k = G.txt(rr, c).replace(/\s/g, '').match(/^(\d{1,2})일$/); if (k) dayCol[+k[1]] = c; }
      if (!month || !Object.keys(dayCol).length) continue;
      const m = `${year}-${U.pad(month)}`;
      const holSet = new Set((hol ? hol(m) : HOLIDAYS[m] || []).map(Number));
      const rows = [];
      let colorless = 0, guessed = 0;
      for (let rr = r + 2; rr <= G.r1; rr++) {
        const nm = G.txt(rr, nameCol);
        if (!nm) { if (/인원|합계/.test(G.txt(rr, G.c0) + G.txt(rr, nameCol - 3) + G.txt(rr, nameCol - 1))) break; continue; }
        if (nm.replace(/\s/g, '') === '성명' || /인원/.test(nm)) break;
        const days = {};
        let anyColor = false;
        Object.entries(dayCol).forEach(([d, c]) => {
          const w = new Date(year, month - 1, +d).getDay(); if (w === 0 || w === 6) return;
          const v = G.txt(rr, c);
          const st = FILL[G.fill(rr, c)] || '';
          if (st) anyColor = true;
          if (/휴/.test(v)) days[d] = '휴';
          else if (st === '결') days[d] = `${v && !isNaN(+v) ? +v : ''}|결`;
          else if (v !== '' && !isNaN(+v)) days[d] = st ? `${+v}|${st}` : String(+v);
          else if (st) days[d] = `|${st}`;
        });
        // 색이 없는 표(붙여넣기): 오른쪽 요약 칸 숫자로 채울 수 있는 것은 채운다
        //  - 공휴일에 시간이 적힌 날 = 공가, - 결근 수만큼의 빈 평일 = 결근
        if (!anyColor) {
          const want = k => (head[k] != null ? Number(String(G.txt(rr, head[k])).replace(/[^0-9]/g, '')) || 0 : 0);
          holSet.forEach(d => { const c = cell(days[d]); if (c.h != null && !c.st && want('공') > 0) days[d] = `${c.h}|공`; });
          const blanks = Object.keys(dayCol).map(Number).filter(d => { const w = new Date(year, month - 1, d).getDay(); return w > 0 && w < 6 && !days[d]; });
          if (want('결') && blanks.length === want('결')) blanks.forEach(d => { days[d] = '|결'; });
          const got = k => Object.values(days).filter(v => cell(v).st === k).length;
          if (want('병') > got('병') || want('특') > got('특')) colorless++;
          if (want('결') || want('공')) guessed++;
        }
        // 요일별 기본 시간: 요일마다 가장 많이 나온 시간
        const pat = [1, 2, 3, 4, 5].map(w => { const cnt = {}; Object.entries(days).forEach(([d, v]) => { const c = cell(v); if (c.h != null && new Date(year, month - 1, +d).getDay() === w) cnt[c.h] = (cnt[c.h] || 0) + 1; }); const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; return best ? best[0] : ''; });
        rows.push({ name: nm, type: G.top(rr, nameCol - 3), sub: G.top(rr, nameCol - 2), birth: head.birth != null ? normDate(G.txt(rr, head.birth)) : '', start: head.start != null ? normDate(G.txt(rr, head.start)) : '', end: head.end != null ? normDate(G.txt(rr, head.end)) : '', days, pattern: pat.every(Boolean) ? pat.join(',') : '' });
      }
      if (rows.length) {
        const t = rows[0].type || '', s0 = rows[0].sub || '';
        found.push({ sheet, month: m, label: `${[t, s0].filter(Boolean).join(' ') || '구분 없음'} ${rows.length}명`, rows, on: true, colorless });
      }
      r += 2;
    }
    return found;
  }
  const ST_BY_LABEL = { 공가: '공', 특휴: '특', 병가: '병', 결근: '결' };
  /** 지금 쓰는 엑셀 양식(구분·성명·생년월일·참여시작일·참여종료일·1일~31일)을 읽는다 */
  function parseWorkbook(wb, fileName) {
    const found = [];
    for (const name of wb.SheetNames) {
      const ws = wb.Sheets[name];
      if (!ws['!ref']) continue;
      const rg = XLSX.utils.decode_range(ws['!ref']);
      const at = (r, c) => ws[XLSX.utils.encode_cell({ r, c })];
      const txt = (r, c) => { const x = at(r, c); return x && x.v != null ? String(x.w ?? x.v).trim() : ''; };
      const top = (r, c) => { const mg = (ws['!merges'] || []).find(g => r >= g.s.r && r <= g.e.r && c >= g.s.c && c <= g.e.c); return mg ? txt(mg.s.r, mg.s.c) : txt(r, c); };
      const fill = (r, c) => { const x = at(r, c); return x && x.s && x.s.fgColor && x.s.fgColor.rgb ? String(x.s.fgColor.rgb).toUpperCase().slice(-6) : ''; };
      let year = 0;
      for (let r = rg.s.r; r <= Math.min(rg.e.r, 3) && !year; r++) for (let c = rg.s.c; c <= Math.min(rg.e.c, 20); c++) { const k = txt(r, c).match(/(20\d{2})\s*년/); if (k) { year = +k[1]; break; } }
      if (!year) { const k = String(fileName || '').match(/(20\d{2})/); year = k ? +k[1] : +ui.month.slice(0, 4); }
      found.push(...parseGrid({ r0: rg.s.r, r1: rg.e.r, c0: rg.s.c, c1: rg.e.c, txt, fill, top }, year, name, m => meta(m).holidays));
    }
    return found;
  }
  /** 엑셀에서 복사해 붙여넣은 글(탭으로 나뉜 표). 색은 없으므로 요약 칸으로 공가·결근을 채운다 */
  function parsePaste(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.split('\t'));
    const c1 = Math.max(0, ...lines.map(l => l.length - 1));
    const txt = (r, c) => String((lines[r] || [])[c] ?? '').trim();
    // 합쳐진 칸(구분)은 위쪽의 마지막 값
    const top = (r, c) => { for (let k = r; k >= 0; k--) { const v = txt(k, c); if (v) return /구분|성명/.test(v) ? '' : v; } return ''; };
    return parseGrid({ r0: 0, r1: lines.length - 1, c0: 0, c1, txt, fill: () => '', top }, +ui.month.slice(0, 4), '붙여넣기', m => meta(m).holidays);
  }
  function importPanel() {
    const g = ui.imp;
    return `<div class="at-imp"><b>엑셀에서 찾은 명단</b> <span class="sub">${e(g.file)}</span>
      <div class="at-imp-list">${g.found.map((x, i) => `<label class="check"><input type="checkbox" data-act="at-imp-toggle" data-i="${i}" ${x.on ? 'checked' : ''}>${e(V.monthLabel(x.month))} · ${e(x.label)}${x.colorless ? ` <span class="tv-over">· 병가·특휴 날짜 확인 필요 ${x.colorless}명</span>` : ''}</label>`).join('')}</div>
      <p class="sub" style="margin:4px 0">같은 이름·생년월일인 참여자는 새로 만들지 않고 그 달 기록만 덮어써요. 칸 색(공가 초록·특휴 파랑·병가 보라·결근 검정)도 읽어요.</p>
      <div class="inline"><button class="btn btn-sm btn-primary" type="button" data-act="at-imp-commit">불러오기</button><button class="btn btn-sm" type="button" data-act="at-imp-cancel">취소</button></div></div>`;
  }
  function commitImport() {
    const picked = ui.imp.found.filter(x => x.on);
    const now = new Date();
    const src = `${ui.imp.file} · ${U.today().slice(5).replace('-', '/')} ${U.pad(now.getHours())}:${U.pad(now.getMinutes())}`;
    const byKey = new Map(S.get().jobPeople.map(p => [p.name + '|' + normDate(p.birth), p]));
    let no = S.get().jobPeople.reduce((a, p) => Math.max(a, Number(p.no) || 0), 0);
    const newPeople = [], recs = [];
    let months = new Set();
    picked.forEach(g => g.rows.forEach(r => {
      const key = r.name + '|' + r.birth;
      let p = byKey.get(key) || [...byKey.values()].find(x => x.name === r.name && !r.birth);
      const type = TYPES.find(t => (r.type || '').includes(t.slice(0, 2))) || '복지형';
      const sub = SUBS.find(t => (r.sub || '').includes(t.slice(0, 2))) || '참여형';
      if (!p) { p = { id: U.uid('J'), no: String(++no), name: r.name, type, sub, birth: r.birth, start: r.start, end: r.end, pattern: r.pattern || DEFAULT_PATTERN[sub], staff: S.me(), src }; newPeople.push(p); byKey.set(key, p); }
      const old = recOf(p.id, g.month);
      recs.push({ ...(old ? { id: old.id } : {}), pid: p.id, month: g.month, days: JSON.stringify(r.days), src });
      months.add(g.month);
    }));
    if (newPeople.length) S.putMany('jp', newPeople);
    if (recs.length) S.putMany('att', recs);
    ui.imp = null;
    if (months.size) ui.month = [...months].sort().pop();
    return { people: newPeople.length, recs: recs.length };
  }

  /* ---------- 인쇄 · 엑셀 ---------- */
  function doc(scale = 1) {
    const m = ui.month, mt = meta(m), n = dim(m);
    const list = people().filter(p => activeIn(p, m) && (!ui.group || `${p.type}·${p.sub}` === ui.group));
    const hol = new Set(mt.holidays.map(Number));
    const all = Object.fromEntries(list.map(p => [p.id, daysOf(p.id, m)]));
    const dl = daily(list, m, all);
    const rowMm = +(Math.min(5.2, 165 / Math.max(20, list.length + 4)) * scale).toFixed(2);
    const fs = +(Math.min(7.5, rowMm * 1.55) ).toFixed(2);
    const cls = d => { const w = wd(m, d); return w === 6 ? 'sat' : w === 0 ? 'sun' : hol.has(d) ? 'hol' : ''; };
    const weekSum = (pid, d) => { let s = 0; for (let k = d - 5; k < d; k++) if (k >= 1) { const c = cell(all[pid][k]); if (c.h != null) s += c.h; } return s; };
    const tail = wd(m, n) > 0 && wd(m, n) < 6;
    const tot = { hours: 0, cnt: 0, real: 0 };
    let lastG = null;
    const body = list.map((p, i) => {
      const s = sums(p, m, all[p.id], mt); tot.hours += s.hours; tot.cnt += s.cnt; tot.real += s.real;
      const g = `${p.type}·${p.sub}`; const span = g !== lastG ? list.filter(x => `${x.type}·${x.sub}` === g).length : 0; lastG = g;
      let tds = '';
      for (let d = 1; d <= n; d++) {
        const c0 = cls(d);
        if (c0 === 'sat') { tds += `<td class="wk">${weekSum(p.id, d) || ''}</td>`; continue; }
        if (c0 === 'sun') { tds += '<td class="sun"></td>'; continue; }
        const c = cell(all[p.id][d]);
        tds += `<td class="${c.st ? 'st-' + c.st : ''} ${c.off ? 'off' : ''}">${c.off ? '휴무' : c.h != null ? c.h : ''}</td>`;
      }
      if (tail) tds += `<td class="wk">${weekSum(p.id, n + 1) || ''}</td>`;
      return `<tr style="height:${rowMm}mm">${span ? `<td rowspan="${span}" class="grp">${e(p.type)}<br>${e(p.sub)}</td>` : ''}<td>${i + 1}</td><td class="nm">${e(p.name)}</td>${tds}<td>${s.hours}</td><td>${s.cnt}</td><td>${s.real}</td><td class="st-공">${s.공}</td><td class="st-특">${s.특}</td><td class="st-병">${s.병}</td><td class="st-결">${s.결}</td><td>${s.gt + s.off}</td><td>${s.off}/${OFF_LIMIT}</td></tr>`;
    }).join('');
    const foot = (label, key) => `<tr style="height:${rowMm}mm" class="ft"><td colspan="3">${label}</td>${Array.from({ length: n }, (_, k) => { const d = k + 1, c0 = cls(d); return c0 === 'sat' ? '<td class="wk"></td>' : c0 === 'sun' ? '<td class="sun"></td>' : `<td>${hol.has(d) && key !== 'work' ? '' : dl[d][key] || ''}</td>`; }).join('')}${tail ? '<td class="wk"></td>' : ''}`;
    const sign = '<table class="sign"><tr><th rowspan="2" class="sign-side">결<br>재</th><th>담 당</th><th>팀 장</th></tr><tr><td></td><td></td></tr></table>';
    return `<article class="doc at-doc" style="font-size:${fs}pt">
      <div class="at-doc-head"><h1>${m.slice(0, 4)}년 장애인일자리사업 참여자 근태 현황 <span>(${+m.slice(5, 7)}월)</span></h1>${sign}</div>
      <table class="at-dtbl"><colgroup><col style="width:3.2%"><col style="width:2.2%"><col style="width:4.6%">${Array.from({ length: n + (tail ? 1 : 0) }, () => '<col>').join('')}<col style="width:3.6%"><col style="width:3%"><col style="width:3%"><col style="width:2.2%"><col style="width:2.2%"><col style="width:2.2%"><col style="width:2.2%"><col style="width:2.2%"><col style="width:2.8%"></colgroup>
        <thead><tr><th rowspan="2">구분</th><th rowspan="2">번호</th><th rowspan="2">성명</th><th colspan="${n + (tail ? 1 : 0)}">${+m.slice(5, 7)}월</th><th colspan="9">기준 ${mt.base}일</th></tr>
          <tr>${Array.from({ length: n }, (_, k) => `<th class="${cls(k + 1)}">${k + 1}</th>`).join('')}${tail ? '<th class="wk">계</th>' : ''}<th>시간</th><th>실적<br>건수</th><th>실근무<br>일수</th><th class="st-공">공가</th><th class="st-특">특휴</th><th class="st-병">병가</th><th class="st-결">결근</th><th>근태</th><th>휴무<br>사용</th></tr></thead>
        <tbody>${body}
          <tr style="height:${rowMm}mm" class="ft"><td colspan="3">합계 (${list.length}명)</td><td colspan="${n + (tail ? 1 : 0)}"></td><td>${tot.hours}</td><td>${tot.cnt}</td><td>${tot.real}</td><td colspan="6"></td></tr>
          ${foot('근무 인원', 'work')}<td colspan="9"></td></tr>${foot('병가·공가 사용 인원', 'use')}<td colspan="9"></td></tr>${foot('실 근무 인원', 'real')}<td colspan="9"></td></tr>
          ${places(list).map(pl => `<tr style="height:${rowMm}mm" class="ft"><td colspan="3">${e(pl)} 인원</td>${Array.from({ length: n }, (_, k) => { const d = k + 1, c0 = cls(d); return c0 === 'sat' ? '<td class="wk"></td>' : c0 === 'sun' ? '<td class="sun"></td>' : `<td>${dl[d].place[pl] || ''}</td>`; }).join('')}${tail ? '<td class="wk"></td>' : ''}<td colspan="9"></td></tr>`).join('')}
        </tbody></table>
      <p class="at-doc-legend"><span class="st-공">공가</span><span class="st-특">특휴</span><span class="st-병">병가</span><span class="st-결">결근</span> 토요일 칸은 주간 시간 합계</p>
    </article>`;
  }
  function xlsx() {
    const m = ui.month, mt = meta(m), n = dim(m);
    const list = people().filter(p => activeIn(p, m));
    const head = ['구분', '유형', '번호', '성명', '생년월일', '참여시작일', '참여종료일', ...Array.from({ length: n }, (_, k) => `${k + 1}일(${U.WD[wd(m, k + 1)]})`), '시간', '실적건수', '실근무 일수', '공가', '특휴', '병가', '결근', '근태', '휴무사용'];
    const rows = list.map((p, i) => {
      const days = daysOf(p.id, m), s = sums(p, m, days, mt);
      return [p.type, p.sub, i + 1, p.name, p.birth, p.start, p.end, ...Array.from({ length: n }, (_, k) => { const c = cell(days[k + 1]); return c.off ? '휴무' : c.st ? `${c.h ?? ''}(${ST[c.st].label})` : c.h ?? ''; }), s.hours, s.cnt, s.real, s.공, s.특, s.병, s.결, s.gt + s.off, `${s.off}/${OFF_LIMIT}`];
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`${m.slice(0, 4)}년 장애인일자리사업 참여자 근태 현황 (${+m.slice(5, 7)}월) · 기준 ${mt.base}일`], head, ...rows]), `${+m.slice(5, 7)}월`);
    XLSX.writeFile(wb, `${V.monthLabel(m)} 장애인일자리 출석부.xlsx`);
  }

  return { ui, ST, findRow, srcList, removeSrc, clearMonth, parsePaste, parseInput, applyAll, undo, releaseGrid, page, results, bindGrid, fillMonth, saveMeta, addPerson, pasteCommit, removePerson, parseWorkbook, commitImport, doc, xlsx, sums, cell, meta, people, daysOf };
})();

</script>
<script>
/* 홍보·방문처: 행정복지센터·직업재활시설·장애인단체·특수학급 고등학교·특수학교·임대아파트 등
 * 엑셀(기관 목록)을 한 번에 넣고, 분류별로 몇 곳 중 몇 곳을 다녀왔는지 한눈에 보고, 방문을 바로 기록한다.
 * 데이터는 네트워크 기관(분류·주소·연락처·세부 정보)으로 저장해 지도·상세 화면에도 같이 나온다. */
window.OR = (() => {
  const e = U.esc;
  const ui = { cat: '', q: '', todo: false };
  const VISIT_TYPES = ['방문', '홍보', '미팅', '행사', '전화'];
  const clean = v => String(v ?? '').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
  const num = v => { const n = Number(String(v).replace(/[^0-9.]/g, '')); return String(v).trim() !== '' && !isNaN(n) ? n : null; };

  /* ---------- 엑셀 읽기 ---------- */
  /** 시트마다 모양을 보고 알맞게 읽는다. 돌려주는 것: [{ category, name, address, phone, note, area, info }] */
  function parse(buf) {
    const wb = XLSX.read(buf, { type: 'array' });
    const out = [];
    wb.SheetNames.forEach(sn => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }).map(r => r.map(clean));
      const hi = rows.findIndex(r => r.some(c => /^주\s?소$/.test(c)) && r.some(c => /명$|학교명|단지명/.test(c)));
      const head = hi >= 0 ? rows[hi] : [];
      const col = re => head.findIndex(c => re.test(c));
      if (head.some(c => c === '단지명')) return apartments(rows, hi, col, out);
      if (head.some(c => c === '학교명')) return schools(rows, hi, col, sn, out);
      if (rows.some(r => r.some(c => c === '유')) && rows.some(r => r.some(c => /특수학교/.test(c)))) return specialSchools(rows, out);
      if (hi >= 0) return grouped(rows, hi, col, sn, out);
    });
    // 같은 이름이 여러 곳이면 읍면동을 붙여 구분 (예: 화성시정신건강복지센터 (마도면))
    const cnt = {}; out.forEach(x => { cnt[x.name] = (cnt[x.name] || 0) + 1; });
    out.forEach(x => { if (cnt[x.name] > 1) { const a = D.detectArea(x.address); x.name = `${x.name} (${a || x.address.split(' ').slice(-2).join(' ')})`; } });
    // 다른 분류에 이미 쓴 전화번호가 또 나오면 잘못 복사한 번호일 수 있어 비우고 알려 준다
    const seen = new Map();
    out.forEach(x => {
      const d = x.phone.replace(/\D/g, '');
      if (d.length < 8) return;
      if (seen.has(d) && seen.get(d) !== x.category) { x.phoneWarn = x.phone; x.phone = ''; } else if (!seen.has(d)) seen.set(d, x.category);
    });
    return out;
  }
  /** 분류 칸(예: 행정복지센터·직업재활시설)이 왼쪽에 한 번만 적힌 목록 */
  function grouped(rows, hi, col, sn, out) {
    const nc = col(/명$/), ac = col(/^주\s?소$/), pc = col(/연락처|전화/), rc = col(/비고/);
    let group = '';
    rows.slice(hi + 1).forEach(r => {
      const g = r.slice(0, nc).find(c => c && !/^\d+$/.test(c));
      if (g) group = g;
      const name = r[nc];
      if (!name || name === '계') return;
      out.push({ category: group || sn, name, address: r[ac] || '', phone: r[pc] || '', note: rc >= 0 ? r[rc] : '', info: {} });
    });
  }
  function schools(rows, hi, col, sn, out) {
    const nc = col(/학교명/), ac = col(/^주\s?소$/), pc = col(/연락처/), rc = col(/비고/);
    const sc = col(/특수학급 학급/), tc = col(/순회학급 학급/), ss = col(/특수학급 학생/), ts = col(/순회학급 학생/), tot = col(/^계$/);
    rows.slice(hi + 1).forEach(r => {
      const name = r[nc];
      if (!name || r.some(c => c === '계') && !num(r[col(/^순$/)])) return;
      const info = {};
      if (num(r[sc])) info['특수학급'] = `${num(r[sc])}학급`;
      if (num(r[tc])) info['순회학급'] = `${num(r[tc])}학급`;
      const st = num(r[tot]) ?? ((num(r[ss]) || 0) + (num(r[ts]) || 0));
      if (st) info['학생'] = `${st}명`;
      out.push({ category: /고등/.test(sn) || /고등학교/.test(name) ? '특수학급 고등학교' : sn, name, address: r[ac] || '', phone: r[pc] || '', note: rc >= 0 ? r[rc] : '', info });
    });
  }
  /** 특수학교: 유·초·중·고 칸마다 학교 줄이 있고, 주소는 아래 '1. 성심학교: 주소 (☏전화)' 글에 있다 */
  function specialSchools(rows, out) {
    const GR = { '유': 1, '초': 6, '중': 3, '고': 3 };
    const base = n => n.replace(/\(.*?\)/g, '').replace(/\s+/g, '').trim();
    const by = new Map();
    let level = '';
    rows.forEach(r => {
      const lv = r.find(c => GR[c]);
      if (lv && r.some(c => c === '학교명')) { level = lv; return; }
      const ni = r.findIndex(c => /학교/.test(c) && !/학교명|특수학교|[:<>*☏]|^\d+\./.test(c)); // 안내 글(* 고등학교: 1학급 당 7인, 1. 성심학교: 주소) 빼기
      if (!level || ni < 0) return;
      const name = r[ni], k = base(name);
      const x = by.get(k) || { name: k, kind: (name.match(/\((사립|공립)\)/) || [])[1] || '', levels: {} };
      let cls = 0, st = 0;
      for (let g = 0; g < GR[level]; g++) { cls += num(r[ni + 1 + g * 2]) || 0; st += num(r[ni + 2 + g * 2]) || 0; }
      if (cls || st) x.levels[level] = { cls, st };
      by.set(k, x);
    });
    // 주소·전화
    rows.flat().forEach(c => {
      const m = c.match(/^\d+\.\s*(.+?학교)\s*:\s*(.+?)\s*\(\s*☏?\s*([\d-]+)\s*\)/);
      if (!m) return;
      const x = by.get(base(m[1])) || { name: base(m[1]), kind: '', levels: {} };
      x.address = m[2]; x.phone = m[3]; by.set(base(m[1]), x);
    });
    by.forEach(x => {
      const info = {};
      if (x.kind) info['설립'] = x.kind;
      ['유', '초', '중', '고'].forEach(l => { if (x.levels[l]) info[`${l === '유' ? '유치' : l}부`] = `${x.levels[l].st}명`; });
      const all = Object.values(x.levels).reduce((a, v) => a + v.st, 0);
      if (all) info['학생'] = `${all}명`;
      out.push({ category: '특수학교', name: x.name, address: x.address || '', phone: x.phone || '', note: '', info });
    });
  }
  function apartments(rows, hi, col, out) {
    const nc = col(/단지명/), ac = col(/^주\s?소$/), pc = col(/전화/), rc = col(/비고/), tc = col(/유형/), hc = col(/세대수/), dc = col(/동수/), ec = col(/읍면동/);
    rows.slice(hi + 1).forEach(r => {
      const name = r[nc];
      if (!name) return;
      const info = {};
      if (r[tc]) info['유형'] = r[tc];
      if (num(r[hc])) info['세대'] = `${num(r[hc]).toLocaleString('ko-KR')}세대`;
      if (num(r[dc])) info['동'] = `${num(r[dc])}개 동`;
      out.push({ category: '임대아파트', name, address: r[ac] || '', phone: r[pc] || '', note: r[rc] || '', area: ec >= 0 ? r[ec] : '', info });
    });
  }

  /* ---------- 미리 보기 → 반영 ---------- */
  function plan(list) {
    const nets = S.get().networks, bizs = S.get().businesses;
    return list.map(x => {
      const k = U.orgKey(x.name);
      const ex = nets.find(n => U.orgKey(n.name) === k);
      const biz = !ex && bizs.find(b => U.orgKey(b.name) === k);
      return { ...x, match: ex ? ex.id : '', biz: biz ? biz.name : '', on: !biz };
    });
  }
  function previewHtml(st) {
    const fresh = st.rows.filter(r => r.on && !r.match).length, upd = st.rows.filter(r => r.on && r.match).length;
    const cats = [...new Set(st.rows.map(r => r.category))];
    const warn = st.rows.filter(r => r.phoneWarn);
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">홍보·방문처 가져오기</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <p class="sub" style="margin:0">${e(st.file)} · ${cats.map(c => `${e(c)} ${st.rows.filter(r => r.category === c).length}`).join(' · ')}</p></div>
      <div class="dr-body">
        <p class="sub">새로 <b>${fresh}곳</b>을 기관으로 등록하고, 이미 있는 <b>${upd}곳</b>은 분류·세부 정보·빈 칸을 채워요. 주소로 지도 위치를 차례로 찾아요.</p>
        ${warn.length ? `<p class="form-notice">⚠ 다른 분류와 전화번호가 같은 ${warn.length}곳은 잘못 복사된 번호 같아서 비워 두었어요: ${warn.slice(0, 6).map(r => `${e(r.name)}(${e(r.phoneWarn)})`).join(', ')}${warn.length > 6 ? ' …' : ''}</p>` : ''}
        <div class="table-wrap"><table class="tbl bulk-tbl"><thead><tr><th></th><th>분류</th><th>이름</th><th>주소</th><th>연락처</th><th>세부 정보</th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr class="${r.on ? '' : 'dup'}"><td><input type="checkbox" data-act="or-pick" data-i="${i}" ${r.on ? 'checked' : ''} aria-label="넣기"></td><td class="nowrap">${e(r.category)}</td>
          <td><b>${e(r.name)}</b>${r.match ? ' <span class="badge">채움</span>' : r.biz ? `<div class="meta">사업체 '${e(r.biz)}'로 이미 있음</div>` : ' <span class="badge accent">새로</span>'}</td>
          <td class="clip">${e(r.address)}</td><td class="nowrap num">${e(r.phone)}</td><td class="wrap">${Object.entries(r.info).map(([k, v]) => `${e(k)} ${e(v)}`).join(' · ')}${r.note ? `<div class="meta">${e(r.note)}</div>` : ''}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div class="dr-foot"><button class="btn" type="button" data-act="dr-close">취소</button><button class="btn btn-primary" type="button" data-act="or-commit" ${fresh + upd ? '' : 'disabled'}>새로 ${fresh}곳 · 채움 ${upd}곳 넣기</button></div>`;
  }
  function commit(st) {
    const me = S.me(), today = U.today();
    const rows = st.rows.filter(r => r.on);
    const fresh = rows.filter(r => !r.match).map(r => ({ name: r.name, category: r.category, status: '보통', address: r.address, area: r.area || '', phone: r.phone, relation: '', promo: '', since: today, staff: me, memo: r.note || '', info: r.info }));
    const added = fresh.length ? S.upsertMany('net', fresh) : [];
    const patches = rows.filter(r => r.match).map(r => {
      const n = S.find('net', r.match) || {};
      return { id: r.match, category: r.category, info: { ...(n.info || {}), ...r.info }, ...(n.address ? {} : { address: r.address }), ...(n.phone ? {} : { phone: r.phone }), ...(r.note && !(n.memo || '').includes(r.note) ? { memo: [n.memo, r.note].filter(Boolean).join('\n') } : {}) };
    });
    if (patches.length) S.putMany('net', patches);
    // 주소로 지도 위치 찾기 (서버 부담을 줄이려고 1초에 한 곳씩)
    const queue = [...added, ...patches.map(p => S.find('net', p.id))].filter(n => n && n.address && (n.lat == null || n.approx)).map(n => n.id);
    (async () => { for (const id of queue) { await S.refine('net', id); await new Promise(r => setTimeout(r, 1100)); } })();
    return { added: added.length, filled: patches.length, locating: queue.length };
  }

  /* ---------- 화면 ---------- */
  const CAT_ORDER = ['행정복지센터', '직업재활시설', '장애인단체', '정신건강복지센터', '특수학급 고등학교', '특수학교', '임대아파트'];
  /** 홍보·방문처로 보는 기관: 엑셀로 넣은 분류 + 세부 정보가 있는 기관 */
  const isTarget = n => CAT_ORDER.includes(n.category) || (n.info && Object.keys(n.info).length);
  const visitsOf = n => S.actsOf('net', n.id).filter(a => VISIT_TYPES.includes(a.type));
  function page() {
    const nets = S.view().networks.filter(isTarget);
    const cats = [...new Set([...CAT_ORDER.filter(c => nets.some(n => n.category === c)), ...nets.map(n => n.category)])];
    const yr = U.today().slice(0, 4);
    const visitedThisYear = n => visitsOf(n).some(a => a.date.startsWith(yr));
    const cards = cats.map(c => {
      const list = nets.filter(n => n.category === c), done = list.filter(visitedThisYear).length, pct = list.length ? Math.round(done / list.length * 100) : 0;
      return `<button type="button" class="or-card ${ui.cat === c ? 'on' : ''}" data-act="or-cat" data-cat="${e(c)}"><span class="or-card-t">${e(c)}</span><b class="num">${list.length}<small>곳</small></b>
        <span class="or-bar"><i style="width:${pct}%"></i></span><span class="or-card-s">올해 방문 <b class="num">${done}</b>곳 · ${pct}%</span></button>`;
    }).join('');
    return `
      <div class="page-head"><div><h1 class="page-title">홍보·방문처</h1><div class="page-desc">행정복지센터·직업재활시설·장애인단체·특수학교·임대아파트 등 홍보하러 갈 곳을 분류별로 모아 보고, 다녀온 날을 바로 기록해요.</div></div>
        <div class="inline"><button class="btn btn-primary" type="button" data-act="or-file">기관 목록 엑셀 넣기</button><input type="file" id="orFile" accept=".xlsx,.xls" hidden><a class="btn" href="#/map">지도에서 보기</a></div></div>
      ${nets.length ? `<div class="or-cards"><button type="button" class="or-card ${!ui.cat ? 'on' : ''}" data-act="or-cat" data-cat=""><span class="or-card-t">전체</span><b class="num">${nets.length}<small>곳</small></b><span class="or-bar"><i style="width:${nets.length ? Math.round(nets.filter(visitedThisYear).length / nets.length * 100) : 0}%"></i></span><span class="or-card-s">올해 방문 <b class="num">${nets.filter(visitedThisYear).length}</b>곳</span></button>${cards}</div>
      <div class="toolbar"><input class="input" id="orQ" placeholder="이름·주소·읍면동으로 찾기" value="${e(ui.q)}" style="max-width:320px"><label class="check"><input type="checkbox" data-act="or-todo" ${ui.todo ? 'checked' : ''}>올해 아직 안 간 곳만</label></div>
      <div id="orList">${listHtml(nets)}</div>`
      : `<div class="panel"><div class="empty"><strong>아직 홍보·방문처가 없어요</strong>기관 목록 엑셀(행정복지센터·특수학급·특수학교·임대아파트 등)을 넣으면 분류별로 정리돼요.<div><button class="btn btn-primary" type="button" data-act="or-file">기관 목록 엑셀 넣기</button></div></div></div>`}`;
  }
  function listHtml(nets = S.view().networks.filter(isTarget)) {
    const yr = U.today().slice(0, 4);
    let list = nets.filter(n => (!ui.cat || n.category === ui.cat) && U.match(ui.q, n.name, n.address, n.area, n.category, n.etc));
    if (ui.todo) list = list.filter(n => !visitsOf(n).some(a => a.date.startsWith(yr)));
    const cats = [...new Set([...CAT_ORDER, ...list.map(n => n.category)])].filter(c => list.some(n => n.category === c));
    if (!list.length) return '<div class="panel"><div class="empty">조건에 맞는 곳이 없어요.</div></div>';
    return cats.map(c => {
      const rows = list.filter(n => n.category === c).sort((a, b) => (a.area || '').localeCompare(b.area || '', 'ko') || a.name.localeCompare(b.name, 'ko'));
      return `<section class="panel or-sec"><div class="panel-pad or-sec-h"><h2 class="section-title">${e(c)} <span class="sub num">${rows.length}곳</span></h2></div>
        <div class="table-wrap"><table class="tbl or-tbl"><thead><tr><th>이름</th><th>읍면동</th><th>주소</th><th>연락처</th><th>세부 정보</th><th>기타</th><th>최근 방문</th><th></th></tr></thead><tbody>
        ${rows.map(n => { const v = visitsOf(n)[0]; const thisYear = v && v.date.startsWith(yr); return `<tr class="${thisYear ? 'or-done' : ''}">
          <td><b class="link" data-act="open" data-kind="net" data-id="${n.id}">${e(n.name)}</b>${n.memo ? `<div class="meta">${e(n.memo.split('\n')[0])}</div>` : ''}</td>
          <td class="nowrap">${e(n.area || '')}</td><td class="clip" title="${e(n.address || '')}">${e(n.address || '')}</td>
          <td class="nowrap num">${n.phone ? `<a href="tel:${e(n.phone.replace(/[^0-9+]/g, ''))}">${e(n.phone)}</a>` : '<span class="sub">-</span>'}</td>
          <td>${Object.entries(n.info || {}).map(([k, val]) => `<span class="or-chip">${e(k)} <b>${e(val)}</b></span>`).join('')}</td>
          <td class="or-etc-td"><textarea class="input or-etc" rows="1" data-chg="or-etc" data-id="${n.id}" data-field="etc" placeholder="자유롭게 적기 (담당자, 다음 방문 계획 등)" aria-label="${e(n.name)} 기타">${e(n.etc || '')}</textarea></td>
          <td class="nowrap">${v ? `<b class="num">${U.dateDot(v.date)}</b><div class="meta">${e(v.type)}${v.staff ? ' · ' + e(v.staff) : ''}</div>` : '<span class="sub">아직 없음</span>'}</td>
          <td class="nowrap"><button class="btn btn-sm ${thisYear ? '' : 'btn-primary'}" type="button" data-act="or-visit" data-id="${n.id}">오늘 방문</button></td></tr>`; }).join('')}
        </tbody></table></div></section>`;
    }).join('');
  }
  function bind() {
    const q = document.getElementById('orQ');
    if (q) q.addEventListener('input', U.debounce(() => { ui.q = q.value.trim(); document.getElementById('orList').innerHTML = listHtml(); }, 150));
  }

  return { ui, parse, plan, previewHtml, commit, page, listHtml, bind, isTarget, CAT_ORDER };
})();

</script>
<script>
/* 이용자 관리 (현장중심): 복지관 시트 '이용자입력'에서 이용자를 골라 등록하고,
 * 과정도(대기자 → 초기면접 → 직업상담 → 사례회의 → 직업재활계획서 → 현장훈련 → 취업알선 → 취업)에서 지금 어디까지 왔는지 관리한다.
 * 현장훈련·취업알선·취업은 사업체와 연결하고(예: 문○○ - ○○병원 (취업)), 퇴사·중단하면 대기자로 돌아가며 지난 기록(log)은 남긴다.
 * 우리 시트에는 이용자번호·이름·단계·직업욕구·메모만 두고, 성별·나이·장애정보는 복지관 시트에서 그때그때 불러온다 */
window.CL = (() => {
  const e = U.esc;
  const ui = { q: '', view: 'board', find: '', found: null, finding: false, info: {}, infoAsked: new Set(), pick: null };
  const STAGES = D.CLIENT_STAGES, BIZ = D.CLIENT_BIZ_STAGES;
  // 예전 단계 이름 → 새 이름
  const OLD = { '현장훈련 대기': '현장훈련', '취업 대기': '취업알선' };
  const stageOf = c => { const st = OLD[c.stage] || c.stage; return STAGES.includes(st) ? st : STAGES[0]; };
  const list = () => (S.view().clients || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const stageIdx = c => STAGES.indexOf(stageOf(c));
  const stageDate = (c, st) => { const m = c.stages || {}; return m[st] || m[Object.keys(OLD).find(k => OLD[k] === st)] || ''; };
  const logOf = c => (Array.isArray(c.log) ? c.log : []);
  /** 전에 취업·훈련했다가 그만두고 돌아온 적이 있나 */
  const ends = c => logOf(c).filter(x => x.ev === 'end');
  const bizLine = c => (c.biz && BIZ.includes(stageOf(c)) ? `${c.biz} (${stageOf(c)})` : '');
  /** 복지관 시트에서 기본 정보(성별·나이·장애유형 등) 불러오기: 화면에 보이는 사람만, 한 번씩 */
  function loadInfo(nos, done) {
    const want = nos.filter(n => n && !ui.infoAsked.has(n));
    if (!want.length || !S.REMOTE) return;
    want.forEach(n => ui.infoAsked.add(n));
    S.call('api_orgUserInfo', { nos: want, sheet: S.get().settings.orgPerfSheet || '' }).then(r => { Object.assign(ui.info, r || {}); done && done(); }).catch(() => {});
  }
  const infoLine = c => {
    const i = ui.info[c.no];
    if (!c.no) return '<span class="sub">이용자입력에 없음</span>';
    if (!i) return S.REMOTE ? '<span class="sub">기본 정보 불러오는 중…</span>' : '';
    return [i.sex, i.age && `${i.age}세`, i.type, i.grade && i.grade.replace('장애의 정도가 ', '').replace(' 장애인', ''), i.town].filter(Boolean).map(e).join(' · ');
  };
  /** 이 사람 이름으로 넣은 실적 (실적 화면에서 참여자로 적은 것) */
  const perfsOf = c => [...S.get().perfs.filter(p => S.pplOf(p).includes(c.name)).map(p => ({ d: p.date, item: p.item, staff: p.staff })),
    ...S.get().activities.filter(a => a.fromPerf === 'Y' && S.pplOf(a).includes(c.name)).map(a => ({ d: a.date, item: a.perf, staff: a.staff }))].sort((a, b) => b.d.localeCompare(a.d));

  function page() {
    const all = list(), q = ui.q.trim();
    const rows = all.filter(c => !q || U.match(q, c.name, c.no, c.job, c.memo));
    const counts = STAGES.map(st => rows.filter(c => stageOf(c) === st).length);
    const board = `<div class="cl-board">${STAGES.map((st, k) => `<section class="cl-col${st === '대기자' ? ' wait' : BIZ.includes(st) ? ' biz' : ''}"><h3>${st === '대기자' ? '' : k + '. '}${e(st)} <span class="n">${counts[k]}</span></h3>
        ${rows.filter(c => stageOf(c) === st).map(card).join('') || '<p class="sub cl-none">없음</p>'}</section>`).join('')}</div>`;
    const table = `<div class="table-wrap"><table class="tbl cl-tbl"><thead><tr><th>이름</th><th>이용자번호</th><th>기본 정보</th><th>현재 단계</th><th>연결 사업체</th><th>희망 직종</th><th>담당</th></tr></thead><tbody>
      ${rows.map(c => `<tr data-act="cl-open" data-id="${c.id}" class="click"><td><b>${e(c.name)}</b>${ends(c).length ? ' <span class="cl-re">재등록</span>' : ''}</td><td class="num">${e(c.no || '-')}</td><td>${infoLine(c)}</td><td>${stageBadge(c)}</td><td>${e(bizLine(c))}</td><td>${e(c.job || '')}</td><td>${e(c.staff || '')}</td></tr>`).join('') || '<tr><td colspan="7" class="sub">아직 등록한 이용자가 없어요.</td></tr>'}</tbody></table></div>`;
    return `<div class="page-head"><div><h1 class="page-title">이용자</h1><div class="page-desc">복지관 이용자 명단에서 이용자를 골라 등록하고, 과정도에서 지금 어디까지 진행됐는지 관리해요. 현장훈련·취업알선·취업은 사업체와 연결하고, 퇴사하면 대기자로 돌아가도 지난 기록이 남아요. 성별·나이·장애정보는 복지관 시트에서 그때그때 불러와요.</div></div></div>
      <section class="panel panel-pad cl-add">
        <h2 class="section-title">+ 이용자 추가 <span class="sub">복지관 시트 '이용자입력'에서 찾아요</span></h2>
        <form class="inline" data-form="cl-find" autocomplete="off"><input class="input" id="clFind" value="${e(ui.find)}" placeholder="이름 또는 이용자번호 (예: 홍길동, 2026-00012)" style="max-width:320px"><button class="btn btn-primary" type="submit" ${ui.finding ? 'disabled' : ''}>${ui.finding ? '찾는 중…' : '찾기'}</button></form>
        ${foundHtml()}
      </section>
      <div class="toolbar"><input class="input" id="clQ" value="${e(ui.q)}" placeholder="등록한 이용자 찾기 (이름·번호·희망 직종)" style="max-width:320px">
        <div class="seg"><button type="button" class="${ui.view === 'board' ? 'on' : ''}" data-act="cl-view" data-v="board">과정도 보기</button><button type="button" class="${ui.view === 'table' ? 'on' : ''}" data-act="cl-view" data-v="table">목록 보기</button></div>
        <span class="sub">${rows.length}명</span></div>
      ${ui.view === 'table' ? table : board}`;
  }
  const stageBadge = c => `<span class="cl-stage s${stageIdx(c)}">${stageIdx(c) ? stageIdx(c) + '. ' : ''}${e(stageOf(c))}</span>`;
  const card = c => { const re = ends(c), last = re[re.length - 1];
    return `<button type="button" class="cl-card" data-act="cl-open" data-id="${c.id}"><b>${e(c.name)}${re.length ? ' <span class="cl-re">재등록</span>' : ''}</b> <span class="sub num">${e(c.no || '')}</span>
      <span class="cl-card-i">${infoLine(c)}</span>${bizLine(c) ? `<span class="cl-card-b">🏢 ${e(bizLine(c))}</span>` : ''}${c.job ? `<span class="cl-card-j">희망: ${e(c.job)}</span>` : ''}
      ${last && stageOf(c) === '대기자' ? `<span class="cl-card-j">이전: ${e(last.biz || '')} ${e(last.stage)} → ${U.dateDot(last.d)} ${e(last.note || '종료')}</span>` : ''}
      <span class="cl-dots">${STAGES.slice(1).map((st, k) => `<i class="${k + 1 <= stageIdx(c) ? 'on' : ''}" title="${e(st)} ${e(stageDate(c, st))}"></i>`).join('')}</span><span class="sub">${stageDate(c, stageOf(c)) ? U.dateDot(stageDate(c, stageOf(c))) : ''}${c.staff ? ' · ' + e(c.staff) : ''}</span></button>`; };
  function foundHtml() {
    if (!ui.found) return S.REMOTE ? '<div class="inline" style="margin-top:6px"><button class="btn btn-sm btn-ghost" type="button" data-act="cl-add-manual">이용자입력에 없는 사람으로 추가</button></div>' : '<p class="sub">팀 공유 사이트(구글 시트 연결)에서 복지관 이용자 명단을 찾을 수 있어요. 여기서는 이름만 적어 추가할 수 있어요.</p><div class="inline"><button class="btn btn-sm" type="button" data-act="cl-add-manual">이름만으로 추가</button></div>';
    const have = new Set(S.get().clients.map(c => c.no).filter(Boolean));
    return `<div class="cl-found">${ui.found.length ? ui.found.map((u, i) => `<div class="cl-found-row"><b>${e(u.name)}</b> <span class="num sub">${e(u.no)}</span>
        <span class="sub">${[u.sex, u.age && u.age + '세', u.type, u.grade, u.town].filter(Boolean).map(e).join(' · ')}</span>
        ${have.has(u.no) ? '<span class="badge">이미 등록됨</span>' : `<button class="btn btn-sm btn-primary" type="button" data-act="cl-add" data-i="${i}">추가</button>`}</div>`).join('')
      : `<p class="sub">'${e(ui.find)}'을(를) 이용자입력에서 찾지 못했어요. 이름을 확인하거나, 복지관 시트에 먼저 등록해 주세요.</p>`}
      <div class="inline" style="margin-top:6px"><button class="btn btn-sm" type="button" data-act="cl-add-manual">이용자입력에 없는 사람으로 추가</button></div></div>`;
  }

  /** 상세 (오른쪽 창) */
  function detailHtml(c) {
    const i = ui.info[c.no] || {}, k = stageIdx(c), ps = perfsOf(c), cur = stageOf(c), log = logOf(c);
    const staff = S.staffHere().map(s => s.name);
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">${e(c.name)} <span class="sub num">${e(c.no || '')}</span></h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <p class="sub" style="margin:0">${c.no ? (ui.info[c.no] ? [i.sex, i.birth && `${i.birth} (${i.age}세)`, i.type, i.grade, [i.city, i.town].filter(Boolean).join(' '), i.income].filter(Boolean).map(e).join(' · ') : '기본 정보 불러오는 중…') : '이용자입력에 없는 사람이에요.'}</p></div>
      <div class="dr-body">
        <h3 class="dp-dr-h">과정도 <span class="sub">단계를 누르면 지금 단계가 바뀌고 그날 날짜가 남아요. 현장훈련·취업알선·취업은 사업체를 골라 연결해요</span></h3>
        ${bizLine(c) ? `<div class="cl-now">🏢 <b>${e(c.biz)}</b> (${e(cur)}) ${stageDate(c, cur) ? `<span class="sub">${U.dateDot(stageDate(c, cur))}부터</span>` : ''}
          <button class="btn btn-sm" type="button" data-act="cl-end" data-id="${c.id}">퇴사·중단 → 대기자로</button></div>` : ''}
        <ol class="cl-steps">${STAGES.map((st, j) => `<li class="${st === '대기자' ? (cur === st ? 'cur wait' : 'wait') : j < k ? 'done' : j === k ? 'cur' : ''}"><button type="button" data-act="cl-stage" data-id="${c.id}" data-stage="${e(st)}"><b>${st === '대기자' ? '⏸' : j}</b><span>${e(st)}${BIZ.includes(st) && cur === st && c.biz ? ` · ${e(c.biz)}` : ''}</span></button>
          <input class="input sm" type="date" data-cl-date="${e(st)}" data-id="${c.id}" value="${e(stageDate(c, st))}" aria-label="${e(st)} 날짜"></li>
          ${ui.pick && ui.pick.id === c.id && ui.pick.stage === st ? pickHtml(c, st) : ''}`).join('')}</ol>
        ${cur !== '대기자' && !bizLine(c) ? `<div class="inline" style="margin-top:8px"><button class="btn btn-sm btn-ghost" type="button" data-act="cl-end" data-id="${c.id}">중단 → 대기자로</button></div>` : ''}
        <h3 class="dp-dr-h">지난 기록 <span class="sub">단계가 바뀔 때마다 남아요${ends(c).length ? ` · 퇴사·중단 ${ends(c).length}번` : ''}</span></h3>
        ${log.length ? `<ul class="cl-log">${log.slice().reverse().map(x => `<li class="${x.ev === 'end' ? 'end' : ''}"><span class="num">${U.dateDot(x.d)}</span> ${x.ev === 'end' ? `<b>퇴사·중단</b> ${e(x.biz ? x.biz + ' ' : '')}${e(x.stage)}${x.note ? ' · ' + e(x.note) : ''} → 대기자` : `${e(x.stage)}${x.biz ? ' · 🏢 ' + e(x.biz) : ''}`}${x.by ? ` <span class="sub">${e(x.by)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="sub">아직 없어요.</p>'}
        <form id="clForm" data-id="${c.id}" autocomplete="off">
          <h3 class="dp-dr-h">직업욕구</h3>
          <div class="cl-needs">${D.CLIENT_NEEDS.map(([key, l]) => `<label>${l}<input class="input" name="${key}" value="${e(c[key] || '')}"></label>`).join('')}</div>
          <label class="cl-memo">메모<textarea class="textarea" name="memo" rows="3">${e(c.memo || '')}</textarea></label>
          <label>담당<select class="select" name="staff"><option value="">-</option>${[...new Set([...staff, c.staff].filter(Boolean))].map(n => `<option ${n === c.staff ? 'selected' : ''}>${e(n)}</option>`).join('')}</select></label>
          <div class="inline" style="margin-top:10px"><button class="btn btn-primary" type="button" data-act="cl-save" data-id="${c.id}">저장</button><button class="btn btn-danger-ghost" type="button" data-act="cl-del" data-id="${c.id}">이용자 목록에서 빼기</button></div>
        </form>
        <h3 class="dp-dr-h">이 사람 실적 <span class="sub">실적 화면에서 참여자로 넣은 것 ${ps.length}건</span></h3>
        ${ps.length ? `<table class="tbl"><tbody>${ps.slice(0, 50).map(p => `<tr><td class="num nowrap">${U.dateDot(p.d)}</td><td>${e(p.item)}</td><td class="sub">${e(p.staff || '')}</td></tr>`).join('')}</tbody></table>` : '<p class="sub">아직 없어요. 실적을 넣을 때 참여자 칸에 이 이름을 적으면 여기 모여요.</p>'}
      </div>`;
  }

  /** 사업체 고르기 (현장훈련·취업알선·취업): 이름을 쓰면 등록된 사업체에서 찾고, 없으면 쓴 이름 그대로 */
  function pickHtml(c, st) {
    const names = [...new Set(S.get().businesses.filter(b => !S.isPending(b)).map(b => b.name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    const def = BIZ.includes(stageOf(c)) ? c.biz || '' : (logOf(c).filter(x => x.biz).pop() || {}).biz || '';
    return `<li class="cl-pick"><form data-form="cl-biz" data-id="${c.id}" data-stage="${e(st)}" autocomplete="off">
      <label>${e(st)}할 사업체<input class="input" name="biz" list="clBizList" value="${e(st === '취업' || st === '현장훈련' ? def : '')}" placeholder="사업체 이름 (예: 빈센트병원)" required></label>
      <datalist id="clBizList">${names.map(n => `<option value="${e(n)}">`).join('')}</datalist>
      <label>날짜<input class="input" type="date" name="d" value="${U.today()}"></label>
      <div class="inline"><button class="btn btn-sm btn-primary" type="submit">연결</button><button class="btn btn-sm" type="button" data-act="cl-pick-cancel">취소</button></div></form></li>`;
  }
  const logAdd = (c, x) => [...logOf(c), { by: S.me(), ...x }].slice(-200);
  /** 단계 바꾸기: 고른 단계가 지금 단계가 되고, 날짜가 비어 있으면 오늘로. 사업체 단계면 사업체도 함께 */
  function setStage(c, st, biz, d) {
    const stages = { ...(c.stages || {}) };
    const day = d || stages[st] || U.today();
    stages[st] = day;
    const patch = { id: c.id, stage: st, stages, log: logAdd(c, { d: day, stage: st, biz: BIZ.includes(st) ? (biz && biz.name) || '' : '' }) };
    if (BIZ.includes(st)) { patch.biz = (biz && biz.name) || ''; patch.bizId = (biz && biz.id) || ''; }
    else if (st !== '대기자') { patch.biz = ''; patch.bizId = ''; }
    return S.upsert('cl', patch);
  }
  /** 퇴사·중단: 지금 단계·사업체를 지난 기록에 남기고 대기자로. 이번 과정의 단계 날짜는 비운다 */
  function endNow(c, note, d) {
    const day = d || U.today();
    return S.upsert('cl', { id: c.id, stage: '대기자', stages: { '대기자': day }, biz: '', bizId: '', log: logAdd(c, { d: day, ev: 'end', stage: stageOf(c), biz: c.biz || '', note: note || '' }) });
  }
  function addFrom(u) {
    return S.upsert('cl', { no: u.no || '', name: u.name, stage: '초기면접', stages: { '초기면접': U.today() }, log: [{ d: U.today(), stage: '초기면접', by: S.me() }], biz: '', bizId: '', staff: S.me(), job: '', area: '', hours: '', pay: '', move: '', cert: '', memo: '' });
  }
  return { ui, page, detailHtml, loadInfo, setStage, endNow, addFrom, list, stageOf, STAGES, BIZ };
})();

</script>
<script>
/* 대시보드 위 '실적 대시보드': 구역(현장중심·고용공단)의 실적 분류표로
 * 연간/월간 KPI · 세부사업별 목표 대비 달성률 표 · 월별 실적 막대를 보여 주고, 세부사업을 누르면 담당자별·기록 목록이 열린다 */
window.DP = (() => {
  const e = U.esc;
  const now = () => U.today().slice(0, 7);
  const ui = { mode: 'year', year: +U.today().slice(0, 4), month: now() };
  // 고용지원사업 기본 연간 목표(횟수) — 기관 사업계획 2026 기준. 데이터 관리에서 바꾸려면 settings.goalsBySet
  const GOALS = { '고용지원사업': { '직업상담': 120, '취업알선': 66, '취업확정': 54, '사후관리': 60, '취업자자조모임': 7, '고용자원개발': 60, '사업체관리': 120, '고용네트워크': 2 } };
  const SEC_LABEL = new Proxy({}, { get: (_, k) => D.progLabel(k) }); // 소속 값 → 화면 이름

  /** 지금 보는 구역의 실적 분류표 */
  function setOfScope() {
    const sc = S.getScope();
    if (sc.startsWith('s:')) return S.perfSetOf(sc.slice(2)) || '';
    if (!sc.startsWith('p:')) return '';
    return (S.get().settings.perfByProgram || {})[sc.slice(2)] || '';
  }
  const progOfScope = () => (S.getScope().startsWith('p:') ? S.getScope().slice(2) : '');

  /** 기간(YYYY 또는 YYYY-MM)의 실적 줄: 방문·전화 기록에서 자동으로 잡힌 것 + 직접 입력 */
  function lines(set, prefix, v = S.view()) {
    const acts = S.perfRows(prefix, v).filter(r => r.p.set === set).map(r => ({ id: r.a.id, kind: 'act', item: r.p.item, staff: r.a.staff || '', d: r.d, name: r.t ? r.t.name : '', tk: r.a.targetType, tid: r.t ? r.t.id : '', content: r.a.content || '', how: r.a.type, ppl: S.pplOf(r.a), n: Number(r.a.people) || 1, key: r.a.targetId }));
    const mans = v.perfs.filter(p => p.set === set && (p.date || '').startsWith(prefix)).map(p => ({ id: p.id, kind: 'perf', item: p.item, staff: p.staff || '', d: p.date, name: p.place || '', content: p.note || '', how: '직접 입력', ppl: S.pplOf(p), n: Number(p.people) || 1, key: U.orgKey(p.place) }));
    return [...acts, ...mans].sort((a, b) => a.d.localeCompare(b.d));
  }

  /** 고용지원사업 등: 기본 사업계획 목표 + 실적 화면에서 고친 목표 */
  function goalMap(set) {
    let custom = S.get().settings.goalsBySet; if (typeof custom === 'string') { try { custom = JSON.parse(custom); } catch { custom = null; } }
    return { ...(GOALS[set] || {}), ...((custom || {})[set] || {}) };
  }
  /** 목표: { year(i): 연간 목표, month(i, m): 그 달 목표 } (현장중심은 실적 목표 설정을, 나머지는 기본 사업계획을 쓴다) */
  function goals(set, Y) {
    if (set === GL.SET) {
      const g = GL.goal(), months = Number(g.months) || 12;
      return { year: i => GL.yearGoal(i, Y), month: (i, m) => GL.monthGoal(i, m, Y), note: Y === g.baseYear ? `${g.baseYear}년은 ${13 - months}~12월(${months}개월) 기준` : '연간 = 기준 실적 × 12 ÷ 기준 개월 수' };
    }
    const G = goalMap(set);
    // 월 목표: 연간 목표를 12달에 나눠 다 더하면 연간 목표와 같게 (예: 66 = 6·6·6·6·6·6·5·5·5·5·5·5)
    const month = (i, m) => { const t = G[i]; if (t == null || t === '') return null; const base = Math.floor(t / 12), extra = t - base * 12; return base + (m - 1 < extra ? 1 : 0); };
    return { year: i => (G[i] == null || G[i] === '' ? null : Number(G[i])), month, note: '연간 목표(횟수) 기준 · 월 목표 = 연간을 12달에 나눈 값' };
  }

  const pc = (a, t) => (t ? Math.round(a / t * 1000) / 10 : null);

  /* ---------- 실시간 코칭: 목표 대비 지금 어디쯤인지, 무엇을 더 하면 되는지 ---------- */
  /** 그 달 평일(주말·공휴일 빼고) 목록 */
  function workdays(ym) {
    let hol = []; try { hol = window.AT ? (AT.meta(ym).holidays || []).map(Number) : []; } catch { hol = []; }
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), out = [];
    for (let d = 1; d <= last; d++) { const wd = new Date(y, m - 1, d).getDay(); if (wd && wd !== 6 && !hol.includes(d)) out.push(`${ym}-${U.pad(d)}`); }
    return out;
  }
  // 세부사업마다 바로 할 일 (버튼)
  const ACTION = item => /사업체개발|고용자원개발/.test(item) ? `<button class="btn btn-sm btn-primary" type="button" data-act="new-biz">+ 사업체 발굴 등록</button><a class="btn btn-sm" href="#/map">지도에서 찾기</a>`
    : /사업체관리|고용네트워크/.test(item) ? `<a class="btn btn-sm" href="#/contacts">연락이력 쓰기</a>`

  /** ⚙️ 세부사업·목표 관리: 기관 기본 항목은 목표만, 대시보드에서 더한 항목은 이름·목표·삭제까지. 저장하면 실적 탭에 바로 반영 */
  function mgrHtml(set, Y) {

    const cnt = i => S.get().perfs.filter(p => p.set === set && p.item === i).length + S.get().activities.filter(a => a.fromPerf === 'Y' && a.perf === i).length;
    const num = v => (v == null || v === '' ? '' : v);

        <td>${own ? `<label class="check sub"><input type="checkbox" data-mgr-only="${e(i)}" ${c.countOnly ? 'checked' : ''}>횟수만</label>` : `<span class="sub">${S.NO_PEOPLE.has(i) ? '횟수만' : '사람 수도'}</span>`}</td>
        <td class="r num sub">${n}건</td>
        <td>${own ? `<button class="icon-btn" type="button" data-act="dp-mgr-del" data-item="${e(i)}" aria-label="${e(i)} 지우기" title="${n ? '기록이 있으면 못 지워요' : '지우기'}" ${n ? 'disabled' : ''}>${V.I.close}</button>` : ''}</td></tr>`;
    };
    const gHead = isGL ? '<th class="r">연인원</th><th class="r">실인원</th><th class="r">횟수</th>' : '<th class="r">연간 목표(횟수)</th>';
    return `<details class="dp-mgr" ${ui.mgr ? 'open' : ''} id="dpMgr"><summary data-act="dp-mgr"><b>⚙️ 세부사업·목표 관리</b> <span class="sub">세부사업 추가·이름 바꾸기·목표 고치기 · 저장하면 실적 탭에 바로 반영돼요</span></summary>
      <div class="dp-mgr-body">
        ${isGL ? `<div class="inline goal-top"><label>기준 연도 <input class="input sm num" id="mgrBaseYear" value="${g.baseYear}" style="width:72px"></label><label>기준 개월 수 <input class="input sm num" id="mgrMonths" value="${g.months}" style="width:56px"></label><span class="sub">${g.baseYear}년은 ${13 - (Number(g.months) || 12)}~12월 목표, 다음 해부터 × 12 ÷ ${g.months}</span></div>` : ''}

          <tbody>${items.map(row).join('')}</tbody>
          <tfoot><tr class="dp-mgr-new"><th><input class="input sm" id="mgrNewName" placeholder="새 세부사업 이름 (예: 직장체험)"></th>${isGL ? [0, 1, 2].map(k => `<td class="r"><input class="input sm num mgr-in" id="mgrNewG${k}" placeholder="-" inputmode="numeric"></td>`).join('') : '<td class="r"><input class="input sm num mgr-in" id="mgrNewG0" placeholder="-" inputmode="numeric"></td>'}<td></td><td><label class="check sub"><input type="checkbox" id="mgrNewOnly">횟수만</label></td><td></td><td><button class="btn btn-sm" type="button" data-act="dp-mgr-add">+ 추가</button></td></tr></tfoot></table></div>
        <div class="inline" style="justify-content:space-between;margin-top:8px"><span class="sub">기관 기본 항목은 이름은 그대로, 목표만 고칠 수 있어요. 직접 더한 항목은 이름을 바꾸면 그동안 넣은 실적도 새 이름으로 옮겨져요. '횟수만' = 사업체개발처럼 사람 수(연·실인원) 없이 건수만 세요.</span><button class="btn btn-primary" type="button" data-act="dp-mgr-save">저장</button></div>
      </div></details>`;
  }
  /** 지금 보는 기간의 공통 값 */
  function ctx() {
    const set = setOfScope();
    if (!set || !D.PERF_SETS[set]) return null;
    const items = D.PERF_SETS[set].items, Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`), mm = +M.slice(5, 7), G = goals(set, Y);
    const yLines = lines(set, String(Y)), cum = yLines.filter(l => l.d.slice(0, 7) <= M), mon = yLines.filter(l => l.d.startsWith(M));
    const cnt = (list, i) => S.perfCount(list, i).cnt, sumC = list => items.reduce((a, i) => a + cnt(list, i), 0);
    const gM = Array.from({ length: 12 }, (_, k) => items.reduce((a, i) => a + (G.month(i, k + 1) || 0), 0));
    const first = Math.max(1, gM.findIndex(v => v > 0) + 1 || 1);
    return { set, items, Y, M, mm, G, yLines, cum, mon, cnt, sumC, first };
  }
  /** 막대 몇 개짜리 작은 월별 그래프 (그림만, 누르기 없음) */

  }
  /** KPI 카드를 누르면: 누적(연간 목표 대비) 또는 이 달(월 목표 대비)을 그림으로 */
  function sumHtml(st) {
    const c = ctx(); if (!c) return '';
    const { set, items, Y, M, mm, G, yLines, cum, mon, cnt, sumC, first } = c;
    const isCum = st.kind !== 'mon';
    const list = isCum ? cum : mon;
    const tgt = i => (isCum ? G.year(i) : G.month(i, mm));
    // 지금쯤 가 있어야 할 곳(%): 누적은 이 달까지 월 목표 합 ÷ 연간 목표, 이 달은 지난 평일 비율
    const wd = workdays(M), T = U.today(), frac = M === T.slice(0, 7) ? wd.filter(d => d < T).length / (wd.length || 1) : M < T.slice(0, 7) ? 1 : 0;
    const paceOf = i => { const t = tgt(i); if (!t) return null; if (!isCum) return frac * 100; let g = 0; for (let m = 1; m <= mm; m++) g += G.month(i, m) || 0; return g / t * 100; };
    const tot = sumC(list), totT = items.reduce((a, i) => a + (tgt(i) || 0), 0), p = pc(tot, totT);
    const labels = [], act = [], gl = [];
    let a = 0, g = 0;
    for (let m = first; m <= 12; m++) { a += items.reduce((s2, i) => s2 + cnt(yLines.filter(l => +l.d.slice(5, 7) === m), i), 0); g += items.reduce((s2, i) => s2 + (G.month(i, m) || 0), 0); labels.push(`${m}월`); act.push(a); gl.push(g); }
    const staffs = [...new Set([...S.staffHere().map(x => x.name), ...list.map(l => l.staff).filter(Boolean)])];
    const sv = staffs.map(n => [n, sumC(list.filter(l => l.staff === n))]), smax = Math.max(1, ...sv.map(x => x[1]));
    const title = isCum ? `누적 실적 · ${Y}년 ${first}~${mm}월` : `${Y}년 ${mm}월 실적`;
    const recs = list.slice().sort((x, y) => y.d.localeCompare(x.d));
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">${isCum ? '📈' : '📅'} ${e(title)}</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <div class="seg" style="margin-top:6px"><button type="button" class="${isCum ? 'on' : ''}" data-act="dp-sum" data-kind="cum">누적 (연간 목표 대비)</button><button type="button" class="${isCum ? '' : 'on'}" data-act="dp-sum" data-kind="mon">${mm}월 (월 목표 대비)</button></div></div>
      <div class="dr-body">
        <div class="dp-sum-top">${ring(p, 96)}<div><b class="num dp-sum-n">${U.num(tot)}</b><span class="sub"> / ${U.num(totT)}건 (${isCum ? '연간 목표' : '월 목표'})</span>
          <p class="sub" style="margin:4px 0 0">${p == null ? '' : p >= 100 ? '목표를 채웠어요 👏' : `${U.num(Math.max(0, totT - tot))}건 남았어요.`} ${isCum ? '점선 = 지금쯤 가 있어야 할 곳' : M === T.slice(0, 7) ? `평일 ${wd.filter(d => d < T).length}/${wd.length}일 지남 · 점선 = 지금쯤 가 있어야 할 곳` : ''}</p></div></div>
        ${isCum ? `<h3 class="dp-dr-h">누적 추이 <span class="sub">파란 선 = 쌓인 실적 · 회색 점선 = 쌓인 목표</span></h3>${cumChart(labels, act, gl, Math.max(0, mm - first))}`
          : `<h3 class="dp-dr-h">${mm}월 날짜별 실적</h3>${(() => { const days = Array.from({ length: new Date(Y, mm, 0).getDate() }, (_, k) => k + 1); return miniCols(days.map(d => sumC(mon.filter(l => +l.d.slice(8, 10) === d))), days.map(() => 0), days.map(d => (d % 5 === 1 ? String(d) : '')), M === T.slice(0, 7) ? +T.slice(8, 10) - 1 : -1); })()}`}
        <h3 class="dp-dr-h">세부사업별 <span class="sub">막대 = ${isCum ? '누적' : '이 달'} 실적 ÷ ${isCum ? '연간' : '월'} 목표 · 누르면 그 사업 자세히</span></h3>
        <div class="dp-hbs">${items.map(i => { const cc = S.perfCount(list, i); return hbar(e(i), cc.cnt, tgt(i), paceOf(i), `data-act="dp-item" data-item="${e(i)}" role="button" tabindex="0"`, cc.yeon != null && cc.cnt ? `연 ${cc.yeon} · 실 ${cc.sil}` : ''); }).join('')}</div>
        <h3 class="dp-dr-h">담당자별 <span class="sub">${isCum ? '누적' : '이 달'} 실적</span></h3>
        <div class="dp-hbs">${sv.map(([n, v]) => `<div class="dp-hb"><span class="dp-hb-l row">${V.staffDot(n)}${e(n)}</span><span class="dp-hb-t"><i style="width:${v / smax * 100}%;background:${V.staffColor(n)}"></i></span><span class="dp-hb-v num"><b>${v}</b>건</span></div>`).join('') || '<p class="sub">담당자가 없어요.</p>'}</div>
        <h3 class="dp-dr-h">기록 ${recs.length}건</h3>
        ${recs.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>세부사업</th><th>사업체·기관</th><th>참여자</th><th>담당</th></tr></thead><tbody>${recs.slice(0, 300).map(l => `<tr class="sc-row" style="--sc:${V.staffColor(l.staff)}"><td class="num nowrap">${U.dateDot(l.d)}</td><td class="nowrap"><span class="link" data-act="dp-item" data-item="${e(l.item)}">${e(l.item)}</span></td><td>${l.tid ? `<b class="link" data-act="open" data-kind="${l.tk}" data-id="${l.tid}">${e(l.name)}</b>` : e(l.name || '-')}</td><td>${e((l.ppl || []).join(', '))}</td><td class="nowrap">${e(l.staff)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="sub">아직 기록이 없어요. 실적은 실적 화면에서 넣은 것만 세요.</p>'}
      </div>`;
  }
  /** 세부사업 자세히: 담당자별 (당월·누적) + 기록 목록 */
  function itemHtml(st) {
    const set = setOfScope(), Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`), mm = +M.slice(5, 7);

          ${staffs.map(n => `<tr class="${st.who === n ? 'on' : ''}"><th><button type="button" class="linklike" data-act="dp-who" data-who="${e(n)}">${V.staffDot(n)}${e(n)}</button></th><td class="r num">${fmt(C(all.filter(l => l.staff === n && l.d.startsWith(M))))}</td><td class="r num"><b>${fmt(C(all.filter(l => l.staff === n)))}</b></td></tr>`).join('')}
        </tbody></table></div>

        ${list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>사업체·기관</th><th>참여자</th><th>내용</th><th>담당</th><th>구분</th></tr></thead><tbody>
          ${list.slice(0, 300).map(l => `<tr class="sc-row" style="--sc:${V.staffColor(l.staff)}"><td class="num nowrap">${U.dateDot(l.d)}</td><td>${l.tid ? `<b class="link" data-act="open" data-kind="${l.tk}" data-id="${l.tid}">${e(l.name)}</b>` : `<b>${e(l.name || '-')}</b>`}</td><td>${e((l.ppl || []).join(', '))}</td><td class="wrap">${e(l.content)}</td><td class="nowrap">${e(l.staff)}</td><td class="nowrap sub">${e(l.how)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="sub">아직 기록이 없어요.</p>'}
      </div>`;
  }

  /** AI 코칭에 보낼 숫자 요약 (참여자 이름 같은 개인정보는 넣지 않는다) */
  function coachFacts() {
    const set = setOfScope();
    if (!set) return null;
    const items = D.PERF_SETS[set].items, Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`);
    const yLines = lines(set, String(Y)), cum = yLines.filter(l => l.d.slice(0, 7) <= M), mon = yLines.filter(l => l.d.startsWith(M));

    const label = SEC_LABEL[progOfScope()] || progOfScope(), periodLabel = ui.mode === 'month' ? `${Y}년 ${+M.slice(5, 7)}월` : `${Y}년`;
    return { key: label + periodLabel, set, label, M, text: [`부서: ${label} (${set})`, `기준: ${M} (오늘 ${U.today()}, 이번 달 남은 평일 ${cd.left}일)`, ...cd.facts].join('\n') };
  }

  return { ui, panel, itemHtml, sumHtml, setOfScope, lines, goals, goalMap, coachFacts };
})();

  /* ---------- Toast / Confirm ---------- */
  function toast(msg, type = '', opt = {}) {

  function confirmBox(title, body, ok = '확인') {

  const GATES = {

    'ai-summary': [['biz', 2]], 'ai-research': [['biz', 2]], 'edit-research': [['biz', 2]], 'sv-biz-edit': [['biz', 2]], 'sv-job-edit': [['biz', 2]], 'sv-clear': [['biz', 2]], 'sv-job-del': [['biz', 3]],

    'new-card': [['cards', 2]], 'card-link-to': [['cards', 2]], 'card-autolink': [['cards', 2]], 'card-photo': [['cards', 2]], 'card-pdf': [['cards', 2]], 'card-bulk-commit': [['cards', 2]], 'photo-clear': [['cards', 2]],
    'map-addmode': [['biz', 2]],
    'new-event': [['schedule', 2]], 'ev-import': [['schedule', 2]], 'edit-event': [['schedule', 2]], 'ev-toggle': [['schedule', 2]], 'ev-del': [['schedule', 3]],
    'ct-paste': [['contacts', 2]], 'ct-oc': [['contacts', 2]], 'ct-reg-form': [['contacts', 2]], 'ct-reg': [['contacts', 2]], 'ct-reg-all': [['contacts', 2]], 'ct-unreg': [['contacts', 2]], 'ct-file': [['contacts', 2]], 'ct-paste-commit': [['contacts', 2]], 'ct-url': [['contacts', 2]],

    if (act === 'triage') return d.to === 'personal' ? [['cards', 2]] : [['cards', 2], [KIND_MENU[d.to], 2]];
    if (act === 'act-del') { const x = S.find('act', d.id); return [[x && x.targetType === 'net' ? 'network' : 'biz', 3]]; }

  const FORM_GATES = { 'cl-biz': [['clients', 2]], 'ct-add': [['contacts', 2]], 'perf-add': [['perf', 2]], 'sv-biz': [['biz', 2]], 'sv-job': [['biz', 2]] };
  const CHG_GATES = { 'or-etc': [['network', 2]], 'pa-field': [['perf', 2]], 'pf-field': [['perf', 2]], 'jp-field': [['attend', 2]], 'act-field': [['contacts', 2]] };

  /* ---------- 보기 범위 · 동기화 상태 ---------- */
  function renderScope() {

  const DEDUPE_WHAT = { biz: '사업체', net: '기관', card: '명함' };
  function dedupeGroups(kind) {
    const idx = S.dupIndex(kind), seen = new Set(), groups = [];

  /* ---------- 실적 연동: 복지관 사업실적 시트로 보내기 (실적 화면의 '실적 연동' 탭) ---------- */
  /** 한 달·한 분류표의 실적(실적 화면에서 넣은 것)을 기관 시트 모양으로.
   *  사람마다 세는 항목 → need(실적(일반): 이 탭에서 이름을 직접 적으면 이름마다 한 줄), 건수만 → etc(실적(기타)) */
  function orgPerfRows(month, set) {
    const need = [], etc = [];
    DP.lines(set, month, S.get()).forEach(l => {
      const rec = l.kind === 'perf' ? S.find('perf', l.id) || {} : {};
      const key = `${l.kind === 'perf' ? 'perf' : 'act'}:${l.id}`;
      if (S.NO_PEOPLE.has(l.item)) etc.push({ date: l.d, item: l.item, people: rec.people || '', note: l.name || l.content || '', staff: l.staff });
      else need.push({ key, date: l.d, item: l.item, place: l.name || l.content || '', staff: l.staff, ppl: l.ppl || [] });
    });
    // 세부사업명 순서(실적표 순서)대로 묶고, 같은 세부사업 안에서는 날짜순 → 복지관 시트에도 이 순서로 들어간다
    const order = D.PERF_SETS[set] ? D.PERF_SETS[set].items : [];
    const by = (x, y) => (order.indexOf(x.item) - order.indexOf(y.item)) || x.date.localeCompare(y.date);
    return { need: need.sort(by), etc: etc.sort(by) };
  }
  /* 이름은 이 탭에서 직접 적는다. 적은 이름은 이 화면에만 두고 복지관 시트로 보낼 때만 쓴다 (우리 사이트 시트에는 저장하지 않음) */
  const org = { key: '', res: null, busy: false, err: '', done: null, names: {}, sent: [], stale: false, pick: new Set() };
  // 체크박스: 실적(일반) = '기록키|이름', 실적(기타) = 'e|날짜|세부사업|비고|순번'. 체크한 줄만 보낸다
  const genPick = (key, name) => `${key}|${name}`;
  const etcPicks = list => { const c = {}; return list.map(x => { const k = `e|${x.date}|${x.item}|${x.note}`; c[k] = (c[k] || 0) + 1; return `${k}|${c[k]}`; }); };
  const orgKey = () => `${V.ui.perf.month}|${V.ui.perf.set}`;
  /** 실적 보내기는 그 달 마지막 평일 하루만 (마지막 날이 토·일이면 그 전 금요일). 관리자는 언제든 */
  const lastWorkday = ym => { const [y, m] = ym.split('-').map(Number), d = new Date(y, m, 0); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1); return `${y}-${U.pad(m)}-${U.pad(d.getDate())}`; };
  const sendOpen = ym => U.today() === lastWorkday(ym);
  const sendDayLabel = ym => { const d = U.parse(lastWorkday(ym)); return `${d.getMonth() + 1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]})`; };
  const splitNames = v => String(v || '').split(/[,，、/·;\n]+/).map(x => x.trim()).filter(Boolean);
  const namesOf = n => (org.names[n.key] != null ? org.names[n.key].flatMap(splitNames) : n.ppl);
  const nameSlots = n => (org.names[n.key] != null ? org.names[n.key] : n.ppl.length ? n.ppl.slice() : ['']);
  function orgPayload(rows) {
    const gen = [], sent = [];

    return { gen, sent, etc: rows.etc.map(({ staff, ...r }) => r) };
  }
  /** commit = 보내기, item = 그 세부사업만 보내기 (비우면 전부) */
  async function orgSyncRun(commit, item) {
    const f = V.ui.perf, key = orgKey(), pl = orgPayload(orgPerfRows(f.month, f.set)), items = D.PERF_SETS[f.set].items;
    // 보낼 때는 체크한 줄만 (item을 주면 그 세부사업의 체크한 줄만)
    const ek = etcPicks(pl.etc);
    const sentKeys = [];
    const gen = commit ? pl.gen.filter((x, i) => { const k = genPick(pl.sent[i].key, x.name), ok = org.pick.has(k) && (!item || x.item === item); if (ok) sentKeys.push(k); return ok; }) : pl.gen;

    }

        sentKeys.forEach(k => org.pick.delete(k));
        return orgSyncRun(false);
      }
      org.res = res; org.sent = pl.sent; org.etcRows = pl.etc;
      // 복지관 시트에 이미 두 번 들어간 줄(중복)도 같이 찾아 둔다
      try { org.dups = await S.call('api_orgPerfDedupe', { month: f.month, items, commit: false, sheet: S.get().settings.orgPerfSheet || '' }); } catch { org.dups = null; }
    } catch (err) { org.err = (err && err.message) || String(err); }

  }

    const genRowsOf = list => { let no = 0; return list.map(n => { const slots = nameSlots(n); return slots.map((nm, k) => {

    const etcRowsOf = list => list.map((x, i) => { const st = etcSt(x); return `<tr class="os-${st || 'none'}">${box(ekOf(x), st)}<td class="sh-n">${i + 1}</td><td class="sh-y num">${x.date}</td><td class="sh-auto">${e(def.big)}</td><td class="sh-auto">${e(def.mid)}</td><td class="sh-y">${e(x.item)}</td><td class="sh-y num">${e(x.people)}</td>${blankY}${blankY}<td class="sh-y">${e(x.note)}</td>${chk}${chk}<td class="sh-side">${badge(st)}</td><td class="sh-side sub">${e(x.staff)}</td></tr>`; }).join('');

    else if (cur && org.stale) state = '<p class="form-notice">이름을 고쳤어요. <b>🔄 복지관 시트와 비교</b>를 눌러 다시 확인한 뒤 보내 주세요.</p>';

    const why = [];

      ${done ? `<div class="os-done"><b>✅ 보내기 완료${done.item ? ` · ${e(done.item)}` : ''} (${e(done.at || '')})</b>
        <p>복지관 실적 시트에 <b>실적(일반) ${done.add.gen}줄</b> · <b>실적(기타) ${done.add.etc}줄</b>을 맨 아래에 넣었어요.${done.dup.gen + done.dup.etc ? ` 이미 들어가 있던 ${done.dup.gen + done.dup.etc}줄은 건너뛰었어요.` : ''}</p>
        <ul class="sub"><li>이용자번호·장애유형·대분류 같은 칸은 복지관 시트의 식이 알아서 채워요.</li><li>아래 표의 결과가 <b>"이미 있음"</b>으로 바뀌었으면 들어간 거예요. 다시 눌러도 두 번 들어가지 않아요.</li><li>잘못 보냈으면 그 항목의 <b>보낸 것 취소</b>를 누르세요.</li></ul>
