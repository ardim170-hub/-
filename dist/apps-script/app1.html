    const GIV = ['민준', '서연', '지훈', '하은', '도윤', '수빈', '현우', '지아', '준호', '예린', '성민', '유진', '태희', '동현', '수아', '재원', '미정', '영수', '혜진', '상훈', '경아', '은비', '진우', '나래'];
    const person = () => pick(SUR) + pick(GIV);
    const STAFF_LIST = [{ name: '김정배', program: '장애인개발원' }, { name: '이수정', program: '장애인개발원' }, { name: '박현우', program: '장애인개발원' }, { name: '최유나', program: '고용공단' }];
    const STAFF = STAFF_LIST.map(s => s.name);
    const PRE = ['동탄', '향남', '봉담', '남양', '송산', '우정', '서해', '제부', '비봉', '정남', '팔탄', '매송', '마도', '새솔', '병점', '기안', '청명', '한울', '늘푸른', '새빛', '다온', '도담', '가온', '라온', '해솔', '온누리', '푸른들', '한결', '누리', '바른'];
    const used = new Set();
    const coName = ind => {
      for (let k = 0; k < 50; k++) {
        const n = pick(PRE) + pick(INDUSTRIES[ind].suf);
        if (!used.has(n)) { used.add(n); return (rnd() < .35 ? '(주)' : '') + n; }
      }
      return pick(PRE) + pick(INDUSTRIES[ind].suf) + int(2, 9);
    };
    const place = () => {
      const a = pick(AREAS);
      // 실제 경계 안에 들어오는 점을 고른다 (경계 데이터가 없으면 중심 근처)
      let lat = a.lat, lng = a.lng;
      for (let t = 0; t < 30; t++) {
        const la = +(a.lat + (rnd() - .5) * .03).toFixed(5), ln = +(a.lng + (rnd() - .5) * .03).toFixed(5);
        if (!BOUNDS.length || areaAt(la, ln) === a.name) { lat = la; lng = ln; break; }
      }
      return { area: a.name, lat, lng, address: `경기도 화성시 ${a.name} ${pick(['산단로', '공단로', '중앙로', '시청로', '삼성로', '효행로', '상신하길로', '남양로'])} ${int(10, 480)}` };
    };

    const businesses = [], networks = [], cards = [], activities = [], events = [];
    let cardN = 0, actN = 0, evN = 0;
    const addCard = (o) => { cards.push({ id: 'C' + String(++cardN).padStart(3, '0'), tags: [], photo: null, memo: '', ...o }); };
    const addAct = (o) => activities.push({ id: 'A' + String(++actN).padStart(4, '0'), ...o });
    const addEv = (o) => events.push({ id: 'E' + String(++evN).padStart(3, '0'), done: false, memo: '', time: '', ...o });

    const stagePlan = [['발굴', 10], ['접촉', 9], ['방문상담', 7], ['채용협의', 5], ['채용연계', 8], ['보류', 4]];
    let bN = 0;
    for (const [stage, count] of stagePlan) {
      for (let k = 0; k < count; k++) {
        const industry = pick(INDUSTRY_LIST);
        const info = INDUSTRIES[industry];
        const p = place();
        const id = 'B' + String(++bN).padStart(3, '0');
        const emp = rnd() < .3 ? int(52, 320) : int(6, 48);
        const si = STAGE[stage].i;
        const staff = pick(STAFF);
        // 발굴일: 단계가 진행될수록 더 오래전
        const discoveredAt = U.addDays(T, -int(10 + si * 25, 60 + si * 55));
        const jobs = [...new Set([pick(info.jobs), pick(info.jobs)])].join(', ');
        const b = {
          id, name: coName(industry), industry, bizNo: `${int(120, 699)}-${int(10, 99)}-${int(10000, 99999)}`,
          ceo: person(), phone: `031-${int(350, 379)}-${d4()}`, employees: emp, ...p, stage, jobs,
          workConditions: pick(['주 5일, 09:00~16:00', '주 5일, 09:00~18:00', '주 3일, 10:00~15:00 (시간제)', '주 5일, 08:30~15:30', '평일 오전 4시간']),
          accessibility: info.acc, placements: stage === '채용연계' ? int(1, 3) : 0,
          source: pick(SOURCES), discoveredAt, staff,
          memo: pick(['', '', '대표님이 장애인 고용에 관심 많음. 지원금 제도 안내 필요.', '인사담당자 통화는 오후 2시 이후가 편하다고 함.', '작년에 다른 기관 통해 채용한 경험 있음.', '의무고용 부담금 문의 있었음.', '현장 견학 가능. 방문 전 전화 필수.']),
        };
        businesses.push(b);

        // 담당자 명함
        if (si >= 1 && stage !== '보류' || (stage === '보류' && rnd() < .7)) {
          const n = rnd() < .3 ? 2 : 1;
          for (let j = 0; j < n; j++) {
            addCard({
              name: person(), org: b.name, dept: pick(['경영지원팀', '인사팀', '총무팀', '생산관리팀', '']),
              title: j === 0 ? pick(['인사팀장', '관리부장', '총무과장', '공장장', '실장', '대표']) : pick(['주임', '대리', '매니저']),
              phone: `031-${int(350, 379)}-${d4()}`, mobile: `010-${d4()}-${d4()}`, email: `contact${cardN + 1}@example.com`,
              address: b.address, linkType: 'biz', linkId: id, tags: [pick(['사업체 담당자', '인사 담당', '현장 관리자'])],
              metAt: U.addDays(discoveredAt, int(3, 20)), metWhere: pick(['사업체 방문', '전화 후 명함 교환', '채용박람회']),
            });
          }
        }

        // 단계 흐름에 맞춘 활동 기록
        const steps = [['발굴', `${b.source}로 사업체 발굴. ${industry}, 상시근로자 ${emp}명`]];
        if (si >= 1) steps.push(['전화', '첫 연락. 장애인 채용 지원 제도와 복지관 직업지원 서비스 안내']);
        if (si >= 2) steps.push(['방문', `현장 방문. ${jobs} 직무 확인, 작업 환경 점검`]);
        if (si >= 3) steps.push(['미팅', '채용 조건 협의. 근무시간·급여·훈련 기간 논의']);
        if (stage === '채용연계') steps.push(['채용연계', `장애인 근로자 ${b.placements}명 채용 연계, 초기 적응 지원 시작`]);
        if (stage === '보류') steps.push(['전화', pick(['올해 채용 계획 없음. 하반기 재연락 요청', '업무 특성상 당분간 어렵다는 답변', '담당자 변경으로 보류'])]);
        let d = discoveredAt;
        const span = Math.max(1, U.diffDays(discoveredAt, T) - 2);
        steps.forEach(([type, content], idx) => {
          if (idx > 0) d = U.addDays(d, Math.max(1, Math.floor(span / steps.length) + int(-3, 3)));
          if (U.diffDays(d, T) < 0) d = T;
          addAct({ targetType: 'biz', targetId: id, date: d, type, content, staff });
        });

        // 다음 일정
        if (ACTIVE_STAGES.includes(stage) && rnd() < .8) {
          const off = rnd() < .18 ? -int(1, 5) : int(0, 20);
          const type = stage === '접촉' ? pick(['전화', '방문']) : stage === '방문상담' ? pick(['방문', '미팅']) : pick(['미팅', '면접 동행']);
          addEv({ date: U.addDays(T, off), time: pick(['10:00', '11:00', '14:00', '15:30', '']), type, title: `${type} - ${b.name}`, targetType: 'biz', targetId: id });
        }
        if (stage === '채용연계' && rnd() < .5) {
          addEv({ date: U.addDays(T, int(1, 25)), time: '14:00', type: '방문', title: `채용 후 적응 모니터링 - ${b.name}`, targetType: 'biz', targetId: id });
        }
      }
    }

    // 네트워크 기관 (가상)
    const NETS = [
      ['공공기관', '화성시 장애인일자리 협의체', '구인 정보 공유, 분기별 사례 회의', '협의체 회의 자료 배포'],
      ['공공기관', '서부권 고용복지 상담창구', '구직 장애인 의뢰 및 취업 알선 연계', '리플릿 비치'],
      ['공공기관', '향남 행정복지 민원센터', '복지 대상자 취업 상담 의뢰', '리플릿 비치, 게시판 홍보'],
      ['복지기관', '새솔 발달장애인 주간활동센터', '졸업생 취업 전환 연계', '보호자 설명회 공동 개최'],
      ['복지기관', '늘봄 장애인자립생활지원센터', '자립 준비 당사자 직업 상담 연계', 'SNS 공동 홍보'],
      ['복지기관', '해솔 지역아동센터', '청소년 직업체험 프로그램 협력', '소식지 교환'],
      ['교육기관', '다온 특수학교 (예시)', '전공과 학생 현장실습처 연계', '학부모 대상 취업 설명회'],
      ['교육기관', '봉담 평생학습관', '직업훈련 강좌 공동 운영', '강좌 안내문 게시'],
      ['교육기관', '화성권 직업훈련학교 (예시)', '바리스타·제과 훈련 과정 연계', '훈련생 모집 공동 홍보'],
      ['기업·경제단체', '화성 서부 산업단지 협의회', '입주 기업 대상 장애인 고용 설명회', '협의회 소식지 게재'],
      ['기업·경제단체', '동탄 소상공인 연합회', '소규모 사업장 채용 발굴', '회원사 단체 문자 안내'],
      ['기업·경제단체', '향남 사회적경제 네트워크', '사회적기업 일자리 연계', '공동 박람회 부스'],
      ['언론·홍보', '화성 생활정보 소식지 (예시)', '복지관 취업 성공 사례 기사 게재', '분기별 기사 게재'],
      ['언론·홍보', '지역 공동체 라디오 (예시)', '인터뷰 출연, 채용 캠페인', '캠페인 방송'],
      ['후원·자원봉사', '남양 로타리 봉사단 (예시)', '취업 준비물(면접 정장) 후원', '후원 감사 행사'],
      ['후원·자원봉사', '청명 기업 봉사 모임', '직무 멘토링 자원봉사', '봉사자 모집 공동 홍보'],
      ['의료기관', '동탄 재활의원 (예시)', '취업 전 건강 상담 협력', '대기실 리플릿 비치'],
      ['의료기관', '서부 정신건강 상담센터 (예시)', '정신장애 당사자 취업 연계 사례 협력', '공동 캠페인'],
      ['복지기관', '비봉 노인복지관', '중장년 장애인 일자리 정보 공유', '게시판 홍보'],
      ['공공기관', '동탄 청년 일자리 지원 창구', '청년 장애인 구직 연계', '청년 대상 설명회'],
    ];
    NETS.forEach(([category, name, relation, promo], i) => {
      const p = place();
      const id = 'N' + String(i + 1).padStart(3, '0');
      const status = i % 5 === 3 ? '휴면' : i % 3 === 0 ? '활발' : pick(['활발', '보통']);
      const since = U.addDays(T, -int(90, 900));
      const staff = pick(STAFF);
      networks.push({ id, name, category, ...p, relation, promo, status, since, staff, memo: pick(['', '', '연말 감사 행사 초대 대상', '담당자 교체 잦음, 기관 대표번호로 연락', '분기 1회 방문 약속']) });
      addCard({
        name: person(), org: name, dept: pick(['운영지원팀', '사업팀', '대외협력팀', '']), title: pick(['팀장', '사회복지사', '주무관', '실장', '간사', '과장']),
        phone: `031-${int(350, 379)}-${d4()}`, mobile: rnd() < .7 ? `010-${d4()}-${d4()}` : '', email: `partner${cardN + 1}@example.com`,
        address: p.address, linkType: 'net', linkId: id, tags: ['네트워크'], metAt: U.addDays(since, int(0, 30)), metWhere: pick(['기관 방문', '협의체 회의', '지역 행사']),
      });
      const n = status === '휴면' ? 1 : int(2, 4);
      let d = since;
      for (let j = 0; j < n; j++) {
        d = U.addDays(d, int(20, Math.max(25, Math.floor(U.diffDays(since, T) / n))));
        if (U.diffDays(d, T) < 0) d = U.addDays(T, -int(1, 10));
        addAct({ targetType: 'net', targetId: id, date: d, type: j === 0 ? '미팅' : pick(['홍보', '행사', '전화', '이메일']), content: j === 0 ? `협력 논의: ${relation}` : `${promo} 진행`, staff });
      }
      if (status !== '휴면' && rnd() < .45) {
        const type = pick(['행사', '홍보', '미팅']);
        addEv({ date: U.addDays(T, int(-2, 24)), time: pick(['10:00', '13:30', '16:00']), type, title: `${type} - ${name}`, targetType: 'net', targetId: id });
      }
    });

    // 행사에서 받은 미연결 명함
    for (let k = 0; k < 4; k++) {
      addCard({
        name: person(), org: pick(['경기 서남부 채용박람회 참가사', '지역 상공인 모임', '직업재활 세미나 참석자']), dept: '', title: pick(['과장', '대표', '매니저']),
        phone: '', mobile: `010-${d4()}-${d4()}`, email: `card${cardN + 1}@example.com`, address: '', linkType: '', linkId: '',
        tags: ['행사 명함'], metAt: U.addDays(T, -int(5, 60)), metWhere: pick(['채용박람회', '지역 세미나']), memo: '추후 사업체 발굴 대상 검토',
      });
    }

    // 사업체 없는 일반 일정
    addEv({ date: U.addDays(T, 3), time: '10:00', type: '행사', title: '장애인 채용 설명회 준비 회의', targetType: '', targetId: '' });
    addEv({ date: U.addDays(T, 9), time: '13:00', type: '홍보', title: '복지관 소식지 취업 사례 원고 마감', targetType: '', targetId: '' });

    return {
      version: 1, isDemo: true,
      settings: { orgName: '화성시아르딤복지관 직업지원팀', staff: STAFF_LIST, cityMapUrl: CITY_DASHBOARD_URL },
      businesses, networks, cards, activities, events,
    };
  }

  function empty() {
    return {
      version: 1, isDemo: false,
      settings: { orgName: '화성시아르딤복지관 직업지원팀', staff: [{ name: '김정배', program: '' }], cityMapUrl: CITY_DASHBOARD_URL },
      businesses: [], networks: [], cards: [], activities: [], events: [],
    };
  }

  return { BUILTIN_PROGRAMS, progLabel, progFull, setCustomPrograms, setCustomItems, customItems, isBuiltinItem, PERM_MENUS, PERM_LEVELS, PERM_RANK, SUPPORT_TYPES, SUPPORT_LABEL, MAP_COLORS, CONTACT_RESULTS, CONTACT_STATUS, PROCEDURES, TRIP_METHODS, TRIP_REPORTS, PERF_SETS, DEFAULT_PERF_BY_PROGRAM, suggestPerf, BOUNDS, areaAt, GUS, GU, guOf, detectArea, guessCategory, DEFAULT_LINKS, AREAS, AREA_BY_NAME, CITY_CENTER, CITY_DASHBOARD_URL, STAGES, STAGE, ACTIVE_STAGES, PROGRAMS, PROGRAM, INDUSTRIES, INDUSTRY_LIST, SOURCES, NET_CATEGORIES, NET_STATUS, ACT_TYPES, EVENT_TYPES, MANDATORY, mandatoryCount, demo, empty };
})();

</script>
<script>
/* 데이터 저장소: 모든 화면은 이 한 곳의 데이터에서 계산한다.
   - 파일로 열면(로컬 모드): 이 브라우저의 IndexedDB에 저장
   - 구글 Apps Script 웹 앱으로 열면(공유 모드): 구글 시트에 저장하고 팀원과 함께 본다 */
window.S = (() => {
  const DB_NAME = 'ardim-jobs-crm';
  const KEY = 'state';
  const REMOTE = !!(window.google && google.script && google.script.run);
  let state = null;
  const listeners = new Set();

    if (!x.area && has) x.area = D.areaAt(+x.lat, +x.lng);
    if (!x.area && x.address) x.area = D.detectArea(x.address);
    if (!has && D.AREA_BY_NAME[x.area]) { x.lat = D.AREA_BY_NAME[x.area].lat; x.lng = D.AREA_BY_NAME[x.area].lng; x.approx = true; }
    return x;
  }

  /* ---------- 로컬 저장 (IndexedDB) ---------- */
  function openDb() {
    return new Promise((res, rej) => {

        q.onsuccess = () => res(q.result || null);
        q.onerror = () => rej(q.error);

    } catch (e) {
      try { return JSON.parse(localStorage.getItem(DB_NAME) || 'null'); } catch { return null; }
    }
  }

      await new Promise((res, rej) => {

        t.objectStore('kv').put(v, KEY);
        t.oncomplete = res; t.onerror = () => rej(t.error);

    }

      .then(r => {
        if (--pending === 0) setSync('saved');

        if (r && r.calErr && Date.now() - calWarnAt > 60000) { calWarnAt = Date.now(); App.toast('일정은 저장했지만 구글 캘린더에는 못 넣었어요: ' + r.calErr, 'error'); }

      })
      .catch(err => {

  /* ---------- 보낼 기록 보관함 ----------

   * 인터넷이 끊기거나 서버가 잠깐 막혀도 지워지지 않고, 다시 연결되면 자동으로 다시 보낸다 */
  const OUTBOX = 'ardim.outbox.v1';

  function serverPayload(s) {
    const sheets = {};
    for (const col of COLS) sheets[SHEETS[col][0]] = s[col].map(x => toRow(col, x));
    sheets[STAFF_SHEET[0]] = s.settings.staff.map(x => ({ '이름': x.name, '소속 사업': x.program || '' }));
    // 설정은 항목을 빠짐없이 보낸다 (직원은 따로 '직원' 시트). 글자가 아닌 값은 JSON 글자로
    const settings = {};
    Object.entries(s.settings).forEach(([k, v]) => { if (k === 'staff' || v === undefined) return; settings[k] = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); });
    settings.cityMapUrl = s.settings.cityMapUrl || '';
    settings.isDemo = s.isDemo ? 'Y' : '';
    if (!access.admin) { delete settings.admins; delete settings.members; delete settings.perms; }
    return { sheets, settings };
  }
  /** 팀 공유 모드의 사용 권한. 파일 버전은 늘 관리자 */
  let access = { me: '', owner: '', admin: true, perms: {} };
  const isAdmin = () => !REMOTE || access.admin;
  /** 이 사람의 메뉴 권한 (0 숨김 · 1 보기만 · 2 등록·수정 · 3 삭제까지). 파일 버전·관리자·정하지 않은 메뉴는 3 */
  const level = menu => (isAdmin() ? 3 : D.PERM_RANK[(access.perms || {})[menu]] ?? 3);
  const can = (menu, need) => level(menu) >= need;
  const accessInfo = () => ({ ...access });

  let lastSig = '';
  let aiServer = false;
  let writeSeq = 0, refreshT = null; // 이 컴퓨터에서 바꿀 때마다 1씩 는다
  async function refresh() {
    if (!REMOTE || pending) return;
    const seq = writeSeq;
    try {
      const res = await call('api_load', schema());
      // 불러오는 사이에 이 컴퓨터에서 입력·저장이 있었으면, 받은 내용은 그 전 것이라 버리고 잠시 뒤 다시 받는다
      if (pending || seq !== writeSeq || outbox.length) { clearTimeout(refreshT); refreshT = setTimeout(refresh, 4000); return; }
      const before = JSON.stringify(access);
      const next = applyOutbox(fromServer(res));
      const sig = JSON.stringify(next);
      if (before !== JSON.stringify(access)) lastSig = ''; // 내 권한이 바뀌면 화면을 다시 그린다
      if (sig !== lastSig) { lastSig = sig; state = next; notify(); }
      setSync('saved');
    } catch (err) { setSync('error', err); }
  }

  /** 현재 접속자 알리기·받기 (공유 모드에서만) */
  const presence = info => (REMOTE ? call('api_presence', info).catch(() => null) : Promise.resolve(null));
  /** 보내는 중인 저장이 모두 끝날 때까지 기다린다 (최대 20초) */
  async function whenSaved() {
    flush();
    for (let i = 0; i < 200 && (pending > 0 || (outbox.length && flushing)); i++) await new Promise(r => setTimeout(r, 100));
    return pending === 0 && !outbox.length;
  }
  /** 저장·새로고침 버튼: 내 저장을 끝낸 뒤 구글 시트에서 최신 내용을 다시 받아 화면을 새로 그린다 */
  async function reload() {
    if (!REMOTE) { persistLocal(); notify(); return { remote: false, saved: true }; }
    const saved = await whenSaved();
    lastSig = '';
    await refresh();
    if (sync.status === 'error') throw sync.error || new Error('불러오지 못했습니다');
    return { remote: true, saved };
  }

  /* ---------- 초기화 ---------- */
  async function init() {
    if (REMOTE) {
      const res = await call('api_load', schema());
      state = applyOutbox(fromServer(res));
      lastSig = JSON.stringify(state);
      setSync('saved');
      if (outbox.length) setTimeout(flush, 500); // 지난번에 못 보낸 기록부터 보낸다
      setInterval(refresh, 30000);
      window.addEventListener('online', flush);
      window.addEventListener('focus', () => { flush(); refresh(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      return state;
    }
    const raw = await readRaw();
    state = normalize(raw && raw.version ? raw : D.demo());
    if (!raw) persistLocal();
    return state;
  }

  const get = () => state;
  function notify() { listeners.forEach(fn => fn()); }
  function commit() { writeSeq++; persistLocal(); if (REMOTE) lastSig = JSON.stringify(state); notify(); }
  const subscribe = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  async function replace(next) {
    next = normalize(next);
    if (REMOTE) {
      // 사진은 시트 밖에서 따로 올린다
      const photos = next.cards.filter(c => typeof c.photo === 'string' && c.photo.startsWith('data:'));
      photos.forEach(c => { photoCache.set(c.id, c.photo); c.photo = 'Y'; });
      await send('api_replaceAll', serverPayload(next));
      for (const c of photos) await send('api_putPhoto', c.id, photoCache.get(c.id));
    }
    state = next; commit();
  }
  /** 엑셀 합치기: 지금 데이터는 그대로 두고, 파일에만 있는 줄(ID 기준)을 더한다. 직원 이름도 없는 사람만 더한다 */
  async function mergeIn(next) {
    next = normalize(next);
    const added = {}, ops = [];
    for (const col of COLS) {
      const have = new Set(state[col].map(x => x.id));
      const fresh = (next[col] || []).filter(x => x.id && !have.has(x.id));
      if (col === 'cards') fresh.forEach(c => { if (c.photo === 'Y') c.photo = null; }); // 사진은 파일에 없으므로 비운다
      if (!fresh.length) continue;
      state[col].push(...fresh);
      added[col] = fresh.length;
      fresh.forEach(x => ops.push(opPut(col, x)));
    }
    const names = new Set(state.settings.staff.map(x => x.name));
    const newStaff = (next.settings.staff || []).filter(x => x.name && !names.has(x.name));
    commit();
    if (REMOTE) {
      for (let i = 0; i < ops.length; i += 300) queueApply(ops.slice(i, i + 300));
      if (newStaff.length) await saveSettings({ staff: [...state.settings.staff, ...newStaff] });
    } else if (newStaff.length) await saveSettings({ staff: [...state.settings.staff, ...newStaff] });
    return { added, staff: newStaff.length, total: ops.length };
  }
  /** 예전 직접 입력 실적: 비고에 '사업체 · 내용'으로 붙여 넣던 것을 사업체·기관 칸으로 나눈다 (사업체개발은 비고 전체가 이름) */
  function splitPerfPlaces() {
    const fix = state.perfs.filter(p => !p.place && p.note).map(p => {
      const i = p.note.indexOf(' · ');
      if (i > 0) return { id: p.id, place: p.note.slice(0, i), note: p.note.slice(i + 3) };
      if (p.item === '사업체개발' && p.note.length <= 40 && !/\n/.test(p.note)) return { id: p.id, place: p.note, note: '' };
      if (p.note.length <= 15 && !/\s/.test(p.note.trim())) return { id: p.id, place: p.note.trim(), note: '' }; // 띄어쓰기 없는 짧은 이름 (예: 이항섭)
      return null;
    }).filter(Boolean);
    if (fix.length) putMany('perf', fix);
    return fix.length;
  }
  async function saveSettings(patch) {
    Object.assign(state.settings, patch);
    normalize(state);
    commit();
    if (REMOTE) await send('api_saveSettings', serverPayload(state).settings, serverPayload(state).sheets[STAFF_SHEET[0]]);
  }

  /* ---------- CRUD ---------- */
  const COL = { biz: 'businesses', net: 'networks', card: 'cards', act: 'activities', ev: 'events', perf: 'perfs', trip: 'trips', jp: 'jobPeople', att: 'attends', tp: 'trainPlans' };
  const PREFIX = { biz: 'B', net: 'N', card: 'C', act: 'A', ev: 'E', perf: 'P', trip: 'T', jp: 'J', att: 'W', tp: 'R' };
  const find = (kind, id) => state[COL[kind]].find(x => x.id === id);
  const photoCache = new Map();

  function upsert(kind, obj) {
    const col = COL[kind];
    const list = state[col];
    if (!obj.id) obj.id = U.uid(PREFIX[kind]);
    Object.keys(obj).forEach(k => obj[k] === undefined && delete obj[k]);
    const i = list.findIndex(x => x.id === obj.id);
    const before = i >= 0 ? list[i] : null;
    if (!['act', 'ev', 'perf', 'trip'].includes(kind)) { obj.updatedAt = U.today(); if (!before) obj.createdAt = U.today(); }
    let photoOp = null;
    if (REMOTE && kind === 'card' && 'photo' in obj) {
      if (typeof obj.photo === 'string' && obj.photo.startsWith('data:')) { photoCache.set(obj.id, obj.photo); photoOp = ['api_putPhoto', obj.id, obj.photo]; obj.photo = 'Y'; }
      else if (!obj.photo && before && before.photo) { photoCache.delete(obj.id); photoOp = ['api_delPhoto', obj.id]; obj.photo = null; }
    }
    const rec = before ? { ...before, ...obj } : obj;
    if (kind === 'biz' || kind === 'net' || kind === 'card') place(rec);
    if (i >= 0) list[i] = rec; else list.push(rec);
    commit();
    if ((kind === 'biz' || kind === 'net' || kind === 'card') && rec.address && (rec.approx || rec.lat == null) && (!before || before.address !== rec.address || before.lat == null)) refine(kind, rec.id);
    if (REMOTE) {
      queueApply([opPut(col, rec)]);
      if (photoOp) send(...photoOp).catch(() => {});
    }
    return rec;
  }

  /** 주소로 정확한 좌표를 찾아 대략 위치를 바꾼다 (인터넷 필요, 실패하면 그대로 둔다) */
  const refining = new Map(); // 같은 곳을 동시에 두 번 찾지 않게
  function refine(kind, id) {
    const k = kind + id;
    if (!refining.has(k)) refining.set(k, refineOnce(kind, id).finally(() => refining.delete(k)));
    return refining.get(k);
  }
  async function refineOnce(kind, id) {
    if (!window.M || !M.geocode) return;
    const x = find(kind, id);
    if (!x || !x.address) return;
    try {
      const r = await M.geocode(x.address);
      if (!r || r.lat < 36.9 || r.lat > 37.4 || r.lng < 126.5 || r.lng > 127.25) return false; // 화성시 밖이면 무시
      const cur = find(kind, id);
      if (cur && (cur.approx || cur.lat == null)) upsert(kind, { id, lat: r.lat, lng: r.lng, approx: !!r.approx, area: D.areaAt(r.lat, r.lng) || cur.area || '' });
      return true;
    } catch { return false; /* 오프라인 등 */ }
  }

  /** 여러 건을 한 번에 추가 (파일로 일괄 등록) */
  function upsertMany(kind, objs) {
    const col = COL[kind];
    const recs = objs.map(o => {
      const rec = { ...o, id: o.id || U.uid(PREFIX[kind]) };
      if (kind !== 'act' && kind !== 'ev') { rec.createdAt = rec.createdAt || U.today(); rec.updatedAt = U.today(); }
      if (kind === 'biz' || kind === 'net' || kind === 'card') place(rec);
      state[col].push(rec);
      return rec;
    });
    commit();
    if (REMOTE && recs.length) queueApply(recs.map(r => opPut(col, r)));
    return recs;
  }

  /** 여러 건을 한 번에 저장(있으면 고치고 없으면 추가). 출석부처럼 칸을 여러 개 바꿀 때 한 번만 보낸다 */
  function putMany(kind, objs) {
    const col = COL[kind];
    const list = state[col];
    const recs = objs.map(o => {
      const id = o.id || U.uid(PREFIX[kind]);
      const i = list.findIndex(x => x.id === id);
      const rec = i >= 0 ? { ...list[i], ...o, id } : { ...o, id };
      if (i >= 0) list[i] = rec; else list.push(rec);
      return rec;
    });
    commit();
    if (REMOTE && recs.length) queueApply(recs.map(r => opPut(col, r)));
    return recs;
  }
  /** 여러 건 삭제 (되돌리기 가능) */
  function removeMany(kind, ids) {
    const col = COL[kind];
    const set = new Set(ids);
    const gone = state[col].filter(x => set.has(x.id));
    if (!gone.length) return null;
    state[col] = state[col].filter(x => !set.has(x.id));
    commit();
    if (REMOTE) queueApply(gone.map(x => opDel(col, x.id)));
    return () => putMany(kind, gone);
  }

  function remove(kind, id) {
    const col = COL[kind];
    const list = state[col];
    const i = list.findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = list.splice(i, 1);
    const removed = { acts: [], evs: [], cards: [] };
    if (kind === 'biz' || kind === 'net') {
      removed.acts = state.activities.filter(a => a.targetType === kind && a.targetId === id);
      removed.evs = state.events.filter(e => e.targetType === kind && e.targetId === id);
      state.activities = state.activities.filter(a => !(a.targetType === kind && a.targetId === id));
      state.events = state.events.filter(e => !(e.targetType === kind && e.targetId === id));
      state.cards.forEach(c => { if (c.linkType === kind && c.linkId === id) { removed.cards.push(c); c.linkType = ''; c.linkId = ''; } });
    }
    commit();
    if (REMOTE) {
      queueApply([opDel(col, id), ...removed.acts.map(a => opDel('activities', a.id)), ...removed.evs.map(e => opDel('events', e.id)), ...removed.cards.map(c => opPut('cards', c))]);
      if (kind === 'card' && gone.photo) send('api_delPhoto', id).catch(() => {}); // 되돌리기 시 사진은 복구되지 않음
    }
    return () => { // 되돌리기
      list.splice(Math.min(i, list.length), 0, gone);
      state.activities.push(...removed.acts);
      state.events.push(...removed.evs);
      removed.cards.forEach(c => { c.linkType = kind; c.linkId = id; });
      if (kind === 'card' && REMOTE && gone.photo) gone.photo = photoCache.has(id) ? gone.photo : null;
      commit();
      if (REMOTE) {
        queueApply([opPut(col, gone), ...removed.acts.map(a => opPut('activities', a)), ...removed.evs.map(e => opPut('events', e)), ...removed.cards.map(c => opPut('cards', c))]);
        if (kind === 'card' && photoCache.has(id)) send('api_putPhoto', id, photoCache.get(id)).catch(() => {});
      }
    };
  }

  /* ---------- 중복 찾기 · 합치기 ---------- */
  const orgKey = U.orgKey;
  const digits = s => String(s || '').replace(/\D/g, '');
  /** 같은 곳·같은 사람으로 볼 열쇠들. 열쇠 하나라도 같으면 중복 의심 */
  function dupKeys(kind, x) {
    const k = [];
    if (kind === 'card') {
      if (digits(x.mobile).length >= 10) k.push(['m' + digits(x.mobile), '휴대전화 같음']);
      if (x.email && x.email.includes('@')) k.push(['e' + x.email.trim().toLowerCase(), '이메일 같음']);
      if (U.norm(x.name) && orgKey(x.org)) k.push(['o' + U.norm(x.name) + '|' + orgKey(x.org), '이름·소속 같음']);
    } else {
      if (orgKey(x.name).length >= 2) k.push(['n' + orgKey(x.name), '이름 같음']);
      if (kind === 'biz' && digits(x.bizNo).length === 10) k.push(['b' + digits(x.bizNo), '사업자번호 같음']);
      if (digits(x.phone).length >= 9) k.push(['p' + digits(x.phone), '대표 전화 같음']);
    }
    return k;
  }
  /** kind 전체에서 중복 의심 묶음: id → [{ x, why }] */
  function dupIndex(kind) {
    const list = state[COL[kind]];
    const bucket = new Map();
    list.forEach(x => dupKeys(kind, x).forEach(([key, why]) => { if (!bucket.has(key)) bucket.set(key, []); bucket.get(key).push([x, why]); }));
    const out = new Map();
    bucket.forEach(group => {
      if (group.length < 2) return;
      group.forEach(([x]) => group.forEach(([y, why]) => {
        if (x.id === y.id) return;
        const arr = out.get(x.id) || out.set(x.id, []).get(x.id);
        const hit = arr.find(d => d.x.id === y.id);
        if (hit) { if (!hit.why.includes(why)) hit.why.push(why); } else arr.push({ x: y, why: [why] });
      }));
    });
    return out;
  }
  /** 새로 등록하려는 것과 겹치는 기존 항목 */
  function dupesOf(kind, obj) {
    const keys = new Map(dupKeys(kind, obj));
    const out = [];
    state[COL[kind]].forEach(y => {
      if (y.id === obj.id || isPending(y)) return; // 미등록(연락만 한 곳)은 중복으로 보지 않는다
      const why = dupKeys(kind, y).filter(([k]) => keys.has(k)).map(([, w]) => w);
      if (why.length) out.push({ x: y, why });
    });
    return out;
  }
  /** dropId를 keepId에 합친다: 빈 칸 채우기, 활동·일정·명함 연결 옮기기, dropId 삭제 */
  function merge(kind, keepId, dropId) {
    const col = COL[kind];
    let keep = find(kind, keepId), drop = find(kind, dropId);
    if (!keep || !drop || keep === drop) return null;
    if (kind === 'card' && !keep.photo && drop.photo) [keep, drop] = [drop, keep]; // 사진 있는 쪽을 남긴다
    const patch = { id: keep.id };
    const empty = v => v == null || v === '' || v === 0 || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
    Object.keys(drop).forEach(k => {
      if (['id', 'createdAt', 'updatedAt', 'photo', 'lat', 'lng', 'approx', 'area'].includes(k)) return;
      const kv = keep[k], dv = drop[k];
      if (empty(dv)) return;
      if (k === 'jobAnalyses') patch[k] = [...(kv || []), ...dv.filter(j => !(kv || []).some(o => o.id === j.id))];
      else if (Array.isArray(dv)) patch[k] = [...new Set([...(kv || []), ...dv])];
      else if (k === 'memo' && kv && !String(kv).includes(dv)) patch[k] = `${kv}\n${dv}`;
      else if (empty(kv)) patch[k] = dv;
    });
    if (kind !== 'card' ? (keep.approx || keep.lat == null) && drop.lat != null && !drop.approx : keep.lat == null && drop.lat != null) Object.assign(patch, { lat: drop.lat, lng: drop.lng, approx: !!drop.approx, area: drop.area || keep.area });
    if (kind === 'biz' && D.STAGE[drop.stage] && D.STAGE[keep.stage] && drop.stage !== '보류' && (keep.stage === '보류' || D.STAGE[drop.stage].i > D.STAGE[keep.stage].i)) patch.stage = drop.stage;
    if (kind === 'biz') patch.placements = Math.max(Number(keep.placements) || 0, Number(drop.placements) || 0);
    const moved = [];
    if (kind !== 'card') {
      state.activities.forEach(a => { if (a.targetType === kind && a.targetId === drop.id) { a.targetId = keep.id; moved.push(['activities', a]); } });
      state.events.forEach(v => { if (v.targetType === kind && v.targetId === drop.id) { v.targetId = keep.id; moved.push(['events', v]); } });
      state.cards.forEach(c => { if (c.linkType === kind && c.linkId === drop.id) { c.linkId = keep.id; moved.push(['cards', c]); } });
    }
    state[col] = state[col].filter(x => x.id !== drop.id);
    upsert(kind, patch); // commit + 저장
    if (REMOTE) {
      queueApply([...moved.map(([c, r]) => opPut(c, r)), opDel(col, drop.id)]);
      if (kind === 'card' && drop.photo) send('api_delPhoto', drop.id).catch(() => {});
    }
    return keep.id;
  }

  /** 명함 소속과 이름이 겹치는 사업체·기관 (예: '화성시정신건강복지센터 화성시자살예방센터' ↔ '화성시정신건강복지센터') */
  function matchPlaces(c) {
    const words = String(c.org || '').split(/[\s,/·]+/).map(orgKey).filter(w => w.length >= 2);
    const whole = orgKey(c.org);
    if (!whole) return [];
    const hit = n => { const k = orgKey(n); return k.length >= 2 && (k === whole || whole.includes(k) || k.includes(whole) || words.includes(k)); };
    const all = [...state.businesses.filter(b => hit(b.name)).map(x => ({ kind: 'biz', x })), ...state.networks.filter(n => hit(n.name)).map(x => ({ kind: 'net', x }))];
    // 같은 종류·같은 이름이 중복 등록돼 있으면 하나(먼저 등록한 것)만 보여 준다. 나중에 합치면 명함 연결도 같이 옮겨진다
    const seen = new Set();
    return all.filter(m => { const k = m.kind + orgKey(m.x.name); if (seen.has(k)) return false; seen.add(k); return true; });
  }
  /** 명함을 사업체·기관에 연결. 그곳에 위치가 없고 명함에 있으면 명함 위치를 가져온다 */
  function linkCard(cardId, kind, id) {
    const c = find('card', cardId), x = find(kind, id);
    if (!c || !x) return null;
    upsert('card', { id: c.id, linkType: kind, linkId: x.id });
    const hasP = o => o.lat != null && o.lng != null && o.lat !== '' && !isNaN(o.lat);
    if (!hasP(x) && hasP(c)) upsert(kind, { id: x.id, lat: c.lat, lng: c.lng, approx: !!c.approx, area: x.area || c.area || '', address: x.address || c.address || '' });
    else if (!x.address && c.address) upsert(kind, { id: x.id, address: c.address });
    return x;
  }

  /** 명함 사진: 로컬 모드는 data URL, 공유 모드는 필요할 때 시트에서 불러온다 */
  const photoLoading = new Set();
  function photo(c) {
    if (!c || !c.photo) return null;
    if (typeof c.photo === 'string' && c.photo.startsWith('data:')) return c.photo;
    if (!REMOTE) return null;
    if (photoCache.has(c.id)) return photoCache.get(c.id);
    if (!photoLoading.has(c.id)) {
      photoLoading.add(c.id);
      call('api_getPhoto', c.id).then(d => { photoCache.set(c.id, d || null); notify(); }).catch(() => {}).finally(() => photoLoading.delete(c.id));
    }
    return null;
  }

  /* ---------- 직원 · 소속 · 보기 범위 ---------- */
  const staff = () => state.settings.staff;
  const programOf = name => (staff().find(s => s.name === name) || {}).program || '';
  /** 사업체·기관이 어느 사업 지도에 나오는지: 직접 고른 사업, 없으면 담당 직원의 소속 사업 */
  const programsOf = x => ((x && x.programs && x.programs.length) ? x.programs : [programOf(x && x.staff)].filter(Boolean));
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } };
  let scope = lsGet('ardim.scope') || 'all';
  const getScope = () => scope;
  function setScope(v) { scope = v; lsSet('ardim.scope', v); notify(); }
  /** 이 PC를 쓰는 사람: 고른 사람이 지금 보는 구역(예: 현장중심) 직원이면 그 사람, 아니면 로그인한 계정의 이름, 그것도 아니면 구역의 첫 직원.
   *  (다른 구역 직원 이름으로 저장되면 지금 화면에 안 보이는 일을 막는다) */
  function me() {
    const m = lsGet('ardim.me'), here = staffHere(), inHere = n => here.some(s => s.name === n);
    if (m && staff().some(s => s.name === m) && inHere(m)) return m;
    let names = {}; try { const v = state.settings.accNames; names = (v && typeof v === 'object') ? v : JSON.parse(v || '{}') || {}; } catch { names = {}; }
    const acc = names[String(access.me || '').toLowerCase()];
    if (acc && inHere(acc)) return acc;
    return (here[0] || staff()[0] || {}).name || '';
  }
  function setMe(v) { lsSet('ardim.me', v); notify(); }
  function staffInScope(name, sc = scope) {
    if (sc === 'all') return true;
    if (sc.startsWith('p:')) return programOf(name) === sc.slice(2); // 구역(현장중심·고용공단 등)은 그 소속 직원 것만. 서로 섞이지 않게
    if (sc.startsWith('s:')) return name === sc.slice(2);
    return true;
  }
  /** 지금 보는 범위의 직원 (현장중심이면 장애인개발원 소속만) */
  /** 지금 보는 구역(소속)의 직원만. 구역에 직원이 없으면 빈 목록 (다른 구역 직원으로 저장되지 않게) */
  const staffHere = () => (scope === 'all' ? staff() : staff().filter(x => staffInScope(x.name)));
  const inScope = (name, sc = scope) => staffInScope(name, sc);
  function scopeLabel() {
    if (scope.startsWith('p:')) return D.progLabel(scope.slice(2));
    if (scope.startsWith('s:')) return scope.slice(2) + ' 담당';
    return '전체 팀';
  }
  /** 현재 보기 범위(전체 팀/소속/직원)에 해당하는 데이터 */
  /** 연락이력에만 있는 곳(미등록)은 사업체·지도·대시보드에 안 나온다. 연락이력에서 '등록'을 눌러야 나온다 */
  const isPending = b => !!b && b.pending === 'Y';
  function view(sc = scope) {
    if (sc === 'all') return { ...state, businesses: state.businesses.filter(b => !isPending(b)) };
    const inSc = n => staffInScope(n, sc);
    const biz = state.businesses.filter(b => inSc(b.staff) && !isPending(b));
    const net = state.networks.filter(n => inSc(n.staff));
    const ids = new Set([...biz.map(b => 'biz' + b.id), ...net.map(n => 'net' + n.id)]);
    const inT = x => !x.targetType || ids.has(x.targetType + x.targetId);
    return {
      ...state,
      businesses: biz, networks: net,
      cards: state.cards.filter(c => !c.linkType || ids.has(c.linkType + c.linkId)),
      activities: state.activities.filter(a => inSc(a.staff) || (a.targetType && ids.has(a.targetType + a.targetId))),
      events: state.events.filter(x => (x.staff ? inSc(x.staff) : inT(x))),
      perfs: state.perfs.filter(p => inSc(p.staff)),
      trips: state.trips.filter(t => inSc(t.staff)),
    };
  }


  /* ---------- 파생 조회 ---------- */
  const actsOf = (kind, id) => state.activities.filter(a => a.targetType === kind && a.targetId === id).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const eventsOf = (kind, id) => state.events.filter(e => e.targetType === kind && e.targetId === id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const cardsOf = (kind, id) => state.cards.filter(c => c.linkType === kind && c.linkId === id);
  const lastAct = (kind, id) => actsOf(kind, id)[0] || null;
  const nextEvent = (kind, id) => eventsOf(kind, id).find(e => !e.done) || null;
  const targetOf = x => (x.targetType && x.targetId ? find(x.targetType, x.targetId) : null);
  const linkOf = c => (c.linkType && c.linkId ? find(c.linkType, c.linkId) : null);

  function stats(v = view()) {
    const ym = U.today().slice(0, 7);
    const b = v.businesses;
    const byStage = Object.fromEntries(D.STAGES.map(s => [s.key, 0]));
    b.forEach(x => { byStage[x.stage] = (byStage[x.stage] || 0) + 1; });
    const placedPeople = b.reduce((s, x) => s + (Number(x.placements) || 0), 0);
    const newThisMonth = b.filter(x => (x.discoveredAt || '').startsWith(ym)).length;
    const active = D.ACTIVE_STAGES.reduce((s, k) => s + (byStage[k] || 0), 0);
    const mandatoryBiz = b.filter(x => D.mandatoryCount(x.employees) > 0).length;
    const netActive = v.networks.filter(n => n.status === '활발').length;
    const cardsThisMonth = v.cards.filter(c => (c.metAt || c.createdAt || '').startsWith(ym)).length;
    return { total: b.length, byStage, placedPeople, newThisMonth, active, mandatoryBiz, netTotal: v.networks.length, netActive, cardTotal: v.cards.length, cardsThisMonth, placedBiz: byStage['채용연계'] || 0 };
  }

  /** 직원별·소속별 실적 (전체 팀 기준) */
  function staffStats() {
    const ym = U.today().slice(0, 7);
    const row = name => {
      const b = state.businesses.filter(x => x.staff === name);
      return {
        biz: b.length,
        active: b.filter(x => D.ACTIVE_STAGES.includes(x.stage)).length,
        placedBiz: b.filter(x => x.stage === '채용연계').length,
        placed: b.reduce((s, x) => s + (Number(x.placements) || 0), 0),
        net: state.networks.filter(x => x.staff === name).length,
        actsMonth: state.activities.filter(a => a.staff === name && a.date.startsWith(ym)).length,
      };
    };
    const people = staff().map(s => ({ ...s, ...row(s.name) }));
    const sum = list => list.reduce((t, r) => { for (const k of ['biz', 'active', 'placedBiz', 'placed', 'net', 'actsMonth']) t[k] = (t[k] || 0) + r[k]; return t; }, {});
    const groups = [...D.PROGRAMS.map(p => p.key), ''].map(key => ({ key, people: people.filter(p => (p.program || '') === key) })).filter(g => g.people.length).map(g => ({ ...g, total: sum(g.people) }));
    const known = new Set(staff().map(s => s.name));
    const orphan = state.businesses.filter(b => !known.has(b.staff)).length;
    return { groups, total: sum(people), orphan };
  }

  /* ---------- 실적 ---------- */
  /** 직원의 실적 분류표 이름 (현장중심직업재활센터 / 고용지원사업) */
  const perfSetOf = staffName => state.settings.perfByProgram[programOf(staffName)] || '';
  /** 사업체 최초 등록일: 발굴일과 첫 연락 기록 중 이른 날 (오늘 입력해도 처음 만난 날이 9월이면 9월) */
  function bizFirst(b) {
    if (!b) return '';
    const ds = [b.discoveredAt, ...state.activities.filter(a => a.targetType === 'biz' && a.targetId === b.id && a.type !== '발굴').map(a => a.date)].filter(U.isDate);
    return ds.sort()[0] || '';
  }
  /** 실적에 쓰는 날짜: 발굴(사업체 등록) 기록은 입력한 날이 아니라 사업체의 최초 등록일 */
  function perfDate(a, t = targetOf(a)) {
    if (a.type === '발굴' && a.targetType === 'biz' && t) return bizFirst(t) || a.date;
    return a.date;
  }
  /** 활동 기록의 실적 분류: {set, big, mid, item} 또는 null */
  /** 활동 기록의 실적 분류: {set, big, mid, item} 또는 null.
   *  실적은 '실적' 화면에서 넣은 것만 센다 (연락이력·사업체 개발·상세 화면 기록은 실적이 아님) */
  const isPerfEntry = a => !!a && a.fromPerf === 'Y';
  function perfOf(a) {
    if (!isPerfEntry(a) || !a.perf || a.perf === '제외') return null;
    const set = perfSetOf(a.staff);
    const def = D.PERF_SETS[set];
    if (!def || !def.items.includes(a.perf)) return null;
    return { set, big: def.big, mid: def.mid, item: a.perf };
  }
  /** 기간(YYYY-MM) 안의 실적 기록. d = 실적 날짜(발굴 기록은 최초 등록일) */
  function perfRows(month, v = view()) {
    return v.activities.map(a => { const t = targetOf(a); return { a, t, d: perfDate(a, t) }; }).filter(r => r.d.startsWith(month))
      .map(r => ({ ...r, p: perfOf(r.a) })).filter(r => r.p)
      .sort((x, y) => x.d.localeCompare(y.d) || x.p.item.localeCompare(y.p.item));
  }
  /** 이 달 연락 중 실적에 자동으로 안 들어간 것 (이미 개발한 사업체에 다시 연락 등). 골라서 넣을 수 있다 */
  function perfLeft() { return []; }


  /* ---------- 연인원 / 실인원 / 횟수 ----------
     한 사람이 한 번 받으면 1/1/1, 같은 사람이 두 번이면 2/1/2.
     현장중심 직업훈련은 (훈련받은 날 수의 합 / 훈련 인원 / 훈련한 날짜 수): 1명이 한 달 20일 나가면 20/1/20.
     사업체개발처럼 사람을 세지 않는 항목은 횟수만. */
  const pplOf = r => String((r && r.ppl) || '').split(/[,，、/·;\n]+/).map(x => x.trim()).filter(Boolean);
  const BASE_NO_PEOPLE = ['사업체개발', '고용자원개발', '사업체관리', '고용네트워크'];
  const NO_PEOPLE = new Set(BASE_NO_PEOPLE); // + 대시보드에서 '횟수만'으로 더한 세부사업
  const isTrain = item => /훈련/.test(item || '');
  /** lines: [{ item, d, ppl: [이름], n: 이름이 없을 때 인원, key: 이름이 없을 때 같은 사람으로 볼 사업체·기관 }] → { yeon, sil, cnt } (사람을 안 세는 항목은 yeon·sil = null) */
  function perfCount(lines, item) {
    const L = item ? lines.filter(l => l.item === item) : lines;
    if (item && NO_PEOPLE.has(item)) return { yeon: null, sil: null, cnt: L.length };
    // 이름이 없는 줄은 같은 사업체·기관(또는 '사업체·기관·이름' 칸에 적은 이름)이면 같은 사람으로 본다
    const names = new Set(), keys = new Map();
    let yeon = 0, unnamed = 0;
    L.forEach(l => {
      const ppl = l.ppl || [];
      if (ppl.length) { yeon += ppl.length; ppl.forEach(x => names.add(x)); return; }
      const k = Number(l.n) || 1; yeon += k;
      if (l.key) keys.set(l.key, Math.max(keys.get(l.key) || 0, k)); else unnamed += k;
    });
    return { yeon, sil: names.size + unnamed + [...keys.values()].reduce((a, b) => a + b, 0), cnt: isTrain(item) ? new Set(L.map(l => l.d)).size : yeon };
  }
  /** 실적 표 (구글 시트 '실적(기타)' 열 순서). 직접 입력한 실적 + 활동 기록 자동 집계(날짜·세부사업별 한 줄) */
  function perfTable(month, set, withActs = true, v = view()) {
    const def = D.PERF_SETS[set];
    if (!def) return [];
    // 참여자 이름이 있으면 그 해 처음 나온 사람 = 신규, 몇 번째인지 = 회차
    const seen = new Map();
    const yearRecs = [...v.perfs.filter(p => p.set === set), ...v.activities.filter(a => a.perf && a.perf !== '제외')]
      .filter(r => (r.date || '').slice(0, 4) === month.slice(0, 4) && pplOf(r).length).sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.id).localeCompare(String(b.id)));
    const info = new Map();
    yearRecs.forEach(r => { const item = r.item || r.perf; let fresh = 0, round = 0; pplOf(r).forEach(x => { const k = item + '|' + x, c = (seen.get(k) || 0) + 1; seen.set(k, c); if (c === 1) fresh++; round = c; }); info.set(r.id, { fresh, round: pplOf(r).length === 1 ? round : '' }); });
    const rows = v.perfs.filter(p => p.set === set && (p.date || '').startsWith(month)).map(p => {
      const ppl = pplOf(p), inf = info.get(p.id);
      return {
        kind: 'manual', id: p.id, date: p.date, big: def.big, mid: def.mid, item: p.item,
        people: ppl.length || p.people || '', newPeople: inf ? inf.fresh : p.newPeople || '', round: inf ? inf.round : p.round || '', note: [p.place, ppl.join(', '), p.note].filter(Boolean).join(' · '), src: `직접 입력 · ${p.staff || ''}`,
      };
    });
    if (withActs) {
      const groups = new Map();
      perfRows(month, v).filter(r => r.p.set === set).forEach(({ a, p, t, d }) => {
        const k = d + '|' + p.item;
        const g = groups.get(k) || { kind: 'auto', date: d, big: def.big, mid: def.mid, item: p.item, people: 0, targets: new Map(), n: 0 };
        g.n++; g.people += pplOf(a).length || Number(a.people) || 0;
        const inf = info.get(a.id); if (inf) g.fresh = (g.fresh || 0) + inf.fresh;
        if (t) g.targets.set(t.id, t.name);
        groups.set(k, g);
      });
      groups.forEach(g => rows.push({ ...g, people: g.people || '', newPeople: g.fresh || '', round: '', note: g.targets.size || g.n, src: `활동 ${g.n}건: ${[...g.targets.values()].join(', ')}` }));
    }
    return rows.sort((x, y) => x.date.localeCompare(y.date) || def.items.indexOf(x.item) - def.items.indexOf(y.item));
  }

  /** 최근 12개월: 신규 발굴 수, 채용연계 활동 수 */
  function monthly(v = view()) {
    const T = U.parse(U.today());
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(T.getFullYear(), T.getMonth() - i, 1);
      months.push({ key: `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}월`, discovered: 0, placed: 0 });
    }
    const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
    v.businesses.forEach(b => { const i = idx[(b.discoveredAt || '').slice(0, 7)]; if (i != null) months[i].discovered++; });
    v.activities.forEach(a => { if (a.type === '채용연계') { const i = idx[a.date.slice(0, 7)]; if (i != null) months[i].placed++; } });
    return months;
  }

  /** 오늘 확인할 일: 지난 미완료 일정, 7일 내 일정, 연락 공백이 긴 진행 중 사업체 */
  function priorities(v = view()) {
    const T = U.today();
    const out = [];
    v.events.filter(e => !e.done && U.diffDays(T, e.date) <= 7).forEach(e => {
      const t = targetOf(e);
      out.push({ kind: 'ev', id: e.id, date: e.date, name: t ? t.name : e.title, why: t ? `${e.type}${e.time ? ' · ' + e.time : ''}` : e.type, staff: t?.staff || '', target: t ? { kind: e.targetType, id: t.id } : null, sort: U.diffDays(T, e.date) });
    });
    v.businesses.filter(b => D.ACTIVE_STAGES.includes(b.stage) && !nextEvent('biz', b.id)).forEach(b => {
      const la = lastAct('biz', b.id);
      const gap = la ? U.diffDays(la.date, T) : 999;
      if (gap >= 21) out.push({ kind: 'gap', id: b.id, date: la?.date, name: b.name, why: `${b.stage} 단계 · 마지막 연락 ${gap}일 전`, staff: b.staff, gap, target: { kind: 'biz', id: b.id }, sort: 8 + (60 - Math.min(gap, 60)) / 100 });
    });
    return out.sort((a, b) => a.sort - b.sort);
  }

  function recentActs(n = 8, v = view()) {
    return [...v.activities].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, n);
  }

  /* ---------- 검색 (보기 범위와 관계없이 팀 전체) ---------- */
  function search(q) {
    const nq = U.norm(q);
    if (!nq) return { biz: [], net: [], card: [] };
    const hit = (...vals) => U.match(q, ...vals);
    const v = view(); // 지금 구역 안에서만 찾는다 (현장중심에서 고용공단 자료가 안 나오게)
    const biz = v.businesses.filter(b => hit(b.name, b.industry, b.ceo, b.address, b.area, b.bizNo, b.jobs, b.memo, b.staff, b.phone) || cardsOf('biz', b.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const net = v.networks.filter(n => hit(n.name, n.category, n.address, n.area, n.relation, n.memo, n.staff) || cardsOf('net', n.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const card = v.cards.filter(c => hit(c.name, c.org, c.title, c.dept, c.phone, c.mobile, c.email, (c.tags || []).join(' '), c.memo));
    return { biz: can('biz', 1) ? biz.slice(0, 8) : [], net: can('network', 1) ? net.slice(0, 6) : [], card: can('cards', 1) ? card.slice(0, 8) : [] };
  }

  /* ---------- 엑셀 ---------- */
  function exportXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) {
      const [sheet, cols] = SHEETS[col];
      const ws = XLSX.utils.json_to_sheet(state[col].map(x => toRow(col, x)), { header: cols.map(c => c[1]) });
      ws['!cols'] = cols.map(([k]) => ({ wch: ['name', 'address', 'memo', 'content', 'relation', 'jobs', 'accessibility', 'title', 'org'].includes(k) ? 28 : 13 }));
      XLSX.utils.book_append_sheet(wb, ws, sheet);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.settings.staff.map(s => ({ '이름': s.name, '소속 사업': s.program })), { header: ['이름', '소속 사업'] }), STAFF_SHEET[0]);
    XLSX.writeFile(wb, `아르딤_취업지원_${U.today()}.xlsx`);
  }

  function parseXlsx(buf) {
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const next = D.empty();
    next.settings = { ...state.settings };
    const found = [];
    for (const col of COLS) {
      const ws = wb.Sheets[SHEETS[col][0]];
      if (!ws) continue;
      found.push(SHEETS[col][0]);
      next[col] = XLSX.utils.sheet_to_json(ws, { defval: '' }).map(r => fromRow(col, r)).filter(o => keepRow(col, o));
    }
    const sw = wb.Sheets[STAFF_SHEET[0]];
    if (sw) {
      const list = XLSX.utils.sheet_to_json(sw, { defval: '' }).map(r => ({ name: String(r['이름'] || '').trim(), program: String(r['소속 사업'] || '').trim() })).filter(s => s.name);
      if (list.length) { next.settings.staff = list; found.push(STAFF_SHEET[0]); }
    }
    // 사진은 엑셀에 없으므로 같은 ID의 기존 사진을 유지
    const old = Object.fromEntries(state.cards.filter(c => c.photo).map(c => [c.id, c.photo]));
    next.cards.forEach(c => { c.photo = old[c.id] || null; });
    return { next: normalize(next), found };
  }

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function exportJson() {
    const copy = { ...state, cards: state.cards.map(c => ({ ...c, photo: photo(c) || (REMOTE ? null : c.photo) })) };
    download(`아르딤_취업지원_백업_${U.today()}.json`, new Blob([JSON.stringify(copy)], { type: 'application/json' }));
  }
  function templateXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([SHEETS[col][1].map(c => c[1])]), SHEETS[col][0]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['이름', '소속 사업']]), STAFF_SHEET[0]);
    XLSX.writeFile(wb, '아르딤_취업지원_엑셀양식.xlsx');
  }

  /** 지원고용·현장훈련 진행 여부: 직접 체크한 것 + 활동 기록(현장훈련 유, 내용)·출장 명령부에서 찾은 것 */
  function supportOf(b) {
    const set = new Set((b.support || []).filter(t => D.SUPPORT_TYPES.includes(t)));
    const found = new Set();
    const scan = txt => { if (/현장\s*훈련/.test(txt || '')) found.add('현장훈련'); if (/지원\s*고용/.test(txt || '')) found.add('지원고용'); };
    actsOf('biz', b.id).forEach(a => { if (a.training === '유') found.add('현장훈련'); scan(a.content); });
    const key = U.orgKey(b.name).replace(/점$/, '');
    if (key.length >= 2) state.trips.forEach(t => { const p = U.orgKey(t.place || '').replace(/점$/, ''); if (p && (p.includes(key) || key.includes(p)) && p.length >= 2) scan(t.purpose); });
    found.forEach(t => set.add(t));
    return { types: D.SUPPORT_TYPES.filter(t => set.has(t)), auto: [...found].some(t => !(b.support || []).includes(t)) };
  }
  /** 사업체 종류 색: 취업 연계(채용연계 단계이거나 채용 인원이 있음) > 지원고용 > 현장훈련 > 사업체 개발 */
  const bizTone = b => {
    if (!b) return 'biz';
    if (b.stage === '채용연계' || Number(b.placements) > 0) return 'placed';
    const t = supportOf(b).types;
    return t.includes('지원고용') ? 'employ' : t.includes('현장훈련') ? 'training' : 'biz';
  };
  /** 지도에 별로 표시할 우리 복지관 (네트워크에 '아르딤'이 들어간 기관) */
  const isHome = n => /아르딤/.test(n.name || '');

  return {
    REMOTE, isAdmin, level, can, accessInfo, supportOf, bizTone, isHome, dupIndex, dupesOf, merge, matchPlaces, linkCard, init, get, commit, subscribe, replace, mergeIn, splitPerfPlaces, saveSettings, reload, whenSaved, presence, find, upsert, upsertMany, putMany, removeMany, remove, photo, refine,
    get aiServer() { return aiServer; }, call: (fn, ...a) => call(fn, ...a),
    staff, staffHere, inScope, programOf, programsOf, perfSetOf, perfOf, isPerfEntry, isPending, perfRows, pplOf, perfCount, NO_PEOPLE, perfLeft, bizFirst, perfDate, perfTable, getScope, setScope, scopeLabel, me, setMe, view,
    actsOf, eventsOf, cardsOf, lastAct, nextEvent, targetOf, linkOf, stats, staffStats, monthly, priorities, recentActs, search,
    exportXlsx, parseXlsx, exportJson, templateXlsx, refresh, SHEETS,
    sync, outboxSize, flush, onSync: fn => { syncListeners.add(fn); return () => syncListeners.delete(fn); },
  };
})();

</script>
<script>
/* 지도: Leaflet + 배경 지도(여러 종류 중 선택) + 화성시 행정동 경계
   배경 지도는 인터넷에서 받아오고, 행정동·구 경계와 이름은 앱 안에 들어 있어 인터넷이 막혀도 보인다. */
window.M = (() => {
  const BOUNDARY_ATTR = '행정동 경계: 통계청 SGIS, <a href="https:\/\/github.com/vuski/admdongkor" target="_blank" rel="noopener">admdongkor</a> (CC BY 4.0)';
  /** 배경 지도 종류. 키 없이 쓸 수 있는 것을 먼저 둔다 */
  const BASES = [
    { key: 'esri', label: '일반 지도', url: 'https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: 'Tiles &copy; Esri', maxNativeZoom: 18 },
    { key: 'sat', label: '위성 사진', url: 'https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: 'Imagery &copy; Esri', maxNativeZoom: 18 },
    { key: 'osm', label: 'OpenStreetMap', url: 'https:\/\/tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '&copy; <a href="https:\/\/www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', maxNativeZoom: 19 },
    { key: 'vworld', label: '브이월드 (한국 지도)', needsKey: true, url: key => `https:\/\/api.vworld.kr/req/wmts/1.0.0/${key}/Base/{z}/{y}/{x}.png`, attr: '&copy; 국토교통부 브이월드', maxNativeZoom: 19 },
    { key: 'vworld-sat', label: '브이월드 항공사진', needsKey: true, url: key => `https:\/\/api.vworld.kr/req/wmts/1.0.0/${key}/Satellite/{z}/{y}/{x}.jpeg`, attr: '&copy; 국토교통부 브이월드', maxNativeZoom: 19 },
    { key: 'none', label: '배경 없음 (경계만)' },
  ];
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 */ } };
  const vworldKey = () => (window.S && S.get() && S.get().settings.vworldKey) || '';
  const available = () => BASES.filter(b => !b.needsKey || vworldKey());
  // 브이월드 키가 있으면 처음부터 브이월드(한국 지도). 지도에서 직접 고른 배경이 있으면 그것
  const baseKey = () => {
    const k = lsGet('ardim.basemap'), ok = available().some(b => b.key === k);
    if (ok && lsGet('ardim.basemap.picked') === '1') return k;
    if (vworldKey()) return 'vworld';
    return ok ? k : 'esri';
  };

  const maps = new Map();
  let tilesOk = null; // null: 모름, true: 배경 지도 받아옴, false: 못 받아옴
  const pin = () => L.divIcon({ className: '', html: '<div class="pick-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 26] });
  const toLatLng = rings => rings.map(r => r.map(([x, y]) => [y, x]));

  /** 행정동·구 경계와 이름 */
  function boundaryLayer(map) {
    const H = window.HWASEONG || { areas: [], gus: [] };
    const areaPolys = H.areas.map(b => {
      const color = (D.GU[b.gu] || {}).color || '#667085';
      return L.polygon(toLatLng(b.p), { color, weight: .8, opacity: .55, fillColor: color, fillOpacity: .1, interactive: false });
    });
    const guLines = (H.gus || []).map(g => L.polygon(toLatLng(g.p), { color: (D.GU[g.name] || {}).color || '#344054', weight: 2.6, opacity: .95, fill: false, interactive: false }));
    const label = (c, html, cls) => L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: cls, html, iconSize: null }) });
    const areaLabels = H.areas.map(b => label(b.c, `<span>${b.name}</span>`, 'area-label'));
    const guLabels = (H.gus || []).map(g => label(g.c, `<span style="--c:${(D.GU[g.name] || {}).color}">${g.name}</span>`, 'gu-label'));
    L.layerGroup([...areaPolys, ...guLines, ...guLabels, ...areaLabels]).addTo(map);
    const style = () => {
      const bare = tilesOk === false || map._arBase === 'none';
      areaPolys.forEach(p => p.setStyle({ fillOpacity: bare ? .22 : .1 }));
      const c = map.getContainer();
      c.classList.toggle('offline', bare);
      c.classList.toggle('z-high', map.getZoom() >= 12);
    };
    map.on('zoomend', style);
    style();
    return { style };
  }

  function create(el, opts = {}) {
    if (!window.L) { el.innerHTML = '<div class="empty"><strong>지도를 불러오지 못했습니다</strong>페이지를 새로고침해 보세요.</div>'; return null; }
    const old = maps.get(el);
    if (old) old.remove();
    const map = L.map(el, { zoomControl: opts.zoomControl !== false, scrollWheelZoom: opts.scroll !== false, attributionControl: true })
      .setView(opts.center || D.CITY_CENTER, opts.zoom || 11);
    map.attributionControl.addAttribution(BOUNDARY_ATTR);
    const note = L.control({ position: 'bottomleft' });
    note.onAdd = () => { const d = L.DomUtil.create('div', 'map-note'); d.textContent = '배경 지도를 불러오지 못해 행정구역 경계만 표시합니다. 오른쪽 위 버튼에서 다른 배경 지도를 골라 보세요.'; return d; };
    map._arNote = note;
    const setOk = ok => {
      if (tilesOk === ok) return;
      tilesOk = ok;
      maps.forEach(m => { m._arBoundary && m._arBoundary.style(); if (m._arNote) { if (ok) m._arNote.remove(); else if (m._arBase !== 'none') m._arNote.addTo(m); } });
    };
    // 배경 지도 선택
    const layers = {};
    available().forEach(b => {
      if (b.key === 'none') { layers[b.label] = L.layerGroup(); layers[b.label]._arKey = 'none'; return; }
      const t = L.tileLayer(typeof b.url === 'function' ? b.url(vworldKey()) : b.url, { attribution: b.attr, maxZoom: 19, maxNativeZoom: b.maxNativeZoom });
      let loaded = 0, failed = 0;
      t.on('tileload', () => { loaded++; setOk(true); });
      t.on('tileerror', () => { failed++; if (!loaded && failed >= 3 && map._arBase === b.key) setOk(false); });
      t._arKey = b.key;
      layers[b.label] = t;
    });
    const cur = baseKey();
    const first = Object.values(layers).find(l => l._arKey === cur);
    map._arBase = cur;
    first.addTo(map);
    L.control.layers(layers, null, { position: 'topright', collapsed: !opts.showLayers }).addTo(map);
    map.on('baselayerchange', e => {
      map._arBase = e.layer._arKey;
      lsSet('ardim.basemap', map._arBase); lsSet('ardim.basemap.picked', '1');
      tilesOk = null;
      if (map._arBase === 'none') note.remove();
      bl.style();
    });
    const bl = boundaryLayer(map);
    map._arBoundary = bl;
    setTimeout(() => { if (tilesOk === null && map._arBase !== 'none') setOk(false); }, 7000);
    if (tilesOk === false && cur !== 'none') note.addTo(map);
    maps.set(el, map);
    setTimeout(() => map.invalidateSize(), 60);
    return map;
  }

  /** 구(또는 화성시 전체) 경계에 맞춰 보기 */
  function guBounds(gu) {
    const pts = D.BOUNDS.filter(b => !gu || b.gu === gu).flatMap(b => b.p.flat().map(([x, y]) => [y, x]));
    return pts.length ? L.latLngBounds(pts) : null;
  }

  /** 사업체: 노랑(개발) / 빨강(지원고용·현장훈련 진행). hot = 이번 달 발굴이면 크게, 진한 테두리 */
  const bizColor = b => D.MAP_COLORS[S.bizTone(b)];
  function bizMarker(b, hot) {
    const size = hot ? 22 : 17;
    const dim = b.stage === '보류' ? 'opacity:.6;' : '';
    return L.marker([b.lat, b.lng], {
      riseOnHover: true, zIndexOffset: hot ? 300 : 100,
      icon: L.divIcon({ className: '', html: `<div class="bz-pin ${hot ? 'hot' : ''} ${S.bizTone(b) === 'placed' ? 'placed' : ''} ${S.bizTone(b) !== 'placed' && S.supportOf(b).types.length === 2 ? 'both' : ''}" style="--c:${bizColor(b)};${dim}"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] }),
    });
  }
  function cardMarker(c) {
    return L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: '<div class="card-pin"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) });
  }
  /** 기관: 검정 마름모. 우리 복지관은 금색 별 + 이름표 */
  const STAR = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M12 1.8l3.1 6.5 7.1.9-5.2 4.9 1.3 7.1L12 17.8l-6.3 3.4 1.3-7.1L1.8 9.2l7.1-.9z" fill="var(--c)" stroke="#3B2A00" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  function netMarker(n) {
    if (S.isHome(n)) {
      return L.marker([n.lat, n.lng], {
        zIndexOffset: 1000, riseOnHover: true,
        icon: L.divIcon({ className: '', html: `<div class="home-pin" style="--c:${D.MAP_COLORS.home}">${STAR}<span>${U.esc(n.name)}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16] }),
      });
    }
    return L.marker([n.lat, n.lng], { riseOnHover: true, icon: L.divIcon({ className: '', html: `<div class="net-pin" style="--c:${D.MAP_COLORS.net};${n.status === '휴면' ? 'opacity:.55' : ''}"></div>`, iconSize: [15, 15], iconAnchor: [7.5, 7.5] }) });
  }
  const hasPos = x => x && x.lat != null && x.lng != null && !isNaN(x.lat) && !isNaN(x.lng) && x.lat !== '' && x.lng !== '';

  const soloBtn = (kind, x) => {
    const so = V.ui.map.solo;
    return so && so.kind === kind && so.id === x.id
      ? '<button class="btn btn-ghost btn-sm" type="button" data-act="map-solo-off">전체 보기</button>'
      : `<button class="btn btn-ghost btn-sm" type="button" data-act="map-solo" data-kind="${kind}" data-id="${x.id}">이것만 보기</button>`;
  };
  /** 이 곳이 들어가 있는 사업 지도 */
  const progTags = x => { const ps = S.programsOf(x).map(k => D.PROGRAM[k]).filter(Boolean); return ps.length ? `<div class="pop-progs">${ps.map(p => `<span style="--c:${p.hex}">${U.esc(p.map)}</span>`).join('')}</div>` : ''; };
  function popupHtml(kind, x) {
    if (kind === 'card') {
      return `<div class="pop-name">${U.esc(x.org || x.name)}</div><div class="pop-meta">분류 대기 명함 · ${U.esc(x.name)} ${U.esc(x.title || '')}<br>${U.esc(x.address || '')}</div>
        <div class="inline">${V.triageButtons(x)}</div><div class="inline pop-actions">${soloBtn(kind, x)}</div>`;
    }
    const sup = kind === 'biz' ? S.supportOf(x).types : [];
    const meta = kind === 'biz'
      ? `${sup.map(t => `<b style="color:${t === '지원고용' ? D.MAP_COLORS.employ : D.MAP_COLORS.training}">${t}</b> · `).join('')}${U.esc(x.stage)} · ${U.esc(x.industry || '')} · ${U.esc(x.area || '')}`
      : `${U.esc(x.category)} · 관계 ${U.esc(x.status)} · ${U.esc(x.area || '')}`;
    // 연결된 명함: 이름을 누르면 명함 상세, 전화 아이콘은 바로 걸기
    const cards = S.cardsOf(kind, x.id);
    const telOf = c => String(c.mobile || c.phone || '').replace(/[^0-9+]/g, '');
    const tone = kind === 'biz' ? S.bizTone(x) : S.isHome(x) ? 'home' : 'net';
    const cardList = cards.length
      ? `<ul class="pop-cards">${cards.slice(0, 4).map(c => `<li><button type="button" class="linklike" data-act="open" data-kind="card" data-id="${c.id}">${U.esc(c.name)}</button> <span class="pop-meta">${U.esc([c.dept, c.title].filter(Boolean).join(' · '))}</span>${telOf(c) ? ` <a class="pop-tel" href="tel:${telOf(c)}">${U.esc(c.mobile || c.phone)}</a>` : ''}</li>`).join('')}${cards.length > 4 ? `<li class="pop-meta">외 ${cards.length - 4}장</li>` : ''}</ul>`
      : '<div class="pop-meta pop-nocard">연결된 명함 없음</div>';
    return `<div class="pop tone-${tone}"><div class="pop-kind">${{ biz: '사업체 개발', placed: '취업 연계', employ: '지원고용 진행', training: '현장훈련 진행', net: '기관', home: '우리 복지관' }[tone]}</div>
      <div class="pop-name">${U.esc(x.name)}</div><div class="pop-meta">${meta}${x.approx ? '<br>읍면동 중심의 대략적 위치' : ''}</div>
      ${x.address ? `<div class="pop-addr">📍 ${U.esc(x.address)} <button class="linklike" type="button" data-act="copy" data-v="${U.esc(x.address)}">복사</button></div>` : ''}
      ${x.phone ? `<div class="pop-addr">📞 <a href="tel:${U.esc(String(x.phone).replace(/[^0-9+]/g, ''))}">${U.esc(x.phone)}</a></div>` : ''}
      <div class="pop-links"><a href="${naverSearch(x)}" target="_blank" rel="noopener">네이버 지도</a><a href="${kakaoLink(x)}" target="_blank" rel="noopener">카카오맵</a></div>
      ${cardList}
      <div class="inline pop-actions"><button class="btn btn-sm btn-primary" type="button" data-act="open" data-kind="${kind}" data-id="${x.id}">상세 보기</button><button class="btn btn-sm" type="button" data-act="cards-of" data-kind="${kind}" data-id="${x.id}">명함 관리에서 보기${cards.length ? ` (${cards.length})` : ''}</button></div>
      <div class="inline pop-actions"><button class="btn btn-sm btn-route" type="button" data-act="route-to" data-kind="${kind}" data-id="${x.id}">여기까지 길찾기</button><button class="btn btn-ghost btn-sm" type="button" data-act="route-from" data-kind="${kind}" data-id="${x.id}">여기서 출발</button>${soloBtn(kind, x)}</div>
      <div class="inline pop-edit"><button class="linklike" type="button" data-act="edit" data-kind="${kind}" data-id="${x.id}">✏️ 수정</button><button class="linklike" type="button" data-act="map-move" data-kind="${kind}" data-id="${x.id}">📍 위치 옮기기</button>${S.isHome(x) ? '' : `<button class="linklike pop-del" type="button" data-act="delete" data-kind="${kind}" data-id="${x.id}">🗑 삭제</button>`}</div>
      ${progTags(x)}</div>`;
  }

  /** 위치 지정용 지도: 클릭하면 핀 이동 */
  function picker(el, pos, onPick) {
    const has = pos && hasPos(pos);
    const map = create(el, { center: has ? [pos.lat, pos.lng] : D.CITY_CENTER, zoom: has ? 15 : 11 });
    if (!map) return null;
    let marker = has ? L.marker([pos.lat, pos.lng], { draggable: true, icon: pin() }).addTo(map) : null;
    const set = (lat, lng, zoom) => {
      lat = +lat.toFixed(6); lng = +lng.toFixed(6);
      if (!marker) { marker = L.marker([lat, lng], { draggable: true, icon: pin() }).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); }); }
      else marker.setLatLng([lat, lng]);
      if (zoom) map.setView([lat, lng], zoom);
      onPick(lat, lng);
    };
    if (marker) marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); });
    map.on('click', e => set(e.latlng.lat, e.latlng.lng));
    return { map, set };
  }

  /** 주소 → 좌표 (OpenStreetMap Nominatim, 인터넷 필요. 한국 도로명 주소는 못 찾을 수 있음) */
  /** 브이월드 주소 검색 (도로명·지번 모두, 한국 주소에 가장 정확). 키가 있을 때만, JSONP로 부른다 */
  function vworldGeocode(q, type) {
    return new Promise(res => {
      const cb = '__vw' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      const done = v => { delete window[cb]; s.remove(); res(v); };
      window[cb] = j => { const p = j && j.response && j.response.status === 'OK' && j.response.result && j.response.result.point; done(p ? { lat: +(+p.y).toFixed(6), lng: +(+p.x).toFixed(6), label: q } : null); };
      s.src = `https:\/\/api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326&refine=true&simple=true&format=json&type=${type}&key=${encodeURIComponent(vworldKey())}&address=${encodeURIComponent(q)}&callback=${cb}`;
      s.onerror = () => done(null);
      setTimeout(() => window[cb] && done(null), 8000);
      document.head.appendChild(s);
    });
  }
  async function geocode(address) {
    const q = String(address || '').trim();
    if (!q) return null;
    if (S.REMOTE) {
      // 공유 사이트: 서버가 브이월드 → 카카오 → 구글 지도 순서로 찾아 준다
      const r = await S.call('api_geocode', q).catch(() => null);
      if (r && r.error) console.warn('주소 검색:', r.error);
      if (r && r.lat) return { lat: +r.lat.toFixed(6), lng: +r.lng.toFixed(6), label: r.label, approx: !!r.approx };
    }
    if (vworldKey() && !S.REMOTE) {
      if (S.REMOTE) {
        // 공유 사이트: 구글 서버가 등록한 사이트 주소로 대신 물어본다
        const r = await S.call('api_geocode', q).catch(() => null);
        if (r && r.error) console.warn('브이월드:', r.error);
        if (r && r.lat) return { lat: +r.lat.toFixed(6), lng: +r.lng.toFixed(6), label: r.label };
      } else for (const type of ['road', 'parcel']) { const r = await vworldGeocode(q, type); if (r) return r; }
    }
    // OpenStreetMap 검색: 전체 주소 → 번지 뺀 주소 → (화성시 안에서만) 도로 이름. 도로 이름으로 찾으면 그 도로의 대략 위치다
    const road = q.match(/([가-힣A-Za-z0-9·]+(?:대로|로|길))\s*(\d+(?:-\d+)?)?/);
    const tries = [[q], [q.replace(/\s*\d+(-\d+)?\s*$/, '')], [q.includes('화성') ? null : '화성시 ' + q],
      [road && road[2] ? `${road[1]} ${road[2]}` : null, true], [road ? road[1] : null, true, true]];
    for (const [t, bounded, approx] of tries) {
      if (!t) continue;
      const url = `https:\/\/nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(t)}${bounded ? `&viewbox=${HS_BOX}&bounded=1` : ''}`;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('geocode ' + res.status);
      const j = await res.json();
      if (j[0]) return { lat: +(+j[0].lat).toFixed(6), lng: +(+j[0].lon).toFixed(6), label: j[0].display_name, approx: !!approx };
    }
    return null;
  }
  const HS_BOX = '126.55,37.35,127.22,36.95'; // 화성시를 감싸는 네모 (서,북,동,남)

  /* ---------- 길찾기 ----------
   * 두 곳 사이 직선거리로 대략 시간을 어림하고, 정확한 경로는 네이버·카카오 길찾기로 넘긴다 */
  function distKm(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }
  /** 도로는 직선보다 1.35배 길고, 차 평균 35km/h · 버스 평균 15km/h(+기다림 10분) · 걸음 4.5km/h로 어림 */
  function estimate(km) {
    const road = km * 1.35;
    return { road, car: Math.max(3, Math.round(road / 35 * 60)), transit: Math.round(road / 15 * 60 + 10), walk: Math.round(road / 4.5 * 60) };
  }
  // 네이버 지도 길찾기 주소는 웹 메르카토르(EPSG:3857) 좌표를 쓴다
  const merc = (lat, lng) => [lng * 20037508.34 / 180, Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180].map(v => v.toFixed(2));
  const naverRoute = (a, b, mode) => `https:\/\/map.naver.com/p/directions/${merc(a.lat, a.lng).join(',')},${encodeURIComponent(a.name)},,/${merc(b.lat, b.lng).join(',')},${encodeURIComponent(b.name)},,/-/${mode}`;
  const kakaoRoute = (a, b) => `https:\/\/map.kakao.com/link/from/${encodeURIComponent(a.name)},${a.lat},${a.lng}/to/${encodeURIComponent(b.name)},${b.lat},${b.lng}`;

  /** 도로를 따라가는 자동차 경로 (OpenStreetMap 기반 무료 OSRM). 실패하면 null → 직선으로 대신 그린다. 교통 상황은 반영하지 않는다 */
  const routeCache = new Map();
  async function roadRoute(a, b) {
    const key = [a.lat, a.lng, b.lat, b.lng].join(',');
    if (routeCache.has(key)) return routeCache.get(key);
    // 카카오 키가 있으면 카카오 길찾기(실제 도로)로
    if (S.REMOTE && S.get().settings.kakaoOn === 'Y') {
      const r = await S.call('api_route', { lat: a.lat, lng: a.lng }, { lat: b.lat, lng: b.lng }).catch(() => null);
      if (r && r.km) { routeCache.set(key, r); return r; }
    }
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      const res = await fetch(`https:\/\/router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`, { signal: ctl.signal });
      clearTimeout(timer);
      const j = await res.json();
      const r = j && j.code === 'Ok' && j.routes && j.routes[0];
      const out = r ? { km: r.distance / 1000, min: Math.round(r.duration / 60), path: r.geometry.coordinates.map(([x, y]) => [y, x]) } : null;
      routeCache.set(key, out);
      return out;
    } catch { return null; }
  }

  /** 장소·주소 검색 (공유 사이트: 서버가 카카오 → 브이월드 → 구글 순서로) */
  async function placeSearch(q) {
    if (S.REMOTE) return (await S.call('api_placeSearch', q).catch(() => [])) || [];
    try {
      const j = await (await fetch(`https:\/\/nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`)).json();
      return j.map(x => ({ name: x.display_name.split(',')[0], cat: x.type || '', addr: x.display_name, road: '', phone: '', lat: +x.lat, lng: +x.lon, by: 'osm' }));
    } catch { return []; }
  }
  /** 찍은 자리의 주소 */
  async function revGeo(lat, lng) {
    if (S.REMOTE) return S.call('api_revGeo', lat, lng).catch(() => null);
    try { const j = await (await fetch(`https:\/\/nominatim.openstreetmap.org/reverse?format=json&accept-language=ko&lat=${lat}&lon=${lng}`)).json(); return j && j.display_name ? { road: '', addr: j.display_name, bldg: '' } : null; } catch { return null; }
  }
  const kakaoLink = x => `https:\/\/map.kakao.com/link/map/${encodeURIComponent(x.name)},${x.lat},${x.lng}`;
  const naverSearch = x => `https:\/\/map.naver.com/p/search/${encodeURIComponent(x.address || x.name)}`;

  return { placeSearch, revGeo, BASES, create, guBounds, distKm, estimate, roadRoute, naverRoute, kakaoRoute, bizColor, bizMarker, netMarker, cardMarker, hasPos, popupHtml, picker, geocode, kakaoLink, naverSearch };
})();

<script>
/* AI 도우미 (Claude API)
   - 공유 모드: 구글 Apps Script 서버가 대신 호출한다 (API 키는 스크립트 속성에 보관, 브라우저에 노출되지 않음)
   - 파일 모드: 이 PC 브라우저에 저장한 API 키로 직접 호출한다
   API 키가 없으면 모든 AI 기능은 숨고, 직접 입력으로 대신한다. */
window.AI = (() => {
  const MODEL = 'claude-opus-5-5';
  const KEY_LS = 'ardim.anthropicKey';
  const localKey = () => { try { return localStorage.getItem(KEY_LS) || ''; } catch { return ''; } };
  const available = () => (S.REMOTE ? S.aiServer : !!localKey());

  async function setKey(key) {
    if (S.REMOTE) { await S.call('api_setAiKey', key); return; }
    try { if (key) localStorage.setItem(KEY_LS, key); else localStorage.removeItem(KEY_LS); } catch { /* 저장 불가 */ }
  }

  /** Messages API 한 번 호출. 공유 모드는 서버 프록시, 파일 모드는 직접 */
  async function post(body) {
    if (S.REMOTE) {
      const r = await S.call('api_claude', body);
      if (r && r.error) throw new Error(r.error.message || JSON.stringify(r.error));
      return r;
    }
    const res = await fetch('https:\/\/api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': localKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((j.error && j.error.message) || `HTTP ${res.status}`);
    return j;
  }

  /** 서버 도구(웹 검색)가 pause_turn으로 멈추면 이어서 요청한다 */
  async function run(body) {
    body = { model: MODEL, fallbacks: 'default', ...body };
    let msg;
    for (let i = 0; i < 4; i++) {
      msg = await post(body);
      if (msg.stop_reason !== 'pause_turn') break;
      body = { ...body, messages: [...body.messages, { role: 'assistant', content: msg.content }] };

    if (msg.stop_reason === 'refusal') throw new Error('AI가 이 요청을 처리하지 않았습니다.');
    return msg;
  }
  const textOf = msg => (msg.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  const imageBlock = dataUrl => {
    const [, type, data] = dataUrl.match(/^data:([^;]+);base64,(.*)$/) || [];
    if (!data) throw new Error('이미지 형식을 읽지 못했습니다.');
    return type === 'application/pdf'
      ? { type: 'document', source: { type: 'base64', media_type: type, data } }
      : { type: 'image', source: { type: 'base64', media_type: type, data } };
  };
  const obj = props => ({ type: 'object', additionalProperties: false, required: Object.keys(props), properties: props });
  const str = description => ({ type: 'string', description });

  /* ---------- 명함 사진 → 연락처 ---------- */
  const CARD_PROPS = {
    name: str('사람 이름'), title: str('직함/직위'), dept: str('부서'), org: str('회사·기관 이름'),
    mobile: str('휴대전화 010-0000-0000 형식'), phone: str('사무실 전화 (대표번호 포함)'), fax: str('팩스'),
    email: str('이메일'), address: str('주소 전체'), homepage: str('홈페이지 주소'),
  };
  const CARD_SCHEMA = obj(CARD_PROPS);

  /** 명함 PDF (한 쪽에 한 장이든, 여러 장을 스캔한 것이든) → 명함 목록 */

      messages: [{ role: 'user', content: [imageBlock(dataUrl), { type: 'text', text: '이 명함 사진에서 연락처 정보를 읽어 주세요. 사진에 없는 항목은 빈 문자열로 두고, 짐작해서 채우지 마세요. 전화번호는 하이픈을 넣어 주세요.' }] }],
    });

  /* ---------- 사업자등록증·구인공고 등 사진/PDF → 사업체 정보 ---------- */

    name: str('상호(사업체명)'), ceo: str('대표자'), bizNo: str('사업자등록번호 000-00-00000'), address: str('사업장 소재지'),
    industry: str('업태/종목을 짧게'), phone: str('대표 전화'), employees: str('근로자 수(숫자만, 모르면 빈 문자열)'),
    jobs: str('모집 직무가 있으면 쉼표로'), workConditions: str('근무 조건이 있으면 한 줄로'), memo: str('그 밖에 참고할 내용 한두 줄'),
  });
  async function readBizDoc(dataUrl) {

      messages: [{ role: 'user', content: [imageBlock(dataUrl), { type: 'text', text: '이 문서(사업자등록증, 구인공고, 회사 소개서 등)에서 사업체 정보를 읽어 주세요. 문서에 없는 항목은 빈 문자열로 두고 짐작하지 마세요.' }] }],
    });

  /* ---------- 인터넷 기초 조사 ---------- */

      system: '당신은 장애인 취업지원 기관(화성시아르딤복지관 직업지원팀)의 사업체 개발 담당자를 돕습니다. 장애인 채용 가능성을 판단하는 데 필요한 공개 정보를 찾아 한국어로 짧게 정리합니다. 확인되지 않은 내용은 쓰지 말고 "확인 안 됨"이라고 적습니다.',
      messages: [{ role: 'user', content: `다음 사업체를 인터넷에서 조사해 아래 형식 그대로 정리해 주세요.

사업체: ${b.name}

형식:

사업체: ${b.name} (${b.industry || '업종 미입력'}, ${b.area || ''}, 상시근로자 ${b.employees || '미입력'}명)
진행 단계: ${b.stage}
가능 직무: ${b.jobs || '-'} / 근무 조건: ${b.workConditions || '-'} / 고려사항: ${b.accessibility || '-'}
메모: ${b.memo || '-'}
기초 조사: ${b.research || '-'}
활동 기록:
${acts || '-'}` }],

${facts}` }],
    });

  }

  /* ---------- 연락이력: 캡처(구인공고·문자·메모 화면) → 연락 기록 칸 ---------- */
  const SHOT_SCHEMA = obj({

    contactName: str('채용 담당자 이름과 직함 (예: 김재윤 부장)'), jobType: str('모집 직종·직무 (짧게)'),
    content: str('연락 기록에 남길 핵심 한두 줄: 근무시간·급여·인원·마감일 등 (화면에 있는 것만)'), jobUrl: str('화면에 보이는 공고 주소(https로 시작). 없으면 빈 문자열'),
  });
  async function readContactShot(dataUrl) {
    const msg = await run({
      max_tokens: 3000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: SHOT_SCHEMA } },
      messages: [{ role: 'user', content: [imageBlock(dataUrl), { type: 'text', text: '장애인 취업지원 직업재활사가 사업체에 연락하기 전에 찍은 캡처예요(구인공고, 문자, 메모 등). 연락이력에 등록할 정보만 뽑아 주세요. 화면에 없는 항목은 빈 문자열로 두고 짐작해서 채우지 마세요.' }] }],
    });
    return JSON.parse(textOf(msg));
  }

  return { MODEL, available, setKey, localKey, readCard, readCardsPdf, readBizDoc, readContactShot, research, summarize, coach };
})();

    if (period === 'last') return date.startsWith(prev);
    if (period === '3m') return U.diffDays(date, T) <= 92 && date <= T;
    if (period === 'year') return date.startsWith(T.slice(0, 4));
    if (period === 'month') return date.startsWith(month);

  function staffPanel() {
    const ss = S.staffStats();
    // 구역(현장중심·고용공단) 안에서는 그 구역 직원만, 합계도 그 구역만

    const row = (label, r, cls = '', act = '') => `<tr class="${cls}" ${act}><td>${label}</td><td class="r">${r.biz}</td><td class="r">${r.active}</td><td class="r"><b>${r.placed}</b><span class="meta">명</span></td><td class="r">${r.net}</td><td class="r">${r.actsMonth}</td></tr>`;
