<script>(window.__parts = window.__parts || []).push('app3'); (window.__ver = window.__ver || {})['app3'] = "2026.10.29 11:25";</script>
<script>
/* 직업훈련 반별 월간 일정표 (JOB이음터 · 일과놀이반): 월~금 × 오전·오후 칸에 훈련 구분과 내용을 적는다
   - 칸 하나 = 기록 한 줄 { date, slot: 오전|오후|종일, cat: 훈련 구분, content: 내용, color }
   - 날짜 옆 표시(예: 7 (건강관리))는 slot '라벨', 아래 안내 문구는 그 달 1일의 slot '안내'
   - 엑셀(지금 쓰는 일정표 양식)·한글 파일을 여러 개 불러와 한 달에 합칠 수 있다 */
window.TR = (() => {
  const e = U.esc;
  const CLASSES = ['JOB이음터', '일과놀이반'];
  const ui = { month: U.today().slice(0, 7), cls: CLASSES[0], edit: null, imp: null };
  const SLOTS = ['오전', '오후'];
  const TIMES = { 오전: '10:00~12:00', 오후: '13:30~16:00' };
  // 칸 색: 엑셀에서 쓰던 색 그대로

  // 반 칸이 비어 있는 예전 기록은 JOB이음터로 본다
  const clsOf = x => x.cls || CLASSES[0];
  const plans = (m, cls = ui.cls) => S.get().trainPlans.filter(x => (x.date || '').startsWith(m) && clsOf(x) === cls);
  const at = (m, d, slot, cls = ui.cls) => plans(m, cls).find(x => x.date === `${m}-${U.pad(d)}` && x.slot === slot);
  const dim = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const wd = (m, d) => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, d).getDay();
  const staffNames = () => S.staff().filter(s => s.program === '직업훈련').map(s => s.name);

  /** 월~금 주 단위로 날짜 묶기 */
  function weeks(m) {
    const out = []; let cur = null;
    for (let d = 1; d <= dim(m); d++) {
      const w = wd(m, d); if (w === 0 || w === 6) continue;
      if (!cur || w === 1) { cur = [null, null, null, null, null]; out.push(cur); }
      cur[w - 1] = d;
    }
    return out;
  }
  const FONTS = [['', '기본 글씨체'], ['Malgun Gothic, 맑은 고딕', '맑은 고딕'], ['NanumGothic, 나눔고딕', '나눔고딕'], ['Gulim, 굴림', '굴림'], ['Dotum, 돋움', '돋움'], ['Batang, 바탕, serif', '바탕'], ['Gungsuh, 궁서, serif', '궁서']];
  const SIZES = [9, 10, 11, 12, 13, 14, 16, 18, 20, 24, 28];
  const TEXT_COLORS = ['111111', 'DC2626', 'C2410C', 'B08800', '15803D', '1D4ED8', '7C3AED', '6B7280'];
  const CAT_LIST = ['직업탐색훈련', '직업준비훈련', '작업훈련', '권익옹호훈련', '사회적응훈련', '직업탐색훈련 / 작업훈련', '직업탐색훈련 / 직업준비훈련', '직업준비훈련 / 작업훈련', '직업준비훈련 / 권익옹호훈련', '권익옹호훈련 / 작업훈련', '사회적응훈련 / 직업탐색훈련', '사회적응훈련 / 직업준비훈련'];
  const catList = () => [...new Set([...CAT_LIST, ...S.get().trainPlans.map(p => p.cat).filter(Boolean)])];
  const fmtOf = x => (x && x.fmt && typeof x.fmt === 'object' ? x.fmt : {});
  /** 칸 서식 → style (배경·글자색·크기·글씨체·굵게·기울임·밑줄·정렬) */
  function styleOf(x, print) {
    if (!x) return '';
    const f = fmtOf(x), st = [];
    if (x.color) st.push(`background:#${x.color}`);
    if (f.fc) st.push(`color:#${f.fc}`);
    if (f.size) st.push(print ? `font-size:calc(${f.size * 0.62}pt * var(--tps, 1))` : `font-size:${f.size}px`);
    if (f.font) st.push(`font-family:${f.font}, sans-serif`);
    if (f.b) st.push('font-weight:800');
    if (f.i) st.push('font-style:italic');
    if (f.u) st.push('text-decoration:underline');
    if (f.al) st.push(`text-align:${f.al}`);
    return st.length ? `style="${st.join(';')}"` : '';
  }
  function cellHtml(m, d, slot, rowspan, R, c, print) {
    const x = at(m, d, slot);
    const bg = styleOf(x, print);
    const f = fmtOf(x);
    const lines = x ? String(x.content || '').split('\n').filter(Boolean) : [];
    const big = x && !x.cat && lines.length <= 2 && /휴관|미운영|휴가|연휴|추석|공휴일/.test(x.content || '');
    return `<td class="tp-cell ${x ? '' : 'empty'} ${big ? 'big' : ''}" ${rowspan ? `rowspan="${rowspan}"` : ''} ${bg} data-r="${R}" data-c="${c}" ${rowspan ? `data-r2="${R + 1}"` : ''}>
      ${f.chk ? `<span class="tp-chk ${f.on ? 'on' : ''}" data-act="tp-check" data-r="${R}" data-c="${c}" role="checkbox" aria-checked="${!!f.on}" title="눌러서 체크">${f.on ? '☑' : '☐'}</span>` : ''}${x && (x.cat || x.content) ? `${x.cat ? `<div class="tp-cat">${e(x.cat)}</div>` : ''}<div class="tp-txt">${lines.map(l => e(l)).join('<br>')}</div>` : ''}<button type="button" class="tp-dd" data-act="tp-dd" data-r="${R}" data-c="${c}" tabindex="-1" aria-label="훈련 구분 고르기" title="훈련 구분 고르기">▾</button></td>`;
  }
  function grid(m, forPrint) {
    const ws = weeks(m);
    const label = d => { const x = at(m, d, '라벨'); return x && x.content ? x.content : ''; };
    return `<table class="tp-tbl ${forPrint ? 'print' : ''}"><colgroup><col style="width:9%">${'<col style="width:18.2%">'.repeat(5)}</colgroup>
      <thead><tr><th></th>${['월', '화', '수', '목', '금'].map(w => `<th>${w}</th>`).join('')}</tr></thead>
      <tbody>${ws.map((wk, wi) => `
        <tr class="tp-date"><td></td>${wk.map((d, c) => d ? `<td class="tp-dcell ${label(d) ? 'lab' : ''}" data-r="${wi * 3}" data-c="${c}" title="글자를 치면 날짜 옆 표시 (예: 건강관리)">${d}${label(d) ? ` <b>(${e(label(d))})</b>` : ''}</td>` : '<td class="none"></td>').join('')}</tr>
        ${SLOTS.map((slot, si) => `<tr class="tp-slot"><th>${slot}<small>(${TIMES[slot]})</small></th>${wk.map((d, c) => {
          if (!d) return si === 0 ? '<td class="none" rowspan="2"></td>' : '';
          const full = at(m, d, '종일');
          if (full) return si === 0 ? cellHtml(m, d, '종일', 2, wi * 3 + 1, c, forPrint) : '';
          return cellHtml(m, d, slot, 0, wi * 3 + 1 + si, c, forPrint);
        }).join('')}</tr>`).join('')}`).join('')}
      </tbody></table>`;
  }
  // 출석부와 같은 공휴일 목록을 쓴다 (없으면 빈 목록)
  const AT_HOL = m => { try { return (window.AT && AT.meta(m).holidays || []).map(Number); } catch { return []; } };
  const notesOf = m => { const x = at(m, 1, '안내'); return x ? x.content || '' : ''; };

  function view() {
    const m = ui.month, names = staffNames();
    const n = plans(m).filter(x => SLOTS.includes(x.slot) || x.slot === '종일').length;
    return `<section class="panel tp">
      <div class="chips tp-classes" role="tablist" aria-label="반 고르기">${CLASSES.map(c => `<button type="button" role="tab" class="chip ${ui.cls === c ? 'on' : ''}" data-act="tp-cls" data-cls="${e(c)}">${e(c)} <span class="n">${plans(m, c).filter(x => SLOTS.includes(x.slot) || x.slot === '종일').length}</span></button>`).join('')}</div>
      <div class="tp-head">
        <div class="month-nav"><button class="icon-btn" type="button" data-act="tp-month" data-d="-1" aria-label="이전 달">${V.I.back}</button><b class="num">${V.monthLabel(m)}</b><button class="icon-btn" type="button" data-act="tp-month" data-d="1" aria-label="다음 달" style="transform:scaleX(-1)">${V.I.back}</button></div>
        <h2 class="tp-title">${e(ui.cls)} ${+m.slice(5)}월 일정표</h2>
        <div class="inline">
          <button class="btn" type="button" data-act="tp-import">📂 엑셀·한글 불러오기</button>
          <button class="btn" type="button" data-act="tp-copy-prev" title="지난달 같은 요일 프로그램으로 빈 칸 채우기">지난달 요일별로 채우기</button>
          <button class="btn btn-primary" type="button" data-act="tp-print" ${n ? '' : 'disabled'}>🖨 인쇄</button>
        </div>
      </div>
      <p class="sub tp-staff">직업훈련 담당: ${names.length ? names.map(x => `<b>${e(x)}</b>`).join(', ') : '<span class="tv-over">데이터 관리에서 직원 소속을 "직업훈련"으로 정해 주세요</span>'}</p>
      ${ui.imp ? importPanel() : ''}
      <div class="tp-tools tp-ribbon">
        <select class="select sm" id="tpFont" data-tpfmt="font" title="글씨체" tabindex="-1">${FONTS.map(([v, l]) => `<option value="${e(v)}">${l}</option>`).join('')}</select>
        <select class="select sm" id="tpSize" data-tpfmt="size" title="글씨 크기" tabindex="-1"><option value="">크기</option>${SIZES.map(z => `<option value="${z}">${z}</option>`).join('')}</select>
        <button type="button" class="tp-tb" data-act="tp-fmt" data-k="b" title="굵게 (Ctrl+B)" tabindex="-1"><b>가</b></button>
        <button type="button" class="tp-tb" data-act="tp-fmt" data-k="i" title="기울임 (Ctrl+I)" tabindex="-1"><i>가</i></button>
        <button type="button" class="tp-tb" data-act="tp-fmt" data-k="u" title="밑줄 (Ctrl+U)" tabindex="-1"><u>가</u></button>
        <span class="tp-sep"></span>
        <span class="tp-grp" title="글자색"><span class="tp-lbl">글자</span>${TEXT_COLORS.map(c => `<button type="button" class="tp-sw sm" style="background:#${c}" data-act="tp-fc" data-color="${c}" title="글자색" tabindex="-1"></button>`).join('')}<input type="color" class="tp-pick" data-tpfmt="fc" title="글자색 직접 고르기" tabindex="-1"></span>
        <span class="tp-sep"></span>
        <button type="button" class="tp-tb" data-act="tp-align" data-al="left" title="왼쪽 정렬" tabindex="-1">⬅</button>
        <button type="button" class="tp-tb" data-act="tp-align" data-al="center" title="가운데 정렬" tabindex="-1">↔</button>
        <button type="button" class="tp-tb" data-act="tp-align" data-al="right" title="오른쪽 정렬" tabindex="-1">➡</button>
        <span class="tp-sep"></span>
        <button type="button" class="tp-tb wide" data-act="tp-chkbox" title="고른 칸에 체크박스 넣기/빼기" tabindex="-1">☑ 체크박스</button>
        <select class="select sm" id="tpCatSel" data-tpfmt="cat" title="고른 칸의 훈련 구분 (드롭다운)" tabindex="-1"><option value="">▾ 훈련 구분 고르기</option>${catList().map(c => `<option>${e(c)}</option>`).join('')}<option value="-">(훈련 구분 지우기)</option></select>
        <button type="button" class="tp-tb wide" data-act="tp-fmt-clear" title="고른 칸의 글씨 서식 지우기" tabindex="-1">서식 지우기</button>
      </div>
      <div class="tp-tools">
        <span class="sub">칸 색</span>
        ${COLORS.map(([c, l]) => `<button type="button" class="tp-sw ${c ? '' : 'none'}" style="${c ? `background:#${c}` : ''}" data-act="tp-color" data-color="${c}" title="칸 색: ${l}" tabindex="-1">${c ? '' : '색 없음'}</button>`).join('')}<input type="color" class="tp-pick" data-tpfmt="bg" title="칸 색 직접 고르기" tabindex="-1">
        <button type="button" class="btn btn-sm" data-act="tp-merge" tabindex="-1" title="오전·오후를 한 칸으로 합치거나 나눠요">⇕ 오전·오후 합치기/나누기</button>
        <button type="button" class="btn btn-sm" data-act="tp-undo" tabindex="-1">↶ 되돌리기</button>
        <details class="at-keys tp-keys"><summary>⌨️ 엑셀처럼 쓰기</summary><div class="sub">칸을 누르고 바로 글자를 치면 새로 써져요. <kbd>Enter</kbd> 저장 후 아래로, <kbd>Alt</kbd>+<kbd>Enter</kbd> 칸 안에서 줄 바꿈, <kbd>Tab</kbd> 오른쪽으로, <kbd>←↑→↓</kbd> 이동, <kbd>F2</kbd>·두 번 누르기 = 있던 글 고치기, <kbd>Delete</kbd> 지우기, <kbd>Shift</kbd>+방향키·끌기 = 여러 칸, <kbd>Ctrl</kbd>+<kbd>C</kbd>/<kbd>V</kbd> 복사·붙여넣기(엑셀에서 복사한 칸도 됨), <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기.
          칸의 첫 줄이 "직업탐색훈련 / 작업훈련"처럼 훈련 이름이면 훈련 구분(밑줄)으로 들어가요. 날짜 칸에 글자를 치면 "(건강관리)" 같은 표시가 붙어요.</div></details>
      </div>
      <div class="tp-wrap" id="tpWrap"><textarea class="tp-ed" id="tpEd" spellcheck="false" aria-label="일정표 칸 입력"></textarea>${grid(m)}<div class="tp-ddlist" id="tpDD" hidden></div></div>
      <div class="tp-notes"><label>아래 안내 문구 <span class="sub">(한 줄에 하나, 인쇄할 때 표 아래에 나와요)</span><textarea class="textarea" id="tpNotes" rows="3" placeholder="※복지관 상황에 따라 일정이 변동될 수 있습니다.">${e(notesOf(m))}</textarea></label>
        <div class="inline"><button class="btn btn-sm" type="button" data-act="tp-notes-save">안내 저장</button>${n ? `<button class="btn btn-sm btn-danger-ghost" type="button" data-act="tp-clear">${+m.slice(5)}월 일정표 비우기 (${n}칸)</button>` : ''}</div></div>
    </section>`;
  }
  function editDialog() {
    const { date, slot } = ui.edit;
    const m = date.slice(0, 7), d = +date.slice(8);
    const x = at(m, d, slot) || at(m, d, '종일') || {};
    const full = slot === '종일' || !!at(m, d, '종일');
    return `<div class="modal-layer tp-modal" id="tpModal"><div class="modal" role="dialog" aria-label="일정표 칸 고치기">
      <h2>${+date.slice(5, 7)}월 ${d}일 (${['일', '월', '화', '수', '목', '금', '토'][wd(m, d)]}) ${full ? '하루 종일' : slot}</h2>
      <label>훈련 구분 <input class="input" id="tpCat" value="${e(x.cat || '')}" list="tpCats" placeholder="예: 직업탐색훈련 / 작업훈련"></label>
      <datalist id="tpCats">${[...new Set(S.get().trainPlans.map(p => p.cat).filter(Boolean))].slice(0, 40).map(c => `<option value="${e(c)}">`).join('')}</datalist>
      <label>내용 <textarea class="textarea" id="tpContent" rows="4" placeholder="- 바리스타&#10;- 댄스 유산소">${e(x.content || '')}</textarea></label>
      <label>칸 색 <select class="select" id="tpColor">${COLORS.map(([c, l]) => `<option value="${c}" ${(x.color || '') === c ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="tpFull" ${full ? 'checked' : ''}> 오전·오후 합쳐서 하루 종일 (휴관·외부 일정 등)</label>
      <div class="inline tp-modal-acts"><button class="btn btn-primary" type="button" data-act="tp-save">저장</button>${x.id ? '<button class="btn btn-danger-ghost" type="button" data-act="tp-del">칸 비우기</button>' : ''}<button class="btn" type="button" data-act="tp-cancel">닫기</button></div>
    </div></div>`;
  }
  function save() {
    const { date, slot } = ui.edit;
    const m = date.slice(0, 7), d = +date.slice(8);
    const full = document.getElementById('tpFull').checked;
    const rec = { date, cat: document.getElementById('tpCat').value.trim(), content: document.getElementById('tpContent').value.replace(/\r/g, '').trim(), color: document.getElementById('tpColor').value };
    const old = full ? [at(m, d, '오전'), at(m, d, '오후'), at(m, d, '종일')] : [at(m, d, '종일')];
    const keep = full ? at(m, d, '종일') : at(m, d, slot);
    const drop = old.filter(o => o && (!keep || o.id !== keep.id)).map(o => o.id);
    if (drop.length) S.removeMany('tp', drop);
    if (rec.cat || rec.content) S.putMany('tp', [{ ...(keep ? { id: keep.id } : {}), ...rec, cls: ui.cls, slot: full ? '종일' : (slot === '종일' ? '오전' : slot) }]);
    else if (keep) S.removeMany('tp', [keep.id]);
    ui.edit = null;
  }
  function remove() {
    const { date, slot } = ui.edit; const m = date.slice(0, 7), d = +date.slice(8);
    const ids = [at(m, d, slot), at(m, d, '종일')].filter(Boolean).map(x => x.id);
    ui.edit = null;
    return ids.length ? S.removeMany('tp', ids) : null;
  }
  function setLabel(date, text) {
    const m = date.slice(0, 7), d = +date.slice(8);
    const x = at(m, d, '라벨');
    if (!text) { if (x) S.removeMany('tp', [x.id]); return; }
    S.putMany('tp', [{ ...(x ? { id: x.id } : {}), date, slot: '라벨', cat: '', content: text, color: '', cls: ui.cls }]);
  }
  function saveNotes(text) {
    const m = ui.month, x = at(m, 1, '안내');
    if (!text.trim()) { if (x) S.removeMany('tp', [x.id]); return; }
    S.putMany('tp', [{ ...(x ? { id: x.id } : {}), date: `${m}-01`, slot: '안내', cat: '', content: text.trim(), color: '', cls: ui.cls }]);
  }
  function clearMonth() {
    const ids = plans(ui.month).map(x => x.id);
    return ids.length ? S.removeMany('tp', ids) : null;
  }
  /** 지난달 같은 요일(마지막 주 기준이 아니라 가장 흔한 내용)로 이번 달 빈 칸 채우기. 휴관·특별 일정은 빼고 */
  function copyPrev() {
    const m = ui.month, [y, mo] = m.split('-').map(Number), pd = new Date(y, mo - 2, 1);
    const pm = `${pd.getFullYear()}-${U.pad(pd.getMonth() + 1)}`;
    const src = plans(pm).filter(x => SLOTS.includes(x.slot) && !x.color && x.cat);
    const best = {};
    src.forEach(x => { const k = `${wd(pm, +x.date.slice(8))}|${x.slot}`; const v = `${x.cat}\u0000${x.content}`; (best[k] ||= {})[v] = ((best[k] || {})[v] || 0) + 1; });
    const hol = AT_HOL(m);
    const recs = [];
    for (let d = 1; d <= dim(m); d++) {
      const w = wd(m, d); if (w === 0 || w === 6 || hol.includes(d) || at(m, d, '종일')) continue;
      SLOTS.forEach(slot => {

<script>
/* 홍보·방문처: 행정복지센터·직업재활시설·장애인단체·특수학급 고등학교·특수학교·임대아파트 등

 * 데이터는 네트워크 기관(분류·주소·연락처·세부 정보)으로 저장해 지도·상세 화면에도 같이 나온다. */

    const wb = XLSX.read(buf, { type: 'array' });

    wb.SheetNames.forEach(sn => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }).map(r => r.map(clean));
      const hi = rows.findIndex(r => r.some(c => /^주\s?소$/.test(c)) && r.some(c => /명$|학교명|단지명/.test(c)));

  function grouped(rows, hi, col, sn, out) {

        ${warn.length ? `<p class="form-notice">⚠ 다른 분류와 전화번호가 같은 ${warn.length}곳은 잘못 복사된 번호 같아서 비워 두었어요: ${warn.slice(0, 6).map(r => `${e(r.name)}(${e(r.phoneWarn)})`).join(', ')}${warn.length > 6 ? ' …' : ''}</p>` : ''}
        <div class="table-wrap"><table class="tbl bulk-tbl"><thead><tr><th></th><th>분류</th><th>이름</th><th>주소</th><th>연락처</th><th>세부 정보</th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr class="${r.on ? '' : 'dup'}"><td><input type="checkbox" data-act="or-pick" data-i="${i}" ${r.on ? 'checked' : ''} aria-label="넣기"></td><td class="nowrap">${e(r.category)}</td>
          <td><b>${e(r.name)}</b>${r.match ? ' <span class="badge">채움</span>' : r.biz ? `<div class="meta">사업체 '${e(r.biz)}'로 이미 있음</div>` : ' <span class="badge accent">새로</span>'}</td>
          <td class="clip">${e(r.address)}</td><td class="nowrap num">${e(r.phone)}</td><td class="wrap">${Object.entries(r.info).map(([k, v]) => `${e(k)} ${e(v)}`).join(' · ')}${r.note ? `<div class="meta">${e(r.note)}</div>` : ''}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div class="dr-foot"><button class="btn" type="button" data-act="dr-close">취소</button><button class="btn btn-primary" type="button" data-act="or-commit" ${fresh + upd ? '' : 'disabled'}>새로 ${fresh}곳 · 채움 ${upd}곳 넣기</button></div>`;
  }
  function commit(st) {
    const me = S.me(), today = U.today();
    const rows = st.rows.filter(r => r.on);
    const fresh = rows.filter(r => !r.match).map(r => ({ name: r.name, category: r.category, status: '보통', address: r.address, area: r.area || '', phone: r.phone, relation: '', promo: '', since: today, staff: me, memo: r.note || '', info: r.info }));
    const added = fresh.length ? S.upsertMany('net', fresh) : [];
    const patches = rows.filter(r => r.match).map(r => {
      const n = S.find('net', r.match) || {};
      return { id: r.match, category: r.category, info: { ...(n.info || {}), ...r.info }, ...(n.address ? {} : { address: r.address }), ...(n.phone ? {} : { phone: r.phone }), ...(r.note && !(n.memo || '').includes(r.note) ? { memo: [n.memo, r.note].filter(Boolean).join('\n') } : {}) };
    });
    if (patches.length) S.putMany('net', patches);
    // 주소로 지도 위치 찾기 (서버 부담을 줄이려고 1초에 한 곳씩)
    const queue = [...added, ...patches.map(p => S.find('net', p.id))].filter(n => n && n.address && (n.lat == null || n.approx)).map(n => n.id);
    (async () => { for (const id of queue) { await S.refine('net', id); await new Promise(r => setTimeout(r, 1100)); } })();
    return { added: added.length, filled: patches.length, locating: queue.length };
  }

  /* ---------- 화면 ---------- */
  const CAT_ORDER = ['행정복지센터', '직업재활시설', '장애인단체', '정신건강복지센터', '특수학급 고등학교', '특수학교', '임대아파트'];
  /** 홍보·방문처로 보는 기관: 엑셀로 넣은 분류 + 세부 정보가 있는 기관 */
  const isTarget = n => CAT_ORDER.includes(n.category) || (n.info && Object.keys(n.info).length);
  const visitsOf = n => S.actsOf('net', n.id).filter(a => VISIT_TYPES.includes(a.type));
  function page() {
    const nets = S.view().networks.filter(isTarget);
    const cats = [...new Set([...CAT_ORDER.filter(c => nets.some(n => n.category === c)), ...nets.map(n => n.category)])];
    const yr = U.today().slice(0, 4);
    const visitedThisYear = n => visitsOf(n).some(a => a.date.startsWith(yr));
    const cards = cats.map(c => {
      const list = nets.filter(n => n.category === c), done = list.filter(visitedThisYear).length, pct = list.length ? Math.round(done / list.length * 100) : 0;
      return `<button type="button" class="or-card ${ui.cat === c ? 'on' : ''}" data-act="or-cat" data-cat="${e(c)}"><span class="or-card-t">${e(c)}</span><b class="num">${list.length}<small>곳</small></b>
        <span class="or-bar"><i style="width:${pct}%"></i></span><span class="or-card-s">올해 방문 <b class="num">${done}</b>곳 · ${pct}%</span></button>`;
    }).join('');
    return `
      <div class="page-head"><div><h1 class="page-title">홍보·방문처</h1><div class="page-desc">행정복지센터·직업재활시설·장애인단체·특수학교·임대아파트 등 홍보하러 갈 곳을 분류별로 모아 보고, 다녀온 날을 바로 기록해요.</div></div>
        <div class="inline"><button class="btn btn-primary" type="button" data-act="or-file">기관 목록 엑셀 넣기</button><input type="file" id="orFile" accept=".xlsx,.xls" hidden><a class="btn" href="#/map">지도에서 보기</a></div></div>
      ${nets.length ? `<div class="or-cards"><button type="button" class="or-card ${!ui.cat ? 'on' : ''}" data-act="or-cat" data-cat=""><span class="or-card-t">전체</span><b class="num">${nets.length}<small>곳</small></b><span class="or-bar"><i style="width:${nets.length ? Math.round(nets.filter(visitedThisYear).length / nets.length * 100) : 0}%"></i></span><span class="or-card-s">올해 방문 <b class="num">${nets.filter(visitedThisYear).length}</b>곳</span></button>${cards}</div>
      <div class="toolbar"><input class="input" id="orQ" placeholder="이름·주소·읍면동으로 찾기" value="${e(ui.q)}" style="max-width:320px"><label class="check"><input type="checkbox" data-act="or-todo" ${ui.todo ? 'checked' : ''}>올해 아직 안 간 곳만</label></div>
      <div id="orList">${listHtml(nets)}</div>`
      : `<div class="panel"><div class="empty"><strong>아직 홍보·방문처가 없어요</strong>기관 목록 엑셀(행정복지센터·특수학급·특수학교·임대아파트 등)을 넣으면 분류별로 정리돼요.<div><button class="btn btn-primary" type="button" data-act="or-file">기관 목록 엑셀 넣기</button></div></div></div>`}`;
  }
  function listHtml(nets = S.view().networks.filter(isTarget)) {
    const yr = U.today().slice(0, 4);
    let list = nets.filter(n => (!ui.cat || n.category === ui.cat) && U.match(ui.q, n.name, n.address, n.area, n.category));
    if (ui.todo) list = list.filter(n => !visitsOf(n).some(a => a.date.startsWith(yr)));
    const cats = [...new Set([...CAT_ORDER, ...list.map(n => n.category)])].filter(c => list.some(n => n.category === c));
    if (!list.length) return '<div class="panel"><div class="empty">조건에 맞는 곳이 없어요.</div></div>';
    return cats.map(c => {
      const rows = list.filter(n => n.category === c).sort((a, b) => (a.area || '').localeCompare(b.area || '', 'ko') || a.name.localeCompare(b.name, 'ko'));
      return `<section class="panel or-sec"><div class="panel-pad or-sec-h"><h2 class="section-title">${e(c)} <span class="sub num">${rows.length}곳</span></h2></div>
        <div class="table-wrap"><table class="tbl or-tbl"><thead><tr><th>이름</th><th>읍면동</th><th>주소</th><th>연락처</th><th>세부 정보</th><th>최근 방문</th><th></th></tr></thead><tbody>
        ${rows.map(n => { const v = visitsOf(n)[0]; const thisYear = v && v.date.startsWith(yr); return `<tr class="${thisYear ? 'or-done' : ''}">
          <td><b class="link" data-act="open" data-kind="net" data-id="${n.id}">${e(n.name)}</b>${n.memo ? `<div class="meta">${e(n.memo.split('\n')[0])}</div>` : ''}</td>
          <td class="nowrap">${e(n.area || '')}</td><td class="clip" title="${e(n.address || '')}">${e(n.address || '')}</td>
          <td class="nowrap num">${n.phone ? `<a href="tel:${e(n.phone.replace(/[^0-9+]/g, ''))}">${e(n.phone)}</a>` : '<span class="sub">-</span>'}</td>
          <td>${Object.entries(n.info || {}).map(([k, val]) => `<span class="or-chip">${e(k)} <b>${e(val)}</b></span>`).join('')}</td>
          <td class="nowrap">${v ? `<b class="num">${U.dateDot(v.date)}</b><div class="meta">${e(v.type)}${v.staff ? ' · ' + e(v.staff) : ''}</div>` : '<span class="sub">아직 없음</span>'}</td>
          <td class="nowrap"><button class="btn btn-sm ${thisYear ? '' : 'btn-primary'}" type="button" data-act="or-visit" data-id="${n.id}">오늘 방문</button></td></tr>`; }).join('')}
        </tbody></table></div></section>`;
    }).join('');
  }
  function bind() {
    const q = document.getElementById('orQ');
    if (q) q.addEventListener('input', U.debounce(() => { ui.q = q.value.trim(); document.getElementById('orList').innerHTML = listHtml(); }, 150));
  }

  return { ui, parse, plan, previewHtml, commit, page, listHtml, bind, isTarget, CAT_ORDER };
})();

</script>
<script>
/* 대시보드 위 '실적 대시보드': 구역(현장중심·고용공단)의 실적 분류표로
 * 연간/월간 KPI · 세부사업별 목표 대비 달성률 표 · 월별 실적 막대를 보여 주고, 세부사업을 누르면 담당자별·기록 목록이 열린다 */
window.DP = (() => {
  const e = U.esc;
  const now = () => U.today().slice(0, 7);
  const ui = { mode: 'year', year: +U.today().slice(0, 4), month: now() };
  // 고용지원사업 기본 연간 목표(횟수) — 기관 사업계획 2026 기준. 데이터 관리에서 바꾸려면 settings.goalsBySet
  const GOALS = { '고용지원사업': { '직업상담': 120, '취업알선': 66, '취업확정': 54, '사후관리': 60, '취업자자조모임': 7, '고용자원개발': 60, '사업체관리': 120, '고용네트워크': 2 } };
  const SEC_LABEL = new Proxy({}, { get: (_, k) => D.progLabel(k) }); // 소속 값 → 화면 이름

  /** 지금 보는 구역의 실적 분류표 */
  function setOfScope() {
    const sc = S.getScope();
    if (sc.startsWith('s:')) return S.perfSetOf(sc.slice(2)) || '';
    if (!sc.startsWith('p:')) return '';
    return (S.get().settings.perfByProgram || {})[sc.slice(2)] || '';
  }
  const progOfScope = () => (S.getScope().startsWith('p:') ? S.getScope().slice(2) : '');

  /** 기간(YYYY 또는 YYYY-MM)의 실적 줄: 방문·전화 기록에서 자동으로 잡힌 것 + 직접 입력 */
  function lines(set, prefix, v = S.view()) {
    const acts = S.perfRows(prefix, v).filter(r => r.p.set === set).map(r => ({ id: r.a.id, kind: 'act', item: r.p.item, staff: r.a.staff || '', d: r.d, name: r.t ? r.t.name : '', tk: r.a.targetType, tid: r.t ? r.t.id : '', content: r.a.content || '', how: r.a.type, ppl: S.pplOf(r.a), n: Number(r.a.people) || 1, key: r.a.targetId }));
    const mans = v.perfs.filter(p => p.set === set && (p.date || '').startsWith(prefix)).map(p => ({ id: p.id, kind: 'perf', item: p.item, staff: p.staff || '', d: p.date, name: p.place || '', content: p.note || '', how: '직접 입력', ppl: S.pplOf(p), n: Number(p.people) || 1, key: U.orgKey(p.place) }));
    return [...acts, ...mans].sort((a, b) => a.d.localeCompare(b.d));
  }

  /** 고용지원사업 등: 기본 사업계획 목표 + 실적 화면에서 고친 목표 */
  function goalMap(set) {
    let custom = S.get().settings.goalsBySet; if (typeof custom === 'string') { try { custom = JSON.parse(custom); } catch { custom = null; } }
    return { ...(GOALS[set] || {}), ...((custom || {})[set] || {}) };
  }
  /** 목표: { year(i): 연간 목표, month(i, m): 그 달 목표 } (현장중심은 실적 목표 설정을, 나머지는 기본 사업계획을 쓴다) */
  function goals(set, Y) {
    if (set === GL.SET) {
      const g = GL.goal(), months = Number(g.months) || 12;
      return { year: i => GL.yearGoal(i, Y), month: (i, m) => GL.monthGoal(i, m, Y), note: Y === g.baseYear ? `${g.baseYear}년은 ${13 - months}~12월(${months}개월) 기준` : '연간 = 기준 실적 × 12 ÷ 기준 개월 수' };
    }
    const G = goalMap(set);
    // 월 목표: 연간 목표를 12달에 나눠 다 더하면 연간 목표와 같게 (예: 66 = 6·6·6·6·6·6·5·5·5·5·5·5)
    const month = (i, m) => { const t = G[i]; if (t == null || t === '') return null; const base = Math.floor(t / 12), extra = t - base * 12; return base + (m - 1 < extra ? 1 : 0); };
    return { year: i => (G[i] == null || G[i] === '' ? null : Number(G[i])), month, note: '연간 목표(횟수) 기준 · 월 목표 = 연간을 12달에 나눈 값' };
  }

  const pc = (a, t) => (t ? Math.round(a / t * 1000) / 10 : null);

  /* ---------- 실시간 코칭: 목표 대비 지금 어디쯤인지, 무엇을 더 하면 되는지 ---------- */
  /** 그 달 평일(주말·공휴일 빼고) 목록 */
  function workdays(ym) {
    let hol = []; try { hol = window.AT ? (AT.meta(ym).holidays || []).map(Number) : []; } catch { hol = []; }
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), out = [];
    for (let d = 1; d <= last; d++) { const wd = new Date(y, m - 1, d).getDay(); if (wd && wd !== 6 && !hol.includes(d)) out.push(`${ym}-${U.pad(d)}`); }
    return out;
  }
  // 세부사업마다 바로 할 일 (버튼)
  const ACTION = item => /사업체개발|고용자원개발/.test(item) ? `<button class="btn btn-sm btn-primary" type="button" data-act="new-biz">+ 사업체 발굴 등록</button><a class="btn btn-sm" href="#/map">지도에서 찾기</a>`
    : /사업체관리|고용네트워크/.test(item) ? `<a class="btn btn-sm" href="#/contacts">연락이력 쓰기</a>`
    : `<button class="btn btn-sm" type="button" data-act="dp-goperf" data-item="${e(item)}">실적 입력하기</button>`;
  /** 코칭 문장 목록 [{ lv: 'bad'|'warn'|'good'|'info', t, d, act }] + AI에 보낼 요약 */
  function coachData(set, items, G, Y, M, yLines, mon, cum) {
    const T = U.today(), curYM = T.slice(0, 7), live = M === curYM;
    const out = [], facts = [];
    const cnt = (list, i) => S.perfCount(list, i).cnt;
    const wd = workdays(M), passed = live ? wd.filter(d => d < T).length : wd.length, left = live ? wd.filter(d => d >= T).length : 0;
    const frac = wd.length ? passed / wd.length : 1, mm = +M.slice(5, 7);
    const yPace = set === GL.SET ? GL.paceOf(Y, GL.goal()) / 100 : (Y < +T.slice(0, 4) ? 1 : (+T.slice(5, 7) - 1 + (+T.slice(8, 10)) / 31) / 12);
    items.forEach(i => {
      const mt = G.month(i, mm), yt = G.year(i), done = cnt(mon, i), c = cnt(cum, i);
      // 연간 속도: 지금쯤 가 있어야 할 만큼에서 얼마나 늦었는지
      let yr = '', ysc = 0;
      if (yt && Y === +T.slice(0, 4)) {
        const exp = Math.round(yt * yPace), gap = exp - c, monthsLeft = Math.max(1, 12 - +T.slice(5, 7) + 1);
        if (gap >= Math.max(3, yt * .15)) { yr = `연간으로는 ${yt}건 중 ${c}건(지금쯤 ${exp}건)이라 남은 ${monthsLeft}달 동안 <b>월 ${Math.ceil((yt - c) / monthsLeft)}건</b>씩 해야 해요.`; ysc = gap / yt; }
      }
      if (!mt) { if (yr) out.push({ lv: 'warn', sc: ysc, t: `${i} 연간 목표보다 늦어요`, d: yr, act: ACTION(i) }); return; }
      const need = mt - done, expect = Math.round(mt * frac), behind = expect - done;
      facts.push(`${i}: 이번 달 ${done}/${mt}건 (지금쯤 ${expect}건이면 맞음), 누적 ${c}/${yt ?? '-'}건`);
      if (need <= 0) { out.push({ lv: yr ? 'info' : 'good', sc: -1 + ysc, t: `${i} 이번 달 목표 달성 (${done}/${mt}건)`, d: [done > mt ? `${done - mt}건 넘었어요. 넘친 실적은 다음 달로 이월돼요.` : '목표만큼 했어요.', yr].filter(Boolean).join(' '), act: yr ? ACTION(i) : '' }); return; }
      if (!live) { out.push({ lv: 'bad', sc: need / mt, t: `${i} ${need}건 모자랐어요 (${done}/${mt}건)`, d: '지난 기간이라 다음 달에 더 채워야 해요.' }); return; }
      const perDay = left ? need / left : need;
      const how = left ? `이번 달 목표 ${mt}건까지 ${need}건 남았어요. 남은 평일 ${left}일 동안 ${perDay >= 1 ? `<b>하루 ${Math.ceil(perDay)}건</b>` : `<b>주 ${Math.ceil(perDay * 5)}건</b>`}씩 하면 맞출 수 있어요.` : `이번 달이 끝나 ${need}건은 다음 달에 더 채워야 해요.`;
      if (behind > 0) out.push({ lv: behind / mt >= .3 || (left <= 5 && need > left) ? 'bad' : 'warn', sc: behind / mt + ysc + (left ? 0 : 1), t: `${i} 실적이 부족해요 — 지금쯤 ${expect}건인데 ${done}건`, d: [how, yr].filter(Boolean).join(' '), act: ACTION(i) });
      else out.push({ lv: yr ? 'warn' : 'info', sc: ysc, t: `${i} 이번 달은 순조로워요 (${done}/${mt}건)`, d: [`${need}건 남았고 남은 평일 ${left}일이에요.`, yr].filter(Boolean).join(' '), act: yr ? ACTION(i) : '' });
    });
    // 오래 연락이 끊긴 진행 중 사업체
    if (live) {
      const v = S.view();
      const stale = v.businesses.filter(b => D.ACTIVE_STAGES.includes(b.stage) && S.inScope(b.staff)).map(b => ({ b, last: S.actsOf('biz', b.id).map(a => a.date).sort().pop() || b.discoveredAt || '' })).filter(x => x.last && U.diffDays(x.last, T) >= 21).sort((a, b) => a.last.localeCompare(b.last));
      if (stale.length) out.push({ lv: 'warn', sc: .25, t: `3주 넘게 연락이 끊긴 진행 중 사업체 ${stale.length}곳`, d: `${stale.slice(0, 3).map(x => `<b class="link" data-act="open" data-kind="biz" data-id="${x.b.id}">${e(x.b.name)}</b>(${U.ago ? U.ago(x.last) : x.last})`).join(', ')}${stale.length > 3 ? ` 외 ${stale.length - 3}곳` : ''} — 다시 연락하면 사업체관리·취업 실적으로 이어져요.`, act: '<a class="btn btn-sm" href="#/contacts">연락이력 쓰기</a>' });
      facts.push(`3주 넘게 연락 없는 진행 중 사업체 ${stale.length}곳`);
      // 직원별 이번 달 실적
      const staffs = S.staffHere().map(x => x.name);
      const per = staffs.map(n => [n, items.reduce((a, i) => a + cnt(mon.filter(l => l.staff === n), i), 0)]);
      facts.push('직원별 이번 달 실적: ' + per.map(([n, c]) => `${n} ${c}건`).join(', '));

      const own = !D.isBuiltinItem(set, i), c = custom.get(i) || {}, n = cnt(i);
      const goalsCells = isGL ? [0, 1, 2].map(k => `<td class="r">${inp(i, k, (g.rows[i] || [])[k])}</td>`).join('') : `<td class="r">${inp(i, 0, gm[i])}</td>`;
      return `<tr data-mgr-row="${e(i)}" class="${own ? 'own' : ''}"><th>${own ? `<input class="input sm mgr-name" data-mgr-name="${e(i)}" value="${e(i)}" aria-label="세부사업 이름">` : `${e(i)} <span class="badge">기관 기본</span>`}</th>
        ${goalsCells}<td class="r num sub">${G.year(i) ?? '-'}</td>
        <td>${own ? `<label class="check sub"><input type="checkbox" data-mgr-only="${e(i)}" ${c.countOnly ? 'checked' : ''}>횟수만</label>` : `<span class="sub">${S.NO_PEOPLE.has(i) ? '횟수만' : '사람 수도'}</span>`}</td>
        <td class="r num sub">${n}건</td>
        <td>${own ? `<button class="icon-btn" type="button" data-act="dp-mgr-del" data-item="${e(i)}" aria-label="${e(i)} 지우기" title="${n ? '기록이 있으면 못 지워요' : '지우기'}" ${n ? 'disabled' : ''}>${V.I.close}</button>` : ''}</td></tr>`;
    };
    const gHead = isGL ? '<th class="r">연인원</th><th class="r">실인원</th><th class="r">횟수</th>' : '<th class="r">연간 목표(횟수)</th>';
    return `<details class="dp-mgr" ${ui.mgr ? 'open' : ''} id="dpMgr"><summary data-act="dp-mgr"><b>⚙️ 세부사업·목표 관리</b> <span class="sub">세부사업 추가·이름 바꾸기·목표 고치기 · 저장하면 실적 탭에 바로 반영돼요</span></summary>
      <div class="dp-mgr-body">
        ${isGL ? `<div class="inline goal-top"><label>기준 연도 <input class="input sm num" id="mgrBaseYear" value="${g.baseYear}" style="width:72px"></label><label>기준 개월 수 <input class="input sm num" id="mgrMonths" value="${g.months}" style="width:56px"></label><span class="sub">${g.baseYear}년은 ${13 - (Number(g.months) || 12)}~12월 목표, 다음 해부터 × 12 ÷ ${g.months}</span></div>` : ''}
        <div class="table-wrap"><table class="tbl dp-mgr-tbl"><thead><tr><th>세부사업</th>${gHead}<th class="r sub">${Y}년 목표</th><th>세는 법</th><th class="r">기록</th><th></th></tr></thead>
          <tbody>${items.map(row).join('')}</tbody>
          <tfoot><tr class="dp-mgr-new"><th><input class="input sm" id="mgrNewName" placeholder="새 세부사업 이름 (예: 직장체험)"></th>${isGL ? [0, 1, 2].map(k => `<td class="r"><input class="input sm num mgr-in" id="mgrNewG${k}" placeholder="-" inputmode="numeric"></td>`).join('') : '<td class="r"><input class="input sm num mgr-in" id="mgrNewG0" placeholder="-" inputmode="numeric"></td>'}<td></td><td><label class="check sub"><input type="checkbox" id="mgrNewOnly">횟수만</label></td><td></td><td><button class="btn btn-sm" type="button" data-act="dp-mgr-add">+ 추가</button></td></tr></tfoot></table></div>
        <div class="inline" style="justify-content:space-between;margin-top:8px"><span class="sub">기관 기본 항목은 이름은 그대로, 목표만 고칠 수 있어요. 직접 더한 항목은 이름을 바꾸면 그동안 넣은 실적도 새 이름으로 옮겨져요. '횟수만' = 사업체개발처럼 사람 수(연·실인원) 없이 건수만 세요.</span><button class="btn btn-primary" type="button" data-act="dp-mgr-save">저장</button></div>
      </div></details>`;
  }
  /** 지금 보는 기간의 공통 값 */
  function ctx() {
    const set = setOfScope();
    if (!set || !D.PERF_SETS[set]) return null;
    const items = D.PERF_SETS[set].items, Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`), mm = +M.slice(5, 7), G = goals(set, Y);
    const yLines = lines(set, String(Y)), cum = yLines.filter(l => l.d.slice(0, 7) <= M), mon = yLines.filter(l => l.d.startsWith(M));
    const cnt = (list, i) => S.perfCount(list, i).cnt, sumC = list => items.reduce((a, i) => a + cnt(list, i), 0);
    const gM = Array.from({ length: 12 }, (_, k) => items.reduce((a, i) => a + (G.month(i, k + 1) || 0), 0));
    const first = Math.max(1, gM.findIndex(v => v > 0) + 1 || 1);
    return { set, items, Y, M, mm, G, yLines, cum, mon, cnt, sumC, first };
  }
  /** 막대 몇 개짜리 작은 월별 그래프 (그림만, 누르기 없음) */
  function miniCols(vals, goalsArr, labels, curIdx) {
    const max = Math.max(1, ...vals, ...goalsArr);
    return `<div class="dp-chart dp-chart-sm" style="grid-template-columns:repeat(${vals.length},minmax(0,1fr))">${vals.map((n, k) => `<span class="dp-col ${k === curIdx ? 'on' : ''}"><span class="dp-col-plot">${goalsArr[k] ? `<i class="dp-goal" style="bottom:${goalsArr[k] / max * 100}%"></i>` : ''}<span class="dp-bar" style="height:${n / max * 100}%">${n ? `<em class="num">${n}</em>` : ''}</span></span><span class="dp-col-l">${labels[k]}</span></span>`).join('')}</div>`;
  }
  /** KPI 카드를 누르면: 누적(연간 목표 대비) 또는 이 달(월 목표 대비)을 그림으로 */
  function sumHtml(st) {
    const c = ctx(); if (!c) return '';
    const { set, items, Y, M, mm, G, yLines, cum, mon, cnt, sumC, first } = c;
    const isCum = st.kind !== 'mon';
    const list = isCum ? cum : mon;
    const tgt = i => (isCum ? G.year(i) : G.month(i, mm));
    // 지금쯤 가 있어야 할 곳(%): 누적은 이 달까지 월 목표 합 ÷ 연간 목표, 이 달은 지난 평일 비율
    const wd = workdays(M), T = U.today(), frac = M === T.slice(0, 7) ? wd.filter(d => d < T).length / (wd.length || 1) : M < T.slice(0, 7) ? 1 : 0;
    const paceOf = i => { const t = tgt(i); if (!t) return null; if (!isCum) return frac * 100; let g = 0; for (let m = 1; m <= mm; m++) g += G.month(i, m) || 0; return g / t * 100; };
    const tot = sumC(list), totT = items.reduce((a, i) => a + (tgt(i) || 0), 0), p = pc(tot, totT);
    const labels = [], act = [], gl = [];
    let a = 0, g = 0;
    for (let m = first; m <= 12; m++) { a += items.reduce((s2, i) => s2 + cnt(yLines.filter(l => +l.d.slice(5, 7) === m), i), 0); g += items.reduce((s2, i) => s2 + (G.month(i, m) || 0), 0); labels.push(`${m}월`); act.push(a); gl.push(g); }
    const staffs = [...new Set([...S.staffHere().map(x => x.name), ...list.map(l => l.staff).filter(Boolean)])];
    const sv = staffs.map(n => [n, sumC(list.filter(l => l.staff === n))]), smax = Math.max(1, ...sv.map(x => x[1]));
    const title = isCum ? `누적 실적 · ${Y}년 ${first}~${mm}월` : `${Y}년 ${mm}월 실적`;
    const recs = list.slice().sort((x, y) => y.d.localeCompare(x.d));
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">${isCum ? '📈' : '📅'} ${e(title)}</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <div class="seg" style="margin-top:6px"><button type="button" class="${isCum ? 'on' : ''}" data-act="dp-sum" data-kind="cum">누적 (연간 목표 대비)</button><button type="button" class="${isCum ? '' : 'on'}" data-act="dp-sum" data-kind="mon">${mm}월 (월 목표 대비)</button></div></div>
      <div class="dr-body">
        <div class="dp-sum-top">${ring(p, 96)}<div><b class="num dp-sum-n">${U.num(tot)}</b><span class="sub"> / ${U.num(totT)}건 (${isCum ? '연간 목표' : '월 목표'})</span>
          <p class="sub" style="margin:4px 0 0">${p == null ? '' : p >= 100 ? '목표를 채웠어요 👏' : `${U.num(Math.max(0, totT - tot))}건 남았어요.`} ${isCum ? '점선 = 지금쯤 가 있어야 할 곳' : M === T.slice(0, 7) ? `평일 ${wd.filter(d => d < T).length}/${wd.length}일 지남 · 점선 = 지금쯤 가 있어야 할 곳` : ''}</p></div></div>
        ${isCum ? `<h3 class="dp-dr-h">누적 추이 <span class="sub">파란 선 = 쌓인 실적 · 회색 점선 = 쌓인 목표</span></h3>${cumChart(labels, act, gl, Math.max(0, mm - first))}`
          : `<h3 class="dp-dr-h">${mm}월 날짜별 실적</h3>${(() => { const days = Array.from({ length: new Date(Y, mm, 0).getDate() }, (_, k) => k + 1); return miniCols(days.map(d => sumC(mon.filter(l => +l.d.slice(8, 10) === d))), days.map(() => 0), days.map(d => (d % 5 === 1 ? String(d) : '')), M === T.slice(0, 7) ? +T.slice(8, 10) - 1 : -1); })()}`}
        <h3 class="dp-dr-h">세부사업별 <span class="sub">막대 = ${isCum ? '누적' : '이 달'} 실적 ÷ ${isCum ? '연간' : '월'} 목표 · 누르면 그 사업 자세히</span></h3>
        <div class="dp-hbs">${items.map(i => { const cc = S.perfCount(list, i); return hbar(e(i), cc.cnt, tgt(i), paceOf(i), `data-act="dp-item" data-item="${e(i)}" role="button" tabindex="0"`, cc.yeon != null && cc.cnt ? `연 ${cc.yeon} · 실 ${cc.sil}` : ''); }).join('')}</div>
        <h3 class="dp-dr-h">담당자별 <span class="sub">${isCum ? '누적' : '이 달'} 실적</span></h3>
        <div class="dp-hbs">${sv.map(([n, v]) => `<div class="dp-hb"><span class="dp-hb-l row">${V.staffDot(n)}${e(n)}</span><span class="dp-hb-t"><i style="width:${v / smax * 100}%;background:${V.staffColor(n)}"></i></span><span class="dp-hb-v num"><b>${v}</b>건</span></div>`).join('') || '<p class="sub">담당자가 없어요.</p>'}</div>
        <h3 class="dp-dr-h">기록 ${recs.length}건</h3>
        ${recs.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>세부사업</th><th>사업체·기관</th><th>참여자</th><th>담당</th></tr></thead><tbody>${recs.slice(0, 300).map(l => `<tr class="sc-row" style="--sc:${V.staffColor(l.staff)}"><td class="num nowrap">${U.dateDot(l.d)}</td><td class="nowrap"><span class="link" data-act="dp-item" data-item="${e(l.item)}">${e(l.item)}</span></td><td>${l.tid ? `<b class="link" data-act="open" data-kind="${l.tk}" data-id="${l.tid}">${e(l.name)}</b>` : e(l.name || '-')}</td><td>${e((l.ppl || []).join(', '))}</td><td class="nowrap">${e(l.staff)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="sub">아직 기록이 없어요. 실적은 실적 화면에서 넣은 것만 세요.</p>'}
      </div>`;
  }
  /** 세부사업 자세히: 담당자별 (당월·누적) + 기록 목록 */
  function itemHtml(st) {
    const set = setOfScope(), Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`), mm = +M.slice(5, 7);
    const all = lines(set, String(Y)).filter(l => l.item === st.item && l.d.slice(0, 7) <= M);
    const staffs = [...new Set([...S.staffHere().map(x => x.name), ...all.map(l => l.staff).filter(Boolean)])];
    const list = all.filter(l => !st.who || l.staff === st.who).slice().reverse();
    const C = l => S.perfCount(l, st.item), fmt = c => (c.yeon == null ? `${c.cnt}` : `${c.yeon}/${c.sil}/${c.cnt}`);
    const unit = S.NO_PEOPLE.has(st.item) ? '건' : '연/실/횟수';
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">[${e(st.item)}] 실적 현황</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <p class="sub" style="margin:0">${Y}년 ${(ctx() || { first: 1 }).first}~${mm}월 누적 ${fmt(C(all))} · ${mm}월 ${fmt(C(all.filter(l => l.d.startsWith(M))))} <span class="sub">(${unit})</span></p></div>
      <div class="dr-body">
        ${(() => { const c = ctx(); if (!c) return ''; const { G, yLines, first } = c, yt = G.year(st.item), cc = C(all), p = pc(cc.cnt, yt);
          const ms = Array.from({ length: 13 - first }, (_, k) => k + first), vals = ms.map(m => C(yLines.filter(l => l.item === st.item && +l.d.slice(5, 7) === m)).cnt), gs = ms.map(m => G.month(st.item, m) || 0);
          return `<div class="dp-sum-top">${ring(p, 84)}<div><b class="num dp-sum-n">${cc.cnt}</b><span class="sub"> / ${yt ?? '-'}건 (연간 목표)</span>${cc.yeon != null ? `<p class="sub" style="margin:4px 0 0">연인원 ${cc.yeon} · 실인원 ${cc.sil} · 횟수 ${cc.cnt}</p>` : ''}</div></div>
            <h3 class="dp-dr-h">달별 실적 <span class="sub">가로선 = 그 달 목표</span></h3>${miniCols(vals, gs, ms.map(m => m + '월'), ms.indexOf(mm))}`; })()}
        <h3 class="dp-dr-h">담당자별</h3>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>담당자</th><th class="r">${mm}월 <small>${unit}</small></th><th class="r">누적 (1~${mm}월)</th></tr></thead><tbody>
          ${staffs.map(n => `<tr class="${st.who === n ? 'on' : ''}"><th><button type="button" class="linklike" data-act="dp-who" data-who="${e(n)}">${V.staffDot(n)}${e(n)}</button></th><td class="r num">${fmt(C(all.filter(l => l.staff === n && l.d.startsWith(M))))}</td><td class="r num"><b>${fmt(C(all.filter(l => l.staff === n)))}</b></td></tr>`).join('')}
        </tbody></table></div>
        <h3 style="margin:16px 0 6px">기록 ${list.length}건 ${st.who ? `<span class="sub">· ${e(st.who)}</span> <button type="button" class="linklike" data-act="dp-who" data-who="">전체 보기</button>` : ''}</h3>
        ${list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>사업체·기관</th><th>참여자</th><th>내용</th><th>담당</th><th>구분</th></tr></thead><tbody>
          ${list.slice(0, 300).map(l => `<tr class="sc-row" style="--sc:${V.staffColor(l.staff)}"><td class="num nowrap">${U.dateDot(l.d)}</td><td>${l.tid ? `<b class="link" data-act="open" data-kind="${l.tk}" data-id="${l.tid}">${e(l.name)}</b>` : `<b>${e(l.name || '-')}</b>`}</td><td>${e((l.ppl || []).join(', '))}</td><td class="wrap">${e(l.content)}</td><td class="nowrap">${e(l.staff)}</td><td class="nowrap sub">${e(l.how)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="sub">아직 기록이 없어요.</p>'}
      </div>`;
  }

  /** AI 코칭에 보낼 숫자 요약 (참여자 이름 같은 개인정보는 넣지 않는다) */
  function coachFacts() {
    const set = setOfScope();
    if (!set) return null;
    const items = D.PERF_SETS[set].items, Y = ui.year, M = ui.mode === 'month' ? ui.month : (String(Y) === now().slice(0, 4) ? now() : `${Y}-12`);
    const yLines = lines(set, String(Y)), cum = yLines.filter(l => l.d.slice(0, 7) <= M), mon = yLines.filter(l => l.d.startsWith(M));
    const cd = coachData(set, items, goals(set, Y), Y, M, yLines, mon, cum);
    const label = SEC_LABEL[progOfScope()] || progOfScope(), periodLabel = ui.mode === 'month' ? `${Y}년 ${+M.slice(5, 7)}월` : `${Y}년`;
    return { key: label + periodLabel, set, label, M, text: [`부서: ${label} (${set})`, `기준: ${M} (오늘 ${U.today()}, 이번 달 남은 평일 ${cd.left}일)`, ...cd.facts].join('\n') };
  }

  return { ui, panel, itemHtml, sumHtml, setOfScope, lines, goals, goalMap, coachFacts };
})();

</script>
<script>
/* 앱 셸: 라우팅, Drawer, 검색, 액션 처리 */
window.App = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const view = $('#view');

    ['biz', '사업체·네트워크', 'biz', () => S.get().businesses.length + S.get().networks.length],
    ['map', '지도', 'map'],
    ['schedule', '일정', 'cal', () => S.get().events.filter(x => !x.done && U.diffDays(U.today(), x.date) <= 7).length || ''],
    ['contacts', '연락이력', 'log'],
    ['perf', '실적', 'perf'],
    ['orders', '출장·특근', 'trip'],
    ['outreach', '홍보·방문처', 'map', () => S.view().networks.filter(n => OR.isTarget(n)).length || ''],
    ['attend', '출석부', 'att', () => S.get().jobPeople.length],

  ];
  /* 상단 사업 구역: 고른 구역에 필요한 기능만 왼쪽에 보인다 */
  const SECS = [
    { k: 'field', label: '현장중심', prog: '장애인개발원', items: ['dashboard', 'biz', 'map', 'schedule', 'contacts', 'perf', 'outreach'], desc: '현장중심직업재활센터 (한국장애인개발원) · 사업체 개발·연락·실적·홍보' },
    { k: 'emp', label: '고용공단', prog: '고용공단', items: ['dashboard', 'biz', 'map', 'schedule', 'contacts', 'perf'], desc: '고용지원사업 (한국장애인고용공단) · 사업체·연락·실적' },
    { k: 'jobs', label: '장애인일자리', prog: '장애인일자리', items: ['attend', 'map', 'schedule'], desc: '장애인일자리사업 · 참여자 출석·근무처' },
    { k: 'data', label: '데이터 관리', prog: '', items: ['data'], desc: '직원·계정·권한, 엑셀 백업·가져오기' },
  ];
  const SEC_HINT = {
    dashboard: () => '오늘 할 일·달력', biz: () => `사업체 ${S.view().businesses.length} · 기관 ${S.view().networks.length} · 명함 ${S.view().cards.length}`, map: () => '사업체·기관 위치',
    schedule: () => { const n = S.view().events.filter(x => !x.done && U.diffDays(U.today(), x.date) <= 7 && x.date >= U.today()).length; return n ? `이번 주 ${n}건` : '업무 일정'; },
    contacts: () => '사업체 연락·방문', outreach: () => { const n = S.view().networks.filter(x => OR.isTarget(x)).length; return n ? `${n}곳 · 방문 기록` : '행정복지센터·학교·아파트'; }, perf: () => '월 목표·실적표', orders: () => '출장·특근 명령부·여비', attend: () => `참여자 ${S.get().jobPeople.length}명`, training: () => 'JOB이음터 · 일과놀이반', data: () => '백업·가져오기·권한',
  };
  const lsGetSec = () => { try { return localStorage.getItem('ardim.sec') || ''; } catch { return ''; } };

  const DEDUPE_WHAT = { biz: '사업체', net: '기관', card: '명함' };

    const idx = S.dupIndex(kind), seen = new Set(), groups = [];

    idx.forEach((_, id) => {

    }
    const base = { name, address: c.address || '', area: c.area || '', lat: c.lat ?? null, lng: c.lng ?? null, approx: !!c.approx, staff: S.me() };
    const rec = to === 'biz'
      ? S.upsert('biz', { ...base, stage: '발굴', discoveredAt: U.isDate(c.metAt) ? c.metAt : U.today(), source: '명함', phone: c.phone || '', placements: 0 })
      : S.upsert('net', { ...base, category: category || D.guessCategory(name), status: '보통', since: c.metAt || U.today(), relation: '', promo: '' });
    if (to === 'biz') S.upsert('act', { targetType: 'biz', targetId: rec.id, date: rec.discoveredAt, type: '발굴', content: `명함(${c.name})으로 사업체 등록`, staff: S.me() });
    S.upsert('card', { id: c.id, linkType: to, linkId: rec.id });
    bigMap?.closePopup();
    const where = to === 'biz' ? '사업체 개발' : `네트워크(${rec.category})`;
    if (!M.hasPos(S.find(to, rec.id)) && rec.address) {
      // 도로명 주소처럼 읍면동이 없으면 인터넷 지도에서 주소로 위치를 먼저 찾아 본다
      push({ type: 'loading', title: '지도 위치를 찾는 중', body: `${rec.address} 의 위치를 찾고 있어요.` }, fromDrawer);
      await Promise.race([S.refine(to, rec.id), new Promise(r => setTimeout(r, 12000))]);
      stack.pop();
    }
    if (!M.hasPos(S.find(to, rec.id))) {
      // 주소가 없거나 읍면동을 못 찾으면 지도에 못 나오므로 바로 위치를 정하게 한다
      toast(`'${name}'을(를) ${where}에 등록했어요. ${rec.address ? '주소로 지도 위치를 찾지 못했어요' : '명함에 주소가 없어 지도 위치를 못 정했어요'}. 주소를 고치거나 지도를 눌러 위치를 정해 주세요.`, 'error');
      push({ type: 'form', kind: to, id: rec.id, focus: 'address' }, fromDrawer);
      return rec;
    }
    toast(`'${name}'을(를) ${where}에 등록하고 명함을 연결했습니다.${S.find(to, rec.id).approx ? ' (지도에는 대략적인 위치로 표시돼요)' : ''}`);
    openDetail(to, rec.id, fromDrawer);
    return rec;
  }
  /** 저장 알림 + 지도 연결: 위치가 있으면 "지도에서 보기", 없으면 "위치 정하기" */
  function mapToast(kind, rec, msg) {
    if (!['biz', 'net', 'card'].includes(kind)) return toast(msg);
    if (kind === 'card' && rec.linkType) {
      const t = S.find(rec.linkType, rec.linkId);
      return toast(`${msg} ${t ? `'${t.name}'에 연결된 명함이라 지도에서 그곳을 누르면 보여요.` : ''}`, '', t && M.hasPos(t) ? { action: { label: '📍 지도에서 보기', run: () => A['map-show']({ dataset: { kind: rec.linkType, id: t.id } }) } } : {});
    }
    const run = () => A['map-show']({ dataset: { kind, id: rec.id } });
    // 주소로 위치를 찾는 중이면 잠시 뒤 다시 확인한다
    const cur = S.find(kind, rec.id) || rec;
    if (M.hasPos(cur)) return toast(`${msg} 지도에도 ${cur.approx ? '대략적인 위치로 ' : ''}표시돼요.`, '', { action: { label: '📍 지도에서 보기', run } });
    if (kind === 'card') return toast(`${msg} 명함에 주소가 없어 지도에는 안 나와요. 사업체·기관에 연결하면 그곳 위치로 보여요.`);
    toast(`${msg} 주소가 없어 아직 지도에 안 나와요.`, 'error', { action: { label: '위치 정하기', run: () => push({ type: 'form', kind, id: rec.id, focus: 'address' }, true) } });
  }
  async function onSubmit(form) {
    const res = F.collect(form);
    if (!res) return;
    const { kind, obj } = res;
    const id = form.dataset.id;
    if (id) obj.id = id;
    if (!id && ['biz', 'net', 'card'].includes(kind)) {
      const d = S.dupesOf(kind, obj);
      const list = d.slice(0, 3).map(x => `'${x.x.name}${kind === 'card' && x.x.org ? ' · ' + x.x.org : ''}' (${x.why.join(', ')})`).join(', ');
      if (d.length && !(await confirmBox('이미 비슷한 게 있어요', `${list}${d.length > 3 ? ` 외 ${d.length - 3}건` : ''}. 그래도 새로 등록할까요? 등록한 뒤에도 상세 화면에서 합칠 수 있어요.`, '그래도 등록'))) return;
    }
    // 연락이력에만 있던 같은 이름의 곳(미등록)이 있으면 그 기록을 이어받는다
    const top0 = stack[stack.length - 1] || {};
    const adopt = top0.adopt && S.find('biz', top0.adopt);
    const pend = !id && (kind === 'biz' || kind === 'net') ? (adopt && S.isPending(adopt) ? adopt : S.get().businesses.find(b => S.isPending(b) && U.orgKey(b.name) === U.orgKey(obj.name))) : null;
    if (pend && kind === 'biz') { obj.id = pend.id; obj.pending = ''; }
    const before = id && kind === 'biz' ? (S.find('biz', id) || {}).discoveredAt : null;
    const saved = S.upsert(kind, obj);
    if (pend && kind === 'net') {
      const moves = S.get().activities.filter(a => a.targetType === 'biz' && a.targetId === pend.id).map(a => ({ id: a.id, targetType: 'net', targetId: saved.id }));
      if (moves.length) S.putMany('act', moves);
      S.remove('biz', pend.id);
    }
    if (id && kind === 'biz' && U.isDate(saved.discoveredAt) && before !== saved.discoveredAt) {
      const disc = S.get().activities.filter(a => a.targetType === 'biz' && a.targetId === id && a.type === '발굴');
      if (disc.length) S.putMany('act', disc.map(a => ({ id: a.id, date: saved.discoveredAt })));
    }
    if (kind === 'card' && res.extra) {
      stack.pop();
      registerFromCard(saved, res.extra.to, res.extra.name, res.extra.cat, false);
      return;
    }
    if (!id && kind === 'biz' && !pend) S.upsert('act', { targetType: 'biz', targetId: saved.id, date: saved.discoveredAt || U.today(), type: '발굴', content: saved.source ? `${saved.source}에서 찾아 사업체 등록` : '사업체 발굴 등록', staff: saved.staff || S.me() });
    // 간단 등록에서 담당자를 쓰면 명함도 만들어 이 사업체에 연결한다
    if (!id && kind === 'biz' && res.extra && res.extra.contact) {
      const ct = res.extra.contact, mob = /^01/.test(ct.phone.replace(/\D/g, ''));
      S.upsert('card', { name: ct.name, title: ct.title, org: saved.name, mobile: mob ? ct.phone : '', phone: mob ? '' : ct.phone, email: '', address: saved.address || '', linkType: 'biz', linkId: saved.id, metAt: saved.discoveredAt || U.today(), metWhere: saved.source || '', tags: ['사업체 담당자'], memo: '' });
    }
    mapToast(kind, saved, id ? '저장했습니다.' : '등록했습니다.');
    stack.pop();
    if (!id && kind !== 'ev' && !stack.length) stack.push({ type: 'detail', kind, id: saved.id });
    renderDrawer();
  }

  /* ---------- Search ---------- */
  let srIndex = 0, srItems = [];
  function openSearch() {
    $('#searchLayer').hidden = false;
    const q = $('#searchInput');
    q.value = ''; drawSearch('');
    setTimeout(() => q.focus(), 10);
  }
  function closeSearch() { $('#searchLayer').hidden = true; }
  function drawSearch(q) {
    const box = $('#searchResults');
    if (!q.trim()) { box.innerHTML = '<div class="empty">사업체명, 담당자 이름, 전화번호 뒷자리, 기관명으로 찾을 수 있습니다.</div>'; srItems = []; return; }
    const r = S.search(q);
    srItems = [];
    const row = (kind, x, main, meta, side) => { srItems.push([kind, x.id]); return `<div class="sr ${srItems.length - 1 === srIndex ? 'hi' : ''}" data-act="sr-open" data-i="${srItems.length - 1}"><div style="min-width:0"><div class="name">${main}</div><div class="meta">${meta}</div></div><div class="side">${side}</div></div>`; };
    const contactSide = (kind, id, la) => { const c = S.cardsOf(kind, id)[0]; return `${c ? `<div class="phone">${U.esc(c.name)} ${U.esc(c.mobile || c.phone || '')}</div>` : ''}${la ? `<div>최근 ${U.esc(la.type)} ${U.dateDot(la.date)}</div>` : ''}`; };
    let html = '';
    if (r.biz.length) html += `<div class="sr-group"><h4>사업체 개발</h4>${r.biz.map(b => row('biz', b, U.hl(b.name, q), `${U.esc(b.stage)} · ${U.esc(b.industry)} · ${U.esc(b.area || '')}`, contactSide('biz', b.id, S.lastAct('biz', b.id)))).join('')}</div>`;
    if (r.card.length) html += `<div class="sr-group"><h4>명함</h4>${r.card.map(c => row('card', c, `${U.hl(c.name, q)} <span class="meta">${U.esc(c.title || '')}</span>`, U.hl(c.org || '', q), `<div class="phone">${U.hl(c.mobile || c.phone || '', q)}</div>`)).join('')}</div>`;
    if (r.net.length) html += `<div class="sr-group"><h4>네트워크</h4>${r.net.map(n => row('net', n, U.hl(n.name, q), `${U.esc(n.category)} · 관계 ${U.esc(n.status)}`, contactSide('net', n.id, S.lastAct('net', n.id)))).join('')}</div>`;
    box.innerHTML = html || `<div class="empty"><strong>'${U.esc(q)}' 검색 결과가 없습니다</strong>이름 일부나 전화번호 뒷자리 4자리로 다시 찾아보세요.</div>`;
  }

  /* ---------- 파일·사진으로 등록 ---------- */
  const replaceTop = entry => { if (!stack.length) stack.push(entry); else stack[stack.length - 1] = entry; renderDrawer(); };
  const readDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

  async function handleBizFile(file) {
    if (/\.(xlsx|xls|csv)$/i.test(file.name)) {
      try { push({ type: 'bulk', state: await IMP.start(file) }, false); }
      catch (err) { console.error(err); toast(err.drm ? err.message : '파일에서 표를 읽지 못했습니다. 첫 줄(또는 제목 아래 줄)에 사업체명·주소 같은 열 이름이 있는지 확인하세요.', 'error'); }
      return;
    }
    if (file.size > 20 * 1024 * 1024) return toast('파일이 너무 큽니다. 20MB 이하로 올려 주세요.', 'error');
    if (!AI.available()) return readBizFileLocal(file);
    push({ type: 'loading', title: '문서를 읽는 중', body: 'AI가 사업자등록증·구인공고에서 사업체 정보를 찾고 있습니다. 10~20초 걸립니다.' }, false);
    try {
      const data = file.type === 'application/pdf' ? await readDataUrl(file) : await F.resizeImage(file, 1800, .85);
      const r = await AI.readBizDoc(data);
      replaceTop({ type: 'form', kind: 'biz', preset: { ...r, employees: Number(String(r.employees).replace(/[^0-9]/g, '')) || '', source: '현장 발굴', _notice: 'AI가 문서에서 읽은 내용입니다. 틀린 곳이 없는지 확인한 뒤 등록하세요.' } });
    } catch (err) { closeDrawer(); toast('문서를 읽지 못했습니다: ' + err.message, 'error'); }
  }

  /** AI 키가 없을 때: PDF 글자를 직접 읽어 채우고, 못 읽으면 빈 등록 양식을 연다 */
  async function readBizFileLocal(file) {
    const blank = why => replaceTop({ type: 'form', kind: 'biz', preset: { source: '현장 발굴', _notice: why } });
    push({ type: 'loading', title: '문서를 읽는 중', body: 'PDF에서 사업체 정보를 찾고 있습니다.' }, false);
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) {
      return blank(`사진(${file.name})은 AI 키가 있어야 글자를 읽을 수 있어요. 사진을 보며 아래 칸을 직접 채워 주세요. 데이터 관리 > AI 도우미에 키를 넣으면 다음부터 자동으로 채워집니다.`);
    }
    try {
      const text = await DT.pdfText(file);
      const r = DT.parseBiz(text);
      const got = ['name', 'ceo', 'bizNo', 'address', 'phone'].filter(k => r[k]);
      if (text.replace(/\s/g, '').length < 20) return blank('이 PDF는 스캔한 그림이라 글자를 읽을 수 없어요. 문서를 보며 아래 칸을 직접 채워 주세요. (AI 키가 있으면 스캔본도 읽을 수 있습니다)');
      replaceTop({ type: 'form', kind: 'biz', preset: { ...r, source: '현장 발굴', memo: r.name ? '' : text.slice(0, 400), _notice: got.length ? `PDF 글자에서 ${got.length}개 항목을 찾아 채웠어요. 틀린 곳이 없는지 꼭 확인하고 등록하세요.` : 'PDF에서 사업체 항목을 찾지 못해 읽은 글자를 메모 칸에 넣었어요. 필요한 내용을 옮겨 적어 주세요.' } });
    } catch (err) {
      console.error(err);
      blank('PDF를 읽지 못했어요 (' + err.message + '). 문서를 보며 아래 칸을 직접 채워 주세요.');
    }
  }

  function guessLink(org) {
    const k = U.orgKey(org);
    if (k.length < 2) return null;
    const hit = (list, kind) => { const x = list.find(o => { const n = U.orgKey(o.name); return n && (n === k || n.includes(k) || k.includes(n)); }); return x ? { kind, x } : null; };
    return hit(S.get().businesses, 'biz') || hit(S.get().networks, 'net');
  }

  /* ---------- 명함 PDF로 등록: 한 장이면 등록 양식, 여러 장이면 확인 목록 ---------- */
  const cardMemo = r => [r.fax && `팩스 ${r.fax}`, r.homepage && `홈페이지 ${r.homepage}`].filter(Boolean).join('\n');
  async function handleCardPdf(files) {
    push({ type: 'loading', title: '명함 PDF를 읽는 중', body: AI.available() ? 'AI가 PDF 안의 명함을 찾고 있습니다. 쪽이 많으면 30초쯤 걸립니다.' : 'PDF에서 이름·연락처를 찾고 있습니다.' }, false);
    const found = [];
    let scanned = null;
    for (const f of files) {
      if (f.size > 25 * 1024 * 1024) { toast(`${f.name}: 25MB 이하 PDF만 올릴 수 있어요.`, 'error'); continue; }
      let pages = null, perr = null;
      try { ({ pages } = await DT.pdfPages(f, 40)); } catch (err) { perr = err; }
      if (AI.available()) {
        try {
          const list = await AI.readCardsPdf(await readDataUrl(f));
          list.filter(c => c.name || c.mobile || c.phone || c.email).forEach(c => found.push({ ...c, photo: (pages && pages[(c.page || 1) - 1] || {}).img || '', file: f.name }));
          continue;
        } catch (err) { toast(`AI로 읽지 못해 PDF 글자로 읽어요: ${err.message}`, 'error'); }
      }
      if (!pages) { toast(`${f.name}을(를) 열지 못했어요${perr ? ` (${perr.message})` : ''}.`, 'error'); continue; }
      pages.forEach(pg => {
        const c = DT.parseCard(pg.text);
        if (DT.isCard(c)) found.push({ ...c, page: pg.page, photo: pg.img, file: f.name });
        else if (!pg.text.replace(/\s/g, '') && !scanned) scanned = { img: pg.img, file: f.name };
      });
    }
    if (!found.length) {
      if (scanned) return replaceTop({ type: 'form', kind: 'card', preset: { photo: scanned.img, _notice: `${scanned.file}은(는) 스캔한 그림 PDF라 글자를 읽을 수 없어요. 첫 쪽을 명함 사진으로 넣어 두었으니 보면서 칸을 채워 주세요. (데이터 관리 > AI 도우미에 키를 넣으면 스캔본도 자동으로 읽어요)` } });
      closeDrawer();
      return toast('PDF에서 명함(전화번호·이메일)을 찾지 못했어요.', 'error');
    }
    const rows = found.map(c => {
      const link = guessLink(c.org);
      const dup = S.dupesOf('card', { name: c.name || '', org: c.org || '', mobile: c.mobile || '', email: c.email || '' })[0];
      return { ...c, on: !dup, dup: dup ? `${dup.x.name}${dup.x.org ? ' · ' + dup.x.org : ''}` : '', linkType: link ? link.kind : '', linkId: link ? link.x.id : '', linkName: link ? link.x.name : '' };
    });
    if (rows.length === 1 && !rows[0].dup) {
      const r = rows[0];
      return replaceTop({ type: 'form', kind: 'card', preset: { name: r.name, title: r.title, dept: r.dept, org: r.org, mobile: r.mobile, phone: r.phone, email: r.email, address: r.address, memo: cardMemo(r), photo: r.photo, linkType: r.linkType, linkId: r.linkId,
        _notice: `PDF(${r.file})에서 읽은 내용입니다. 틀린 곳이 없는지 확인한 뒤 등록하세요.${r.linkName ? ` 소속이 같은 '${r.linkName}'에 연결해 두었습니다.` : ''}` } });
    }
    replaceTop({ type: 'cardbulk', state: { rows, metAt: U.today(), metWhere: '' } });
  }
  function cardBulkHtml(st) {
    const n = st.rows.filter(r => r.on).length;
    const inp = (i, k, w) => `<input class="input sm" style="width:${w}px" data-cbf="${i}" data-k="${k}" value="${U.esc(st.rows[i][k] || '')}">`;
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">명함 PDF 등록 · ${st.rows.length}장</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
      <p class="sub" style="margin:0">PDF에서 찾은 명함입니다. 칸을 고칠 수 있고, 이미 있는 명함은 빼 두었어요. 소속이 같은 사업체·기관이 있으면 자동으로 연결됩니다.</p></div>
      <div class="dr-body">
        <div class="table-wrap"><table class="tbl bulk-tbl cb-tbl"><thead><tr><th><input type="checkbox" data-cball ${n === st.rows.length ? 'checked' : ''} aria-label="모두 선택"></th><th></th><th>이름</th><th>직함</th><th>소속</th><th>휴대전화</th><th>전화</th><th>이메일</th><th>연결</th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr class="${r.on ? '' : 'dup'}"><td><input type="checkbox" data-cbon="${i}" ${r.on ? 'checked' : ''} aria-label="등록"></td>
          <td>${r.photo ? `<img class="cb-thumb" src="${r.photo}" alt="">` : ''}<div class="sub">${r.page ? r.page + '쪽' : ''}</div></td>
          <td>${inp(i, 'name', 90)}${r.dup ? `<div class="sub" style="color:var(--danger)">이미 있음: ${U.esc(r.dup)}</div>` : ''}</td><td>${inp(i, 'title', 80)}</td><td>${inp(i, 'org', 150)}</td><td>${inp(i, 'mobile', 125)}</td><td>${inp(i, 'phone', 125)}</td><td>${inp(i, 'email', 150)}</td>
          <td class="nowrap">${r.linkName ? `🔗 ${U.esc(r.linkName)}` : '<span class="sub">분류 대기</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="perf-form" style="margin-top:12px"><label>받은 날<input class="input" type="date" id="cbMet" value="${U.esc(st.metAt)}"></label><label class="grow">받은 곳 <span class="sub">(행사·방문처 등)</span><input class="input" id="cbWhere" value="${U.esc(st.metWhere)}" placeholder="예: 경기 서남부 채용박람회"></label></div>
      </div>
      <div class="dr-foot"><button class="btn" type="button" data-act="dr-close">취소</button><button class="btn btn-primary" type="button" data-act="card-bulk-commit" ${n ? '' : 'disabled'}>선택한 ${n}장 등록</button></div>`;
  }
  function bindCardBulk(st) {
    const inner = $('#drawerInner');
    inner.querySelectorAll('[data-cbf]').forEach(el => { el.oninput = () => { st.rows[+el.dataset.cbf][el.dataset.k] = el.value; }; });
    inner.querySelectorAll('[data-cbon]').forEach(el => { el.onchange = () => { st.rows[+el.dataset.cbon].on = el.checked; renderDrawer(true); }; });

  /* ---------- vCard ---------- */
  function vcard(c) {
    const esc = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${esc(c.name.slice(0, 1))};${esc(c.name.slice(1))};;;`, `FN:${esc(c.name)}`];
    if (c.org) lines.push(`ORG:${esc(c.org)}${c.dept ? ';' + esc(c.dept) : ''}`);
    if (c.title) lines.push(`TITLE:${esc(c.title)}`);
    if (c.mobile) lines.push(`TEL;TYPE=CELL:${c.mobile}`);
    if (c.phone) lines.push(`TEL;TYPE=WORK:${c.phone}`);
    if (c.email) lines.push(`EMAIL;TYPE=WORK:${c.email}`);
    if (c.address) lines.push(`ADR;TYPE=WORK:;;${esc(c.address)};;;;`);
    if (c.memo) lines.push(`NOTE:${esc(c.memo)}`);
    lines.push('END:VCARD');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' }));
    a.download = `${c.name}.vcf`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

    'dp-mgr-save': async () => {
      const set = DP.setOfScope(); if (!set) return;
      const num = v => { const t = String(v ?? '').replace(/[^0-9.]/g, ''); return t === '' ? null : Number(t); };

      const newName = n => (renames.find(r => r[0] === n) || [, n])[1];
      list.forEach(x => { x.name = newName(x.name); });
      document.querySelectorAll('[data-mgr-only]').forEach(el => { const it = list.find(x => x.name === newName(el.dataset.mgrOnly)); if (it) it.countOnly = el.checked; });
      // 목표
      const goalsIn = {};
      document.querySelectorAll('[data-mgr-goal]').forEach(el => { const i = newName(el.dataset.mgrGoal); (goalsIn[i] = goalsIn[i] || [null, null, null])[+el.dataset.k] = num(el.value); });
      const patch = { perfItems: { ...(st.settings.perfItems || {}), [set]: list } };
      if (set === GL.SET) {
        const g = GL.goal(), rows = {};
        Object.entries(g.rows).forEach(([i, r]) => { rows[newName(i)] = r; });
        Object.entries(goalsIn).forEach(([i, r]) => { rows[i] = r; });
        patch.perfGoal = JSON.stringify({ ...g, rows, baseYear: num($('#mgrBaseYear')?.value) || g.baseYear, months: Math.min(12, Math.max(1, num($('#mgrMonths')?.value) || g.months)) });
      } else {
        let custom = st.settings.goalsBySet; if (typeof custom === 'string') { try { custom = JSON.parse(custom); } catch { custom = {}; } }
        const mine = {};
        Object.entries(goalsIn).forEach(([i, r]) => { mine[i] = r[0] == null ? '' : r[0]; });
        patch.goalsBySet = JSON.stringify({ ...(custom || {}), [set]: mine });
      }
      // 그동안 넣은 실적도 새 이름으로
      if (renames.length) {
        const ps = st.perfs.filter(p => p.set === set && renames.some(r => r[0] === p.item)).map(p => ({ id: p.id, item: newName(p.item) }));
        const as = st.activities.filter(a => a.fromPerf === 'Y' && renames.some(r => r[0] === a.perf)).map(a => ({ id: a.id, perf: newName(a.perf) }));
        if (ps.length) S.putMany('perf', ps); if (as.length) S.putMany('act', as);
      }
      await S.saveSettings(patch);
      toast(`세부사업·목표를 저장했어요.${renames.length ? ` 이름을 바꾼 ${renames.length}개 항목의 실적도 옮겼어요.` : ''} 실적 탭에 바로 반영돼요.`);

    'tv-road': async () => {
      // 개인 차량으로 간 줄 중 거리를 안 적은 곳: 복지관 ↔ 출장지 도로 거리 × 2(왕복)를 채운다
      const home = TV.homeOf();
      if (!home) return toast('복지관 위치가 없어 거리를 잴 수 없어요. 지도에서 ★ 복지관 위치를 먼저 등록해 주세요.', 'error');
      const list = TV.monthTrips(R.ui.orders.month).filter(t => TV.ownCar(t) && !Number(t.km));
      if (!list.length) return toast('거리를 채울 개인 차량 출장이 없어요. (방법이 "개인 차량"인 줄만 채워요)');
      let ok = 0, miss = 0;
      const patch = [];
      for (const t of list) {
        const p = TV.placeOf(t);
        if (!p || !M.hasPos(p)) { miss++; continue; }
        const road = await M.roadRoute(home, p);
        const km = road ? road.km * 2 : M.distKm(home, p) * 1.35 * 2;
        patch.push({ id: t.id, km: String(Math.round(km * 10) / 10) });
        ok++;
      }
      patch.forEach(p => S.upsert('trip', p));
      toast(`${ok}건의 왕복 거리를 채웠어요.${miss ? ` ${miss}건은 출장지를 지도에서 못 찾아 직접 적어 주세요.` : ''}`);

    'vworld-refind': async el => {
      // 위치가 없거나 대략 위치(읍면동 중심·도로 이름)인 곳을 브이월드로 다시 찾는다
      const st = S.get();
      const list = [...st.businesses.map(x => ['biz', x]), ...st.networks.map(x => ['net', x])].filter(([, x]) => x.address && (!M.hasPos(x) || x.approx));
      if (!list.length) return toast('다시 찾을 곳이 없어요. 모두 정확한 위치예요.');
      if (!(await confirmBox('브이월드로 위치를 다시 찾을까요?', `주소가 있고 위치가 없거나 대략적인 ${list.length}곳을 차례로 찾습니다. 몇 분 걸릴 수 있어요.`, '찾기'))) return;
      el.disabled = true;
      let found = 0;
      for (const [i, [kind, x]] of list.entries()) {
        el.textContent = `찾는 중… ${i + 1}/${list.length}`;
        // 위치가 없거나 대략 위치면 새로 찾은 위치로 바뀐다 (못 찾으면 그대로)
        await S.refine(kind, x.id);
        const now = S.find(kind, x.id);
        if (now && M.hasPos(now) && !now.approx) found++;
      }
      el.disabled = false; el.textContent = '등록된 곳 위치 브이월드로 다시 찾기';
      toast(`${list.length}곳 중 ${found}곳을 정확한 위치로 바꿨어요.`);
    },

      // 표 안에서 칸을 고칠 때는 화면 전체를 다시 그리지 않아 입력 위치가 유지되게 한다
      if (inlineEdit) {
        inlineEdit = false;
        if (route() === 'contacts') $('#ctResults').innerHTML = R.contactsResults();
        if (route() === 'attend') setTimeout(() => {
          const a = document.activeElement, id = a && a.dataset && a.dataset.id, fd = a && a.dataset && a.dataset.field;
          bindAttend();
          if (id && fd) $(`#atPeople [data-id="${id}"][data-field="${fd}"]`)?.focus({ preventScroll: true });
        }, 0);
        // 여비 계산은 금액이 바로 바뀌어야 하므로 다시 그리되, 커서가 있던 칸으로 돌아간다
        if (route() === 'orders') setTimeout(() => {
          // Tab으로 다음 칸에 커서가 옮겨 간 뒤에 다시 그려야 그 칸을 기억할 수 있다
          const a = document.activeElement, id = a && a.dataset && a.dataset.id, fd = a && a.dataset && a.dataset.field;
          const y = window.scrollY, wrap = $('.tv-tbl, .od-tbl')?.closest('.table-wrap'), x = wrap ? wrap.scrollLeft : 0;
          $('#odResults').innerHTML = R.ordersResults();
          const w2 = $('.tv-tbl, .od-tbl')?.closest('.table-wrap'); if (w2) w2.scrollLeft = x;
          window.scrollTo(0, y);
          if (id && fd) $(`[data-id="${id}"][data-field="${fd}"]`)?.focus({ preventScroll: true });
        }, 0);
        return;
      }
      if (route() === 'attend' && $('#atResults')) { bindAttend(); renderNav(); }
      else if (route() === 'schedule' && V.ui.sched.view === 'train' && $('#tpBox') && !drawerOpen()) { bindSched(); renderNav(); }
      else if (route() === 'map' && V.ui.map.mode !== 'city' && bigMap && $('#mapList')) softMap();
      else if (route() !== 'map' || !drawerOpen()) render(); else { refreshMap(false); renderNav(); }
      if (drawerOpen() && stack[stack.length - 1]?.type === 'detail') renderDrawer(true);
    });
  }

  /* ---------- 구글 드라이브 달별 정리 ---------- */
  const prevYm = () => { const t = U.parse(U.today()); const d = new Date(t.getFullYear(), t.getMonth() - 1, 1); return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; };
  let archiving = false, perfSplitDone = false;
  let xlsxMode = 'merge';
  async function archiveSync(months, onStep) {
    if (archiving) throw new Error('이미 정리하는 중이에요.');
    archiving = true;
    let n = 0, root = '', i = 0;
    try {
      const jobs = R.ARCHIVE_SECTIONS.flatMap(sec => months.map(m => [sec, m]));
      for (const [sec, m] of jobs) {
        i++;
        const files = R.archiveFiles(m, sec.scope);
        if (onStep) onStep(i, jobs.length, m, files.length);
        if (!files.length) continue;
        const r = await S.call('api_archiveWrite', { section: sec.section, files });
        n += r.files.length; root = r.root;
      }
    } finally { archiving = false; }
    return { n, root };
  }
  async function archiveAuto() {
    const st = S.get().settings;
    if (!S.REMOTE || !S.isAdmin() || st.archiveAuto === 'N' || (st.archiveAt || '').slice(0, 10) === U.today()) return;
    if (!(await S.whenSaved())) return;
    try { await archiveSync([prevYm(), U.today().slice(0, 7)]); } catch (err) { console.warn('드라이브 정리 실패', err); }
  }
  async function start() {
    view.innerHTML = `<div class="skel" style="height:28px;width:180px;margin-bottom:18px"></div><div class="skel" style="height:110px;margin-bottom:18px"></div><div class="skel" style="height:320px"></div>`;
    try {
      await S.init();
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="panel"><div class="empty"><strong>데이터를 불러오지 못했습니다</strong>${S.REMOTE ? '구글 시트에 연결하지 못했습니다. 시트를 공유받았는지 확인하고 새로고침해 보세요. (' + U.esc(err.message || err) + ')' : '브라우저 저장소에 접근할 수 없습니다. 시크릿 창이라면 일반 창에서 열어 주세요.'}<div><button class="btn" type="button" onclick="location.reload()">다시 시도</button></div></div></div>`;
      return;
    }
    try {
      const missing = ['U', 'D', 'S', 'M', 'V', 'F', 'SV', 'R'].filter(k => !window[k]);
      if (missing.length) {
        const parts = window.__parts, order = parts ? parts.join(' → ') : '';
        const bad = parts && order !== 'app1 → app2 → app3' ? ` 파일이 읽힌 순서: ${order} (app1 → app2 → app3 이어야 해요. 파일 이름과 내용이 맞는지 확인하세요).` : '';
        const errs = (window.__errs || []).slice(0, 3).join(' / ');
        throw new Error(`프로그램 일부(${missing.join(', ')})를 불러오지 못했습니다.${bad}${errs ? ` 오류: ${errs}.` : ''} ${parts ? 'app1~app3.html' : 'index.html'}을 처음부터 끝까지 다시 붙여 넣고 새 버전으로 배포해 주세요.`);
      }
      bindGlobal();
      verCheck();
      // 열 때도 지금 구역의 기록만 보이게 (예전에 '전체 팀'으로 저장돼 있으면 구역으로 맞춘다)
      { const sp = curSec().prog; if (sp && S.getScope() !== 'p:' + sp) S.setScope('p:' + sp); } // 예전에 한 사람만 보게 저장돼 있어도 구역 전체로
      render();
      // 현재 접속자: 바로 한 번, 그 뒤 1분마다·페이지를 옮길 때마다 알린다
      pingPresence(); setInterval(pingPresence, 60000);
      setTimeout(archiveAuto, 8000); // 관리자가 열면 하루 한 번 이번 달·지난달 정리 파일을 드라이브에 새로 고친다
      window.addEventListener('hashchange', () => setTimeout(pingPresence, 300));
      document.addEventListener('click', ev => { if (!ev.target.closest('#presence')) { const m = $('#presenceMenu'); if (m) m.hidden = true; } });
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="panel"><div class="empty"><strong>화면을 열지 못했습니다</strong>${window.U ? U.esc(err.message || String(err)) : String(err.message || err)}<div><button class="btn" type="button" onclick="location.reload()">다시 시도</button></div></div></div>`;
    }
  }

  return { start, toast, confirm: confirmBox, render };
})();

App.start();

</script>
