<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아르딤 취업지원 CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg: #F7F8FA;--surface: #FFFFFF;--surface-2: #F2F4F7;--line: #E3E7EC;--line-strong: #C3C9D2;--text: #1E2530;--text-2: #5A6372;--navy: #1E2530;--accent: #2F5BD3;--accent-soft: #EEF3FD;--success: #2F7D57;--success-soft: #E7F3EC;--warning: #A86A0C;--warning-soft: #FBF1DF;--danger: #B42318;--danger-soft: #FBE9E7;--muted: #8A94A6;--muted-soft: #F1F1F1;--prog-a: #0F7B7B;--prog-b: #6A4FB8;--prog-c: #C2410C;--st-discover: #8A94A6;--st-contact: #6B9BEF;--st-visit: #2563EB;--st-negotiate: #C98A1B;--st-placed: #FF7A00;--st-hold: #B8BFCC;--k-biz: #F5B700;--k-biz-soft: #FFF6D6;--k-biz-ink: #7A5A00;--k-support: #E5383B;--k-support-soft: #FDE8E8;--k-support-ink: #A61B1E;--k-net: #1B1F24;--k-net-soft: #ECEEF1;--k-net-ink: #1B1F24;--k-home: #D4A017;--k-home-soft: #FFF8E1;--k-home-ink: #6B4E00;--k-card: #0E9384;--k-card-soft: #E3F6F3;--k-card-ink: #0B6B61;--k-ev: #2563EB;--k-ev-soft: #EAF1FE;--k-ev-ink: #1D4ED8;--k-dup: #EA580C;--k-dup-soft: #FFF1E6;--k-dup-ink: #C2410C;--font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;--radius: 8px;--radius-sm: 6px;--shadow: 0 1px 2px rgba(30, 37, 48, .05);--shadow-lg: 0 12px 32px rgba(30, 37, 48, .16);--sidebar: 236px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}
}
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:0;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.brand-name{font-weight:700;font-size:15px;color:var(--navy)}
.brand-sub{font-size:11.5px;color:var(--text-2)}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;text-decoration:none}
.side-nav a svg{width:18px;height:18px;flex:none}
svg{stroke-linecap:round;stroke-linejoin:round}
.side-nav svg,.bottom-nav svg,.icon-btn svg,.btn svg{fill:none;stroke:currentColor;stroke-width:1.8}
.side-nav a:hover{background:var(--surface-2);color:var(--text)}
.side-nav a.active{background:var(--accent-soft);color:var(--navy);font-weight:650}
.side-nav a .count{margin-left:auto;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--text-2)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 28px;background:#f7f8faeb;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.search-trigger{flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--text-2);cursor:text;text-align:left}
.search-trigger svg,.search-input-row svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:inherit;font-size:11.5px;padding:2px 6px;border:1px solid var(--line);border-radius:0;background:var(--surface-2);color:var(--text-2)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.scope-select{width:auto;max-width:210px;font-weight:600}
.scope-select.scoped{border-color:var(--accent);background:var(--accent-soft);color:var(--navy)}
.sync{font-size:12.5px;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok:before{background:var(--success)}
.sync.busy:before{background:var(--warning)}
.sync.err{color:var(--danger);font-weight:600}
.sync.err:before{background:var(--danger)}
.badge.prog{height:19px;padding:0 6px;font-size:11px;background:transparent;border:1px solid var(--c);color:var(--c);margin-left:4px}
.staff-tag{display:inline-flex;align-items:center;white-space:nowrap}
.staff-tbl td,.staff-tbl th{padding:8px 10px;white-space:nowrap}
.staff-tbl tbody tr[data-act]{cursor:pointer}
.prog-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.staff-tbl tr.grp td{background:var(--surface-2)}
.staff-tbl tr.total td{border-top:1px solid var(--line-strong)}
.staff-tbl .indent{padding-left:14px;display:inline-block}
.staff-tbl .meta{margin-left:2px;font-size:12px;color:var(--text-2)}
.card-staff{position:absolute;right:14px;bottom:12px;font-size:11.5px;color:var(--text-2)}
.staff-rows{display:flex;flex-direction:column;gap:6px;width:100%}
.staff-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:190px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column}
.menu button{text-align:left;padding:9px 10px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.demo-banner{margin:14px 28px 0;padding:10px 14px;border-radius:var(--radius);background:var(--warning-soft);color:#6b4a0b;font-size:13.5px}
.view{padding:22px 28px 48px;outline:none;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#333}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#971d14}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.input,.select,.textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font-size:14px}
.textarea{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{padding-right:28px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-title{font-size:23px;font-weight:750;letter-spacing:-.01em}
.page-desc{color:var(--text-2);margin-top:2px}
.section-title{font-size:17.5px;font-weight:650}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sub{color:var(--text-2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel-pad{padding:18px 20px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:0;font-size:12px;font-weight:600;white-space:nowrap;background:var(--muted-soft);color:#4a5467}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.success{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.navy{background:#e6ebf3;color:var(--navy)}
.badge.outline{background:transparent;border:1px solid var(--line-strong);color:var(--text-2)}
.stage-badge{background:var(--surface-2);color:var(--text)}
.stage-badge .dot{background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:550;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip-applied{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:18px}
.kpi{padding:16px 20px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi-label{color:var(--text-2);font-size:13px;font-weight:550}
.kpi-value{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px}
.kpi-value small{font-size:15px;font-weight:600;margin-left:2px;color:var(--text-2)}
.kpi-foot{font-size:12.5px;color:var(--text-2);margin-top:2px}
.kpi a{color:inherit}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.prio{list-style:none;margin:0;padding:0}
.prio li{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prio li:last-child{border-bottom:0}
.prio li:hover{background:var(--surface-2)}
.prio .who{font-weight:650}
.prio .why{color:var(--text-2);font-size:13.5px}
.prio .when{font-size:13px;color:var(--text-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dday{justify-self:start}
.pipeline{display:flex;flex-direction:column;gap:9px}
.pipe-row{display:grid;grid-template-columns:70px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:13.5px;cursor:pointer}
.pipe-bar{height:10px;border-radius:0;background:var(--surface-2);overflow:hidden}
.pipe-bar span{display:block;height:100%;background:var(--c);border-radius:0}
.pipe-row .n{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .d{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.feed .t b{font-weight:650;cursor:pointer}
.feed .t b:hover{color:var(--accent)}
.feed .t .c{color:var(--text-2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--text-2);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:5px;vertical-align:-1px;background:var(--c)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .input{max-width:260px}
.toolbar .select{width:auto;min-width:128px}
.toolbar .spacer{flex:1}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#fafbfc}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .name{font-weight:650}
.tbl .meta{color:var(--text-2);font-size:12.5px;margin-top:1px}
.tbl .nowrap{white-space:nowrap}
.clip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-count{font-size:13px;color:var(--text-2);padding:10px 14px;border-top:1px solid var(--line)}
.mlist{display:none}
.mrow{padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px}
.mrow:last-child{border-bottom:0}
.mrow-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mrow .name{font-weight:650}
.mrow .meta{color:var(--text-2);font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--text-2)}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.skel{background:linear-gradient(90deg,var(--surface-2),#F8F9FB,var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:0}
@keyframes sk{0%{background-position:200% 0}
to{background-position:-200% 0}
}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,27vw,400px);gap:0;height:calc(100vh - 175px);min-height:560px;overflow:hidden}
.map-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.map-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.map-tools .input{width:170px;flex:0 1 170px}
.map-tools .chips{flex-wrap:nowrap}
.map-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.map-side #routeBox{padding:12px 12px 0}
.map-side-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.map-canvas{position:relative;flex:1}
.map-float{position:absolute;left:10px;bottom:22px;z-index:2;max-width:calc(100% - 20px);background:#ffffffed;border:1px solid var(--line-strong);border-radius:0;padding:6px 10px;box-shadow:0 2px 8px #1018281f;pointer-events:none}
.map-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.map-bar .chips{margin:0}
body[data-route=map] .page-head{margin-bottom:12px}
.map-solo{position:absolute;top:10px;left:56px;max-width:calc(100% - 120px);z-index:2;display:flex;align-items:center;gap:10px;background:#172033;color:#fff;border-radius:0;padding:5px 6px 5px 14px;font-size:13px;box-shadow:0 4px 12px #00000040;white-space:nowrap}
.map-solo:empty,.map-solo[hidden]{display:none}
.map-item.on{background:var(--ps, #E4F5EB);box-shadow:inset 4px 0 0 var(--pc, #2F9E62)}
.map-dd{position:relative}
.map-dd>summary{list-style:none;cursor:pointer;border:1px solid var(--line-strong);border-radius:0;padding:4px 12px;font-size:13px;background:var(--surface);user-select:none}
.map-dd>summary::-webkit-details-marker{display:none}
.map-dd>summary:after{content:" ▾";color:var(--text-2)}
.map-dd[open]>summary{border-color:var(--pc, #2F9E62)}
.map-dd-body{position:absolute;top:calc(100% + 6px);left:0;z-index:1200;background:var(--surface);border:1px solid var(--line-strong);border-radius:0;padding:10px 12px;box-shadow:0 8px 24px #10182829;display:grid;gap:6px;min-width:150px}
.btn-pick.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn-add{border-color:#2f9e62;color:#1e6b42;font-weight:700}
.btn-add.on{background:#2f9e62;border-color:#2f9e62;color:#fff}
.map-box.adding,.map-box.adding .leaflet-interactive{cursor:copy!important}
.leaflet-marker-icon.moving{outline:3px dashed #1D4ED8;outline-offset:3px;border-radius:50%;cursor:grab}
.pop-edit{gap:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
.pop-edit .linklike{font-size:12.5px}
.pop-edit .pop-del{color:var(--danger)}
.pop-progs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pop-progs span{font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:0;padding:0 7px}
.map-progs .prog-tab.on{background:var(--c);border-color:var(--c);color:#fff}
.map-progs .prog-tab.on .dot{background:#fff}
.prog-pick{display:flex;flex-wrap:wrap;gap:6px}
.prog-opt{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:0;padding:5px 12px;cursor:pointer;font-size:13px}
.prog-opt:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);font-weight:700}
.prog-opt input{accent-color:var(--c)}
.map-box.picking,.map-box.picking .leaflet-interactive{cursor:crosshair!important}
.route-dot{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 0 0 1px #00000080,0 2px 6px #00000059}
.route-dot.a{background:#172033}
.route-dot.b{background:#1d4ed8}
.route-opts{display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:0;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--text)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:#172033;color:#fff;font-weight:700}
.route-open{width:100%;justify-content:center;font-weight:700;padding-block:9px}
.route-note{margin:0;font-size:12px}
.map-list{overflow-y:auto;flex:1}
.map-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px}
.map-item:hover{background:var(--surface-2)}
.map-item .mk{width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--c)}
.map-item .mk.sq{border-radius:0;transform:rotate(45deg)}
.map-item .name{font-weight:650}
.map-item .meta{color:var(--text-2);font-size:12.5px}
.map-canvas{min-height:0}
.map-box{width:100%;height:100%;background:#e9eef3}
.city-frame{display:block;width:100%;height:calc(100vh - 250px);min-height:520px;border:0;border-top:1px solid var(--line);background:var(--surface-2)}
.mini-map{height:190px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:#e9eef3}
.pick-map{height:240px;border-radius:var(--radius);border:1px solid var(--line-strong);overflow:hidden;background:#e9eef3;cursor:crosshair}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--text-2)}

.map-solo{top:64px}
.place-pin{width:26px;height:34px;background:#e8402b;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px #00000059;margin-left:0}
.pop-addr{font-size:13px;margin-top:4px}
.pop-links{display:flex;gap:10px;margin:6px 0 2px;font-size:12.5px;font-weight:700}
.leaflet-tooltip.mk-label{display:none;background:#ffffffeb;border:0;box-shadow:0 1px 3px #00000040;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:700;color:#222;font-family:var(--font)}
.leaflet-tooltip.mk-label:before{display:none}
.labels-on .leaflet-tooltip.mk-label,.leaflet-tooltip.mk-label.hov{display:block}
.leaflet-marker-icon.mk-sel{z-index:1000!important;filter:drop-shadow(0 0 4px rgba(26,115,232,.9))}
@media (max-width: 860px){.place-box{left:50px;width:calc(100% - 64px)}
}
.pm-year{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;margin-bottom:16px;border-top:4px solid var(--pi)}
.pm-year-num{display:flex;align-items:baseline;gap:8px}
.pm-year-num b{font-size:40px;font-weight:850;line-height:1;color:var(--pi)}
.pm-year-num b.done{color:#1f9d6b}
.pm-year-num b.low{color:#d9485f}
.pm-year-num b.warn{color:#c98a1b}
.pm-year-num span.num{font-size:18px;color:var(--text-2);font-weight:700}
.pm-year-bar{grid-column:1 / -1;height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pm-year-bar i{display:block;height:100%;background:var(--pi);border-radius:999px}
.pm-year-bar i.done{background:#1f9d6b}
.pm-year-bar i.ok{background:#2f7fe0}
.pm-year-bar i.warn{background:#c98a1b}
.pm-year-bar i.low{background:#d9485f}
.pm-tbl td.pm-cin{color:#5b6b82;font-weight:700}
.pm-tbl td.pm-cout{color:#1f9d6b;font-weight:800}
.pm-v small{color:var(--text-2);margin-left:4px}
@media (max-width: 640px){.pm-year{grid-template-columns:1fr}
}
.pm-tbl thead th small{display:block;font-size:11.5px;font-weight:500;color:var(--text-2)}
.dd-body{display:flex;flex-direction:column;gap:12px}
.dd-grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.dd-grp.off{opacity:.55}
.dd-gh{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:6px;cursor:pointer}
.dd-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;cursor:pointer}
.dd-item:hover{background:var(--surface-2)}
.dd-item.keep{background:color-mix(in srgb,var(--pi) 9%,transparent)}
.dd-item input{margin-top:4px}
.dd-main{display:flex;flex-direction:column;min-width:0;font-size:15px}
.dd-main .meta{font-size:13px}
.dd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.dd-card{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.dd-card span{font-weight:700;color:var(--text-2)}
.dd-card b{font-size:20px}
.dd-card b.warn{color:#c98a1b}
.dup-bar .inline{gap:6px}
body{font-size:16px}
.page-head{flex-wrap:wrap;border-bottom:2px solid var(--text);padding-bottom:16px}
.crumb{flex:0 0 100%;order:-1;display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);margin-bottom:2px}
.crumb a{color:var(--text-2);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.crumb a:before{content:"⌂";font-size:15px}
.crumb a:hover{color:var(--pi)}
.crumb b{font-weight:600;color:var(--text-2)}
.crumb b.here{color:var(--text);font-weight:750}
.page-title{font-size:30px}
.page-desc{margin-top:12px;padding:13px 18px 13px 44px;position:relative;background:#f4f6f9;border:1px solid #E1E6ED;border-radius:6px;color:#3d4756;font-size:15px;line-height:1.6}
.page-desc:before{content:"i";position:absolute;left:16px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--pc, #2F7FE0);color:#fff;font:800 12px/18px Georgia,serif;text-align:center}
.section-title{font-size:19px;font-weight:800;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.section-title:before{content:"";width:4px;height:17px;align-self:center;background:var(--pc, var(--text));border-radius:2px;flex:none}
.section-title .sub{font-size:14px;font-weight:500}
.panel{border-color:#dce2ea}
.tbl{font-size:15px}
.tbl th{background:#f4f6f9;color:#2b3440;font-size:14.5px;font-weight:700}
.btn{font-size:15px}
.input,.select,.textarea{font-size:15.5px}
.sub,.meta{font-size:14px}
@media (min-width: 720px){.fsec .frow{grid-template-columns:minmax(0,1fr)!important;gap:0!important;border-top:2px solid var(--text)}
.fsec>h3{border-bottom:0;padding-bottom:0}
.fsec .field{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:0;border-bottom:1px solid #E1E6ED}
.fsec .field>label{grid-row:1 / span 4;display:flex;align-items:center;padding:10px 14px;background:#f4f6f9;font-size:14.5px;font-weight:700;color:#2b3440;border-right:1px solid #E1E6ED}
.fsec .field>:not(label){grid-column:2;margin:0 12px}
.fsec .field>:nth-child(2){margin-top:8px}
.fsec .field>:last-child{margin-bottom:8px}
.fsec h3{font-size:17px}
}
@media (max-width: 640px){.crumb{justify-content:flex-start}
.page-title{font-size:25px}
}
.tbl:not(.pm-tbl):not(.pt-tbl)>tbody>tr>td:first-child{min-width:170px}
@media (min-width: 720px){.fsec .field>:not(label){width:auto;min-width:0;justify-self:stretch;box-sizing:border-box}
.fsec .field>.input,.fsec .field>.select,.fsec .field>.textarea,.fsec .field>.inline{width:calc(100% - 24px)}
}
.site-logo{gap:14px;min-width:0}
.logo-img{height:46px;width:auto;display:block}
.logo-tag{display:flex;flex-direction:column;justify-content:center;padding-left:14px;border-left:1px solid #D5DBE3;line-height:1.2;font-size:12.5px;font-weight:600;color:#6b7280;white-space:nowrap}
.logo-tag b{font-size:17px;font-weight:850;color:#1f4e9a;letter-spacing:-.02em}
@media (max-width: 1180px){.logo-img{height:38px}
}
@media (max-width: 760px){.logo-img{height:32px}
.logo-tag{display:none}
}
.quick-sec>h3{font-size:17px;color:var(--text)}
.quick-sec>h3 .sub{font-weight:500;margin-left:6px}
.more-fields{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.more-fields>summary{cursor:pointer;padding:12px 14px;font-weight:750;font-size:15.5px;list-style:none}
.more-fields>summary:before{content:"＋ ";color:var(--pi, var(--text-2))}
.more-fields[open]>summary:before{content:"－ "}
.more-fields[open]>summary{border-bottom:1px solid var(--line)}
.more-fields>.fsec{padding:14px}
.fill-note{margin-top:10px;line-height:1.6}
.fill-diff{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.input.just-filled{background:#fff8e1;border-color:#f3c969}
.input.need,.select.need,.textarea.need{border-color:#d9485f!important;box-shadow:0 0 0 3px #d9485f2e}
#syncState.err{cursor:pointer}
.st-sum{padding:14px 16px;border-radius:10px;font-size:17px;font-weight:800;margin-bottom:14px}
.st-sum.good{background:#e8f6ef;color:#1f7a52}
.st-sum.bad{background:#fdecef;color:#b4233c}
.st-sum small{font-size:14px;font-weight:500}
.st-tbl th{white-space:nowrap}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.sc-row>td:first-child{box-shadow:inset 5px 0 0 var(--sc, transparent);padding-left:14px}
.sc-sel{border-left:5px solid var(--sc, var(--line))!important;font-weight:700;min-width:96px}
.od-tbl td{white-space:nowrap}
.od-tbl td .input,.od-tbl td .select{min-width:0}
.od-tbl td:nth-child(2) .select{min-width:104px}
.od-each-list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.od-each-item{flex-wrap:wrap;border-top:4px solid var(--sc, var(--line))!important;border-radius:8px!important;padding:10px 12px}
.od-each-name{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.od-each-name b{font-size:16px}
.od-each-item .inline{margin-left:auto}
.od-staff .chip{white-space:nowrap}
.sc-list{display:flex;flex-direction:column;gap:8px}
.sc-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.sc-item.on{border-color:#e8a0ac;background:#fff5f6}
.sc-item input{margin-top:5px}
.sc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc-main b{font-size:16px}
.btn-danger.btn-primary{background:#c8364e;border-color:#c8364e}
.sc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sc-li{box-shadow:inset 4px 0 0 var(--sc, transparent);padding-left:12px!important}
.sc-row>th:first-child{box-shadow:inset 5px 0 0 var(--sc, transparent);padding-left:14px;white-space:nowrap}
.logo-tag{font-size:24px;font-weight:850;color:#1f4e9a;letter-spacing:-.03em;line-height:1;padding-left:16px}
@media (max-width: 1180px){.logo-tag{font-size:20px}
}
.mx-row label{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.arc-tree{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:10px 14px;background:#f4f6f9;border:1px solid #E1E6ED;border-radius:8px;font-size:14.5px}
.arc-tree span{padding:2px 8px;background:#fff;border:1px solid #DCE2EA;border-radius:999px}


</style>
</head>
