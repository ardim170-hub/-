          <section class="dr-sec"><h3>채용 정보</h3>${kv([['최근 구인공고', (() => { const a = S.actsOf('biz', b.id).find(x => R.jobLink(x.jobUrl)); return a ? `<a class="btn btn-sm btn-job" href="${e(R.jobLink(a.jobUrl))}" target="_blank" rel="noopener">공고 보기 · ${e(R.siteName(a.jobUrl))}</a> <span class="sub">${U.dateDot(a.date)} 연락 기록</span>` : ''; })()], ['가능 직무', e(b.jobs)], ['근무 조건', e(b.workConditions)], ['편의시설·고려사항', e(b.accessibility)]])}</section>
          ${locSec(b)}
          <section class="dr-sec"><h3>기본 정보</h3>${kv([['사업자등록번호', e(b.bizNo)], ['대표자', e(b.ceo)], ['대표 전화', b.phone ? `<a href="tel:${e(b.phone.replace(/[^0-9+]/g, ''))}">${e(b.phone)}</a>` : ''], ['홈페이지', b.homepage ? `<a href="${e(/^https?:/.test(b.homepage) ? b.homepage : 'https:\/\/' + b.homepage)}" target="_blank" rel="noopener">${e(b.homepage)}</a>` : ''], ['주소', e(b.address)], ['발굴 경로', e(b.source)], ['발굴일', U.dateDot(b.discoveredAt)], ['실적 진행도', e(R.progressOf(b))], ['복리후생', e(b.welfare)], ['담당 직원', staffTag(b.staff)]])}</section>
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="biz" data-id="${b.id}" style="color:var(--danger)">이 사업체 삭제</button></div>
        </div>`,
      after: () => miniMap(b, 'biz'),
    };
  }

  function detailNet(n, canBack) {
    const la = S.lastAct('net', n.id);
    const pc = primaryContact('net', n.id);
    return {
      html: drHead(e(n.name), `<span class="badge navy">${e(n.category)}</span>${statusBadge(n.status)}<span class="badge outline">${e(n.area || '지역 미지정')}</span>${n.staff ? `<span class="badge outline">담당 ${e(n.staff)}</span>${progBadge(S.programOf(n.staff))}` : ''}`,
        `${callBtn(pc)}<button class="btn btn-sm" type="button" data-act="focus-log">활동 기록</button><button class="btn btn-sm" type="button" data-act="new-event" data-target="net:${n.id}">일정 추가</button><button class="btn btn-sm" type="button" data-act="edit" data-kind="net" data-id="${n.id}">${I.edit}수정</button>`, canBack) +
        `<div class="dr-body">
          <div class="summary">
            <div><div class="l">협력 시작</div><div class="v" style="font-size:16px">${n.since ? U.dateDot(n.since) : '-'}</div></div>
            <div><div class="l">최근 활동</div><div class="v" style="font-size:16px">${la ? U.ago(la.date) : '-'}</div></div>
            <div><div class="l">활동 기록</div><div class="v">${S.actsOf('net', n.id).length}<small>건</small></div></div>
            <div><div class="l">담당자 명함</div><div class="v">${S.cardsOf('net', n.id).length}<small>장</small></div></div>
          </div>
          ${dupSec('net', n)}
          ${n.memo ? `<div class="memo-box">${e(n.memo)}</div>` : ''}
          <section class="dr-sec"><h3>협력 · 홍보</h3>${kv([['협력 내용', e(n.relation)], ['홍보 방식', e(n.promo)], ['관계 상태', e(n.status)], ['담당 직원', staffTag(n.staff)]])}</section>
          ${people('net', n.id)}
          ${eventsSec('net', n.id)}
          ${actsSec('net', n.id)}
          ${locSec(n)}
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="net" data-id="${n.id}" style="color:var(--danger)">이 기관 삭제</button></div>
        </div>`,
      after: () => miniMap(n, 'net'),
    };
  }

  function detailCard(c, canBack) {
    const link = S.linkOf(c);
    const copy = v => v ? `<span class="inline" style="gap:4px"><span class="num">${e(v)}</span><button class="icon-btn" type="button" style="width:30px;height:30px" aria-label="복사" data-act="copy" data-v="${e(v)}">${I.copy}</button></span>` : '';
    return {
      html: drHead(`${e(c.name)} <span class="sub" style="font-size:14px;font-weight:500">${e(c.title || '')}</span>`,
        `${c.linkType === 'biz' && link ? stageBadge(link.stage) : ''}${c.linkType === 'net' ? '<span class="badge navy">네트워크 기관</span>' : ''}${(c.tags || []).map(t => `<span class="badge outline">${e(t)}</span>`).join('')}`,
        `${tel(c) ? `<a class="btn btn-sm btn-primary" href="tel:${e(tel(c).replace(/[^0-9+]/g, ''))}">${I.phone}전화</a>` : ''}${c.mobile ? `<a class="btn btn-sm" href="sms:${e(c.mobile.replace(/[^0-9+]/g, ''))}">문자</a>` : ''}${c.email ? `<a class="btn btn-sm" href="mailto:${e(c.email)}">${I.mail}이메일</a>` : ''}<button class="btn btn-sm" type="button" data-act="vcard" data-id="${c.id}">연락처 파일(vcf)</button><button class="btn btn-sm" type="button" data-act="edit" data-kind="card" data-id="${c.id}">${I.edit}수정</button>`, canBack) +
        `<div class="dr-body">
          ${c.photo ? (S.photo(c) ? `<img class="card-photo" src="${S.photo(c)}" alt="${e(c.name)} 명함 사진">` : '<div class="skel" style="height:180px"></div>') : ''}
          ${dupSec('card', c)}
          <section class="dr-sec"><h3>연락처</h3>${kv([['소속', e(c.org)], ['부서', e(c.dept)], ['휴대전화', copy(c.mobile)], ['사무실 전화', copy(c.phone)], ['이메일', copy(c.email)], ['주소', e(c.address)]])}</section>
          <section class="dr-sec"><h3>연결된 곳</h3>${link ? `<div class="people"><div class="person"><div><div class="pn" data-act="open" data-kind="${c.linkType}" data-id="${link.id}">${e(link.name)}</div><div class="pm">${c.linkType === 'biz' ? `사업체 개발 · ${e(link.stage)}` : `네트워크 · ${e(link.category)}`}</div></div><button class="btn btn-sm" type="button" data-act="open" data-kind="${c.linkType}" data-id="${link.id}">열기</button></div></div>` : `<p class="sub" style="margin:0 0 8px">연결된 사업체나 기관이 없습니다. 아래 버튼을 누르면 소속(${e(c.org || c.name)})으로 새로 등록하고 연결합니다.</p><div class="inline">${triageButtons(c)}</div>`}</section>
          <section class="dr-sec"><h3>받은 정보</h3>${kv([['받은 날', U.dateDot(c.metAt)], ['받은 곳', e(c.metWhere)]])}</section>
          ${c.memo ? `<section class="dr-sec"><h3>메모</h3><div class="memo-box">${e(c.memo)}</div></section>` : ''}
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="card" data-id="${c.id}" style="color:var(--danger)">이 명함 삭제</button></div>
        </div>`,
    };
  }

  function miniMap(x, kind) {
    const el = document.getElementById('miniMap');
    if (!el || !M.hasPos(x)) return;
    const map = M.create(el, { center: [x.lat, x.lng], zoom: x.approx ? 13 : 15, scroll: false });
    if (!map) return;
    (kind === 'biz' ? M.bizMarker(x) : M.netMarker(x)).addTo(map);
    // 주변 1.5km 이내 다른 곳도 흐리게 표시
    const st = S.get();
    [...st.businesses.map(b => ['biz', b]), ...st.networks.map(n => ['net', n])].forEach(([k, o]) => {
      if (o.id === x.id || !M.hasPos(o)) return;
      if (Math.abs(o.lat - x.lat) < .014 && Math.abs(o.lng - x.lng) < .017) {
        const m = (k === 'biz' ? M.bizMarker(o) : M.netMarker(o)).addTo(map);
        if (m.setStyle) m.setStyle({ fillOpacity: .45 }); else m.setOpacity(.5);
        m.bindTooltip(o.name);
      }
    });
  }

  return { I, ui, perfPage, perfResults, perfTsv, dashCal, monthLabel, linkRow, triagePanel, triageButtons, SEARCH_SITES, bizLine, inPeriod, inArea, areaOptions, progBadge, staffRow, dashboard, bizPage, bizResults, netPage, netResults, cardsPage, cardResults, mapPage, mapItems, mapList, routePanel, schedPage, evList, calendar, dataPage, detailBiz, detailNet, detailCard, drHead, stageBadge, opts };
})();

</script>
<script>
/* 등록·수정 폼 (Desktop: 우측 Drawer, Mobile: 전체 화면) */
window.F = (() => {
  const e = U.esc;
  const field = (label, input, opt = {}) => `<div class="field ${opt.full ? 'full' : ''}" data-f="${opt.name || ''}"><label ${opt.for ? `for="${opt.for}"` : ''}>${label}${opt.req ? ' <span class="req">*</span>' : ''}</label>${input}${opt.hint ? `<span class="hint">${opt.hint}</span>` : ''}</div>`;
  const inp = (name, v, attrs = '') => `<input class="input" id="f_${name}" name="${name}" value="${e(v ?? '')}" ${attrs}>`;
  const ta = (name, v, attrs = '') => `<textarea class="textarea" id="f_${name}" name="${name}" ${attrs}>${e(v ?? '')}</textarea>`;
  const staffSel = v => `<select class="select" id="f_staff" name="staff"><option value="">선택</option>${S.staff().map(st => `<option value="${e(st.name)}" ${st.name === v ? 'selected' : ''}>${e(st.name)}${st.program ? ' · ' + e(st.program) : ''}</option>`).join('')}${v && !S.staff().some(st => st.name === v) ? `<option selected>${e(v)}</option>` : ''}</select>`;
  const sel = (name, list, v, blank) => `<select class="select" id="f_${name}" name="${name}">${V.opts(list, v, blank)}</select>`;
  const foot = (label) => `<div class="dr-foot"><button class="btn" type="button" data-act="dr-cancel">취소</button><button class="btn btn-primary" type="submit" form="entityForm">${label}</button></div>`;
  const head = (title) => `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">${title}</h2><button class="icon-btn" type="button" data-act="dr-cancel" aria-label="닫기">${V.I.close}</button></div></div>`;

  function linkOptions(value) {
    const st = S.get();
    const byName = (a, b) => a.name.replace(/^\(주\)/, '').localeCompare(b.name.replace(/^\(주\)/, ''), 'ko');
    return `<option value="">연결 안 함</option>
      <optgroup label="사업체 개발">${[...st.businesses].sort(byName).map(b => `<option value="biz:${b.id}" ${value === 'biz:' + b.id ? 'selected' : ''}>${e(b.name)} (${e(b.stage)})</option>`).join('')}</optgroup>
      <optgroup label="네트워크">${[...st.networks].sort(byName).map(n => `<option value="net:${n.id}" ${value === 'net:' + n.id ? 'selected' : ''}>${e(n.name)}</option>`).join('')}</optgroup>`;
  }

  function locationSection(x) {
    const has = M.hasPos(x);
    return `<div class="fsec"><h3>위치</h3>
      <div class="frow">
        ${field('주소', `<div class="inline">${inp('address', x.address, 'placeholder="경기도 화성시 ..."')}<button class="btn" type="button" data-act="geocode">주소로 찾기</button></div>`, { full: true, for: 'f_address', hint: '주소로 못 찾으면 읍면동을 고른 뒤 아래 지도를 클릭해 정확한 위치를 찍어 주세요.' })}
        ${field('읍·면·동', sel('area', D.AREAS.map(a => a.name), x.area, '선택'), { for: 'f_area' })}
        ${field('좌표', `<div class="input num" id="posLabel" style="display:flex;align-items:center;color:var(--text-2)">${has ? `${x.lat}, ${x.lng}${x.approx ? ' (대략)' : ''}` : '지도를 클릭해 지정'}</div>`)}
      </div>
      <div class="pick-map" id="pickMap" aria-label="지도를 클릭해 위치 지정"></div>
      <input type="hidden" name="lat" value="${has ? x.lat : ''}"><input type="hidden" name="lng" value="${has ? x.lng : ''}"><input type="hidden" name="approx" value="${x.approx ? '1' : ''}">
    </div>`;
  }

  function bindLocation(form) {
    const lat = form.elements.lat, lng = form.elements.lng, approx = form.elements.approx;
    const label = form.querySelector('#posLabel');
    const show = () => { label.textContent = lat.value ? `${lat.value}, ${lng.value}${approx.value ? ' (대략)' : ''}` : '지도를 클릭해 지정'; };
    const pk = M.picker(form.querySelector('#pickMap'), lat.value ? { lat: +lat.value, lng: +lng.value } : null, (a, b) => { lat.value = a; lng.value = b; approx.value = ''; const ar = D.areaAt(a, b); if (ar) form.elements.area.value = ar; show(); });
    form.elements.area.addEventListener('change', () => {
      const a = D.AREA_BY_NAME[form.elements.area.value];
      if (a && (!lat.value || approx.value) && pk) { pk.set(a.lat, a.lng, 14); approx.value = '1'; show(); }
    });
    form._geocode = async () => {
      const q = form.elements.address.value;
      if (!q.trim()) { App.toast('주소를 먼저 입력하세요.', 'error'); return; }
      const btn = form.querySelector('[data-act="geocode"]');
      btn.disabled = true; btn.textContent = '찾는 중…';
      try {
        const r = await M.geocode(q);
        if (r && pk) { pk.set(r.lat, r.lng, 16); App.toast('위치를 찾았습니다. 핀이 맞는지 확인하고, 다르면 지도를 클릭해 옮기세요.'); }
        else App.toast('주소로 위치를 찾지 못했습니다. 읍면동을 고르고 지도를 클릭해 지정하세요.', 'error');
      } catch { App.toast('위치 검색 서비스에 연결하지 못했습니다. 인터넷 연결을 확인하거나 지도를 클릭해 지정하세요.', 'error'); }
      finally { btn.disabled = false; btn.textContent = '주소로 찾기'; }
    };
  }

  /* ---------- 사업체 ---------- */
  const notice = t => t ? `<div class="form-notice">${e(t)}</div>` : '';
  function biz(b, preset = {}, focus) {
    const x = b || { stage: '발굴', discoveredAt: U.today(), staff: S.me(), source: '현장 발굴', placements: 0, ...preset };
    return {
      html: head(b ? '사업체 정보 수정' : '사업체 발굴 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="biz" data-id="${b ? b.id : ''}" data-focus="${e(focus || '')}" novalidate>${notice(preset._notice)}
        <div class="fsec"><h3>기본 정보</h3><div class="frow">
          ${field('사업체명', inp('name', x.name, 'required autocomplete="off"'), { req: true, full: true, name: 'name', for: 'f_name' })}
          ${field('업종', `<input class="input" id="f_industry" name="industry" list="indList" value="${e(x.industry || '')}"><datalist id="indList">${D.INDUSTRY_LIST.map(i => `<option value="${e(i)}">`).join('')}</datalist>`, { for: 'f_industry' })}
          ${field('상시근로자 수', inp('employees', x.employees || '', 'type="number" min="0" inputmode="numeric"'), { for: 'f_employees', hint: '50명 이상이면 장애인 의무고용 대상(3.1%)으로 표시됩니다.' })}
          ${field('사업자등록번호', inp('bizNo', x.bizNo, 'placeholder="000-00-00000"'), { for: 'f_bizNo' })}
          ${field('대표자', inp('ceo', x.ceo), { for: 'f_ceo' })}
          ${field('대표 전화', inp('phone', x.phone, 'type="tel" inputmode="tel" placeholder="031-000-0000"'), { for: 'f_phone' })}
          ${field('홈페이지', inp('homepage', x.homepage, 'placeholder="www..."'), { for: 'f_homepage' })}
        </div></div>
        ${locationSection(x)}
        <div class="fsec"><h3>채용 정보</h3><div class="frow">
          ${field('진행 단계', sel('stage', D.STAGES.map(s => s.key), x.stage), { for: 'f_stage' })}
          ${field('채용 연계 인원', inp('placements', x.placements || 0, 'type="number" min="0" inputmode="numeric"'), { for: 'f_placements' })}
          ${field('가능 직무', inp('jobs', x.jobs, 'placeholder="예: 포장, 검수, 사무 보조"'), { full: true, for: 'f_jobs' })}
          ${field('근무 조건', inp('workConditions', x.workConditions, 'placeholder="예: 주 5일, 09:00~16:00"'), { full: true, for: 'f_workConditions' })}
          ${field('복리후생(기타)', inp('welfare', x.welfare, 'placeholder="예: 중식 제공, 통근버스"'), { full: true, for: 'f_welfare' })}
          ${field('실적 진행도', sel('progress', D.PROCEDURES, x.progress, '자동 (방문·직무분석지 기록으로 판단)'), { full: true, for: 'f_progress' })}
          ${field('진행 사업 (지도에 빨간색)', `<div class="inline">${D.SUPPORT_TYPES.map(t => `<label class="check"><input type="checkbox" name="support" value="${t}" ${(x.support || []).includes(t) ? 'checked' : ''}>${t}</label>`).join('')}</div>`, { full: true })}
          ${field('편의시설·고려사항', ta('accessibility', x.accessibility, 'rows="2" placeholder="예: 엘리베이터 있음, 서서 하는 작업, 통근버스 운영"'), { full: true, for: 'f_accessibility' })}
        </div></div>
        <div class="fsec"><h3>기초 조사</h3><div class="frow">
          ${field('조사 내용', ta('research', x.research, 'rows="7" placeholder="회사 개요, 규모, 주요 제품, 최근 채용 공고, 장애인 고용 관련 내용, 참고할 점, 출처 등"'), { full: true, for: 'f_research', hint: '사업체 상세 화면의 검색 버튼(네이버·구글·사람인 등)으로 찾은 내용을 정리해 두세요.' })}
          ${field('조사일', inp('researchAt', x.researchAt, 'type="date"'), { for: 'f_researchAt' })}
        </div></div>
        <div class="fsec"><h3>운영 정보</h3><div class="frow">
          ${field('발굴 경로', sel('source', D.SOURCES, x.source, '선택'), { for: 'f_source' })}
          ${field('발굴일', inp('discoveredAt', x.discoveredAt, 'type="date"'), { for: 'f_discoveredAt' })}
          ${field('담당 직원', staffSel(x.staff), { for: 'f_staff' })}
          ${field('메모', ta('memo', x.memo, 'rows="3" placeholder="예: 인사팀장 통화는 오후 2시 이후"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(b ? '저장' : '등록'),
      after: form => bindLocation(form),
    };
  }

  /* ---------- 네트워크 ---------- */
  function net(n, preset = {}) {
    const x = n || { category: '복지기관', status: '활발', since: U.today(), staff: S.me(), ...preset };
    return {
      html: head(n ? '기관 정보 수정' : '네트워크 기관 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="net" data-id="${n ? n.id : ''}" novalidate>
        <div class="fsec"><h3>기본 정보</h3><div class="frow">
          ${field('기관명', inp('name', x.name, 'required autocomplete="off"'), { req: true, full: true, name: 'name', for: 'f_name' })}
          ${field('분류', sel('category', D.NET_CATEGORIES, x.category), { for: 'f_category' })}
          ${field('관계 상태', sel('status', D.NET_STATUS, x.status), { for: 'f_status' })}
        </div></div>
        ${locationSection(x)}
        <div class="fsec"><h3>협력 · 홍보</h3><div class="frow">
          ${field('협력 내용', ta('relation', x.relation, 'rows="2" placeholder="예: 구직 장애인 의뢰, 채용박람회 공동 개최"'), { full: true, for: 'f_relation' })}
          ${field('홍보 방식', inp('promo', x.promo, 'placeholder="예: 리플릿 비치, 소식지 게재, SNS 공동 홍보"'), { full: true, for: 'f_promo' })}
          ${field('협력 시작일', inp('since', x.since, 'type="date"'), { for: 'f_since' })}
          ${field('담당 직원', staffSel(x.staff), { for: 'f_staff' })}
          ${field('메모', ta('memo', x.memo, 'rows="3"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(n ? '저장' : '등록'),
      after: form => bindLocation(form),
    };
  }

  /* ---------- 명함 ---------- */
  function card(c, preset = {}) {
    const x = c || { metAt: U.today(), tags: [], linkType: '', linkId: '', ...preset };
    const linkVal = x.linkType && x.linkId ? `${x.linkType}:${x.linkId}` : '';
    return {
      html: head(c ? '명함 수정' : '명함 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="card" data-id="${c ? c.id : ''}" novalidate>${notice(preset._notice)}
        <div class="fsec"><h3>명함 사진</h3>
          <div class="photo-drop" id="photoDrop">
            <img id="photoPreview" ${S.photo(x) ? `src="${S.photo(x)}"` : 'hidden'} alt="명함 사진 미리보기">
            <span id="photoHint">${x.photo ? '' : '명함을 찍은 사진을 올려 두면 원본을 다시 확인할 수 있어요.'}</span>
            <div class="inline"><label class="btn btn-sm" for="f_photoFile">사진 선택</label>${x.photo ? '<button class="btn btn-ghost btn-sm" type="button" data-act="photo-clear">사진 삭제</button>' : ''}</div>
            <input type="file" id="f_photoFile" accept="image/*" capture="environment" hidden>
          </div>
          <input type="hidden" name="photo" value="">
        </div>
        <div class="fsec"><h3>인적 정보</h3><div class="frow">
          ${field('이름', inp('name', x.name, 'required autocomplete="off"'), { req: true, name: 'name', for: 'f_name' })}
          ${field('직함', inp('title', x.title, 'placeholder="예: 인사팀장"'), { for: 'f_title' })}
          ${field('소속', inp('org', x.org), { for: 'f_org' })}
          ${field('부서', inp('dept', x.dept), { for: 'f_dept' })}
        </div></div>
        <div class="fsec"><h3>연락처</h3><div class="frow">
          ${field('휴대전화', inp('mobile', x.mobile, 'type="tel" inputmode="tel" placeholder="010-0000-0000"'), { for: 'f_mobile' })}
          ${field('사무실 전화', inp('phone', x.phone, 'type="tel" inputmode="tel" placeholder="031-000-0000"'), { for: 'f_phone' })}
          ${field('이메일', inp('email', x.email, 'type="email" inputmode="email"'), { full: true, for: 'f_email' })}
          ${field('주소', inp('address', x.address), { full: true, for: 'f_address' })}
        </div></div>
        <div class="fsec"><h3>연결 · 메모</h3><div class="frow">
          ${field('연결할 사업체·기관', `<select class="select" id="f_link" name="link">${linkOptions(linkVal)}</select>`, { full: true, for: 'f_link', hint: '연결하면 그 사업체·기관 상세 화면의 담당자로 표시됩니다.' })}
          ${field('받은 날', inp('metAt', x.metAt, 'type="date"'), { for: 'f_metAt' })}
          ${field('받은 곳', inp('metWhere', x.metWhere, 'placeholder="예: 사업체 방문, 채용박람회"'), { for: 'f_metWhere' })}
          ${field('태그', inp('tags', (x.tags || []).join(', '), 'placeholder="쉼표로 구분. 예: 인사 담당, 행사 명함"'), { full: true, for: 'f_tags' })}
          ${field('메모', ta('memo', x.memo, 'rows="3"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(c ? '저장' : '등록'),
      after: form => {
        form.elements.photo.value = !c && x.photo ? x.photo : 'keep';
        const file = form.querySelector('#f_photoFile');
        const prev = form.querySelector('#photoPreview');
        file.addEventListener('change', async () => {
          const f = file.files[0];
          if (!f) return;
          try {
            const data = await resizeImage(f, 1000, .72);
            form.elements.photo.value = data; prev.src = data; prev.hidden = false;
            form.querySelector('#photoHint').textContent = '';
          } catch { App.toast('사진을 읽지 못했습니다. JPG나 PNG 파일인지 확인하세요.', 'error'); }
        });
        form.elements.link.addEventListener('change', () => {
          const [k, id] = form.elements.link.value.split(':');
          const t = k ? S.find(k, id) : null;
          if (t && !form.elements.org.value) form.elements.org.value = t.name;
          if (t && !form.elements.address.value && t.address) form.elements.address.value = t.address;
        });
      },
    };
  }

  function resizeImage(file, max, q) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = rej;
      r.onload = () => {
        const img = new Image();
        img.onerror = rej;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', q));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  /* ---------- 일정 ---------- */
  function event(ev, preset = {}) {
    const x = ev || { date: U.today(), time: '', type: '방문', targetType: '', targetId: '', ...preset };
    const tval = x.targetType && x.targetId ? `${x.targetType}:${x.targetId}` : '';
    return {
      html: head(ev ? '일정 수정' : '일정 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="ev" data-id="${ev ? ev.id : ''}" novalidate>
        <div class="fsec"><div class="frow">
          ${field('관련 사업체·기관', `<select class="select" id="f_link" name="link">${linkOptions(tval)}</select>`, { full: true, for: 'f_link' })}
          ${field('유형', sel('type', D.EVENT_TYPES, x.type), { for: 'f_type' })}
          ${field('제목', inp('title', x.title, 'placeholder="비워 두면 \'유형 - 사업체명\'으로 저장"'), { for: 'f_title' })}
          ${field('날짜', inp('date', x.date, 'type="date" required'), { req: true, name: 'date', for: 'f_date' })}
          ${field('시간', inp('time', x.time, 'type="time"'), { for: 'f_time' })}
          ${field('메모', ta('memo', x.memo, 'rows="3" placeholder="예: 구직자 2명 동행, 이력서 지참"'), { full: true, for: 'f_memo' })}
        </div></div>
        ${ev ? `<div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="ev" data-id="${ev.id}" style="color:var(--danger)">이 일정 삭제</button></div>` : ''}
      </form></div>` + foot(ev ? '저장' : '등록'),
    };
  }

  /* ---------- 수집 + 검증 ---------- */
  function collect(form) {
    const kind = form.dataset.form;
    const fd = Object.fromEntries(new FormData(form).entries());
    const errs = [];
    form.querySelectorAll('.field.err').forEach(f => { f.classList.remove('err'); f.querySelector('.errmsg')?.remove(); });
    const need = (k, msg) => { if (!String(fd[k] || '').trim()) errs.push([k, msg]); };
    let obj;
    const pos = () => ({ lat: fd.lat ? +fd.lat : null, lng: fd.lng ? +fd.lng : null, approx: !!fd.approx });
    if (kind === 'biz') {
      need('name', '사업체명을 입력하세요.');
      obj = { name: fd.name.trim(), industry: fd.industry.trim(), employees: fd.employees ? +fd.employees : 0, bizNo: fd.bizNo.trim(), ceo: fd.ceo.trim(), phone: fd.phone.trim(), homepage: fd.homepage.trim(), welfare: fd.welfare.trim(), progress: fd.progress, support: [...form.querySelectorAll('[name=support]:checked')].map(c => c.value), research: fd.research.trim(), researchAt: fd.researchAt || (fd.research.trim() ? U.today() : ''), address: fd.address.trim(), area: fd.area, ...pos(), stage: fd.stage, placements: fd.placements ? +fd.placements : 0, jobs: fd.jobs.trim(), workConditions: fd.workConditions.trim(), accessibility: fd.accessibility.trim(), source: fd.source, discoveredAt: fd.discoveredAt, staff: fd.staff, memo: fd.memo.trim() };
    } else if (kind === 'net') {
      need('name', '기관명을 입력하세요.');
      obj = { name: fd.name.trim(), category: fd.category, status: fd.status, address: fd.address.trim(), area: fd.area, ...pos(), relation: fd.relation.trim(), promo: fd.promo.trim(), since: fd.since, staff: fd.staff, memo: fd.memo.trim() };
    } else if (kind === 'card') {
      need('name', '이름을 입력하세요.');
      const [lt, li] = (fd.link || '').split(':');
      obj = { name: fd.name.trim(), title: fd.title.trim(), org: fd.org.trim(), dept: fd.dept.trim(), mobile: fd.mobile.trim(), phone: fd.phone.trim(), email: fd.email.trim(), address: fd.address.trim(), linkType: lt || '', linkId: li || '', metAt: fd.metAt, metWhere: fd.metWhere.trim(), tags: fd.tags.split(',').map(t => t.trim()).filter(Boolean), memo: fd.memo.trim(), photo: fd.photo === 'keep' ? undefined : (fd.photo || null) };
    } else if (kind === 'ev') {
      need('date', '날짜를 입력하세요.');
      const [lt, li] = (fd.link || '').split(':');
      const t = lt ? S.find(lt, li) : null;
      obj = { targetType: lt || '', targetId: li || '', type: fd.type, title: fd.title.trim() || (t ? `${fd.type} - ${t.name}` : fd.type), date: fd.date, time: fd.time, memo: fd.memo.trim() };
    }
    errs.forEach(([k, msg]) => {
      const f = form.querySelector(`[data-f="${k}"]`);
      if (f) { f.classList.add('err'); f.insertAdjacentHTML('beforeend', `<span class="errmsg">${msg}</span>`); }
    });
    if (errs.length) form.querySelector(`[name="${errs[0][0]}"]`)?.focus();
    return errs.length ? null : { kind, obj };
  }

  return { biz, net, card, event, collect, resizeImage };
})();

</script>

      ['bend', '허리굽히기', HRS], ['sit', '의자앉기', HRS], ['squat', '쪼그려앉기', HRS], ['stand', '서기', HRS], ['stairs', '계단오르기', HRS], ['walk', '보행', HRS],
      ['finger', '손가락기민성', [NONE, '연필크기 물건 집기', '동전크기 물건 집기', '바늘크기 물건 집기']],
      ['eyeHand', '눈손협응', [NONE, '어느 정도 요구됨', '중요함', '매우 중요함']],
      ['twoHand', '양손협응', [NONE, '우세손만 사용', '주: 우세손 / 보: 비우세손', '양손 동시 사용']],
      ['hearing', '청력', [NONE, '보청기로 소리/신호 확인', '보청기로 일상대화 가능', '전화사용 및 일상대화 가능']],
      ['vision', '시력', [NONE, '표지판 등 큰 글씨 확인', '상품설명 같은 작은 글씨 확인', '전자부품 등 세밀한 글씨 확인']],
    ]],
    ['인지', [
      ['understand', '지식이해', [NONE, '언어지시, 모델링 후 견본 제시', '언어지시와 함께 모델링', '언어지시만으로 이해']],
      ['write', '쓰기', [NONE, '1~2단어 받아 쓰기', '3~4단어 받아 쓰기', '편지 등 작문하기']],
      ['read', '읽기', [NONE, '1~2단어 읽고 이해', '단문 읽고 이해', '설명서 등의 장문 읽고 이해']],
      ['count', '수 세기', [NONE, '1~10까지 세기', '1~100까지 세기', '100이상 세기']],
      ['math', '수리능력', [NONE, '수 세기', '덧셈·뺄셈 가능', '사칙연산 가능']],
      ['money', '금전관리기술', [NONE, '화폐종류 인지 가능', '거스름 돈 주고 받기', '금전관리 계획 및 실행']],
      ['time', '시간개념', [NONE, '시계보기 가능', '시간에 맞춰 자신이 수행할 일을 확인', '시간계획 및 배분']],
    ]],
    ['작업수행', [
      ['endure', '지속력', ['2시간 미만', '2~3시간 미만', '3~4시간 미만', '4시간 이상']],
      ['speed', '작업속도', ['느린 속도 수용 가능함', '보통의 꾸준한 작업속도가 요구됨', '종종 빠른 작업속도가 요구됨', '지속적으로 빠른 작업속도가 요구됨']],
      ['initiative', '작업주도성', [NONE, '자신의 직무를 스스로 할 수 있어야 함', '자발적으로 하는 것이 도움이 됨', '직원이 다음과제를 지시하거나 단서를 제공할 수 있음']],
      ['sequence', '업무의 순차적 수행', ['한가지 업무', '2~3가지 업무의 순차적 수행이 요구됨', '4~6가지 업무의 순차적 수행이 요구됨', '7가지 이상 업무의 순차적 수행이 요구됨']],
      ['change', '일과상의 변화', ['변화 없음', '하루에 2~3회 변화', '하루에 4~6회 변화', '하루에 7회이상 변화']],
    ]],
    ['변별력', [
      ['size', '크기변별', ['매우 낮음', '낮음', '높음', '매우 높음']], ['shape', '형태변별', ['매우 낮음', '낮음', '높음', '매우 높음']], ['color', '색변별', ['매우 낮음', '낮음', '높음', '매우 높음']],
    ]],
    ['사회성', [
      ['looks', '개인용모', ['중요하지 않음', '청결만 요구', '청결/단정한 복장', '청결/단정한 복장과 외모']],
      ['express', '표현언어', [NONE, '1단어 표현', '2~3단어 조합의 단문 표현', '정확한 문장 표현']],
      ['receive', '수용언어', [NONE, '1단어 수용', '2~3단어 조합의 단문 수용', '긴 문장 수용']],
    ]],
  ];
  const STEP_ROWS = 6, TASK_ROWS = 5;
  const METHODS = ['관찰', '면접', '설문지', '과거자료 분석결과', '체험', '기타'];

  /* ---------- 입력 칸 ---------- */
  function input([k, label, type, o = {}], v) {
    const id = 'sv_' + k;
    const val = v ?? '';
    let ctl;
    if (type === 'textarea') ctl = `<textarea class="textarea" id="${id}" name="${k}" rows="3">${e(val)}</textarea>`;
    else if (type === 'radio') ctl = `<div class="opt-row" role="radiogroup" aria-label="${e(label)}">${o.opts.map(op => `<label class="opt"><input type="radio" name="${k}" value="${e(op)}" ${val === op ? 'checked' : ''}><span>${e(op)}</span></label>`).join('')}<button type="button" class="opt-clear" data-act="sv-clear" data-name="${k}" title="선택 지우기">지우기</button></div>`;
    else if (type === 'checks') ctl = `<div class="opt-row">${o.opts.map(op => `<label class="opt"><input type="checkbox" name="${k}" value="${e(op)}" ${(val || []).includes(op) ? 'checked' : ''}><span>${e(op)}</span></label>`).join('')}</div>`;
    else ctl = `<input class="input" id="${id}" name="${k}" ${type === 'num' ? 'type="number" min="0" inputmode="numeric"' : type === 'date' ? 'type="date"' : ''} value="${e(val)}" ${o.ph ? `placeholder="${e(o.ph)}"` : ''}>`;
    const wide = o.full || type === 'radio' || type === 'checks' || type === 'textarea';
    return `<div class="field ${wide ? 'full' : ''}">${type === 'radio' || type === 'checks' ? `<span class="flabel">${e(label)}</span>` : `<label for="${id}">${e(label)}</label>`}${ctl}</div>`;
  }
  function collectFields(form, fields) {
    const out = {};
    fields.forEach(([k, , type]) => {
      if (type === 'checks') out[k] = [...form.querySelectorAll(`[name="${k}"]:checked`)].map(x => x.value);
      else if (type === 'radio') out[k] = form.querySelector(`[name="${k}"]:checked`)?.value || '';
      else out[k] = (form.elements[k]?.value || '').trim();
    });
    return out;
  }

  const head = t => `<div class="dr-head"><div class="dr-top"><div class="inline" style="flex-wrap:nowrap;min-width:0"><button class="icon-btn" type="button" data-act="dr-back" aria-label="뒤로">${V.I.back}</button><h2 class="dr-title">${t}</h2></div><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div></div>`;
  const foot = `<div class="dr-foot"><button class="btn" type="button" data-act="dr-back">취소</button><button class="btn btn-primary" type="submit" form="svForm">저장</button></div>`;

  /** 사업체정보지 입력 (처음이면 사업체 정보로 미리 채움) */
  function bizForm(b) {
    const d = b.survey || {};
    const first = !b.survey;
    const val = f => (first && f[3]?.from ? f[3].from(b) : d[f[0]]);
    return head(`사업체정보지 · ${e(b.name)}`) + `<div class="dr-body"><form class="form sv-form" id="svForm" data-form="sv-biz" data-id="${b.id}" novalidate>
      ${first ? '<div class="form-notice">사업체 정보에 이미 입력된 내용을 미리 채웠습니다. 방문해서 확인한 내용으로 고쳐 주세요.</div>' : ''}
      <div class="fsec"><div class="frow">${input(['writtenAt', '작성일', 'date'], d.writtenAt || U.today())}${input(['writer', '담당자', 'text'], d.writer || S.me())}</div></div>
      ${BIZ.map(sec => `<div class="fsec"><h3>${e(sec.title)}</h3><div class="frow">${sec.fields.map(f => input(f, val(f))).join('')}</div></div>`).join('')}
    </form></div>` + foot;
  }
  function collectBiz(form) {
    const out = collectFields(form, [['writtenAt', '', 'date'], ['writer', '', 'text'], ...BIZ.flatMap(s => s.fields)]);
    out.writtenAt ||= U.today();
    return out;
  }

  /** 직무분석지 입력 */
  function jobForm(b, j) {
    const d = j || { id: U.uid('J'), writtenAt: U.today(), writer: S.me(), manager: (() => { const c = S.cardsOf('biz', b.id)[0]; return c ? `${c.name} ${c.title || ''}`.trim() : ''; })(), req: {}, steps: [], tasks: [] };
    const reqRow = ([k, label, lv]) => `<tr><th>${e(label)}</th>${lv.map((l, i) => `<td><label class="req-opt"><input type="radio" name="req_${k}" value="${i + 1}" ${String((d.req[k] || {}).lv) === String(i + 1) ? 'checked' : ''}><span><b>${'①②③④'[i]}</b> ${e(l)}</span></label></td>`).join('')}<td><input class="input" name="reqnote_${k}" value="${e((d.req[k] || {}).note || '')}" aria-label="${e(label)} 비고"></td></tr>`;
    const row = (name, i, cols) => `<tr><td class="num">${i + 1}</td>${cols.map(c => `<td><input class="input" name="${name}_${i}_${c}" value="${e(((d[name] || [])[i] || {})[c] || '')}"></td>`).join('')}</tr>`;
    return head(`직무분석지 · ${e(b.name)}`) + `<div class="dr-body"><form class="form sv-form" id="svForm" data-form="sv-job" data-id="${b.id}" data-job="${d.id}" novalidate>
      <div class="fsec"><div class="frow">
        ${input(['jobName', '담당직무명', 'text'], d.jobName)}${input(['writtenAt', '작성일', 'date'], d.writtenAt)}
        ${input(['writer', '담당자', 'text'], d.writer)}${input(['manager', '사업주(인사담당자)', 'text'], d.manager)}
        ${input(['method', '자료수집방법', 'checks', { opts: METHODS }], d.method || [])}${input(['methodEtc', '자료수집방법 기타', 'text'], d.methodEtc)}
        ${input(['summary', '직무개요', 'textarea'], d.summary)}
      </div></div>
      ${REQ.map(([g, items]) => `<div class="fsec"><h3>${e(g)} <span class="sub">요구도 ①~④ 중 하나를 고르세요</span></h3>
        <div class="table-wrap"><table class="req-tbl"><thead><tr><th>항목</th><th>①</th><th>②</th><th>③</th><th>④</th><th>비고</th></tr></thead><tbody>${items.map(reqRow).join('')}</tbody></table></div></div>`).join('')}
      <div class="fsec"><h3>직무 수행과정</h3><div class="table-wrap"><table class="grid-tbl"><thead><tr><th>순번</th><th>세부직무</th><th>수행과업</th><th>세부과업</th><th>필요도구</th></tr></thead>
        <tbody>${Array.from({ length: STEP_ROWS }, (_, i) => row('steps', i, ['duty', 'work', 'sub', 'tools'])).join('')}</tbody></table></div></div>
      <div class="fsec"><h3>과업 분석</h3><div class="table-wrap"><table class="grid-tbl"><thead><tr><th>순번</th><th>세부과업순서</th><th>작업요구수준 (필요기능/작업량/작업속도/무게 등)</th><th>작업도구</th></tr></thead>
        <tbody>${Array.from({ length: TASK_ROWS }, (_, i) => row('tasks', i, ['order', 'level', 'tools'])).join('')}</tbody></table></div></div>
      <div class="fsec"><div class="frow">${input(['caution', '직무수행 시 유의사항 (특성, 위험요소 등)', 'textarea'], d.caution)}${input(['opinion', '종합 소견', 'textarea'], d.opinion)}</div></div>
    </form></div>` + foot;
  }
  function collectJob(form) {
    const out = collectFields(form, [['jobName', '', 'text'], ['writtenAt', '', 'date'], ['writer', '', 'text'], ['manager', '', 'text'], ['method', '', 'checks'], ['methodEtc', '', 'text'], ['summary', '', 'textarea'], ['caution', '', 'textarea'], ['opinion', '', 'textarea']]);
    out.id = form.dataset.job;
    out.req = {};
    REQ.forEach(([, items]) => items.forEach(([k]) => {
      const lv = form.querySelector(`[name="req_${k}"]:checked`)?.value || '';
      const note = (form.elements['reqnote_' + k]?.value || '').trim();
      if (lv || note) out.req[k] = { lv, note };
    }));
    const rows = (name, n, cols) => Array.from({ length: n }, (_, i) => Object.fromEntries(cols.map(c => [c, (form.elements[`${name}_${i}_${c}`]?.value || '').trim()]))).filter(r => Object.values(r).some(Boolean));
    out.steps = rows('steps', STEP_ROWS, ['duty', 'work', 'sub', 'tools']);
    out.tasks = rows('tasks', TASK_ROWS, ['order', 'level', 'tools']);
    return out;
  }

  /* ---------- 인쇄용 문서 (한글 서식처럼 표로) ---------- */
  const box = on => (on ? '■' : '□');
  function show([k, label, type, o = {}], d) {
    const v = d[k];
    if (type === 'radio') return o.opts.map(op => `${box(v === op)} ${e(op)}`).join('&nbsp;&nbsp; ');
    if (type === 'checks') return o.opts.map(op => `${box((v || []).includes(op))} ${e(op)}`).join('&nbsp;&nbsp; ');
    return e(v ?? '').replace(/\n/g, '<br>');
  }
  function bizDoc(b) {
    const d = b.survey || {};
    return `<article class="doc">
      <h1>사업체정보지</h1>
      <table class="doc-meta"><tr><th>작성일</th><td>${e(U.dateDot(d.writtenAt))}</td><th>담당자</th><td>${e(d.writer || '')} &nbsp;&nbsp;(서명/인)</td></tr></table>
      ${BIZ.map(sec => `<table class="doc-tbl"><caption>${e(sec.title)}</caption>${sec.fields.map(f => `<tr><th>${e(f[1])}</th><td>${show(f, d)}</td></tr>`).join('')}</table>`).join('')}
      <p class="doc-foot">화성시아르딤복지관 직업지원팀 · 아르딤 취업지원에서 출력</p>
    </article>`;
  }
  function jobDoc(b, j) {
    return `<article class="doc">
      <h1>직무분석지</h1>
      <table class="doc-meta"><tr><th>작성일</th><td>${e(U.dateDot(j.writtenAt))}</td><th>담당자</th><td>${e(j.writer || '')} &nbsp;&nbsp;(서명/인)</td></tr>
        <tr><th>사업체명</th><td>${e(b.name)}</td><th>사업주(인사담당자)</th><td>${e(j.manager || '')}</td></tr>
        <tr><th>자료수집방법</th><td colspan="3">${METHODS.map(m => `${box((j.method || []).includes(m))} ${m}${m === '기타' && j.methodEtc ? `(${e(j.methodEtc)})` : ''}`).join('&nbsp;&nbsp; ')}</td></tr>
        <tr><th>담당직무명</th><td colspan="3"><b>${e(j.jobName || '')}</b></td></tr>
        <tr><th>직무개요</th><td colspan="3">${e(j.summary || '').replace(/\n/g, '<br>')}</td></tr></table>
      <table class="doc-tbl req-doc"><thead><tr><th>구분</th><th>항목</th><th>①</th><th>②</th><th>③</th><th>④</th><th>비고</th></tr></thead><tbody>
        ${REQ.map(([g, items]) => items.map(([k, label, lv], i) => `<tr>${i === 0 ? `<th rowspan="${items.length}" class="grp">${g}</th>` : ''}<th>${e(label)}</th>${lv.map((l, n) => `<td class="${String((j.req?.[k] || {}).lv) === String(n + 1) ? 'on' : ''}">${e(l)}<br>${box(String((j.req?.[k] || {}).lv) === String(n + 1))}</td>`).join('')}<td>${e((j.req?.[k] || {}).note || '')}</td></tr>`).join('')).join('')}
      </tbody></table>
      <table class="doc-tbl"><caption>직무 수행과정</caption><thead><tr><th>순번</th><th>세부직무</th><th>수행과업</th><th>세부과업</th><th>필요도구</th></tr></thead><tbody>
        ${Array.from({ length: Math.max(STEP_ROWS, (j.steps || []).length) }, (_, i) => { const r = (j.steps || [])[i] || {}; return `<tr><td>${i + 1}</td><td>${e(r.duty || '')}</td><td>${e(r.work || '')}</td><td>${e(r.sub || '')}</td><td>${e(r.tools || '')}</td></tr>`; }).join('')}
      </tbody></table>
      <table class="doc-tbl"><caption>과업 분석</caption><thead><tr><th>순번</th><th>수행사진</th><th>세부과업순서</th><th>작업요구수준</th><th>작업도구</th></tr></thead><tbody>
        ${Array.from({ length: Math.max(TASK_ROWS, (j.tasks || []).length) }, (_, i) => { const r = (j.tasks || [])[i] || {}; return `<tr><td>${i + 1}</td><td class="photo-cell"></td><td>${e(r.order || '')}</td><td>${e(r.level || '')}</td><td>${e(r.tools || '')}</td></tr>`; }).join('')}
      </tbody></table>
      <table class="doc-tbl"><tr><th>직무수행 시<br>유의사항</th><td>${e(j.caution || '').replace(/\n/g, '<br>')}</td></tr><tr><th>종합 소견</th><td>${e(j.opinion || '').replace(/\n/g, '<br>')}</td></tr></table>
      <p class="doc-foot">화성시아르딤복지관 직업지원팀 · 아르딤 취업지원에서 출력</p>
    </article>`;
  }
  /** 보기 화면: 문서 + 인쇄/수정 버튼 */
  function viewer(title, doc, editAct, id, jobId) {
    return head(title) + `<div class="dr-body doc-wrap">
      <div class="inline"><button class="btn btn-primary btn-sm" type="button" data-act="sv-print">인쇄 · PDF 저장</button><button class="btn btn-sm" type="button" data-act="${editAct}" data-id="${id}" ${jobId ? `data-job="${jobId}"` : ''}>${V.I.edit}수정</button></div>
      <div id="svDoc">${doc}</div></div>`;
  }

  /** 사업체 상세 화면의 기초조사 요약 칸 */
  function section(b) {
    const js = b.jobAnalyses || [];
    const filled = d => d ? Object.values(d).filter(v => (Array.isArray(v) ? v.length : v)).length : 0;
    return `<div class="sv-list">
      <div class="sv-item"><div><b>사업체정보지</b> ${b.survey ? `<span class="sub">${U.dateDot(b.survey.writtenAt)} · ${e(b.survey.writer || '')} · ${filled(b.survey)}개 항목</span>` : '<span class="sub">아직 작성하지 않음</span>'}</div>
        <div class="inline">${b.survey ? `<button class="btn btn-sm" type="button" data-act="sv-biz-view" data-id="${b.id}">보기·인쇄</button>` : ''}<button class="btn btn-sm ${b.survey ? '' : 'btn-primary'}" type="button" data-act="sv-biz-edit" data-id="${b.id}">${b.survey ? '수정' : '작성'}</button></div></div>
      ${js.map(j => `<div class="sv-item"><div><b>직무분석지</b> ${e(j.jobName || '(직무명 없음)')} <span class="sub">${U.dateDot(j.writtenAt)} · ${e(j.writer || '')}</span></div>
        <div class="inline"><button class="btn btn-sm" type="button" data-act="sv-job-view" data-id="${b.id}" data-job="${j.id}">보기·인쇄</button><button class="btn btn-sm" type="button" data-act="sv-job-edit" data-id="${b.id}" data-job="${j.id}">수정</button><button class="icon-btn" type="button" aria-label="직무분석지 삭제" data-act="sv-job-del" data-id="${b.id}" data-job="${j.id}">${V.I.close}</button></div></div>`).join('')}
      <div class="sv-item add"><span class="sub">직무마다 한 장씩 작성합니다.</span><button class="btn btn-sm" type="button" data-act="sv-job-edit" data-id="${b.id}">+ 직무분석지 추가</button></div>
    </div>`;
  }

  return { bizForm, collectBiz, jobForm, collectJob, bizDoc, jobDoc, viewer, section };
})();

</script>
<script>
/* 파일로 사업체 여러 곳 등록: 엑셀·CSV의 열 이름을 알아서 맞춘 뒤 미리보기에서 확인하고 등록한다 */
window.IMP = (() => {
  const e = U.esc;
  // 앞쪽일수록 먼저 짝을 찾는다 ('담당자 연락처'가 '담당자'나 '연락처'보다 먼저)
  const FIELDS = [
    ['contactPhone', '담당자 연락처', ['담당자연락처', '담당자전화', '담당자휴대폰', '휴대폰', '핸드폰', '휴대전화']],
    ['contact', '담당자', ['담당자', '담당자명', '인사담당자']],
    ['name', '사업체명', ['사업체명', '업체명', '회사명', '상호', '기업명', '사업장명', '사업체', '업체', '회사', '상호명']],
    ['address', '주소', ['주소', '소재지', '사업장주소', '도로명주소', '지번주소', '사업장소재지']],
    ['industry', '업종', ['업종', '업태', '종목', '산업', '업종명']],
    ['phone', '대표 전화', ['대표전화', '전화번호', '전화', '연락처', '대표번호']],
    ['ceo', '대표자', ['대표자', '대표자명', '대표']],
    ['bizNo', '사업자등록번호', ['사업자등록번호', '사업자번호', '등록번호']],
    ['employees', '상시근로자 수', ['상시근로자수', '상시근로자', '근로자수', '직원수', '종업원수', '인원', '근로자']],
    ['jobs', '가능 직무', ['모집직종', '모집분야', '직무', '직종', '업무']],
    ['homepage', '홈페이지', ['홈페이지', '웹사이트', 'url']],
    ['discoveredAt', '발굴일', ['발굴일', '등록일', '날짜', '일자', '조사일']],
    ['memo', '메모', ['비고', '메모', '특이사항', '참고']],
  ];
  const SHOW = ['name', 'address', 'industry', 'phone', 'ceo', 'bizNo', 'employees', 'jobs', 'homepage', 'discoveredAt', 'memo', 'contact', 'contactPhone'];
  const nh = h => String(h ?? '').toLowerCase().replace(/[\s()\[\]·._-]/g, '');

  function guessMap(headers) {
    const map = {};
    const used = new Set();
    const norm = headers.map(nh);
    for (const pass of ['exact', 'part']) {
      for (const [key, , syn] of FIELDS) {
        if (map[key] != null) continue;
        const i = norm.findIndex((h, j) => !used.has(j) && h && syn.some(s => (pass === 'exact' ? h === s : h.includes(s))));
        if (i >= 0) { map[key] = i; used.add(i); }
      }
    }
    return map;
  }

  async function readTable(file) {
    const buf = await file.arrayBuffer();
    let wb;
    if (/\.csv$/i.test(file.name)) {
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { text = new TextDecoder('euc-kr').decode(buf); }
      wb = XLSX.read(text, { type: 'string', raw: true });
    } else {
      wb = XLSX.read(buf, { type: 'array', cellDates: true });
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, dateNF: 'yyyy-mm-dd' });
    // 제목 줄이 위에 있는 공문서 양식도 있으므로, 알아볼 수 있는 열 이름이 2개 이상인 첫 줄을 머리글로 본다
    let hi = 0;
    for (let i = 0; i < Math.min(grid.length, 15); i++) {
      if (Object.keys(guessMap(grid[i])).length >= 2) { hi = i; break; }
    }
    const headers = (grid[hi] || []).map(h => String(h).trim());
    const rows = grid.slice(hi + 1).filter(r => r.some(v => String(v).trim() !== ''));
    return { headers, rows, sheet: wb.SheetNames[0] };
  }

  /** 미리보기 상태 */
  async function start(file) {
    const t = await readTable(file);
    if (!t.headers.length || !t.rows.length) throw new Error('표를 찾지 못했습니다');
    return { fileName: file.name, ...t, map: guessMap(t.headers), staff: S.me(), stage: '발굴', date: U.today(), includeDup: false };
  }

  function records(st) {
    const existing = new Set(S.get().businesses.map(b => U.orgKey(b.name)));
    const seen = new Set();
    const cell = (r, k) => (st.map[k] != null ? String(r[st.map[k]] ?? '').trim() : '');
    return st.rows.map(r => {
      const name = cell(r, 'name');
      const key = U.orgKey(name);
      const dup = !name ? false : existing.has(key) || seen.has(key);
      if (name) seen.add(key);
      return {
        name, dup,
        address: cell(r, 'address'), industry: cell(r, 'industry'), phone: cell(r, 'phone'), ceo: cell(r, 'ceo'), bizNo: cell(r, 'bizNo'),
        employees: Number(String(cell(r, 'employees')).replace(/[^0-9]/g, '')) || 0, jobs: cell(r, 'jobs'), homepage: cell(r, 'homepage'),
        memo: cell(r, 'memo'), discoveredAt: U.toDateStr(cell(r, 'discoveredAt')), contact: cell(r, 'contact'), contactPhone: cell(r, 'contactPhone'),
      };
    }).filter(x => x.name);
  }

  function html(st) {
    const recs = records(st);
    const add = recs.filter(r => st.includeDup || !r.dup);
    const dupN = recs.filter(r => r.dup).length;
    const colOpts = sel => `<option value="">(없음)</option>${st.headers.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${e(h || `${i + 1}번째 열`)}</option>`).join('')}`;
    return `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">파일로 사업체 등록</h2><button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${V.I.close}</button></div>
        <div class="sub">${e(st.fileName)} · ${e(st.sheet)} 시트 · ${st.rows.length}줄</div></div>
      <div class="dr-body" id="bulkBody">
        <section class="dr-sec"><h3>열 맞추기</h3>
          <p class="sub" style="margin:0 0 8px">파일의 열 이름을 보고 자동으로 맞췄습니다. 틀린 곳만 고치세요. 사업체명은 꼭 필요합니다.</p>
          <div class="map-grid">${SHOW.map(k => FIELDS.find(f => f[0] === k)).map(([k, label]) => `<label>${label}${k === 'name' ? ' <span class="req">*</span>' : ''}<select class="select" data-bulk-map="${k}">${colOpts(st.map[k])}</select></label>`).join('')}</div>
        </section>
        <section class="dr-sec"><h3>등록 설정</h3>
          <div class="frow three">
            <div class="field"><label for="bulkStaff">담당 직원</label><select class="select" id="bulkStaff">${S.staff().map(s => `<option ${s.name === st.staff ? 'selected' : ''}>${e(s.name)}</option>`).join('')}</select></div>
            <div class="field"><label for="bulkStage">진행 단계</label><select class="select" id="bulkStage">${D.STAGES.map(s => `<option ${s.key === st.stage ? 'selected' : ''}>${s.key}</option>`).join('')}</select></div>
            <div class="field"><label for="bulkDate">발굴일 (파일에 없을 때)</label><input class="input" type="date" id="bulkDate" value="${e(st.date)}"></div>
          </div>
          ${dupN ? `<label class="check" style="margin-top:8px"><input type="checkbox" id="bulkDup" ${st.includeDup ? 'checked' : ''}>이미 있는 이름 ${dupN}곳도 새로 등록</label>` : ''}
        </section>
        <section class="dr-sec"><h3>미리보기 <span class="sub num">${add.length}곳 등록 예정${dupN && !st.includeDup ? ` · 중복 ${dupN}곳 제외` : ''}</span></h3>
          <div class="table-wrap"><table class="tbl bulk-tbl"><thead><tr><th>사업체명</th><th>주소</th><th>업종</th><th>전화</th><th>담당자</th></tr></thead>
          <tbody>${recs.slice(0, 40).map(r => `<tr class="${r.dup && !st.includeDup ? 'dup' : ''}"><td><b>${e(r.name)}</b>${r.dup ? ' <span class="badge warn">이미 있음</span>' : ''}</td><td>${e(r.address)}${r.address && D.detectArea(r.address) ? ` <span class="sub">(${e(D.detectArea(r.address))})</span>` : ''}</td><td>${e(r.industry)}</td><td class="num">${e(r.phone)}</td><td>${e(r.contact)} <span class="num sub">${e(r.contactPhone)}</span></td></tr>`).join('')}</tbody></table></div>
          ${recs.length > 40 ? `<p class="sub">처음 40줄만 보여줍니다. 나머지 ${recs.length - 40}줄도 함께 등록됩니다.</p>` : ''}
        </section>
      </div>
      <div class="dr-foot"><button class="btn" type="button" data-act="dr-close">취소</button><button class="btn btn-primary" type="button" data-act="bulk-commit" ${add.length ? '' : 'disabled'}>${add.length}곳 등록</button></div>`;
  }

  function bind(st, rerender) {
    document.querySelectorAll('[data-bulk-map]').forEach(sel => sel.onchange = () => { const k = sel.dataset.bulkMap; if (sel.value === '') delete st.map[k]; else st.map[k] = +sel.value; rerender(); });
    const dup = document.getElementById('bulkDup');
    if (dup) dup.onchange = () => { st.includeDup = dup.checked; rerender(); };
    document.getElementById('bulkStaff').onchange = ev => { st.staff = ev.target.value; };
    document.getElementById('bulkStage').onchange = ev => { st.stage = ev.target.value; };
    document.getElementById('bulkDate').onchange = ev => { st.date = ev.target.value || U.today(); };
  }

  /** 등록하고, 대략 위치인 곳은 인터넷 주소 검색으로 조금씩 정확하게 바꾼다 */
  function commit(st) {
    const recs = records(st).filter(r => st.includeDup || !r.dup);
    const bizs = S.upsertMany('biz', recs.map(r => ({
      name: r.name, address: r.address, industry: r.industry, phone: r.phone, ceo: r.ceo, bizNo: r.bizNo, employees: r.employees, jobs: r.jobs, homepage: r.homepage,
      memo: r.memo, discoveredAt: r.discoveredAt || st.date, stage: st.stage, staff: st.staff, source: '파일 등록', placements: 0,
    })));
    S.upsertMany('act', bizs.map(b => ({ targetType: 'biz', targetId: b.id, date: b.discoveredAt, type: '발굴', content: `파일(${st.fileName})로 일괄 등록`, staff: st.staff })));
    const cards = recs.map((r, i) => (r.contact ? { name: r.contact, org: r.name, mobile: /^01/.test(r.contactPhone) ? r.contactPhone : '', phone: /^01/.test(r.contactPhone) ? '' : r.contactPhone, address: r.address, linkType: 'biz', linkId: bizs[i].id, tags: ['사업체 담당자'], metAt: bizs[i].discoveredAt, metWhere: '파일 등록', memo: '' } : null)).filter(Boolean);
    if (cards.length) S.upsertMany('card', cards);
    const queue = bizs.filter(b => b.address).slice(0, 60).map(b => b.id);
    (async () => { for (const id of queue) { await S.refine('biz', id); await new Promise(r => setTimeout(r, 1100)); } })();
    return { biz: bizs.length, cards: cards.length };
  }

  return { start, html, bind, commit };
})();

</script>
<script>
/* AI 없이 문서에서 사업체 정보 읽기
 * PDF에 글자가 들어 있으면(고용24 구인공고, 전자 발급 사업자등록증 등) 글자를 꺼내
 * '상호', '대표자', '등록번호', '소재지' 같은 항목 이름을 찾아 채운다. 스캔 PDF·사진은 읽지 못한다. */
window.DT = (() => {
  const PDFJS = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let loading = null;

  /** pdf.js는 필요할 때만 불러온다 (인터넷 필요) */
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (loading) return loading;
    loading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js';
      s.onload = async () => {
        const lib = window.pdfjsLib;
        if (!lib) return rej(new Error('PDF 도구를 불러오지 못했습니다.'));
        // 다른 주소의 워커는 바로 못 쓰므로 받아서 blob 주소로 띄운다. 안 되면 워커 없이 읽는다.
        try {
          const code = await (await fetch(PDFJS + 'pdf.worker.min.js')).text();
          lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        } catch { lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
        res(lib);
      };
      s.onerror = () => { loading = null; rej(new Error('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
      document.head.appendChild(s);
    });
    return loading;
  }

  /** PDF → 줄 단위 글자 (앞쪽 3쪽까지) */
  async function pdfText(file) {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const lines = [];
    for (let n = 1; n <= Math.min(pdf.numPages, 3); n++) {
      const page = await pdf.getPage(n);
      const { items } = await page.getTextContent();
      const rows = new Map();
      items.forEach(it => {
        if (!it.str || !it.str.trim()) return;
        const y = Math.round(it.transform[5] / 3);
        (rows.get(y) || rows.set(y, []).get(y)).push({ x: it.transform[4], s: it.str });
      });
      [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, r]) => lines.push(r.sort((a, b) => a.x - b.x).map(o => o.s).join(' ').replace(/\s+/g, ' ').trim()));
    }
    return lines.filter(Boolean).join('\n');
  }

  // '상 호', '상호(법인명)'처럼 글자 사이에 빈칸이 있어도 찾는다
  const lab = w => w.split('').map(c => c.replace(/[()]/g, '\\$&')).join('\\s*');
  const STOP = ['상호', '법인명', '사업장명', '회사명', '기업명', '업체명', '대표자명', '대표자', '대표전화', '전화번호', '성명', '등록번호', '사업자등록번호', '개업연월일', '법인등록번호', '사업장소재지', '소재지', '본점소재지', '주소', '업태', '종목', '전화', '연락처', '홈페이지', '업종', '모집직종', '모집분야', '직종', '근무지주소', '근무예정지', '근무지', '생년월일', '발급', '사업의종류'];
  const stopRe = new RegExp('\\s(?:' + STOP.map(lab).join('|') + ')(?:\\s*[:：]|\\s|$)', 'u');
  function pick(text, labels) {
    for (const l of labels) {
      const m = text.match(new RegExp('(?:^|\\n|\\s)' + lab(l) + '(?:\\s*\\((?:법인명|단체명|상호)[^)]*\\))?\\s*[:：]?\\s*([^\\n]+)', 'u'));
      if (m) {
        let v = m[1].split(stopRe)[0].trim().replace(/^[:：\s]+/, '');
        if (v) return v.slice(0, 120);
      }
    }
    return '';
  }
  /** 글자에서 사업체 항목 뽑기 */
  function parseBiz(text) {
    const t = String(text || '').replace(/\r/g, '').replace(/[(（]\s*주\s*[)）]/g, '(주)');
    const bizNo = (t.match(/\b(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})\b/) || []).slice(1).join('-');
    const phone = pick(t, ['대표전화', '전화번호', '연락처', '전화']).match(/0\d{1,2}[-)\s.]*\d{3,4}[-\s.]*\d{4}/)?.[0]
      || (t.match(/0(?:31|2|70|1\d)[-)\s.]*\d{3,4}[-\s.]*\d{4}/) || [])[0] || '';
    const homepage = (t.match(/(?:https?:\/\/)?www\.[a-z0-9.-]+\.[a-z]{2,}[^\s]*/i) || [])[0] || '';
    const name = pick(t, ['상호(법인명)', '법인명(단체명)', '상호', '법인명', '사업장명', '회사명', '기업명', '업체명']);
    const industry = [pick(t, ['업태']), pick(t, ['종목'])].filter(Boolean).join(' · ') || pick(t, ['업종']);
    return {
      name, bizNo, phone: phone.replace(/[)\s.]+/g, '-').replace(/-+/g, '-'), homepage,
      ceo: pick(t, ['대표자명', '대표자', '성명', '대표']).replace(/\s*\(.*$/, ''),
      address: pick(t, ['사업장소재지', '사업장 소재지', '본점소재지', '근무지주소', '근무예정지', '소재지', '주소']),
      industry, jobs: pick(t, ['모집직종', '직종', '모집분야']),
    };
  }

  return { pdfText, parseBiz };
})();

</script>
<script>
/* 한글(.hwp 5.x) 파일에서 표만 읽어 오는 최소 리더.
 * 복합 문서(CFB) → BodyText/SectionN 스트림 → 압축 해제 → 표·칸·문단 레코드를 따라 칸별 글자를 모은다. */
window.HWP = (() => {
  const u16 = (b, o) => b[o] | (b[o + 1] << 8);
  const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
  const ENDOFCHAIN = 0xFFFFFFFE;

  /** 복합 문서에서 스트림 경로 → 바이트 */
  function cfb(buf) {
    const b = new Uint8Array(buf);
    if (u32(b, 0) !== 0xE011CFD0 || u32(b, 4) !== 0xE11AB1A1) throw new Error('한글(.hwp) 파일이 아닙니다. 한글 2002 이후의 .hwp 파일만 읽을 수 있습니다 (.hwpx는 한글에서 .hwp로 다시 저장하세요).');
    const ss = 1 << u16(b, 0x1E), mss = 1 << u16(b, 0x20);
    const sec = n => 512 + n * ss;
    const difat = [];
    for (let i = 0; i < 109; i++) difat.push(u32(b, 0x4C + i * 4));
    for (let d = u32(b, 0x44), n = u32(b, 0x48); n-- > 0 && d < ENDOFCHAIN;) {
      for (let i = 0; i < ss / 4 - 1; i++) difat.push(u32(b, sec(d) + i * 4));
      d = u32(b, sec(d) + ss - 4);
    }
    const fat = [];
    difat.filter(x => x < ENDOFCHAIN).forEach(s => { for (let i = 0; i < ss / 4; i++) fat.push(u32(b, sec(s) + i * 4)); });
    const chain = (start, table) => { const out = []; for (let s = start, guard = 0; s < ENDOFCHAIN && guard < 1e6; s = table[s], guard++) out.push(s); return out; };
    const readBig = (start, size) => { const out = new Uint8Array(size); let o = 0; for (const s of chain(start, fat)) { const n = Math.min(ss, size - o); if (n <= 0) break; out.set(b.subarray(sec(s), sec(s) + n), o); o += n; } return out; };
    const dirBytes = readBig(u32(b, 0x30), chain(u32(b, 0x30), fat).length * ss);
    const dir = [];
    for (let o = 0; o + 128 <= dirBytes.length; o += 128) {
      const nl = u16(dirBytes, o + 64);
      let name = '';
      for (let i = 0; i < Math.max(0, nl - 2); i += 2) name += String.fromCharCode(u16(dirBytes, o + i));
      dir.push({ name, type: dirBytes[o + 66], left: u32(dirBytes, o + 68), right: u32(dirBytes, o + 72), child: u32(dirBytes, o + 76), start: u32(dirBytes, o + 116), size: u32(dirBytes, o + 120) });
    }
    const root = dir[0];
    const miniStream = readBig(root.start, root.size);
    const minifat = [];
    chain(u32(b, 0x3C), fat).forEach(s => { for (let i = 0; i < ss / 4; i++) minifat.push(u32(b, sec(s) + i * 4)); });
    const cutoff = u32(b, 0x38);
    const read = e => {
      if (e.size >= cutoff) return readBig(e.start, e.size);
      const out = new Uint8Array(e.size); let o = 0;
      for (const s of chain(e.start, minifat)) { const n = Math.min(mss, e.size - o); if (n <= 0) break; out.set(miniStream.subarray(s * mss, s * mss + n), o); o += n; }
      return out;
    };
    const children = id => { const out = []; const walk = i => { if (i >= dir.length || i >= 0xFFFFFFFA) return; const e = dir[i]; walk(e.left); out.push(e); walk(e.right); }; walk(id); return out; };
    return {
      get(path) {
        let list = children(root.child), e;
        for (const part of path.split('/')) { e = list.find(x => x.name === part); if (!e) return null; list = children(e.child); }
        return e && e.type === 2 ? read(e) : null;
      },
      list(storage) { const s = children(root.child).find(x => x.name === storage); return s ? children(s.child).map(x => x.name) : []; },
    };
  }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('이 브라우저는 한글 파일 읽기를 지원하지 않습니다. 최신 크롬에서 열어 주세요.');
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(bytes).catch(() => {});
    writer.close().catch(() => {});
    // 한글 파일은 압축 데이터 뒤에 여분 바이트가 붙는 경우가 있어, 끝에서 나는 오류는 무시하고 풀린 만큼 쓴다
    const reader = ds.readable.getReader(), parts = [];
    let len = 0;
    try { for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); len += value.length; } }
    catch (err) { if (!len) throw new Error('한글 파일 압축을 풀지 못했습니다.'); }
    const out = new Uint8Array(len);
    let o = 0;
    parts.forEach(p => { out.set(p, o); o += p.length; });
    return out;
  }

  /** 문단 글자 레코드 → 문자열 (조판 부호는 건너뜀) */
  function paraText(b, o, size) {
    let t = '';
    for (let j = 0; j + 1 < size;) {
      const c = u16(b, o + j);
      if (c < 32) { j += [0, 10, 13, 24, 25, 26, 27, 28, 29, 30, 31].includes(c) ? 2 : 16; continue; }
      t += String.fromCharCode(c); j += 2;
    }
    return t;
  }

  /** 섹션 레코드에서 표를 뽑는다: [{ rows: [[칸 글자...]...] }] */
  function tables(b) {
    const out = [];
    let tbl = null, cell = null, cellLevel = -1;
    for (let i = 0; i + 4 <= b.length;) {
      const h = u32(b, i); i += 4;
      const tag = h & 0x3FF, level = (h >> 10) & 0x3FF;
      let size = (h >>> 20) & 0xFFF;
      if (size === 0xFFF) { size = u32(b, i); i += 4; }
      if (cell && level < cellLevel) cell = null; // 칸 밖으로 나옴
      if (tag === 77) { tbl = { rows: [], spans: [] }; out.push(tbl); cell = null; }
      else if (tag === 72 && tbl && size >= 16) {
        const col = u16(b, i + 8), row = u16(b, i + 10);
        (tbl.rows[row] = tbl.rows[row] || [])[col] = '';
        (tbl.spans[row] = tbl.spans[row] || [])[col] = u16(b, i + 12) || 1;
        cell = { row, col }; cellLevel = level;
      } else if (tag === 67 && cell) {
        const t = paraText(b, i, size).trim();
        if (t) { const r = tbl.rows[cell.row]; r[cell.col] = r[cell.col] ? r[cell.col] + '\n' + t : t; }
      }
      i += size;
    }
    out.forEach(t => { t.rows = Array.from(t.rows, r => Array.from(r || [], c => (c || '').normalize('NFKC'))); t.spans = Array.from(t.spans, r => Array.from(r || [], x => x || 1)); });
    return out;
  }

  /** .hwp 파일(ArrayBuffer) → 표 목록 */
  async function readTables(buf) {
    const doc = cfb(buf);
    const head = doc.get('FileHeader');
    if (!head) throw new Error('한글 문서 머리 정보를 찾지 못했습니다.');
    const flags = u32(head, 36);
    if (flags & 2) throw new Error('암호가 걸린 한글 파일은 읽을 수 없습니다.');
    if (flags & 4) throw new Error('배포용 한글 문서는 읽을 수 없습니다.');
    const names = doc.list('BodyText').filter(n => /^Section\d+$/.test(n)).sort((a, b) => a.slice(7) - b.slice(7));
    const all = [];
    for (const n of names) {
      let data = doc.get('BodyText/' + n);
      if (flags & 1) data = await inflateRaw(data);
      all.push(...tables(data));
    }
    return all;
  }

  return { readTables };
})();

</script>
<script>
/* 연락이력 · 방문 보고 · 출장/특근 명령부 · 개발대장
   복지관이 지금 쓰는 구글 시트·한글 서식과 같은 열 순서로 보여주고 복사할 수 있게 한다. */
window.R = (() => {
  const e = U.esc;
  const ui = {
    contacts: { month: U.today().slice(0, 7), tab: 'log', q: '' },
    orders: { month: U.today().slice(0, 7), kind: '출장' },
  };
  const CONTACT_TYPES = ['전화', '방문', '이메일', '미팅'];
  const md = d => { if (!U.isDate(d)) return d || ''; const x = U.parse(d); return `${x.getMonth() + 1}월 ${x.getDate()}일`; };
  const clean = v => String(v ?? '').replace(/[\t\r\n]+/g, ' ').trim();
  const tsv = rows => rows.map(r => r.map(clean).join('\t')).join('\n');
  const monthNav = (act, month) => `<div class="month-nav"><button class="icon-btn" type="button" data-act="${act}" data-d="-1" aria-label="이전 달">${V.I.back}</button><b class="num">${V.monthLabel(month)}</b><button class="icon-btn" type="button" data-act="${act}" data-d="1" aria-label="다음 달" style="transform:scaleX(-1)">${V.I.back}</button></div>`;
  const opts = (list, sel, blank) => (blank != null ? `<option value="">${e(blank)}</option>` : '') + list.map(v => `<option ${v === sel ? 'selected' : ''}>${e(v)}</option>`).join('');

  /* ================= 연락이력 ================= */
  const contactOf = b => { const c = S.cardsOf('biz', b.id)[0]; return c ? `${c.name}${c.title ? ' ' + c.title : ''}` : ''; };
  const phoneOf = b => b.phone || (S.cardsOf('biz', b.id)[0] || {}).phone || (S.cardsOf('biz', b.id)[0] || {}).mobile || '';
  /** 이 달 사업체 연락 기록 (전화·방문·이메일·미팅) */
  function contactRows(month) {
    return S.view().activities
      .filter(a => a.targetType === 'biz' && CONTACT_TYPES.includes(a.type) && a.date.startsWith(month))
      .map(a => ({ a, b: S.find('biz', a.targetId) })).filter(r => r.b)
      .sort((x, y) => x.a.date.localeCompare(y.a.date) || x.a.id.localeCompare(y.a.id));
  }
  function contactKpis(rows) {
    const visits = rows.filter(r => r.a.type === '방문');
    return {
      contacted: new Set(rows.map(r => r.b.id)).size,
      visits: visits.length,
      willing: new Set(rows.filter(r => r.a.result === '채용의향 있음').map(r => r.b.id)).size,
      recall: rows.filter(r => r.a.status === '재연락').length,
      perf: visits.filter(r => /실적/.test(r.a.procedure || '')).length,
    };
  }

  function contactsPage() {
    const f = ui.contacts;
    const names = S.get().businesses.map(b => b.name);
    return `
      <div class="page-head">
        <div><h1 class="page-title">연락이력</h1><div class="page-desc">사업체 연락·방문을 한 줄씩 기록하고, 공유 시트의 연락이력·보고용 시트 모양 그대로 복사합니다.</div></div>
        <div class="inline"><button class="btn" type="button" data-act="ct-paste">시트에서 붙여넣어 가져오기</button></div>
      </div>
      <div class="toolbar perf-bar">${monthNav('ct-month', f.month)}
        <div class="chips"><button type="button" class="chip ${f.tab === 'log' ? 'on' : ''}" data-act="ct-tab" data-tab="log">연락이력</button><button type="button" class="chip ${f.tab === 'report' ? 'on' : ''}" data-act="ct-tab" data-tab="report">보고용 (방문 사업체)</button></div>
      </div>
      <section class="panel panel-pad perf-input">
        <h2 class="section-title">연락 기록 추가 <span class="sub">처음 보는 사업체명은 사업체 개발에 자동으로 등록됩니다</span></h2>
        <form class="perf-form" data-form="ct-add" autocomplete="off">
          <label>날짜<input class="input" type="date" name="date" value="${f.month === U.today().slice(0, 7) ? U.today() : f.month + '-01'}" required></label>
          <label>방식<select class="select" name="type">${opts(CONTACT_TYPES, '전화')}</select></label>
          <label class="grow">사업체명<input class="input" name="name" list="ctBizList" required placeholder="예: (주)한결테크"></label>
          <label>전화번호<input class="input" name="phone" inputmode="tel"></label>
          <label>담당자<input class="input" name="contactName" placeholder="예: 김재윤 부장"></label>
          <label>직종<input class="input" name="jobType" placeholder="예: 단순 제조 종사원"></label>
          <label class="grow">결과<input class="input" name="content" required placeholder="예: 전화 안받음 / 장애인 채용 안함"></label>
          <label>연락결과<select class="select" name="result">${opts(D.CONTACT_RESULTS, '', '선택')}</select></label>
          <label>상태<select class="select" name="status">${opts(D.CONTACT_STATUS, '연락완료')}</select></label>
          <label class="grow">주소 <span class="sub">(새 사업체일 때)</span><input class="input" name="address"></label>
          <label class="grow">구인공고 주소 <span class="sub">(고용24·알바몬·알바천국·사람인·잡코리아 등, 사이트 주소만)</span><input class="input" name="jobUrl" inputmode="url" autocomplete="off" placeholder="https:\/\/www.albamon.com/..."></label>
          <button class="btn btn-primary" type="submit">추가</button>
          <datalist id="ctBizList">${names.map(n => `<option value="${e(n)}">`).join('')}</datalist>
        </form>
      </section>
      <div id="ctResults"></div>`;
  }

  function contactsResults() {
    const f = ui.contacts;
    const rows = contactRows(f.month);
    const k = contactKpis(rows);
    const kpi = `<section class="panel perf-sum report-kpi">
      <div><span class="l">총 사업체 연락 수</span><b class="num">${k.contacted}</b><span class="sub">곳</span></div>
      <div><span class="l">총 방문</span><b class="num">${k.visits}</b><span class="sub">회</span></div>
      <div><span class="l">채용의향 있음</span><b class="num">${k.willing}</b><span class="sub">곳</span></div>
      <div><span class="l">실적 (절차: 실적입력)</span><b class="num">${k.perf}</b><span class="sub">곳</span></div>
      <div><span class="l">재연락 필요</span><b class="num">${k.recall}</b><span class="sub">건</span></div></section>`;
    if (f.tab === 'report') {
      const visits = rows.filter(r => r.a.type === '방문');
      return kpi + `<section class="panel">
        <div class="panel-pad perf-actions"><h2 class="section-title">방문 사업체 <span class="sub num">${visits.length}건</span></h2>
          <button class="btn btn-primary" type="button" data-act="ct-copy-report" ${visits.length ? '' : 'disabled'}>${V.I.copy}보고용 시트용 복사</button></div>
        <p class="sub perf-help">보고용 시트의 <b>방문 사업체 수</b> 표에서 <b>날짜</b> 칸을 누르고 Ctrl+V 하세요. (날짜 · 업체명 · 주소 · 연락처/담당자 · 결과 · 현장훈련 유/무 · 절차)</p>
        ${visits.length ? `<div class="table-wrap"><table class="tbl perf-tbl"><thead><tr><th>날짜</th><th>업체명</th><th>주소</th><th>연락처/담당자</th><th>결과</th><th>현장훈련 유/무</th><th>절차</th></tr></thead><tbody>
          ${visits.map(({ a, b }) => `<tr><td class="num">${U.dateDot(a.date)}</td><td><b class="link" data-act="open" data-kind="biz" data-id="${b.id}">${e(b.name)}</b></td><td class="clip" title="${e(b.address)}">${e(b.address || '')}</td>
            <td>${e(phoneOf(b))}<div class="meta">${e(a.contactName || contactOf(b))}</div></td><td class="wrap">${e(a.content)}</td>
            <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="training">${opts(['유', '무'], a.training, '-')}</select></td>
            <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="procedure">${opts(D.PROCEDURES, a.procedure, '-')}</select></td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty"><strong>${V.monthLabel(f.month)}에 방문 기록이 없습니다</strong>방식을 '방문'으로 골라 기록하면 여기에 나옵니다.</div>`}
      </section>`;
    }
    return kpi + `<section class="panel">
      <div class="panel-pad perf-actions"><h2 class="section-title">${V.monthLabel(f.month)} 연락이력 <span class="sub num">${rows.length}건</span></h2>
        <button class="btn btn-primary" type="button" data-act="ct-copy" ${rows.length ? '' : 'disabled'}>${V.I.copy}연락이력 시트용 복사</button></div>
      <p class="sub perf-help">공유 시트 <b>○월 연락이력</b> 탭에서 새 줄의 <b>날짜</b> 칸을 누르고 Ctrl+V 하세요. (날짜 · 사업체명 · 주소 · 전화번호 · 담당자 · 직종 · 결과 · 연락결과 · 상태 · 상담자)</p>
      ${rows.length ? `<div class="table-wrap"><table class="tbl perf-tbl"><thead><tr><th class="r">번호</th><th>날짜</th><th>사업체명</th><th>주소</th><th>전화번호</th><th>담당자</th><th>직종</th><th>결과</th><th>연락결과</th><th>상태</th><th>상담자</th><th>방식</th><th>구인공고</th></tr></thead><tbody>
        ${rows.map(({ a, b }, i) => `<tr><td class="r num">${i + 1}</td><td class="num">${a.date}</td><td><b class="link" data-act="open" data-kind="biz" data-id="${b.id}">${e(b.name)}</b></td><td class="clip" title="${e(b.address)}">${e(b.address || '')}</td>
          <td class="num">${e(phoneOf(b))}</td><td>${e(a.contactName || contactOf(b))}</td><td class="clip">${e(a.jobType || b.jobs || '')}</td><td class="wrap">${e(a.content)}</td>
          <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="result">${opts(D.CONTACT_RESULTS, a.result, '-')}</select></td>
          <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="status">${opts(D.CONTACT_STATUS, a.status, '-')}</select></td>
          <td>${e(a.staff || '')}</td><td><span class="badge">${e(a.type)}</span></td>
          <td class="nowrap">${jobLink(a.jobUrl) ? `<a class="btn btn-sm btn-job" href="${e(jobLink(a.jobUrl))}" target="_blank" rel="noopener" title="${e(a.jobUrl)}">공고 보기 · ${e(siteName(a.jobUrl))}</a><button class="icon-btn" type="button" style="width:28px;height:28px" aria-label="공고 주소 바꾸기" data-act="ct-url" data-id="${a.id}">${V.I.edit}</button>`
            : `<input class="input sm url-in" data-chg="act-field" data-id="${a.id}" data-field="jobUrl" placeholder="공고 주소 붙여넣기" aria-label="구인공고 주소">`}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty"><strong>${V.monthLabel(f.month)} 연락이력이 없습니다</strong>위 칸에 기록하거나, 공유 시트의 연락이력을 복사해 <b>시트에서 붙여넣어 가져오기</b>로 옮겨 오세요.</div>`}
    </section>`;
  }
  const contactTsv = () => tsv(contactRows(ui.contacts.month).map(({ a, b }) => [a.date, b.name, b.address, phoneOf(b), a.contactName || contactOf(b), a.jobType || b.jobs, a.content, a.result, a.status, a.staff]));
  const reportTsv = () => tsv(contactRows(ui.contacts.month).filter(r => r.a.type === '방문').map(({ a, b }) => [U.dateDot(a.date), b.name, b.address, [phoneOf(b), a.contactName || contactOf(b)].filter(Boolean).join(' / '), a.content, a.training, a.procedure]));

  /** 연락 기록 한 줄 저장 (새 사업체면 등록, 단계도 자연스럽게 올림) */
  function addContact(fd) {
    const key = n => U.orgKey(n);
    const name = fd.name.trim();
    let b = S.get().businesses.find(x => key(x.name) === key(name));
    const me = fd.staff && S.staff().some(x => x.name === fd.staff) ? fd.staff : S.me();
    if (!b) {
      b = S.upsert('biz', { name, phone: fd.phone || '', address: fd.address || '', stage: fd.type === '방문' ? '방문상담' : '접촉', discoveredAt: fd.date, source: '현장 발굴', staff: me, placements: 0, jobs: fd.jobType || '' });
      S.upsert('act', { targetType: 'biz', targetId: b.id, date: fd.date, type: '발굴', content: '연락이력에서 사업체 등록', staff: me });
    } else {
      const patch = {};
      if (!b.phone && fd.phone) patch.phone = fd.phone;
      if (!b.address && fd.address) patch.address = fd.address;
      if (b.stage === '발굴') patch.stage = fd.type === '방문' ? '방문상담' : '접촉';
      else if (b.stage === '접촉' && fd.type === '방문') patch.stage = '방문상담';
      if (Object.keys(patch).length) S.upsert('biz', { id: b.id, ...patch });
    }
    S.upsert('act', { targetType: 'biz', targetId: b.id, date: fd.date, type: fd.type, content: fd.content.trim(), staff: me, contactName: fd.contactName || '', jobType: fd.jobType || '', result: fd.result || '', status: fd.status || '', jobUrl: (fd.jobUrl || '').trim(), perf: '', people: '' });
    return b;
  }
  /** 공고 사이트 이름 (버튼에 표시) */
  const SITES = [[/work24\.go\.kr|worknet/, '고용24'], [/worktogether/, '워크투게더'], [/albamon/, '알바몬'], [/alba\.co\.kr/, '알바천국'], [/saramin/, '사람인'], [/jobkorea/, '잡코리아'], [/incruit/, '인크루트'], [/kead\.or\.kr/, '장애인고용공단'], [/hscity|hwaseong/, '화성시'], [/danggeun|daangn/, '당근'], [/indeed/, '인디드']];
  function siteName(u) {
    const url = jobLink(u);
    if (!url) return '';
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
    const hit = SITES.find(([re]) => re.test(host));
    return hit ? hit[1] : host;
  }
  /** 구인공고 주소를 열 수 있는 링크로: http(s)만, www.로 시작하면 https를 붙인다. 사이트 주소가 아니면 빈 문자열 */
  function jobLink(u) {
    const s = String(u || '').trim();
    if (/^https?:\/\/\S+$/i.test(s)) return s;

    let order;

  /** HWP.readTables 결과 → 명령부 줄. year는 파일 이름에서 찾은 해 */
  function parseOrderTables(tables, year) {
    const out = [];
    tables.forEach(t => {

          dept: kind === '특근' ? lines(o.dept).join(' ') || '직업' : '',
          note: [...(kind === '특근' ? pur.slice(1) : []), ...lines(o.note)].join(' / '), actId: '',
        });

    });
    // 동행 줄은 출장시간·방법을 비워 두는 경우가 많아, 같은 날·같은 곳·같은 용무 줄에서 채운다

        ${rows.length ? `<p class="sub">${months.map(V.monthLabel).join(', ')} · 관내출장 ${rows.filter(r => r.kind === '출장').length}줄, 특근 ${rows.filter(r => r.kind === '특근').length}줄을 읽었습니다.${rows.length - fresh.length ? ` 이미 있는 ${rows.length - fresh.length}줄은 건너뜁니다.` : ''}</p>
          <div class="table-wrap"><table class="tbl bulk-tbl"><thead><tr><th>구분</th><th>날짜</th><th>성명</th><th>출장지</th><th>용무·내용</th><th>시간</th><th>복명</th><th>비고</th></tr></thead><tbody>
          ${rows.map(r => `<tr class="${r.dup ? 'muted' : ''}"><td>${r.kind}${r.dup ? ' <span class="sub">(있음)</span>' : ''}</td><td class="num">${e(r.date)}</td><td><b>${e(r.staff)}</b></td><td>${e(r.place)}</td><td>${e(r.purpose)}</td><td class="nowrap">${e(r.time)}</td><td>${e(r.report.join(', '))}</td><td>${e(r.note)}</td></tr>`).join('')}
          </tbody></table></div>` : state.errors.length ? '' : '<p class="sub">명령부 표(출장일 또는 특근일자 칸)를 찾지 못했습니다.</p>'}
      </div>
      <div class="dr-foot"><button class="btn" type="button" data-act="dr-close">취소</button><button class="btn btn-primary" type="button" data-act="od-hwp-commit" ${fresh.length ? '' : 'disabled'}>${fresh.length}줄 가져오기</button></div>`;
  }
  function commitHwp(rows) {

  }

  /* ================= 개발대장 ================= */
  /** 공유 시트 '구인업체 개발 대장' 열 순서: 등록일, 업체명, 주소, 전화번호, 대표명(담당자), 직종/직무, 근무시간, 복리후생(기타), 비고, 실적 진행도, 상담자 */
  const progressOf = b => b.progress || ((b.jobAnalyses || []).length ? '직무분석지 작성완료' : S.actsOf('biz', b.id).some(a => a.type === '방문') ? '방문완료' : '');
  function ledgerTsv(list) {
    return tsv([...list].sort((a, b) => (a.discoveredAt || '').localeCompare(b.discoveredAt || '')).map(b => {
      const people = S.cardsOf('biz', b.id).map(c => `${c.name}${c.title ? ' ' + c.title : ''}`).join(' ') || b.ceo || '';

})();

  /** 화성시 대시보드를 기준 화면 크기로 그린 뒤 칸 너비에 맞춰 축소 */
  let cityRO = null;
  function fitCity() {

    const apply = () => {
      const mode = V.ui.map.cityFit;
      if (mode === 'full') { frame.style.cssText = ''; wrap.style.height = ''; wrap.classList.add('full'); return; }
      wrap.classList.remove('full');
      const baseW = 1920, baseH = mode === 'wide' ? 823 : 1080;
      const k = wrap.clientWidth / baseW;
      frame.style.cssText = `width:${baseW}px;height:${baseH}px;transform:scale(${k});transform-origin:0 0`;
      wrap.style.height = Math.round(baseH * k) + 'px';

    if (markerGroup) markerGroup.remove();
    markerIndex = {};

    // 이 달 발굴은 맨 위에 그린다
    items.filter(i => M.hasPos(i.x)).sort((a, b) => (a.month ? 1 : 0) - (b.month ? 1 : 0)).forEach(({ kind, x, month }) => {
      const m = (kind === 'biz' ? M.bizMarker(x, month) : kind === 'net' ? M.netMarker(x) : M.cardMarker(x))
        .bindPopup(M.popupHtml(kind, x)).bindTooltip(label(kind, x), { direction: 'top', offset: [0, -6] });
      m.addTo(markerGroup);
      markerIndex[kind + x.id] = m;
    });
    markerGroup.addTo(bigMap);
    drawRoute();
    if (fit) {
      const gu = V.ui.map.gu;
      const gb = M.guBounds(gu || '');
      if (gb) bigMap.fitBounds(gb, { padding: [12, 12] });

  let routeLayer = null;

  async function handleHwpFiles(files) {

  /* ---------- Drawer ---------- */
  let stack = [];
