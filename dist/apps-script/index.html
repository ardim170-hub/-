  }

  /** 주소로 정확한 좌표를 찾아 대략 위치를 바꾼다 (인터넷 필요, 실패하면 그대로 둔다) */
  async function refine(kind, id) {
    if (!window.M || !M.geocode) return;
    const x = find(kind, id);
    if (!x || !x.address) return;
    try {
      const r = await M.geocode(x.address);
      if (!r || r.lat < 36.9 || r.lat > 37.4 || r.lng < 126.5 || r.lng > 127.25) return; // 화성시 밖이면 무시
      const cur = find(kind, id);
      if (cur && (cur.approx || cur.lat == null)) upsert(kind, { id, lat: r.lat, lng: r.lng, approx: false, area: D.areaAt(r.lat, r.lng) || cur.area || '' });
    } catch { /* 오프라인 등 */ }
  }

  /** 여러 건을 한 번에 추가 (파일로 일괄 등록) */
  function upsertMany(kind, objs) {
    const col = COL[kind];
    const recs = objs.map(o => {
      const rec = { ...o, id: o.id || U.uid(PREFIX[kind]) };
      if (kind !== 'act' && kind !== 'ev') { rec.createdAt = rec.createdAt || U.today(); rec.updatedAt = U.today(); }
      if (kind === 'biz' || kind === 'net' || kind === 'card') place(rec);
      state[col].push(rec);
      return rec;
    });
    commit();
    if (REMOTE && recs.length) send('api_apply', recs.map(r => opPut(col, r))).catch(() => {});
    return recs;
  }

  function remove(kind, id) {
    const col = COL[kind];
    const list = state[col];
    const i = list.findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = list.splice(i, 1);
    const removed = { acts: [], evs: [], cards: [] };
    if (kind === 'biz' || kind === 'net') {
      removed.acts = state.activities.filter(a => a.targetType === kind && a.targetId === id);
      removed.evs = state.events.filter(e => e.targetType === kind && e.targetId === id);
      state.activities = state.activities.filter(a => !(a.targetType === kind && a.targetId === id));
      state.events = state.events.filter(e => !(e.targetType === kind && e.targetId === id));
      state.cards.forEach(c => { if (c.linkType === kind && c.linkId === id) { removed.cards.push(c); c.linkType = ''; c.linkId = ''; } });
    }
    commit();
    if (REMOTE) {
      send('api_apply', [opDel(col, id), ...removed.acts.map(a => opDel('activities', a.id)), ...removed.evs.map(e => opDel('events', e.id)), ...removed.cards.map(c => opPut('cards', c))]).catch(() => {});
      if (kind === 'card' && gone.photo) send('api_delPhoto', id).catch(() => {}); // 되돌리기 시 사진은 복구되지 않음
    }
    return () => { // 되돌리기
      list.splice(Math.min(i, list.length), 0, gone);
      state.activities.push(...removed.acts);
      state.events.push(...removed.evs);
      removed.cards.forEach(c => { c.linkType = kind; c.linkId = id; });
      if (kind === 'card' && REMOTE && gone.photo) gone.photo = photoCache.has(id) ? gone.photo : null;
      commit();
      if (REMOTE) {
        send('api_apply', [opPut(col, gone), ...removed.acts.map(a => opPut('activities', a)), ...removed.evs.map(e => opPut('events', e)), ...removed.cards.map(c => opPut('cards', c))]).catch(() => {});
        if (kind === 'card' && photoCache.has(id)) send('api_putPhoto', id, photoCache.get(id)).catch(() => {});
      }
    };
  }

  /* ---------- 중복 찾기 · 합치기 ---------- */
  const orgKey = U.orgKey;
  const digits = s => String(s || '').replace(/\D/g, '');
  /** 같은 곳·같은 사람으로 볼 열쇠들. 열쇠 하나라도 같으면 중복 의심 */
  function dupKeys(kind, x) {
    const k = [];
    if (kind === 'card') {
      if (digits(x.mobile).length >= 10) k.push(['m' + digits(x.mobile), '휴대전화 같음']);
      if (x.email && x.email.includes('@')) k.push(['e' + x.email.trim().toLowerCase(), '이메일 같음']);
      if (U.norm(x.name) && orgKey(x.org)) k.push(['o' + U.norm(x.name) + '|' + orgKey(x.org), '이름·소속 같음']);
    } else {
      if (orgKey(x.name).length >= 2) k.push(['n' + orgKey(x.name), '이름 같음']);
      if (kind === 'biz' && digits(x.bizNo).length === 10) k.push(['b' + digits(x.bizNo), '사업자번호 같음']);
      if (digits(x.phone).length >= 9) k.push(['p' + digits(x.phone), '대표 전화 같음']);
    }
    return k;
  }
  /** kind 전체에서 중복 의심 묶음: id → [{ x, why }] */
  function dupIndex(kind) {
    const list = state[COL[kind]];
    const bucket = new Map();
    list.forEach(x => dupKeys(kind, x).forEach(([key, why]) => { if (!bucket.has(key)) bucket.set(key, []); bucket.get(key).push([x, why]); }));
    const out = new Map();
    bucket.forEach(group => {
      if (group.length < 2) return;
      group.forEach(([x]) => group.forEach(([y, why]) => {
        if (x.id === y.id) return;
        const arr = out.get(x.id) || out.set(x.id, []).get(x.id);
        const hit = arr.find(d => d.x.id === y.id);
        if (hit) { if (!hit.why.includes(why)) hit.why.push(why); } else arr.push({ x: y, why: [why] });
      }));
    });
    return out;
  }
  /** 새로 등록하려는 것과 겹치는 기존 항목 */
  function dupesOf(kind, obj) {
    const keys = new Map(dupKeys(kind, obj));
    const out = [];
    state[COL[kind]].forEach(y => {
      if (y.id === obj.id) return;
      const why = dupKeys(kind, y).filter(([k]) => keys.has(k)).map(([, w]) => w);
      if (why.length) out.push({ x: y, why });
    });
    return out;
  }
  /** dropId를 keepId에 합친다: 빈 칸 채우기, 활동·일정·명함 연결 옮기기, dropId 삭제 */
  function merge(kind, keepId, dropId) {
    const col = COL[kind];
    let keep = find(kind, keepId), drop = find(kind, dropId);
    if (!keep || !drop || keep === drop) return null;
    if (kind === 'card' && !keep.photo && drop.photo) [keep, drop] = [drop, keep]; // 사진 있는 쪽을 남긴다
    const patch = { id: keep.id };
    const empty = v => v == null || v === '' || v === 0 || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
    Object.keys(drop).forEach(k => {
      if (['id', 'createdAt', 'updatedAt', 'photo', 'lat', 'lng', 'approx', 'area'].includes(k)) return;
      const kv = keep[k], dv = drop[k];
      if (empty(dv)) return;
      if (k === 'jobAnalyses') patch[k] = [...(kv || []), ...dv.filter(j => !(kv || []).some(o => o.id === j.id))];
      else if (Array.isArray(dv)) patch[k] = [...new Set([...(kv || []), ...dv])];
      else if (k === 'memo' && kv && !String(kv).includes(dv)) patch[k] = `${kv}\n${dv}`;
      else if (empty(kv)) patch[k] = dv;
    });
    if (kind !== 'card' ? (keep.approx || keep.lat == null) && drop.lat != null && !drop.approx : keep.lat == null && drop.lat != null) Object.assign(patch, { lat: drop.lat, lng: drop.lng, approx: !!drop.approx, area: drop.area || keep.area });
    if (kind === 'biz' && D.STAGE[drop.stage] && D.STAGE[keep.stage] && drop.stage !== '보류' && (keep.stage === '보류' || D.STAGE[drop.stage].i > D.STAGE[keep.stage].i)) patch.stage = drop.stage;
    if (kind === 'biz') patch.placements = Math.max(Number(keep.placements) || 0, Number(drop.placements) || 0);
    const moved = [];
    if (kind !== 'card') {
      state.activities.forEach(a => { if (a.targetType === kind && a.targetId === drop.id) { a.targetId = keep.id; moved.push(['activities', a]); } });
      state.events.forEach(v => { if (v.targetType === kind && v.targetId === drop.id) { v.targetId = keep.id; moved.push(['events', v]); } });
      state.cards.forEach(c => { if (c.linkType === kind && c.linkId === drop.id) { c.linkId = keep.id; moved.push(['cards', c]); } });
    }
    state[col] = state[col].filter(x => x.id !== drop.id);
    upsert(kind, patch); // commit + 저장
    if (REMOTE) {
      send('api_apply', [...moved.map(([c, r]) => opPut(c, r)), opDel(col, drop.id)]).catch(() => {});
      if (kind === 'card' && drop.photo) send('api_delPhoto', drop.id).catch(() => {});
    }
    return keep.id;
  }

  /** 명함 사진: 로컬 모드는 data URL, 공유 모드는 필요할 때 시트에서 불러온다 */
  const photoLoading = new Set();
  function photo(c) {
    if (!c || !c.photo) return null;
    if (typeof c.photo === 'string' && c.photo.startsWith('data:')) return c.photo;
    if (!REMOTE) return null;
    if (photoCache.has(c.id)) return photoCache.get(c.id);
    if (!photoLoading.has(c.id)) {
      photoLoading.add(c.id);
      call('api_getPhoto', c.id).then(d => { photoCache.set(c.id, d || null); notify(); }).catch(() => {}).finally(() => photoLoading.delete(c.id));
    }
    return null;
  }

  /* ---------- 직원 · 소속 · 보기 범위 ---------- */
  const staff = () => state.settings.staff;
  const programOf = name => (staff().find(s => s.name === name) || {}).program || '';
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } };
  let scope = lsGet('ardim.scope') || 'all';
  const getScope = () => scope;
  function setScope(v) { scope = v; lsSet('ardim.scope', v); notify(); }
  function me() { const m = lsGet('ardim.me'); return staff().some(s => s.name === m) ? m : (staff()[0]?.name || ''); }
  function setMe(v) { lsSet('ardim.me', v); notify(); }
  function staffInScope(name) {
    if (scope === 'all') return true;
    if (scope.startsWith('p:')) return programOf(name) === scope.slice(2);
    if (scope.startsWith('s:')) return name === scope.slice(2);
    return true;
  }
  function scopeLabel() {
    if (scope.startsWith('p:')) return scope.slice(2);
    if (scope.startsWith('s:')) return scope.slice(2) + ' 담당';
    return '전체 팀';
  }
  /** 현재 보기 범위(전체 팀/소속/직원)에 해당하는 데이터 */
  function view() {
    if (scope === 'all') return state;
    const biz = state.businesses.filter(b => staffInScope(b.staff));
    const net = state.networks.filter(n => staffInScope(n.staff));
    const ids = new Set([...biz.map(b => 'biz' + b.id), ...net.map(n => 'net' + n.id)]);
    const inT = x => !x.targetType || ids.has(x.targetType + x.targetId);
    return {
      ...state,
      businesses: biz, networks: net,
      cards: state.cards.filter(c => !c.linkType || ids.has(c.linkType + c.linkId)),
      activities: state.activities.filter(a => staffInScope(a.staff) || (a.targetType && ids.has(a.targetType + a.targetId))),
      events: state.events.filter(inT),
      perfs: state.perfs.filter(p => staffInScope(p.staff)),
      trips: state.trips.filter(t => staffInScope(t.staff)),
    };
  }

  /* ---------- 파생 조회 ---------- */
  const actsOf = (kind, id) => state.activities.filter(a => a.targetType === kind && a.targetId === id).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const eventsOf = (kind, id) => state.events.filter(e => e.targetType === kind && e.targetId === id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const cardsOf = (kind, id) => state.cards.filter(c => c.linkType === kind && c.linkId === id);
  const lastAct = (kind, id) => actsOf(kind, id)[0] || null;
  const nextEvent = (kind, id) => eventsOf(kind, id).find(e => !e.done) || null;
  const targetOf = x => (x.targetType && x.targetId ? find(x.targetType, x.targetId) : null);
  const linkOf = c => (c.linkType && c.linkId ? find(c.linkType, c.linkId) : null);

  function stats(v = view()) {
    const ym = U.today().slice(0, 7);
    const b = v.businesses;
    const byStage = Object.fromEntries(D.STAGES.map(s => [s.key, 0]));
    b.forEach(x => { byStage[x.stage] = (byStage[x.stage] || 0) + 1; });
    const placedPeople = b.reduce((s, x) => s + (Number(x.placements) || 0), 0);
    const newThisMonth = b.filter(x => (x.discoveredAt || '').startsWith(ym)).length;
    const active = D.ACTIVE_STAGES.reduce((s, k) => s + (byStage[k] || 0), 0);
    const mandatoryBiz = b.filter(x => D.mandatoryCount(x.employees) > 0).length;
    const netActive = v.networks.filter(n => n.status === '활발').length;
    const cardsThisMonth = v.cards.filter(c => (c.metAt || c.createdAt || '').startsWith(ym)).length;
    return { total: b.length, byStage, placedPeople, newThisMonth, active, mandatoryBiz, netTotal: v.networks.length, netActive, cardTotal: v.cards.length, cardsThisMonth, placedBiz: byStage['채용연계'] || 0 };
  }

  /** 직원별·소속별 실적 (전체 팀 기준) */
  function staffStats() {
    const ym = U.today().slice(0, 7);
    const row = name => {
      const b = state.businesses.filter(x => x.staff === name);
      return {
        biz: b.length,
        active: b.filter(x => D.ACTIVE_STAGES.includes(x.stage)).length,
        placedBiz: b.filter(x => x.stage === '채용연계').length,
        placed: b.reduce((s, x) => s + (Number(x.placements) || 0), 0),
        net: state.networks.filter(x => x.staff === name).length,
        actsMonth: state.activities.filter(a => a.staff === name && a.date.startsWith(ym)).length,
      };
    };
    const people = staff().map(s => ({ ...s, ...row(s.name) }));
    const sum = list => list.reduce((t, r) => { for (const k of ['biz', 'active', 'placedBiz', 'placed', 'net', 'actsMonth']) t[k] = (t[k] || 0) + r[k]; return t; }, {});
    const groups = [...D.PROGRAMS.map(p => p.key), ''].map(key => ({ key, people: people.filter(p => (p.program || '') === key) })).filter(g => g.people.length).map(g => ({ ...g, total: sum(g.people) }));
    const known = new Set(staff().map(s => s.name));
    const orphan = state.businesses.filter(b => !known.has(b.staff)).length;
    return { groups, total: sum(people), orphan };
  }

  /* ---------- 실적 ---------- */
  /** 직원의 실적 분류표 이름 (현장중심직업재활센터 / 고용지원사업) */
  const perfSetOf = staffName => state.settings.perfByProgram[programOf(staffName)] || '';
  /** 활동 기록의 실적 분류: {set, big, mid, item} 또는 null */
  function perfOf(a) {
    const set = perfSetOf(a.staff);
    const def = D.PERF_SETS[set];
    if (!def) return null;
    let item = a.perf;
    if (item === '제외') return null;
    if (!item || !def.items.includes(item)) item = D.suggestPerf(set, a, targetOf(a));
    return item ? { set, big: def.big, mid: def.mid, item } : null;
  }
  /** 기간(YYYY-MM) 안의 실적 기록 */
  function perfRows(month, v = view()) {
    return v.activities.filter(a => a.date.startsWith(month)).map(a => ({ a, p: perfOf(a), t: targetOf(a) })).filter(r => r.p)
      .sort((x, y) => x.a.date.localeCompare(y.a.date) || x.p.item.localeCompare(y.p.item));
  }

  /** 실적 표 (구글 시트 '실적(기타)' 열 순서). 직접 입력한 실적 + 활동 기록 자동 집계(날짜·세부사업별 한 줄) */
  function perfTable(month, set, withActs = true, v = view()) {
    const def = D.PERF_SETS[set];
    if (!def) return [];
    const rows = v.perfs.filter(p => p.set === set && (p.date || '').startsWith(month)).map(p => ({
      kind: 'manual', id: p.id, date: p.date, big: def.big, mid: def.mid, item: p.item,
      people: p.people || '', newPeople: p.newPeople || '', round: p.round || '', note: p.note || '', src: `직접 입력 · ${p.staff || ''}`,
    }));
    if (withActs) {
      const groups = new Map();
      perfRows(month, v).filter(r => r.p.set === set).forEach(({ a, p, t }) => {
        const k = a.date + '|' + p.item;
        const g = groups.get(k) || { kind: 'auto', date: a.date, big: def.big, mid: def.mid, item: p.item, people: 0, targets: new Map(), n: 0 };
        g.n++; g.people += Number(a.people) || 0;
        if (t) g.targets.set(t.id, t.name);
        groups.set(k, g);
      });
      groups.forEach(g => rows.push({ ...g, people: g.people || '', newPeople: '', round: '', note: g.targets.size || g.n, src: `활동 ${g.n}건: ${[...g.targets.values()].join(', ')}` }));
    }
    return rows.sort((x, y) => x.date.localeCompare(y.date) || def.items.indexOf(x.item) - def.items.indexOf(y.item));
  }

  /** 최근 12개월: 신규 발굴 수, 채용연계 활동 수 */
  function monthly(v = view()) {
    const T = U.parse(U.today());
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(T.getFullYear(), T.getMonth() - i, 1);
      months.push({ key: `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}월`, discovered: 0, placed: 0 });
    }
    const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
    v.businesses.forEach(b => { const i = idx[(b.discoveredAt || '').slice(0, 7)]; if (i != null) months[i].discovered++; });
    v.activities.forEach(a => { if (a.type === '채용연계') { const i = idx[a.date.slice(0, 7)]; if (i != null) months[i].placed++; } });
    return months;
  }

  /** 오늘 확인할 일: 지난 미완료 일정, 7일 내 일정, 연락 공백이 긴 진행 중 사업체 */
  function priorities(v = view()) {
    const T = U.today();
    const out = [];
    v.events.filter(e => !e.done && U.diffDays(T, e.date) <= 7).forEach(e => {
      const t = targetOf(e);
      out.push({ kind: 'ev', id: e.id, date: e.date, name: t ? t.name : e.title, why: t ? `${e.type}${e.time ? ' · ' + e.time : ''}` : e.type, staff: t?.staff || '', target: t ? { kind: e.targetType, id: t.id } : null, sort: U.diffDays(T, e.date) });
    });
    v.businesses.filter(b => D.ACTIVE_STAGES.includes(b.stage) && !nextEvent('biz', b.id)).forEach(b => {
      const la = lastAct('biz', b.id);
      const gap = la ? U.diffDays(la.date, T) : 999;
      if (gap >= 21) out.push({ kind: 'gap', id: b.id, date: la?.date, name: b.name, why: `${b.stage} 단계 · 마지막 연락 ${gap}일 전`, staff: b.staff, gap, target: { kind: 'biz', id: b.id }, sort: 8 + (60 - Math.min(gap, 60)) / 100 });
    });
    return out.sort((a, b) => a.sort - b.sort);
  }

  function recentActs(n = 8, v = view()) {
    return [...v.activities].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, n);
  }

  /* ---------- 검색 (보기 범위와 관계없이 팀 전체) ---------- */
  function search(q) {
    const nq = U.norm(q);
    if (!nq) return { biz: [], net: [], card: [] };
    const hit = (...vals) => U.match(q, ...vals);
    const biz = state.businesses.filter(b => hit(b.name, b.industry, b.ceo, b.address, b.area, b.bizNo, b.jobs, b.memo, b.staff, b.phone) || cardsOf('biz', b.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const net = state.networks.filter(n => hit(n.name, n.category, n.address, n.area, n.relation, n.memo, n.staff) || cardsOf('net', n.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const card = state.cards.filter(c => hit(c.name, c.org, c.title, c.dept, c.phone, c.mobile, c.email, (c.tags || []).join(' '), c.memo));
    return { biz: biz.slice(0, 8), net: net.slice(0, 6), card: card.slice(0, 8) };
  }

  /* ---------- 엑셀 ---------- */
  function exportXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) {
      const [sheet, cols] = SHEETS[col];
      const ws = XLSX.utils.json_to_sheet(state[col].map(x => toRow(col, x)), { header: cols.map(c => c[1]) });
      ws['!cols'] = cols.map(([k]) => ({ wch: ['name', 'address', 'memo', 'content', 'relation', 'jobs', 'accessibility', 'title', 'org'].includes(k) ? 28 : 13 }));
      XLSX.utils.book_append_sheet(wb, ws, sheet);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.settings.staff.map(s => ({ '이름': s.name, '소속 사업': s.program })), { header: ['이름', '소속 사업'] }), STAFF_SHEET[0]);
    XLSX.writeFile(wb, `아르딤_취업지원_${U.today()}.xlsx`);
  }

  function parseXlsx(buf) {
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const next = D.empty();
    next.settings = { ...state.settings };
    const found = [];
    for (const col of COLS) {
      const ws = wb.Sheets[SHEETS[col][0]];
      if (!ws) continue;
      found.push(SHEETS[col][0]);
      next[col] = XLSX.utils.sheet_to_json(ws, { defval: '' }).map(r => fromRow(col, r)).filter(o => keepRow(col, o));
    }
    const sw = wb.Sheets[STAFF_SHEET[0]];
    if (sw) {
      const list = XLSX.utils.sheet_to_json(sw, { defval: '' }).map(r => ({ name: String(r['이름'] || '').trim(), program: String(r['소속 사업'] || '').trim() })).filter(s => s.name);
      if (list.length) { next.settings.staff = list; found.push(STAFF_SHEET[0]); }
    }
    // 사진은 엑셀에 없으므로 같은 ID의 기존 사진을 유지
    const old = Object.fromEntries(state.cards.filter(c => c.photo).map(c => [c.id, c.photo]));
    next.cards.forEach(c => { c.photo = old[c.id] || null; });
    return { next: normalize(next), found };
  }

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function exportJson() {
    const copy = { ...state, cards: state.cards.map(c => ({ ...c, photo: photo(c) || (REMOTE ? null : c.photo) })) };
    download(`아르딤_취업지원_백업_${U.today()}.json`, new Blob([JSON.stringify(copy)], { type: 'application/json' }));
  }
  function templateXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([SHEETS[col][1].map(c => c[1])]), SHEETS[col][0]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['이름', '소속 사업']]), STAFF_SHEET[0]);
    XLSX.writeFile(wb, '아르딤_취업지원_엑셀양식.xlsx');
  }

  /** 지원고용·현장훈련 진행 여부: 직접 체크한 것 + 활동 기록(현장훈련 유, 내용)·출장 명령부에서 찾은 것 */
  function supportOf(b) {
    const set = new Set((b.support || []).filter(t => D.SUPPORT_TYPES.includes(t)));
    const found = new Set();
    const scan = txt => { if (/현장\s*훈련/.test(txt || '')) found.add('현장훈련'); if (/지원\s*고용/.test(txt || '')) found.add('지원고용'); };
    actsOf('biz', b.id).forEach(a => { if (a.training === '유') found.add('현장훈련'); scan(a.content); });
    const key = U.orgKey(b.name).replace(/점$/, '');
    if (key.length >= 2) state.trips.forEach(t => { const p = U.orgKey(t.place || '').replace(/점$/, ''); if (p && (p.includes(key) || key.includes(p)) && p.length >= 2) scan(t.purpose); });
    found.forEach(t => set.add(t));
    return { types: D.SUPPORT_TYPES.filter(t => set.has(t)), auto: [...found].some(t => !(b.support || []).includes(t)) };
  }
  /** 사업체 종류 색: 취업 연계(채용연계 단계이거나 채용 인원이 있음) > 지원고용·현장훈련 진행 > 사업체 개발 */
  const bizTone = b => (!b ? 'biz' : b.stage === '채용연계' || Number(b.placements) > 0 ? 'placed' : supportOf(b).types.length ? 'support' : 'biz');
  /** 지도에 별로 표시할 우리 복지관 (네트워크에 '아르딤'이 들어간 기관) */
  const isHome = n => /아르딤/.test(n.name || '');

  return {
    REMOTE, isAdmin, accessInfo, supportOf, bizTone, isHome, dupIndex, dupesOf, merge, init, get, commit, subscribe, replace, saveSettings, find, upsert, upsertMany, remove, photo, refine,
    get aiServer() { return aiServer; }, call: (fn, ...a) => call(fn, ...a),
    staff, programOf, perfSetOf, perfOf, perfRows, perfTable, getScope, setScope, scopeLabel, me, setMe, view,
    actsOf, eventsOf, cardsOf, lastAct, nextEvent, targetOf, linkOf, stats, staffStats, monthly, priorities, recentActs, search,
    exportXlsx, parseXlsx, exportJson, templateXlsx, refresh, SHEETS,
    sync, onSync: fn => { syncListeners.add(fn); return () => syncListeners.delete(fn); },
  };
})();

<script>
/* 지도: Leaflet + 배경 지도(여러 종류 중 선택) + 화성시 행정동 경계
   배경 지도는 인터넷에서 받아오고, 행정동·구 경계와 이름은 앱 안에 들어 있어 인터넷이 막혀도 보인다. */
window.M = (() => {
  const BOUNDARY_ATTR = '행정동 경계: 통계청 SGIS, <a href="https:\/\/github.com/vuski/admdongkor" target="_blank" rel="noopener">admdongkor</a> (CC BY 4.0)';
  /** 배경 지도 종류. 키 없이 쓸 수 있는 것을 먼저 둔다 */
  const BASES = [
    { key: 'esri', label: '일반 지도', url: 'https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: 'Tiles &copy; Esri', maxNativeZoom: 18 },
    { key: 'sat', label: '위성 사진', url: 'https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: 'Imagery &copy; Esri', maxNativeZoom: 18 },
    { key: 'osm', label: 'OpenStreetMap', url: 'https:\/\/tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '&copy; <a href="https:\/\/www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', maxNativeZoom: 19 },
    { key: 'vworld', label: '브이월드', needsKey: true, url: key => `https:\/\/api.vworld.kr/req/wmts/1.0.0/${key}/Base/{z}/{y}/{x}.png`, attr: '&copy; 국토교통부 브이월드', maxNativeZoom: 19 },
    { key: 'none', label: '배경 없음 (경계만)' },
  ];
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 */ } };
  const vworldKey = () => (window.S && S.get() && S.get().settings.vworldKey) || '';
  const available = () => BASES.filter(b => !b.needsKey || vworldKey());
  const baseKey = () => { const k = lsGet('ardim.basemap'); return available().some(b => b.key === k) ? k : 'esri'; };

  const maps = new Map();
  let tilesOk = null; // null: 모름, true: 배경 지도 받아옴, false: 못 받아옴
  const pin = () => L.divIcon({ className: '', html: '<div class="pick-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 26] });
  const toLatLng = rings => rings.map(r => r.map(([x, y]) => [y, x]));

  /** 행정동·구 경계와 이름 */
  function boundaryLayer(map) {
    const H = window.HWASEONG || { areas: [], gus: [] };
    const areaPolys = H.areas.map(b => {
      const color = (D.GU[b.gu] || {}).color || '#667085';
      return L.polygon(toLatLng(b.p), { color, weight: .8, opacity: .55, fillColor: color, fillOpacity: .1, interactive: false });
    });
    const guLines = (H.gus || []).map(g => L.polygon(toLatLng(g.p), { color: (D.GU[g.name] || {}).color || '#344054', weight: 2.6, opacity: .95, fill: false, interactive: false }));
    const label = (c, html, cls) => L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: cls, html, iconSize: null }) });
    const areaLabels = H.areas.map(b => label(b.c, `<span>${b.name}</span>`, 'area-label'));
    const guLabels = (H.gus || []).map(g => label(g.c, `<span style="--c:${(D.GU[g.name] || {}).color}">${g.name}</span>`, 'gu-label'));
    L.layerGroup([...areaPolys, ...guLines, ...guLabels, ...areaLabels]).addTo(map);
    const style = () => {
      const bare = tilesOk === false || map._arBase === 'none';
      areaPolys.forEach(p => p.setStyle({ fillOpacity: bare ? .22 : .1 }));
      const c = map.getContainer();
      c.classList.toggle('offline', bare);
      c.classList.toggle('z-high', map.getZoom() >= 12);
    };
    map.on('zoomend', style);
    style();
    return { style };
  }

  function create(el, opts = {}) {
    if (!window.L) { el.innerHTML = '<div class="empty"><strong>지도를 불러오지 못했습니다</strong>페이지를 새로고침해 보세요.</div>'; return null; }
    const old = maps.get(el);
    if (old) old.remove();
    const map = L.map(el, { zoomControl: opts.zoomControl !== false, scrollWheelZoom: opts.scroll !== false, attributionControl: true })
      .setView(opts.center || D.CITY_CENTER, opts.zoom || 11);
    map.attributionControl.addAttribution(BOUNDARY_ATTR);
    const note = L.control({ position: 'bottomleft' });
    note.onAdd = () => { const d = L.DomUtil.create('div', 'map-note'); d.textContent = '배경 지도를 불러오지 못해 행정구역 경계만 표시합니다. 오른쪽 위 버튼에서 다른 배경 지도를 골라 보세요.'; return d; };
    map._arNote = note;
    const setOk = ok => {
      if (tilesOk === ok) return;
      tilesOk = ok;
      maps.forEach(m => { m._arBoundary && m._arBoundary.style(); if (m._arNote) { if (ok) m._arNote.remove(); else if (m._arBase !== 'none') m._arNote.addTo(m); } });
    };
    // 배경 지도 선택
    const layers = {};
    available().forEach(b => {
      if (b.key === 'none') { layers[b.label] = L.layerGroup(); layers[b.label]._arKey = 'none'; return; }
      const t = L.tileLayer(typeof b.url === 'function' ? b.url(vworldKey()) : b.url, { attribution: b.attr, maxZoom: 19, maxNativeZoom: b.maxNativeZoom });
      let loaded = 0, failed = 0;
      t.on('tileload', () => { loaded++; setOk(true); });
      t.on('tileerror', () => { failed++; if (!loaded && failed >= 3 && map._arBase === b.key) setOk(false); });
      t._arKey = b.key;
      layers[b.label] = t;
    });
    const cur = baseKey();
    const first = Object.values(layers).find(l => l._arKey === cur);
    map._arBase = cur;
    first.addTo(map);
    L.control.layers(layers, null, { position: 'topright', collapsed: !opts.showLayers }).addTo(map);
    map.on('baselayerchange', e => {
      map._arBase = e.layer._arKey;
      lsSet('ardim.basemap', map._arBase);
      tilesOk = null;
      if (map._arBase === 'none') note.remove();
      bl.style();
    });
    const bl = boundaryLayer(map);
    map._arBoundary = bl;
    setTimeout(() => { if (tilesOk === null && map._arBase !== 'none') setOk(false); }, 7000);
    if (tilesOk === false && cur !== 'none') note.addTo(map);
    maps.set(el, map);
    setTimeout(() => map.invalidateSize(), 60);
    return map;
  }

  /** 구(또는 화성시 전체) 경계에 맞춰 보기 */
  function guBounds(gu) {
    const pts = D.BOUNDS.filter(b => !gu || b.gu === gu).flatMap(b => b.p.flat().map(([x, y]) => [y, x]));
    return pts.length ? L.latLngBounds(pts) : null;
  }

  /** 사업체: 노랑(개발) / 빨강(지원고용·현장훈련 진행). hot = 이번 달 발굴이면 크게, 진한 테두리 */
  const bizColor = b => D.MAP_COLORS[S.bizTone(b)];
  function bizMarker(b, hot) {
    const size = hot ? 22 : 17;
    const dim = b.stage === '보류' ? 'opacity:.6;' : '';
    return L.marker([b.lat, b.lng], {
      riseOnHover: true, zIndexOffset: hot ? 300 : 100,
      icon: L.divIcon({ className: '', html: `<div class="bz-pin ${hot ? 'hot' : ''} ${S.bizTone(b) === 'placed' ? 'placed' : ''}" style="--c:${bizColor(b)};${dim}"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] }),
    });
  }
  function cardMarker(c) {
    return L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: '<div class="card-pin"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) });
  }
  /** 기관: 검정 마름모. 우리 복지관은 금색 별 + 이름표 */
  const STAR = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M12 1.8l3.1 6.5 7.1.9-5.2 4.9 1.3 7.1L12 17.8l-6.3 3.4 1.3-7.1L1.8 9.2l7.1-.9z" fill="var(--c)" stroke="#3B2A00" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  function netMarker(n) {
    if (S.isHome(n)) {
      return L.marker([n.lat, n.lng], {
        zIndexOffset: 1000, riseOnHover: true,
        icon: L.divIcon({ className: '', html: `<div class="home-pin" style="--c:${D.MAP_COLORS.home}">${STAR}<span>${U.esc(n.name)}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16] }),
      });
    }
    return L.marker([n.lat, n.lng], { riseOnHover: true, icon: L.divIcon({ className: '', html: `<div class="net-pin" style="--c:${D.MAP_COLORS.net};${n.status === '휴면' ? 'opacity:.55' : ''}"></div>`, iconSize: [15, 15], iconAnchor: [7.5, 7.5] }) });
  }
  const hasPos = x => x && x.lat != null && x.lng != null && !isNaN(x.lat) && !isNaN(x.lng) && x.lat !== '' && x.lng !== '';

  function popupHtml(kind, x) {
    if (kind === 'card') {
      return `<div class="pop-name">${U.esc(x.org || x.name)}</div><div class="pop-meta">분류 대기 명함 · ${U.esc(x.name)} ${U.esc(x.title || '')}<br>${U.esc(x.address || '')}</div>
        <div class="inline">${V.triageButtons(x)}</div>`;
    }
    const sup = kind === 'biz' ? S.supportOf(x).types : [];
    const meta = kind === 'biz'
      ? `${sup.length ? `<b style="color:${D.MAP_COLORS.support}">${sup.join('·')} 진행</b> · ` : ''}${U.esc(x.stage)} · ${U.esc(x.industry || '')} · ${U.esc(x.area || '')}`
      : `${U.esc(x.category)} · 관계 ${U.esc(x.status)} · ${U.esc(x.area || '')}`;
    // 연결된 명함: 이름을 누르면 명함 상세, 전화 아이콘은 바로 걸기
    const cards = S.cardsOf(kind, x.id);
    const telOf = c => String(c.mobile || c.phone || '').replace(/[^0-9+]/g, '');
    const tone = kind === 'biz' ? S.bizTone(x) : S.isHome(x) ? 'home' : 'net';
    const cardList = cards.length
      ? `<ul class="pop-cards">${cards.slice(0, 4).map(c => `<li><button type="button" class="linklike" data-act="open" data-kind="card" data-id="${c.id}">${U.esc(c.name)}</button> <span class="pop-meta">${U.esc([c.dept, c.title].filter(Boolean).join(' · '))}</span>${telOf(c) ? ` <a class="pop-tel" href="tel:${telOf(c)}">${U.esc(c.mobile || c.phone)}</a>` : ''}</li>`).join('')}${cards.length > 4 ? `<li class="pop-meta">외 ${cards.length - 4}장</li>` : ''}</ul>`
      : '<div class="pop-meta pop-nocard">연결된 명함 없음</div>';
    return `<div class="pop tone-${tone}"><div class="pop-kind">${{ biz: '사업체 개발', placed: '취업 연계', support: '지원고용·현장훈련', net: '기관', home: '우리 복지관' }[tone]}</div>
      <div class="pop-name">${U.esc(x.name)}</div><div class="pop-meta">${meta}${x.approx ? '<br>읍면동 중심의 대략적 위치' : ''}</div>
      ${cardList}
      <div class="inline pop-actions"><button class="btn btn-sm btn-primary" type="button" data-act="open" data-kind="${kind}" data-id="${x.id}">상세 보기</button><button class="btn btn-sm" type="button" data-act="cards-of" data-kind="${kind}" data-id="${x.id}">명함 관리에서 보기${cards.length ? ` (${cards.length})` : ''}</button></div>
      <div class="inline pop-actions"><button class="btn btn-sm btn-route" type="button" data-act="route-to" data-kind="${kind}" data-id="${x.id}">여기까지 길찾기</button><button class="btn btn-ghost btn-sm" type="button" data-act="route-from" data-kind="${kind}" data-id="${x.id}">여기서 출발</button></div></div>`;
  }

  /** 위치 지정용 지도: 클릭하면 핀 이동 */
  function picker(el, pos, onPick) {
    const has = pos && hasPos(pos);
    const map = create(el, { center: has ? [pos.lat, pos.lng] : D.CITY_CENTER, zoom: has ? 15 : 11 });
    if (!map) return null;
    let marker = has ? L.marker([pos.lat, pos.lng], { draggable: true, icon: pin() }).addTo(map) : null;
    const set = (lat, lng, zoom) => {
      lat = +lat.toFixed(6); lng = +lng.toFixed(6);
      if (!marker) { marker = L.marker([lat, lng], { draggable: true, icon: pin() }).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); }); }
      else marker.setLatLng([lat, lng]);
      if (zoom) map.setView([lat, lng], zoom);
      onPick(lat, lng);
    };
    if (marker) marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); });
    map.on('click', e => set(e.latlng.lat, e.latlng.lng));
    return { map, set };
  }

  /** 주소 → 좌표 (OpenStreetMap Nominatim, 인터넷 필요. 한국 도로명 주소는 못 찾을 수 있음) */
  async function geocode(address) {
    const q = String(address || '').trim();
    if (!q) return null;
    const tries = [q, q.replace(/\s*\d+(-\d+)?\s*$/, ''), q.includes('화성') ? null : '화성시 ' + q].filter(Boolean);
    for (const t of tries) {
      const url = `https:\/\/nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(t)}`;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('geocode ' + res.status);
      const j = await res.json();
      if (j[0]) return { lat: +(+j[0].lat).toFixed(6), lng: +(+j[0].lon).toFixed(6), label: j[0].display_name };
    }
    return null;
  }

  /* ---------- 길찾기 ----------
   * 두 곳 사이 직선거리로 대략 시간을 어림하고, 정확한 경로는 네이버·카카오 길찾기로 넘긴다 */
  function distKm(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }
  /** 도로는 직선보다 1.35배 길고, 차 평균 35km/h · 버스 평균 15km/h(+기다림 10분) · 걸음 4.5km/h로 어림 */
  function estimate(km) {
    const road = km * 1.35;
    return { road, car: Math.max(3, Math.round(road / 35 * 60)), transit: Math.round(road / 15 * 60 + 10), walk: Math.round(road / 4.5 * 60) };
  }
  // 네이버 지도 길찾기 주소는 웹 메르카토르(EPSG:3857) 좌표를 쓴다
  const merc = (lat, lng) => [lng * 20037508.34 / 180, Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180].map(v => v.toFixed(2));
  const naverRoute = (a, b, mode) => `https:\/\/map.naver.com/p/directions/${merc(a.lat, a.lng).join(',')},${encodeURIComponent(a.name)},,/${merc(b.lat, b.lng).join(',')},${encodeURIComponent(b.name)},,/-/${mode}`;
  const kakaoRoute = (a, b) => `https:\/\/map.kakao.com/link/from/${encodeURIComponent(a.name)},${a.lat},${a.lng}/to/${encodeURIComponent(b.name)},${b.lat},${b.lng}`;

  const kakaoLink = x => `https:\/\/map.kakao.com/link/map/${encodeURIComponent(x.name)},${x.lat},${x.lng}`;
  const naverSearch = x => `https:\/\/map.naver.com/p/search/${encodeURIComponent(x.address || x.name)}`;

  return { BASES, create, guBounds, distKm, estimate, naverRoute, kakaoRoute, bizColor, bizMarker, netMarker, cardMarker, hasPos, popupHtml, picker, geocode, kakaoLink, naverSearch };
})();

</script>
<script>
/* AI 도우미 (Claude API)
   - 공유 모드: 구글 Apps Script 서버가 대신 호출한다 (API 키는 스크립트 속성에 보관, 브라우저에 노출되지 않음)
   - 파일 모드: 이 PC 브라우저에 저장한 API 키로 직접 호출한다
   API 키가 없으면 모든 AI 기능은 숨고, 직접 입력으로 대신한다. */
window.AI = (() => {
  const MODEL = 'claude-opus-5-5';
  const KEY_LS = 'ardim.anthropicKey';
  const localKey = () => { try { return localStorage.getItem(KEY_LS) || ''; } catch { return ''; } };
  const available = () => (S.REMOTE ? S.aiServer : !!localKey());

  async function setKey(key) {
    if (S.REMOTE) { await S.call('api_setAiKey', key); return; }
    try { if (key) localStorage.setItem(KEY_LS, key); else localStorage.removeItem(KEY_LS); } catch { /* 저장 불가 */ }
  }

  /** Messages API 한 번 호출. 공유 모드는 서버 프록시, 파일 모드는 직접 */
  async function post(body) {
    if (S.REMOTE) {
      const r = await S.call('api_claude', body);
      if (r && r.error) throw new Error(r.error.message || JSON.stringify(r.error));
      return r;
    }
    const res = await fetch('https:\/\/api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': localKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((j.error && j.error.message) || `HTTP ${res.status}`);
    return j;
  }

  /** 서버 도구(웹 검색)가 pause_turn으로 멈추면 이어서 요청한다 */
  async function run(body) {
    body = { model: MODEL, fallbacks: 'default', ...body };
    let msg;
    for (let i = 0; i < 4; i++) {
      msg = await post(body);
      if (msg.stop_reason !== 'pause_turn') break;
      body = { ...body, messages: [...body.messages, { role: 'assistant', content: msg.content }] };
    }
    if (msg.stop_reason === 'refusal') throw new Error('AI가 이 요청을 처리하지 않았습니다.');
    return msg;
  }
  const textOf = msg => (msg.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  const imageBlock = dataUrl => {
    const [, type, data] = dataUrl.match(/^data:([^;]+);base64,(.*)$/) || [];
    if (!data) throw new Error('이미지 형식을 읽지 못했습니다.');
    return type === 'application/pdf'
      ? { type: 'document', source: { type: 'base64', media_type: type, data } }
      : { type: 'image', source: { type: 'base64', media_type: type, data } };
  };
  const obj = props => ({ type: 'object', additionalProperties: false, required: Object.keys(props), properties: props });
  const str = description => ({ type: 'string', description });

  /* ---------- 명함 사진 → 연락처 ---------- */
  const CARD_SCHEMA = obj({
    name: str('사람 이름'), title: str('직함/직위'), dept: str('부서'), org: str('회사·기관 이름'),
    mobile: str('휴대전화 010-0000-0000 형식'), phone: str('사무실 전화 (대표번호 포함)'), fax: str('팩스'),
    email: str('이메일'), address: str('주소 전체'), homepage: str('홈페이지 주소'),
  });
  async function readCard(dataUrl) {
    const msg = await run({
      max_tokens: 4000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: CARD_SCHEMA } },
      messages: [{ role: 'user', content: [imageBlock(dataUrl), { type: 'text', text: '이 명함 사진에서 연락처 정보를 읽어 주세요. 사진에 없는 항목은 빈 문자열로 두고, 짐작해서 채우지 마세요. 전화번호는 하이픈을 넣어 주세요.' }] }],
    });
    return JSON.parse(textOf(msg));
  }

  /* ---------- 사업자등록증·구인공고 등 사진/PDF → 사업체 정보 ---------- */
  const BIZ_SCHEMA = obj({
    name: str('상호(사업체명)'), ceo: str('대표자'), bizNo: str('사업자등록번호 000-00-00000'), address: str('사업장 소재지'),
    industry: str('업태/종목을 짧게'), phone: str('대표 전화'), employees: str('근로자 수(숫자만, 모르면 빈 문자열)'),
    jobs: str('모집 직무가 있으면 쉼표로'), workConditions: str('근무 조건이 있으면 한 줄로'), memo: str('그 밖에 참고할 내용 한두 줄'),
  });
  async function readBizDoc(dataUrl) {
    const msg = await run({
      max_tokens: 4000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: BIZ_SCHEMA } },
      messages: [{ role: 'user', content: [imageBlock(dataUrl), { type: 'text', text: '이 문서(사업자등록증, 구인공고, 회사 소개서 등)에서 사업체 정보를 읽어 주세요. 문서에 없는 항목은 빈 문자열로 두고 짐작하지 마세요.' }] }],
    });
    return JSON.parse(textOf(msg));
  }

  /* ---------- 인터넷 기초 조사 ---------- */
  async function research(b) {
    const msg = await run({
      max_tokens: 8000,
      output_config: { effort: 'low' },
      tools: [{ type: 'web_search_20260209', name: 'web_search', max_uses: 5, user_location: { type: 'approximate', country: 'KR', city: 'Hwaseong' } }],
      system: '당신은 장애인 취업지원 기관(화성시아르딤복지관 직업지원팀)의 사업체 개발 담당자를 돕습니다. 장애인 채용 가능성을 판단하는 데 필요한 공개 정보를 찾아 한국어로 짧게 정리합니다. 확인되지 않은 내용은 쓰지 말고 "확인 안 됨"이라고 적습니다.',
      messages: [{ role: 'user', content: `다음 사업체를 인터넷에서 조사해 아래 형식 그대로 정리해 주세요.

사업체: ${b.name}
주소: ${b.address || '모름'}
업종: ${b.industry || '모름'}

형식:
- 회사 개요: (무엇을 하는 회사인지 1~2줄)
- 규모: (직원 수, 매출 등 확인된 것)
- 홈페이지: (주소)
- 주요 제품·서비스:
- 최근 채용 공고: (직무, 조건, 게시처)
- 장애인 고용 관련: (장애인 고용 사례, 인증, 기사 등)
- 참고할 점: (방문·연락 전에 알아둘 것)
- 출처: (참고한 웹페이지 주소 목록)` }],
    });
    return textOf(msg);
  }

  /* ---------- 요약 ---------- */
  async function summarize(b) {
    const acts = S.actsOf('biz', b.id).slice(0, 15).map(a => `${a.date} ${a.type}: ${a.content}`).join('\n');
    const msg = await run({
      max_tokens: 2000,
      output_config: { effort: 'low' },
      messages: [{ role: 'user', content: `아래 사업체 기록을 직업지원팀 동료가 10초 안에 파악하도록 한국어 3줄로 요약해 주세요. 각 줄은 "• "로 시작하고, 1줄: 어떤 곳인지, 2줄: 지금까지 진행 상황, 3줄: 다음에 할 일. 기록에 없는 내용은 만들지 마세요.

사업체: ${b.name} (${b.industry || '업종 미입력'}, ${b.area || ''}, 상시근로자 ${b.employees || '미입력'}명)
진행 단계: ${b.stage}
가능 직무: ${b.jobs || '-'} / 근무 조건: ${b.workConditions || '-'} / 고려사항: ${b.accessibility || '-'}
메모: ${b.memo || '-'}
기초 조사: ${b.research || '-'}
활동 기록:
${acts || '-'}` }],
    });
    return textOf(msg);
  }

  return { MODEL, available, setKey, localKey, readCard, readBizDoc, research, summarize };
})();

</script>

    </section>`;

  function chart(months) {
    const W = 640, H = 210, L = 30, R = 8, T = 16, B = 26;
    const max = Math.max(1, ...months.map(m => Math.max(m.discovered, m.placed)));
    const top = Math.max(2, Math.ceil(max / 2) * 2);
    const y = v => T + (H - T - B) * (1 - v / top);
    const gw = (W - L - R) / months.length;
    const bw = Math.min(14, gw / 3.2);
    const ticks = [0, top / 2, top];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12개월 신규 발굴 사업체 수와 채용연계 건수">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
      ${months.map((m, i) => {
        const cx = L + gw * i + gw / 2;
        const bar = (v, x, c, label) => v ? `<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="2" fill="${c}"><title>${m.label} ${label} ${v}</title></rect><text x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v}</text>` : '';
        return `${bar(m.discovered, cx - bw - 1, 'var(--accent)', '신규 발굴')}${bar(m.placed, cx + 1, 'var(--success)', '채용연계')}
          <text x="${cx}" y="${H - 8}" text-anchor="middle" ${i === months.length - 1 ? 'style="fill:var(--text);font-weight:700"' : ''}>${m.label}</text>`;
      }).join('')}
    </svg>`;
  }

  function bizFiltered() {
    const f = ui.biz;
    const nq = U.norm(f.q);
    const dup = S.dupIndex('biz');
    let list = S.view().businesses.filter(b => {
      if (f.dup && !dup.has(b.id)) return false;
      if (f.stage !== '전체' && b.stage !== f.stage) return false;
      if (!inArea(b, f.area)) return false;
      if (f.industry && b.industry !== f.industry) return false;
      if (f.mandatory && !D.mandatoryCount(b.employees)) return false;
      if (!inPeriod(b.discoveredAt, f.period, f.month)) return false;
      if (nq && !U.match(f.q, b.name, b.industry, b.jobs, b.address, b.ceo, b.memo, b.staff, b.phone, b.research, ...S.cardsOf('biz', b.id).flatMap(c => [c.name, c.mobile, c.phone]))) return false;
      return true;
    }).map(b => ({ b, la: S.lastAct('biz', b.id), ne: S.nextEvent('biz', b.id), pc: primaryContact('biz', b.id) }));
    const sorters = {
      recent: (x, y) => (y.la?.date || '').localeCompare(x.la?.date || ''),
      next: (x, y) => (x.ne?.date || '9999').localeCompare(y.ne?.date || '9999'),
      found: (x, y) => (y.b.discoveredAt || '').localeCompare(x.b.discoveredAt || ''),
      name: (x, y) => x.b.name.replace(/^\(주\)/, '').localeCompare(y.b.name.replace(/^\(주\)/, ''), 'ko'),
    };
    return list.sort(sorters[f.sort] || sorters.recent);
  }

  /** 중복 의심 표시 · 지원고용 표시 */
  const dupTag = (idx, id) => (idx.has(id) ? ` <span class="badge dup" title="${e(idx.get(id).map(d => d.x.name + ' (' + d.why.join(', ') + ')').join(' / '))}">중복?</span>` : '');
  const supTag = b => { const t = S.supportOf(b).types; return t.length ? ` <span class="badge support">${t.join('·')}</span>` : ''; };
  const dupBar = (kind, n, on) => (n ? `<div class="dup-bar"><span>${{ biz: '사업체', net: '기관', card: '명함' }[kind]} <b>${n}</b>건이 다른 것과 겹쳐 보여요. 같은 곳이면 상세 화면에서 합칠 수 있어요.</span><button class="btn btn-sm" type="button" data-act="dup-toggle" data-kind="${kind}">${on ? '전체 보기' : '겹치는 것만 보기'}</button></div>` : '');
  function dupSec(kind, x) {
    const list = S.dupIndex(kind).get(x.id) || [];
    if (!list.length) return '';
    const label = y => (kind === 'card' ? `${y.name} · ${y.org || '소속 없음'}` : y.name);
    const meta = y => (kind === 'card' ? [y.mobile, y.email].filter(Boolean).join(' · ') : [y.address, y.phone].filter(Boolean).join(' · '));
    return `<section class="dr-sec dup-sec"><h3>중복 의심 <span class="badge dup">${list.length}</span></h3>
      <p class="sub" style="margin:0 0 8px">같은 ${kind === 'card' ? '사람' : '곳'}이 두 번 등록된 것 같아요. <b>이쪽으로 합치기</b>를 누르면 빈 칸을 채우고${kind === 'card' ? '' : ' 활동·일정·명함을 옮긴 뒤'} 다른 쪽을 지웁니다.</p>
      <div class="people">${list.map(d => `<div class="person"><div style="min-width:0"><div class="pn" data-act="open" data-kind="${kind}" data-id="${d.x.id}">${e(label(d.x))}</div><div class="pm"><b>${e(d.why.join(' · '))}</b>${meta(d.x) ? ' · ' + e(meta(d.x)) : ''}</div></div>

  }

        <tbody>${rows.map(({ b, la, ne, pc }) => `
          <tr data-act="open" data-kind="biz" data-id="${b.id}" class="row-biz is-${S.bizTone(b)}">
            <td><div class="name">${U.hl(b.name, f.q)}${supTag(b)}${dupTag(dup, b.id)}</div><div class="meta">${e(b.industry)} · ${D.guOf(b.area) ? e(D.guOf(b.area)) + ' ' : ''}${e(b.area || '지역 미지정')}</div></td>

            <td class="nowrap">${staffTag(b.staff)}</td>
            <td class="nowrap">${la ? `<div class="num">${U.dateDot(la.date)}</div><div class="meta">${e(la.type)} · ${U.ago(la.date)}</div>` : '<span class="meta">-</span>'}</td>
            <td class="nowrap">${ne ? `${ddayBadge(ne.date)}<div class="meta">${e(ne.type)}</div>` : '<span class="meta">-</span>'}</td>

      </table></div>
      <div class="mlist">${rows.map(({ b, la, ne, pc }) => `
        <div class="mrow row-biz is-${S.bizTone(b)}" data-act="open" data-kind="biz" data-id="${b.id}">

    if (!list.length) return '';
    return `<section class="panel panel-pad triage">
      <div class="section-head"><h2 class="section-title">분류 대기 명함 <span class="num sub">${list.length}장</span></h2><span class="sub">버튼 하나로 사업체 개발이나 네트워크에 등록되고 지도에 표시됩니다</span></div>
      <ul class="triage-list">${list.slice(0, limit).map(c => `<li>
        <div style="min-width:0"><b data-act="open" data-kind="card" data-id="${c.id}">${e(c.org || c.name)}</b> <span class="sub">${e(c.name)} ${e(c.title || '')}${c.area ? ' · ' + e(D.guOf(c.area) + ' ' + c.area) : ''}</span></div>
        <div class="inline">${triageButtons(c)}</div></li>`).join('')}</ul>
      ${list.length > limit ? `<a class="sub" href="#/cards" data-act="card-link-none">나머지 ${list.length - limit}장 보기</a>` : ''}
    </section>`;
  }
  const triageButtons = c => `<button class="btn btn-sm" type="button" data-act="triage" data-to="biz" data-id="${c.id}">사업체로</button><button class="btn btn-sm" type="button" data-act="triage" data-to="net" data-id="${c.id}">네트워크로</button><button class="btn btn-ghost btn-sm" type="button" data-act="triage" data-to="personal" data-id="${c.id}" title="개인 연락처로 두고 이 목록에서 뺍니다">개인</button>`;
  function netResults() {
    const f = ui.net;
    const nq = U.norm(f.q);
    const all = S.view().networks;
    if (!all.length) return `<div class="panel">${emptyState('등록된 기관이 없습니다', '협력·홍보 기관을 등록하면 지도에 함께 표시됩니다.', 'new-net', '+ 기관 등록')}</div>`;
    const dup = S.dupIndex('net');
    const rows = all.filter(n => (!f.dup || dup.has(n.id)) && (f.cat === '전체' || n.category === f.cat) && (!f.status || n.status === f.status) &&
      (!nq || U.match(f.q, n.name, n.relation, n.promo, n.memo, n.address, n.staff, ...S.cardsOf('net', n.id).flatMap(c => [c.name, c.mobile, c.phone]))))
      .map(n => ({ n, la: S.lastAct('net', n.id), ne: S.nextEvent('net', n.id), pc: primaryContact('net', n.id) }))
      .sort((x, y) => (y.la?.date || '').localeCompare(x.la?.date || ''));
    if (!rows.length) return `<div class="panel"><div class="empty"><strong>조건에 맞는 기관이 없습니다</strong>검색어나 분류를 바꿔 보세요.</div></div>`;
    return dupBar('net', dup.size, f.dup) + `<div class="panel">
      <div class="table-wrap has-mobile"><table class="tbl">
        <thead><tr><th>기관</th><th>관계</th><th>협력 내용</th><th>기관 담당자</th><th>우리 담당</th><th>최근 활동</th><th>다음 일정</th></tr></thead>
        <tbody>${rows.map(({ n, la, ne, pc }) => `
          <tr data-act="open" data-kind="net" data-id="${n.id}" class="row-net ${S.isHome(n) ? 'is-home' : ''}">
            <td><div class="name">${S.isHome(n) ? '<span class="home-star" aria-hidden="true">★</span>' : ''}${U.hl(n.name, f.q)}${dupTag(dup, n.id)}</div><div class="meta">${e(n.category)} · ${e(n.area || '')}</div></td>
            <td>${statusBadge(n.status)}</td>
            <td><div class="clip" title="${e(n.relation)}">${e(n.relation || '-')}</div><div class="meta clip">홍보: ${e(n.promo || '-')}</div></td>
            <td>${pc ? `<div>${e(pc.name)} <span class="meta">${e(pc.title || '')}</span></div><div class="meta num">${e(tel(pc))}</div>` : '<span class="meta">명함 없음</span>'}</td>
            <td class="nowrap">${staffTag(n.staff)}</td>
            <td class="nowrap">${la ? `<div class="num">${U.dateDot(la.date)}</div><div class="meta">${e(la.type)} · ${U.ago(la.date)}</div>` : '-'}</td>
            <td class="nowrap">${ne ? `${ddayBadge(ne.date)}<div class="meta">${e(ne.type)}</div>` : '<span class="meta">-</span>'}</td>
          </tr>`).join('')}</tbody></table></div>
      <div class="mlist">${rows.map(({ n, la, pc }) => `
        <div class="mrow" data-act="open" data-kind="net" data-id="${n.id}">
          <div class="mrow-top"><span class="name">${U.hl(n.name, f.q)}</span>${statusBadge(n.status)}</div>
          <div class="meta">${e(n.category)} · ${e(n.relation || '')}</div>
          <div class="meta">${pc ? `${e(pc.name)} ${e(tel(pc))}` : ''}${la ? ` · 최근 ${U.ago(la.date)}` : ''}</div>
        </div>`).join('')}</div>
      <div class="list-count num">${rows.length}곳 표시 · ${e(S.scopeLabel())} ${all.length}곳</div>
    </div>`;
  }

  /* ================= 명함 ================= */
  function cardsPage() {
    const f = ui.cards;
    const all = S.view().cards;
    const cnt = k => all.filter(c => k === 'all' ? true : k === 'none' ? !c.linkType : c.linkType === k).length;
    return `
      <div class="page-head">
        <div><h1 class="page-title">명함 관리</h1><div class="page-desc">휴대폰으로 명함을 찍어 올리면 ${AI.available() ? 'AI가 이름·연락처를 읽어 채워 줍니다' : '사진과 함께 보관됩니다'}. 사업체·기관과 연결하면 지도와 상세 화면에 함께 나옵니다.</div></div>
        <div class="inline"><button class="btn" type="button" data-act="new-card">직접 입력</button><button class="btn btn-primary" type="button" data-act="card-photo">${I.camera}명함 사진으로 등록</button></div>
      </div>

      <div class="chips" style="margin-bottom:12px">${[['all', '전체'], ['biz', '사업체 담당자'], ['net', '네트워크 기관'], ['none', '연결 안 됨']].map(([k, l]) => `<button type="button" class="chip ${f.link === k ? 'on' : ''}" data-act="card-link" data-link="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
      <div class="toolbar">
        <input class="input" id="cardQ" type="search" placeholder="이름·소속·전화 뒷자리·초성(ㄱㅈㅂ)" value="${e(f.q)}">
        <span class="spacer"></span>
        <select class="select" id="cardSort" aria-label="정렬">
          <option value="recent" ${f.sort === 'recent' ? 'selected' : ''}>최근 받은 순</option>
          <option value="name" ${f.sort === 'name' ? 'selected' : ''}>이름순</option>
          <option value="org" ${f.sort === 'org' ? 'selected' : ''}>소속순</option>
        </select>
      </div>
      <div class="index-bar" role="toolbar" aria-label="가나다 색인">${['', ...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'.split(''), 'A-Z'].map(k => `<button type="button" class="${f.idx === k ? 'on' : ''}" data-act="card-idx" data-idx="${k}">${k || '전체'}</button>`).join('')}</div>
      <div id="cardResults"></div>`;
  }
  function cardResults() {
    const f = ui.cards;
    const nq = U.norm(f.q);
    const all = S.view().cards;
    if (!all.length) return `<div class="panel">${emptyState('등록된 명함이 없습니다', '명함 사진과 연락처를 등록해 보세요.', 'new-card', '+ 명함 등록')}</div>`;
    const dup = S.dupIndex('card');
    const rows = all.filter(c => (!f.dup || dup.has(c.id)) && (!f.of || (c.linkType === f.of.kind && c.linkId === f.of.id)) && (f.link === 'all' || (f.link === 'none' ? !c.linkType : c.linkType === f.link)) &&
      (!f.idx || U.indexOf(f.sort === 'org' ? c.org : c.name) === f.idx) &&
      (!nq || U.match(f.q, c.name, c.org, c.dept, c.title, c.mobile, c.phone, c.email, (c.tags || []).join(','), c.memo, c.address)))
      .sort({
        recent: (a, b) => (b.metAt || '').localeCompare(a.metAt || ''),
        name: (a, b) => a.name.localeCompare(b.name, 'ko'),
        org: (a, b) => (a.org || '').replace(/^\(주\)/, '').localeCompare((b.org || '').replace(/^\(주\)/, ''), 'ko'),
      }[f.sort]);
    const ofChip = f.of ? `<div class="chips" style="margin-bottom:10px"><button type="button" class="chip chip-applied" data-act="cards-of-clear">${e(f.of.name)}의 명함만 ✕</button></div>` : '';
    if (!rows.length && f.of) return ofChip + `<div class="panel"><div class="empty"><strong>${e(f.of.name)}에 연결된 명함이 없습니다</strong>명함을 등록할 때 이곳과 연결하면 여기에 모입니다.</div></div>`;
    if (!rows.length) return `<div class="panel"><div class="empty"><strong>검색 결과가 없습니다</strong>이름 일부, 전화번호 뒷자리, 초성(ㄱㅈㅂ)으로도 찾을 수 있어요.${f.idx ? '<div><button class="btn" type="button" data-act="card-idx" data-idx="">색인 해제</button></div>' : ''}</div></div>`;
    return ofChip + dupBar('card', dup.size, f.dup) + `<div class="card-grid">${rows.map(c => {
      const link = S.linkOf(c);
      const tone = c.linkType === 'biz' ? 'k-' + S.bizTone(link) : c.linkType === 'net' ? (link && S.isHome(link) ? 'k-home' : 'k-net') : 'k-none';
      return `<article class="bcard ${tone}" data-act="open" data-kind="card" data-id="${c.id}" tabindex="0">
        <div class="org">${c.linkType === 'biz' ? `<span class="badge stage-badge" style="--c:${D.STAGE[link?.stage]?.color || 'var(--muted)'}"><span class="dot"></span>사업체</span>` : c.linkType === 'net' ? '<span class="badge navy">기관</span>' : ''}<span>${U.hl(c.org || '소속 미기재', f.q)}</span></div>
        <div class="pname">${U.hl(c.name, f.q)}${dupTag(dup, c.id)}<span class="ptitle">${e([c.dept, c.title].filter(Boolean).join(' · '))}</span></div>
        <div class="contact">
          ${c.mobile ? `<div>M ${U.hl(c.mobile, f.q)}</div>` : ''}
          ${c.phone ? `<div>T ${U.hl(c.phone, f.q)}</div>` : ''}
          ${c.email ? `<div>${e(c.email)}</div>` : ''}
        </div>
        ${c.photo ? '<span class="tagline photo-flag">사진 있음</span>' : ''}${link && link.staff ? `<span class="card-staff">우리 담당 ${e(link.staff)}</span>` : ''}
      </article>`;
    }).join('')}</div><p class="sub num" style="margin-top:12px">${rows.length}장 표시 · ${e(S.scopeLabel())} ${all.length}장</p>`;
  }

  /* ================= 지도 ================= */
  function mapPage() {
    const f = ui.map;
    const st = S.view();
    const noPos = st.businesses.filter(b => !M.hasPos(b)).length + st.networks.filter(n => !M.hasPos(n)).length;
    const pending = st.cards.filter(c => !c.linkType && M.hasPos(c) && !(c.tags || []).includes('개인')).length;
    const guCount = g => st.businesses.filter(b => D.guOf(b.area) === g).length + st.networks.filter(n => D.guOf(n.area) === g).length;
    return `
      <div class="page-head">
        <div><h1 class="page-title">화성시 지도</h1><div class="page-desc">모든 사업체·기관을 지도에 표시하고, 옆 목록에는 고른 달에 발굴한 사업체만 보여줍니다.${scopeNote()}</div></div>
        <div class="inline"><button class="btn" type="button" data-act="new-net">+ 기관 등록</button><button class="btn btn-primary" type="button" data-act="new-biz">+ 사업체 발굴 등록</button></div>
      </div>
      <div class="chips" style="margin-bottom:12px" role="tablist">
        <button type="button" role="tab" class="chip ${f.mode === 'ours' ? 'on' : ''}" data-act="map-mode" data-mode="ours" aria-selected="${f.mode === 'ours'}">사업체·네트워크 지도</button>
        <button type="button" role="tab" class="chip ${f.mode === 'city' ? 'on' : ''}" data-act="map-mode" data-mode="city" aria-selected="${f.mode === 'city'}">화성시 대시보드</button>
      </div>
      ${f.mode === 'city' ? cityMap() : `
      <div class="chips gu-chips" style="margin-bottom:12px">${[['', '화성시 전체'], ...D.GUS.map(g => [g.name, g.name])].map(([k, l]) => `<button type="button" class="chip ${f.gu === k ? 'on' : ''}" data-act="map-gu" data-gu="${k}" ${k ? `style="--c:${D.GU[k].color}"` : ''}>${k ? '<span class="dot"></span>' : ''}${l}${k ? `<span class="n">${guCount(k)}</span>` : ''}</button>`).join('')}</div>
      <section class="panel map-layout">
        <div class="map-side">
          <div class="map-side-head">
            <div class="month-nav">
              <button class="icon-btn" type="button" data-act="map-month" data-d="-1" aria-label="이전 달">${I.back}</button>
              <b class="num" id="mapMonthLabel">${monthLabel(f.month)}</b>
              <button class="icon-btn" type="button" data-act="map-month" data-d="1" aria-label="다음 달" style="transform:scaleX(-1)">${I.back}</button>
              <button class="btn btn-ghost btn-sm" type="button" data-act="map-listmode" id="mapListMode">${f.listAll ? '이 달만' : '전체 목록'}</button>
            </div>
            <input class="input" id="mapQ" type="search" placeholder="지도에서 이름 찾기 (초성 가능)" value="${e(f.q)}">
            <div class="chips">
              <button type="button" class="chip ${f.biz ? 'on' : ''}" data-act="map-layer" data-layer="biz">사업체 개발</button>
              <button type="button" class="chip ${f.net ? 'on' : ''}" data-act="map-layer" data-layer="net">네트워크</button>
              <button type="button" class="chip ${f.card ? 'on' : ''}" data-act="map-layer" data-layer="card">분류 대기 명함${pending ? ` <span class="n">${pending}</span>` : ''}</button>
            </div>
            <div class="map-legend map-key">
              <span><i class="dot-lg" style="--c:${D.MAP_COLORS.biz}"></i>사업체 개발</span>
              <span><i class="dot-lg" style="--c:${D.MAP_COLORS.placed}"></i>취업 연계</span>
              <span><i class="dot-lg" style="--c:${D.MAP_COLORS.support}"></i>지원고용·현장훈련</span>
              <span><i class="sq" style="--c:${D.MAP_COLORS.net}"></i>기관</span>
              <span><i class="star" style="--c:${D.MAP_COLORS.home}"></i>아르딤복지관</span>
              <span><i class="sq" style="--c:${D.MAP_COLORS.card}"></i>명함</span>
              <span><i class="ring"></i>이 달 발굴</span>
            </div>
            ${S.view().networks.some(n => S.isHome(n) && M.hasPos(n)) ? '' : `<button class="btn btn-sm" type="button" data-act="home-add" style="align-self:flex-start">★ 화성시아르딤복지관 위치 등록</button>`}
            <div class="map-legend map-stages"><span class="sub">단계</span>${D.STAGES.map(s => `<span><label class="check"><input type="checkbox" data-act="map-stage" data-stage="${s.key}" ${f.stages.has(s.key) ? 'checked' : ''} ${f.biz ? '' : 'disabled'}>${s.key}</label></span>`).join('')}</div>
            <div id="routeBox">${routePanel()}</div>
            ${noPos ? `<div class="sub">위치가 없는 곳 ${noPos}곳은 지도에 표시되지 않습니다.</div>` : ''}
          </div>
          <div class="map-list" id="mapList"></div>
        </div>
        <div class="map-canvas"><div class="map-box" id="bigMap"></div></div>
      </section>`}`;
  }
  /** 화성시 통합 대시보드(공유 링크). 1920×1080 화면으로 그린 뒤 칸 너비에 맞춰 줄여 비율을 유지한다 */
  function cityMap() {
    const url = S.get().settings.cityMapUrl || '';
    const f = ui.map;
    if (!url) return `<div class="panel">${emptyState('화성시 대시보드 주소가 없습니다', '데이터 관리 > 화성시 대시보드 주소에 공유 링크를 넣어 주세요.')}</div>`;
    return `<section class="panel" style="overflow:hidden">
      <div class="panel-pad" style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-block:12px">
        <span class="sub">화성시 통합 대시보드 공유 화면입니다. 화면이 비어 보이면 새 창에서 여세요.</span>
        <div class="inline">
          <select class="select" id="cityFit" aria-label="화면 크기">${[['fit', '화면 맞춤 (16:9)'], ['wide', '넓은 화면 (21:9)'], ['full', '원래 크기']].map(([k, l]) => `<option value="${k}" ${f.cityFit === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <a class="btn btn-sm" href="${e(url)}" target="_blank" rel="noopener">새 창에서 열기</a>
        </div>
      </div>
      <div class="city-wrap" id="cityWrap"><iframe class="city-frame" id="cityFrame" src="${e(url)}" title="화성시 통합 대시보드" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen; geolocation"></iframe></div>
    </section>`;
  }
  const monthLabel = m => `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월`;
  const inMonth = (x, m) => (x.discoveredAt || x.since || x.metAt || x.createdAt || '').startsWith(m);
  /** 지도에 찍을 전체 목록 (구·레이어·단계·검색 반영) */
  function mapItems() {
    const f = ui.map;
    const st = S.view();
    const items = [];
    if (f.biz) st.businesses.filter(b => f.stages.has(b.stage)).forEach(b => items.push({ kind: 'biz', x: b }));
    // 우리 복지관(금색 별)은 기준점이라 네트워크를 꺼도, 구·검색으로 걸러도 늘 보인다
    st.networks.forEach(n => { if (f.net || S.isHome(n)) items.push({ kind: 'net', x: n, home: S.isHome(n) }); });
    if (f.card) st.cards.filter(c => !c.linkType && !(c.tags || []).includes('개인')).forEach(c => items.push({ kind: 'card', x: c }));
    return items.filter(({ x, home }) => home || ((!f.gu || D.guOf(x.area) === f.gu) && U.match(f.q, x.name, x.org, x.area, D.guOf(x.area), x.industry, x.category)))
      .map(it => ({ ...it, month: it.kind === 'biz' && inMonth(it.x, f.month) }));
  }
  /** 길찾기 칸: 출발(기본 = 우리 복지관) → 도착, 대략 거리·시간과 네이버·카카오 길찾기 버튼 */
  function routePanel() {
    const r = ui.map.route;
    const home = S.get().networks.find(n => S.isHome(n) && M.hasPos(n));
    if (!r) return `<div class="route-box idle"><b>🧭 길찾기</b><span class="sub">지도에서 점을 누르고 <b>여기까지 길찾기</b>를 누르면 ${home ? '복지관에서' : '출발지에서'} 얼마나 걸리는지 보여 줘요.</span></div>`;
    const from = r.from ? S.find(r.from.kind, r.from.id) : home;
    const to = r.to ? S.find(r.to.kind, r.to.id) : null;
    const head = `<div class="route-head"><b>🧭 길찾기</b><button class="icon-btn" type="button" data-act="route-clear" aria-label="길찾기 닫기" style="width:28px;height:28px">${I.close}</button></div>`;
    if (!r.to) return `<div class="route-box">${head}<div class="route-ends"><span class="from">출발 <b>${e(from ? from.name : '')}</b></span></div><span class="sub">이제 지도에서 도착할 곳을 누르고 <b>여기까지 길찾기</b>를 누르세요.</span></div>`;
    if (!to || !M.hasPos(to)) return `<div class="route-box">${head}<span class="sub">도착지 위치가 없습니다.</span></div>`;

      <div class="route-est"><span>직선 <b class="num">${km.toFixed(1)}km</b></span><span>🚗 약 <b class="num">${t.car}분</b></span><span>🚌 약 <b class="num">${t.transit}분</b></span>${km < 3 ? `<span>🚶 약 <b class="num">${t.walk}분</b></span>` : ''}</div>
      <p class="sub" style="margin:0">거리로 어림한 시간이에요. 정확한 경로와 시간은 아래에서 확인하세요.</p>
      <div class="inline route-links">${btn(M.naverRoute(from, to, 'car'), '네이버 자동차', 'btn-naver')}${btn(M.naverRoute(from, to, 'transit'), '네이버 대중교통', 'btn-naver')}${km < 3 ? btn(M.naverRoute(from, to, 'walk'), '네이버 도보', 'btn-naver') : ''}${btn(M.kakaoRoute(from, to), '카카오맵 길찾기', 'btn-kakao')}</div>

  /** 옆 목록: 기본은 고른 달에 발굴한 사업체만, 구별로 묶어서 */

    const groups = [...D.GUS.map(g => g.name), ''].map(g => [g, list.filter(i => D.guOf(i.x.area) === g)]).filter(([, l]) => l.length);
    return groups.map(([g, l]) => `<div class="map-group"><h4>${g ? `<span class="prog-dot" style="--c:${D.GU[g].color}"></span>${g}` : '구 미지정'} <span class="num">${l.length}</span></h4>${l.map(({ kind, x }) => `
      <div class="map-item" data-act="map-focus" data-kind="${kind}" data-id="${x.id}">
        <span class="mk ${kind === 'net' && S.isHome(x) ? 'star' : kind !== 'biz' ? 'sq' : ''}" style="--c:${kind === 'biz' ? M.bizColor(x) : kind === 'net' ? (S.isHome(x) ? D.MAP_COLORS.home : D.MAP_COLORS.net) : D.MAP_COLORS.card}"></span>

  /* ================= 일정 ================= */
  function schedPage() {
    return `
      <div class="page-head">
        <div><h1 class="page-title">일정</h1><div class="page-desc">사업체 방문, 면접 동행, 기관 행사 등 업무 일정을 관리합니다.</div></div>
        <button class="btn btn-primary" type="button" data-act="new-event">+ 일정 등록</button>
      </div>
      <div class="sched">
        <section class="panel" id="evList"></section>
        <section class="panel cal-panel" id="calBox"></section>
      </div>`;
  }
  function evRow(ev) {
    const t = S.targetOf(ev);
    const d = U.dday(ev.date);
    return `<div class="ev ${ev.done ? 'done' : ''}">
      <input type="checkbox" aria-label="완료 표시" data-act="ev-toggle" data-id="${ev.id}" ${ev.done ? 'checked' : ''}>
      <div class="ev-when">${U.md(ev.date)} ${e(ev.time || '')}</div>
      <div style="min-width:0"><div class="ev-title">${e(ev.title)}</div>
        <div class="ev-target">${t ? `<span data-act="open" data-kind="${ev.targetType}" data-id="${t.id}">${e(t.name)}</span> · ` : ''}${e(ev.type)}${ev.memo ? ' · ' + e(ev.memo) : ''}</div></div>
      <div class="inline">${ev.done ? '<span class="badge success">완료</span>' : `<span class="badge ${d.tone} num">${d.label}</span>`}<button class="icon-btn" type="button" aria-label="일정 수정" data-act="edit-event" data-id="${ev.id}">${I.edit}</button></div>
    </div>`;
  }
  function evList() {
    const f = ui.sched;
    const T = U.today();
    let evs = [...S.view().events].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    if (f.sel) evs = evs.filter(x => x.date === f.sel);
    const groups = f.sel ? [[U.dateKo(f.sel), evs.filter(x => f.showDone || !x.done)]] : [
      ['지난 일정 (완료 안 됨)', evs.filter(x => !x.done && x.date < T)],
      ['오늘', evs.filter(x => !x.done && x.date === T)],
      ['7일 이내', evs.filter(x => !x.done && x.date > T && U.diffDays(T, x.date) <= 7)],
      ['이후', evs.filter(x => !x.done && U.diffDays(T, x.date) > 7)],
      ...(f.showDone ? [['완료한 일정', evs.filter(x => x.done).reverse().slice(0, 30)]] : []),
    ];
    const body = groups.filter(([, l]) => l.length).map(([h, l]) => `<div class="ev-group"><h3>${e(h)} <span class="num">${l.length}</span></h3>${l.map(evRow).join('')}</div>`).join('');
    return `<div class="panel-pad" style="padding-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 class="section-title">${f.sel ? e(U.dateKo(f.sel)) + ' 일정' : '다가오는 일정'}</h2>
        <div class="inline">${f.sel ? '<button class="btn btn-sm" type="button" data-act="cal-clear">전체 일정 보기</button>' : ''}<label class="check"><input type="checkbox" data-act="ev-showdone" ${f.showDone ? 'checked' : ''}>완료 포함</label></div>
      </div>${body || `<div class="empty"><strong>${f.sel ? '이 날은 일정이 없습니다' : '예정된 일정이 없습니다'}</strong>사업체 방문이나 기관 행사를 등록해 보세요.<div><button class="btn btn-primary" type="button" data-act="new-event" data-date="${f.sel || ''}">+ 일정 등록</button></div></div>`}`;
  }
  /** 달력. f: {month, sel}, pick/move: 날짜 선택·달 이동 액션 이름 */
  function calendar(f = ui.sched, pick = 'cal-pick', move = 'cal-move') {
    const [y, m] = f.month.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(y, m - 1, 1 - first.getDay());
    const T = U.today();
    const byDate = {};
    S.view().events.forEach(x => { (byDate[x.date] ||= []).push(x); });
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = U.fmt(d);
      const evs = (byDate[s] || []).filter(x => !x.done);
      cells += `<button type="button" class="cal-day ${d.getMonth() !== m - 1 ? 'out' : ''} ${s === T ? 'today' : ''} ${s === f.sel ? 'sel' : ''}" data-act="${pick}" data-date="${s}" aria-label="${U.dateKo(s)} 일정 ${evs.length}건">
        ${d.getDate()}<span class="dots">${evs.slice(0, 3).map(x => `<i class="${x.date < T ? 'late' : ''}"></i>`).join('')}</span></button>`;
    }
    return `<div class="cal"><div class="cal-head"><button class="icon-btn" type="button" data-act="${move}" data-d="-1" aria-label="이전 달">${I.back}</button><b class="num">${y}년 ${m}월</b><button class="icon-btn" type="button" data-act="${move}" data-d="1" aria-label="다음 달" style="transform:scaleX(-1)">${I.back}</button></div>
      <div class="cal-grid">${U.WD.map(w => `<div class="cal-dow">${w}</div>`).join('')}${cells}</div></div>`;
  }

    return `

          <label>사업날짜<input class="input" type="date" name="date" value="${f.month === U.today().slice(0, 7) ? U.today() : f.month + '-01'}" required></label>
          <label>세부사업명<select class="select" name="item">${def.items.map(i => `<option>${e(i)}</option>`).join('')}</select></label>
          <label>참여인원<input class="input" type="number" min="0" name="people" inputmode="numeric"></label>

        <p class="sub" style="margin:8px 0 0">사업체·기관 상세 화면에서 남긴 활동 기록(방문·전화 등)은 따로 입력하지 않아도 아래 표에 날짜·세부사업별로 자동 집계됩니다.</p>
      </section>
      <div id="perfResults"></div>`;

  /* ================= 상세 Drawer ================= */

        : '<p class="sub" style="margin:0">연결된 명함이 없습니다. 담당자 명함을 등록하면 여기서 바로 전화할 수 있어요.</p>'}</section>`;
  };
  const eventsSec = (kind, id) => {
    const evs = S.eventsOf(kind, id).filter(x => !x.done);
    return `<section class="dr-sec"><h3>다가오는 일정 <button class="btn btn-ghost btn-sm" type="button" data-act="new-event" data-target="${kind}:${id}">+ 일정</button></h3>
      ${evs.length ? `<div class="people">${evs.map(x => `<div class="person"><div><div style="font-weight:600">${e(x.title)}</div><div class="pm">${U.dateKo(x.date)} ${e(x.time || '')} · ${e(x.type)}</div></div>
