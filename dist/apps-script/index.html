<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아르딤 취업지원 CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 레이아웃: 좌측 사이드바 + 상단 검색바 + 본문, 상세/등록은 우측 Drawer (모바일은 전체 화면 + 하단 탭) */
:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface-2: #F1F3F7;
  --line: #E4E7EC;
  --line-strong: #D0D5DD;
  --text: #172033;
  --text-2: #667085;
  --navy: #132B4F;
  --accent: #2563EB;
  --accent-soft: #EAF1FE;
  --success: #2F7D57;
  --success-soft: #E7F3EC;
  --warning: #A86A0C;
  --warning-soft: #FBF1DF;
  --danger: #B42318;
  --danger-soft: #FBE9E7;
  --muted: #8A94A6;
  --muted-soft: #EEF0F4;

  --prog-a: #0F7B7B;
  --prog-b: #6A4FB8;

  --st-discover: #8A94A6;
  --st-contact: #6B9BEF;
  --st-visit: #2563EB;
  --st-negotiate: #C98A1B;
  --st-placed: #2F7D57;
  --st-hold: #B8BFCC;

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
  --sidebar: 236px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 12px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 16px;
}
.brand-name { font-weight: 700; font-size: 15px; color: var(--navy); }
.brand-sub { font-size: 11.5px; color: var(--text-2); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
  color: var(--text-2); font-weight: 500; text-decoration: none;
}
.side-nav a svg { width: 18px; height: 18px; flex: none; }
svg { stroke-linecap: round; stroke-linejoin: round; }
.side-nav svg, .bottom-nav svg, .icon-btn svg, .btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
.side-nav a:hover { background: var(--surface-2); color: var(--text); }
.side-nav a.active { background: var(--accent-soft); color: var(--navy); font-weight: 650; }
.side-nav a .count { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 28px; background: rgba(247, 248, 250, .92); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.search-trigger {
  flex: 1; min-width: 0; max-width: 560px; display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--text-2); cursor: text; text-align: left;
}
.search-trigger svg, .search-input-row svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }
.search-trigger span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font-family: inherit; font-size: 11.5px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.scope-select { width: auto; max-width: 210px; font-weight: 600; }
.scope-select.scoped { border-color: var(--accent); background: var(--accent-soft); color: var(--navy); }
.sync { font-size: 12.5px; color: var(--text-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--success); }
.sync.busy::before { background: var(--warning); }
.sync.err { color: var(--danger); font-weight: 600; }
.sync.err::before { background: var(--danger); }
.badge.prog { height: 19px; padding: 0 6px; font-size: 11px; background: transparent; border: 1px solid var(--c); color: var(--c); margin-left: 4px; }
.staff-tag { display: inline-flex; align-items: center; white-space: nowrap; }
.staff-tbl td, .staff-tbl th { padding: 8px 10px; white-space: nowrap; }
.staff-tbl tbody tr[data-act] { cursor: pointer; }
.prog-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 1px; }
.staff-tbl tr.grp td { background: var(--surface-2); }
.staff-tbl tr.total td { border-top: 1px solid var(--line-strong); }
.staff-tbl .indent { padding-left: 14px; display: inline-block; }
.staff-tbl .meta { margin-left: 2px; font-size: 12px; color: var(--text-2); }
.card-staff { position: absolute; right: 14px; bottom: 12px; font-size: 11.5px; color: var(--text-2); }
.staff-rows { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.staff-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; z-index: 30;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px; display: flex; flex-direction: column;
}
.menu button { text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; }
.menu button:hover { background: var(--surface-2); }

.demo-banner {
  margin: 14px 28px 0; padding: 10px 14px; border-radius: var(--radius);
  background: var(--warning-soft); color: #6B4A0B; font-size: 13.5px;
}
.view { padding: 22px 28px 48px; outline: none; min-width: 0; }

/* ---------- Buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #1D4FD0; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: #971D14; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.input, .select, .textarea {
  width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); font-size: 14px;
}
.textarea { height: auto; min-height: 76px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select { padding-right: 28px; }

/* ---------- Page header ---------- */
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.page-title { font-size: 23px; font-weight: 750; letter-spacing: -.01em; }
.page-desc { color: var(--text-2); margin-top: 2px; }
.section-title { font-size: 17.5px; font-weight: 650; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.sub { color: var(--text-2); font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel-pad { padding: 18px 20px; }

/* ---------- Badges & chips ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--muted-soft); color: #4A5467;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.navy { background: #E6EBF3; color: var(--navy); }
.badge.outline { background: transparent; border: 1px solid var(--line-strong); color: var(--text-2); }
.stage-badge { background: var(--surface-2); color: var(--text); }
.stage-badge .dot { background: var(--c); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 550; cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip-applied { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; }
.kpi { padding: 16px 20px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi-label { color: var(--text-2); font-size: 13px; font-weight: 550; }
.kpi-value { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 4px; }
.kpi-value small { font-size: 15px; font-weight: 600; margin-left: 2px; color: var(--text-2); }
.kpi-foot { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.kpi a { color: inherit; }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.prio { list-style: none; margin: 0; padding: 0; }
.prio li {
  display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.prio li:last-child { border-bottom: 0; }
.prio li:hover { background: var(--surface-2); }
.prio .who { font-weight: 650; }
.prio .why { color: var(--text-2); font-size: 13.5px; }
.prio .when { font-size: 13px; color: var(--text-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dday { justify-self: start; }

.pipeline { display: flex; flex-direction: column; gap: 9px; }
.pipe-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 42px; gap: 10px; align-items: center; font-size: 13.5px; cursor: pointer; }
.pipe-bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.pipe-bar span { display: block; height: 100%; background: var(--c); border-radius: 5px; }
.pipe-row .n { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.feed li:last-child { border-bottom: 0; }
.feed .d { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
.feed .t b { font-weight: 650; cursor: pointer; }
.feed .t b:hover { color: var(--accent); }
.feed .t .c { color: var(--text-2); }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-2); font-size: 11px; font-family: var(--font); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

/* ---------- Tables ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .input { max-width: 260px; }
.toolbar .select { width: auto; min-width: 128px; }
.toolbar .spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--text-2); font-size: 12.5px;
  padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
}
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: #FAFBFC; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .name { font-weight: 650; }
.tbl .meta { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
.tbl .nowrap { white-space: nowrap; }
.clip { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-count { font-size: 13px; color: var(--text-2); padding: 10px 14px; border-top: 1px solid var(--line); }

/* 모바일용 리스트 행 */
.mlist { display: none; }
.mrow { padding: 13px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 44px; }
.mrow:last-child { border-bottom: 0; }
.mrow-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mrow .name { font-weight: 650; }
.mrow .meta { color: var(--text-2); font-size: 13px; }

/* ---------- Empty / skeleton ---------- */
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }
.skel { background: linear-gradient(90deg, var(--surface-2), #F8F9FB, var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 6px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Map ---------- */
.map-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 0; height: calc(100vh - 190px); min-height: 480px; overflow: hidden; }
.map-side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.map-side-head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.map-list { overflow-y: auto; flex: 1; }
.map-item { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; }
.map-item:hover { background: var(--surface-2); }
.map-item .mk { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--c); }
.map-item .mk.sq { border-radius: 2px; transform: rotate(45deg); }
.map-item .name { font-weight: 650; }
.map-item .meta { color: var(--text-2); font-size: 12.5px; }
.map-canvas { min-height: 0; height: 100%; }
.map-box { width: 100%; height: 100%; background: #E9EEF3; }
.city-frame { display: block; width: 100%; height: calc(100vh - 250px); min-height: 520px; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); }
.mini-map { height: 190px; border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; background: #E9EEF3; }
.pick-map { height: 240px; border-radius: var(--radius); border: 1px solid var(--line-strong); overflow: hidden; background: #E9EEF3; cursor: crosshair; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--text-2); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.map-legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.map-legend i.sq { border-radius: 2px; transform: rotate(45deg); }
.pick-pin { width: 22px; height: 22px; background: var(--accent); border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.net-pin { width: 14px; height: 14px; background: var(--navy); border: 2px solid #fff; transform: rotate(45deg); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.leaflet-popup-content { font-family: var(--font); font-size: 13px; margin: 12px 14px; }
.leaflet-popup-content .pop-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.leaflet-popup-content .pop-meta { color: var(--text-2); margin-bottom: 8px; }
.leaflet-container { font-family: var(--font); }

/* ---------- Cards (명함) ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.bcard {
  aspect-ratio: 9 / 5; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 16px 18px; display: flex; flex-direction: column; cursor: pointer; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.bcard:hover { border-color: var(--line-strong); box-shadow: 0 4px 14px rgba(16,24,40,.08); }
.bcard .org { font-size: 12.5px; color: var(--text-2); font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.bcard .org span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .pname { font-size: 18px; font-weight: 750; margin-top: 8px; letter-spacing: -.01em; }
.bcard .ptitle { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: 6px; }
.bcard .contact { margin-top: auto; font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.bcard .contact div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .tagline { position: absolute; top: 14px; right: 14px; }
.bcard .photo-flag { font-size: 11.5px; color: var(--text-2); }
.card-photo { width: 100%; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.photo-drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--text-2); font-size: 13px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.photo-drop img { max-height: 160px; border-radius: 6px; }

/* ---------- Schedule ---------- */
.sched { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.ev-group { margin-bottom: 6px; }
.ev-group h3 { font-size: 13px; color: var(--text-2); font-weight: 650; padding: 12px 16px 6px; }
.ev { display: grid; grid-template-columns: 28px 86px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); min-height: 48px; }
.ev.done .ev-title { text-decoration: line-through; color: var(--text-2); }
.ev input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
.ev-when { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ev-title { font-weight: 600; }

<script>
/* 공통 유틸: 날짜, 문자열, 포맷 */
window.U = (() => {
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => fmt(new Date());
  const parse = s => {
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  /** b - a (일) */
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  function dday(s) {
    const n = diffDays(today(), s);
    if (n === 0) return { label: '오늘', tone: 'warn', n };
    if (n > 0) return { label: `D-${n}`, tone: n <= 3 ? 'accent' : 'outline', n };
    return { label: `${-n}일 지남`, tone: 'danger', n };
  }
  function ago(s) {
    if (!isDate(s)) return '';
    const n = diffDays(s, today());
    if (n < 0) return `${-n}일 후`;
    if (n === 0) return '오늘';
    if (n === 1) return '어제';
    if (n < 30) return `${n}일 전`;
    if (n < 365) return `${Math.floor(n / 30)}개월 전`;
    return `${Math.floor(n / 365)}년 전`;
  }
  const md = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}.${pad(d.getDate())}`; };
  const dateKo = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
  const dateDot = s => isDate(s) ? s.replace(/-/g, '.') : '';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('ko-KR');
  const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);
  const norm = s => String(s ?? '').toLowerCase().replace(/[\s\-().]/g, '');

  /** 검색어를 강조 표시 (이스케이프 후) */
  function hl(text, q) {
    const t = esc(text);
    if (!q) return t;
    const i = String(text ?? '').toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t;
    const raw = String(text);
    return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + q.length)) + '</mark>' + esc(raw.slice(i + q.length));
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  /** 엑셀 날짜(숫자·Date·문자열)를 YYYY-MM-DD로 */
  function toDateStr(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return fmt(v);
    if (typeof v === 'number') {
      const d = new Date(Math.round((v - 25569) * 86400000));
      return fmt(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    }
    const s = String(v).trim().replace(/[./]/g, '-');
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
  }

  return { pad, fmt, today, parse, isDate, addDays, diffDays, WD, dday, ago, md, dateKo, dateDot, esc, num, uid, norm, hl, debounce, toDateStr };
})();

</script>

<script>
/* 데이터 저장소: 모든 화면은 이 한 곳의 데이터에서 계산한다.
   - 파일로 열면(로컬 모드): 이 브라우저의 IndexedDB에 저장
   - 구글 Apps Script 웹 앱으로 열면(공유 모드): 구글 시트에 저장하고 팀원과 함께 본다 */
window.S = (() => {
  const DB_NAME = 'ardim-jobs-crm';
  const KEY = 'state';
  const REMOTE = !!(window.google && google.script && google.script.run);
  let state = null;
  const listeners = new Set();

  /* ---------- 시트/엑셀 열 정의 (공유 모드의 구글 시트와 엑셀 내보내기가 같은 양식을 쓴다) ---------- */
  const SHEETS = {
    businesses: ['사업체', [['id', '사업체ID'], ['name', '사업체명'], ['industry', '업종'], ['stage', '진행 단계'], ['bizNo', '사업자등록번호'], ['ceo', '대표자'], ['employees', '상시근로자 수'], ['address', '주소'], ['area', '읍면동'], ['lat', '위도'], ['lng', '경도'], ['approx', '대략 위치(Y)'], ['jobs', '가능 직무'], ['workConditions', '근무 조건'], ['accessibility', '편의시설·고려사항'], ['placements', '채용 연계 인원'], ['source', '발굴 경로'], ['discoveredAt', '발굴일'], ['staff', '담당 직원'], ['memo', '메모'], ['createdAt', '등록일'], ['updatedAt', '수정일']]],
    networks: ['네트워크', [['id', '기관ID'], ['name', '기관명'], ['category', '분류'], ['status', '관계 상태'], ['address', '주소'], ['area', '읍면동'], ['lat', '위도'], ['lng', '경도'], ['approx', '대략 위치(Y)'], ['relation', '협력 내용'], ['promo', '홍보 방식'], ['since', '협력 시작일'], ['staff', '담당 직원'], ['memo', '메모'], ['createdAt', '등록일'], ['updatedAt', '수정일']]],
    cards: ['명함', [['id', '명함ID'], ['name', '이름'], ['org', '소속'], ['dept', '부서'], ['title', '직함'], ['mobile', '휴대전화'], ['phone', '사무실 전화'], ['email', '이메일'], ['address', '주소'], ['linkType', '연결 구분(biz/net)'], ['linkId', '연결ID'], ['tags', '태그'], ['metAt', '받은 날'], ['metWhere', '받은 곳'], ['memo', '메모'], ['photo', '사진(Y)'], ['createdAt', '등록일'], ['updatedAt', '수정일']]],
    activities: ['활동기록', [['id', '활동ID'], ['targetType', '대상 구분(biz/net)'], ['targetId', '대상ID'], ['date', '날짜'], ['type', '유형'], ['content', '내용'], ['staff', '담당 직원']]],
    events: ['일정', [['id', '일정ID'], ['date', '날짜'], ['time', '시간'], ['type', '유형'], ['title', '제목'], ['targetType', '대상 구분(biz/net)'], ['targetId', '대상ID'], ['done', '완료(Y/N)'], ['memo', '메모']]],
  };
  const STAFF_SHEET = ['직원', [['name', '이름'], ['program', '소속 사업']]];
  const DATE_KEYS = new Set(['discoveredAt', 'since', 'metAt', 'date', 'createdAt', 'updatedAt']);
  const NUM_KEYS = new Set(['employees', 'placements', 'lat', 'lng']);
  const COLS = Object.keys(SHEETS);

  function toRow(col, x) {
    return Object.fromEntries(SHEETS[col][1].map(([k, h]) => {
      let v = x[k];
      if (k === 'tags') v = (v || []).join(', ');
      else if (k === 'done' || k === 'approx') v = v ? 'Y' : (k === 'done' ? 'N' : '');
      else if (k === 'photo') v = v ? 'Y' : '';
      return [h, v ?? ''];
    }));
  }
  function fromRow(col, r) {
    const o = {};
    for (const [k, h] of SHEETS[col][1]) {
      let v = r[h];
      if (v === undefined) continue;
      if (DATE_KEYS.has(k)) v = U.toDateStr(v);
      else if (NUM_KEYS.has(k)) v = v === '' || v == null ? (k === 'lat' || k === 'lng' ? null : 0) : Number(v);
      else if (k === 'tags') v = String(v || '').split(',').map(t => t.trim()).filter(Boolean);
      else if (k === 'done' || k === 'approx') v = /^(y|yes|o|완료|true|1)$/i.test(String(v).trim());
      else if (k === 'photo') v = /^y$/i.test(String(v).trim()) ? 'Y' : null;
      else v = v == null ? '' : String(v).trim();
      o[k] = v;
    }
    if (!o.id) o.id = U.uid(col[0].toUpperCase());
    return o;
  }
  const keepRow = (col, o) => (col === 'activities' ? o.content || o.type : col === 'events' ? o.title || o.date : o.name);
  function normalize(next) {
    for (const k of COLS) next[k] ||= [];
    next.settings ||= {};
    next.settings.orgName ||= '화성시아르딤복지관 직업지원팀';
    if (next.settings.cityMapUrl == null) next.settings.cityMapUrl = D.CITY_DASHBOARD_URL;
    next.settings.staff = (next.settings.staff || []).map(s => (typeof s === 'string' ? { name: s, program: '' } : { name: String(s.name || '').trim(), program: s.program || '' })).filter(s => s.name);
    if (!next.settings.staff.length) next.settings.staff = [{ name: '김정배', program: '' }];
    next.businesses.forEach(b => {
      if (!D.STAGE[b.stage]) b.stage = '발굴';
      if ((b.lat == null || isNaN(b.lat)) && D.AREA_BY_NAME[b.area]) { b.lat = D.AREA_BY_NAME[b.area].lat; b.lng = D.AREA_BY_NAME[b.area].lng; b.approx = true; }
    });
    next.networks.forEach(n => {
      if (!D.NET_STATUS.includes(n.status)) n.status = '보통';
      if ((n.lat == null || isNaN(n.lat)) && D.AREA_BY_NAME[n.area]) { n.lat = D.AREA_BY_NAME[n.area].lat; n.lng = D.AREA_BY_NAME[n.area].lng; n.approx = true; }
    });
    return next;
  }

  /* ---------- 로컬 저장 (IndexedDB) ---------- */
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function readRaw() {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(KEY);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => rej(q.error);
      });
    } catch (e) {
      try { return JSON.parse(localStorage.getItem(DB_NAME) || 'null'); } catch { return null; }
    }
  }
  async function writeRaw(v) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, KEY);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } catch (e) {
      localStorage.setItem(DB_NAME, JSON.stringify(v));
    }
  }
  let saveTimer = null;
  function persistLocal() {
    if (REMOTE) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await writeRaw(state); }
      catch (e) { App.toast('저장하지 못했습니다. 저장 공간이 부족할 수 있어요. 명함 사진을 줄이거나 엑셀로 백업하세요.', 'error'); }
    }, 150);
  }

  /* ---------- 공유 모드 (구글 Apps Script) ---------- */
  const sync = { status: REMOTE ? 'loading' : 'local', at: null, error: null };
  const syncListeners = new Set();
  const setSync = (status, error = null) => { sync.status = status; sync.error = error; if (status === 'saved') sync.at = new Date(); syncListeners.forEach(fn => fn(sync)); };
  const call = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  let pending = 0;
  function send(fn, ...args) {
    if (!REMOTE) return Promise.resolve();
    pending++;
    setSync('saving');
    return call(fn, ...args)
      .then(r => { if (--pending === 0) setSync('saved'); return r; })
      .catch(err => {
        pending--;
        setSync('error', err);
        App.toast('구글 시트에 저장하지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요. (' + (err && err.message || err) + ')', 'error');
        throw err;
      });
  }
  const opPut = (col, x) => ({ sheet: SHEETS[col][0], op: 'put', id: x.id, row: toRow(col, x) });
  const opDel = (col, id) => ({ sheet: SHEETS[col][0], op: 'del', id });
  const schema = () => Object.fromEntries([...COLS.map(c => [SHEETS[c][0], SHEETS[c][1].map(x => x[1])]), [STAFF_SHEET[0], STAFF_SHEET[1].map(x => x[1])]]);

  function fromServer(res) {
    const next = { version: 1 };
    for (const col of COLS) next[col] = (res.sheets[SHEETS[col][0]] || []).map(r => fromRow(col, r)).filter(o => keepRow(col, o));
    const st = res.settings || {};
    next.settings = {
      orgName: st.orgName || '', cityMapUrl: st.cityMapUrl ?? null,
      staff: (res.sheets[STAFF_SHEET[0]] || []).map(r => ({ name: r['이름'], program: r['소속 사업'] || '' })),
    };
    next.isDemo = st.isDemo === 'Y';
    return normalize(next);
  }
  function serverPayload(s) {
    const sheets = {};
    for (const col of COLS) sheets[SHEETS[col][0]] = s[col].map(x => toRow(col, x));
    sheets[STAFF_SHEET[0]] = s.settings.staff.map(x => ({ '이름': x.name, '소속 사업': x.program || '' }));
    return { sheets, settings: { orgName: s.settings.orgName, cityMapUrl: s.settings.cityMapUrl || '', isDemo: s.isDemo ? 'Y' : '' } };
  }

  let lastSig = '';
  async function refresh() {
    if (!REMOTE || pending) return;
    try {
      const res = await call('api_load', schema());
      if (pending) return; // 불러오는 사이 저장이 시작되면 다음 기회에
      const next = fromServer(res);
      const sig = JSON.stringify(next);
      if (sig !== lastSig) { lastSig = sig; state = next; notify(); }
      setSync('saved');
    } catch (err) { setSync('error', err); }
  }

  /* ---------- 초기화 ---------- */
  async function init() {
    if (REMOTE) {
      const res = await call('api_load', schema());
      state = fromServer(res);
      lastSig = JSON.stringify(state);
      setSync('saved');
      setInterval(refresh, 60000);
      window.addEventListener('focus', refresh);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      return state;
    }
    const raw = await readRaw();
    state = normalize(raw && raw.version ? raw : D.demo());
    if (!raw) persistLocal();
    return state;
  }

  const get = () => state;
  function notify() { listeners.forEach(fn => fn()); }
  function commit() { persistLocal(); if (REMOTE) lastSig = JSON.stringify(state); notify(); }
  const subscribe = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  async function replace(next) {
    next = normalize(next);
    if (REMOTE) {
      // 사진은 시트 밖에서 따로 올린다
      const photos = next.cards.filter(c => typeof c.photo === 'string' && c.photo.startsWith('data:'));
      photos.forEach(c => { photoCache.set(c.id, c.photo); c.photo = 'Y'; });

    }

  }
  async function saveSettings(patch) {
    Object.assign(state.settings, patch);
    normalize(state);
    commit();
    if (REMOTE) await send('api_saveSettings', serverPayload(state).settings, serverPayload(state).sheets[STAFF_SHEET[0]]);
  }

  /* ---------- CRUD ---------- */
  const COL = { biz: 'businesses', net: 'networks', card: 'cards', act: 'activities', ev: 'events' };
  const PREFIX = { biz: 'B', net: 'N', card: 'C', act: 'A', ev: 'E' };
  const find = (kind, id) => state[COL[kind]].find(x => x.id === id);
  const photoCache = new Map();

  function upsert(kind, obj) {
    const col = COL[kind];
    const list = state[col];
    if (!obj.id) obj.id = U.uid(PREFIX[kind]);
    Object.keys(obj).forEach(k => obj[k] === undefined && delete obj[k]);
    const i = list.findIndex(x => x.id === obj.id);
    const before = i >= 0 ? list[i] : null;
    if (kind !== 'act' && kind !== 'ev') { obj.updatedAt = U.today(); if (!before) obj.createdAt = U.today(); }
    let photoOp = null;
    if (REMOTE && kind === 'card' && 'photo' in obj) {
      if (typeof obj.photo === 'string' && obj.photo.startsWith('data:')) { photoCache.set(obj.id, obj.photo); photoOp = ['api_putPhoto', obj.id, obj.photo]; obj.photo = 'Y'; }
      else if (!obj.photo && before && before.photo) { photoCache.delete(obj.id); photoOp = ['api_delPhoto', obj.id]; obj.photo = null; }
    }
    const rec = before ? { ...before, ...obj } : obj;
    if (i >= 0) list[i] = rec; else list.push(rec);
    commit();
    if (REMOTE) {
      send('api_apply', [opPut(col, rec)]).catch(() => {});
      if (photoOp) send(...photoOp).catch(() => {});
    }
    return rec;
  }

  function remove(kind, id) {
    const col = COL[kind];
    const list = state[col];
    const i = list.findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = list.splice(i, 1);
    const removed = { acts: [], evs: [], cards: [] };
    if (kind === 'biz' || kind === 'net') {
      removed.acts = state.activities.filter(a => a.targetType === kind && a.targetId === id);
      removed.evs = state.events.filter(e => e.targetType === kind && e.targetId === id);
      state.activities = state.activities.filter(a => !(a.targetType === kind && a.targetId === id));
      state.events = state.events.filter(e => !(e.targetType === kind && e.targetId === id));
      state.cards.forEach(c => { if (c.linkType === kind && c.linkId === id) { removed.cards.push(c); c.linkType = ''; c.linkId = ''; } });
    }
    commit();
    if (REMOTE) {
      send('api_apply', [opDel(col, id), ...removed.acts.map(a => opDel('activities', a.id)), ...removed.evs.map(e => opDel('events', e.id)), ...removed.cards.map(c => opPut('cards', c))]).catch(() => {});
      if (kind === 'card' && gone.photo) send('api_delPhoto', id).catch(() => {}); // 되돌리기 시 사진은 복구되지 않음
    }
    return () => { // 되돌리기
      list.splice(Math.min(i, list.length), 0, gone);
      state.activities.push(...removed.acts);
      state.events.push(...removed.evs);
      removed.cards.forEach(c => { c.linkType = kind; c.linkId = id; });
      if (kind === 'card' && REMOTE && gone.photo) gone.photo = photoCache.has(id) ? gone.photo : null;
      commit();
      if (REMOTE) {
        send('api_apply', [opPut(col, gone), ...removed.acts.map(a => opPut('activities', a)), ...removed.evs.map(e => opPut('events', e)), ...removed.cards.map(c => opPut('cards', c))]).catch(() => {});
        if (kind === 'card' && photoCache.has(id)) send('api_putPhoto', id, photoCache.get(id)).catch(() => {});
      }
    };
  }

  /** 명함 사진: 로컬 모드는 data URL, 공유 모드는 필요할 때 시트에서 불러온다 */
  const photoLoading = new Set();
  function photo(c) {
    if (!c || !c.photo) return null;
    if (typeof c.photo === 'string' && c.photo.startsWith('data:')) return c.photo;
    if (!REMOTE) return null;
    if (photoCache.has(c.id)) return photoCache.get(c.id);
    if (!photoLoading.has(c.id)) {
      photoLoading.add(c.id);
      call('api_getPhoto', c.id).then(d => { photoCache.set(c.id, d || null); notify(); }).catch(() => {}).finally(() => photoLoading.delete(c.id));
    }
    return null;
  }

  /* ---------- 직원 · 소속 · 보기 범위 ---------- */
  const staff = () => state.settings.staff;
  const programOf = name => (staff().find(s => s.name === name) || {}).program || '';
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } };
  let scope = lsGet('ardim.scope') || 'all';
  const getScope = () => scope;
  function setScope(v) { scope = v; lsSet('ardim.scope', v); notify(); }
  function me() { const m = lsGet('ardim.me'); return staff().some(s => s.name === m) ? m : (staff()[0]?.name || ''); }
  function setMe(v) { lsSet('ardim.me', v); notify(); }
  function staffInScope(name) {
    if (scope === 'all') return true;
    if (scope.startsWith('p:')) return programOf(name) === scope.slice(2);
    if (scope.startsWith('s:')) return name === scope.slice(2);
    return true;
  }
  function scopeLabel() {
    if (scope.startsWith('p:')) return scope.slice(2);
    if (scope.startsWith('s:')) return scope.slice(2) + ' 담당';
    return '전체 팀';
  }
  /** 현재 보기 범위(전체 팀/소속/직원)에 해당하는 데이터 */
  function view() {
    if (scope === 'all') return state;
    const biz = state.businesses.filter(b => staffInScope(b.staff));
    const net = state.networks.filter(n => staffInScope(n.staff));
    const ids = new Set([...biz.map(b => 'biz' + b.id), ...net.map(n => 'net' + n.id)]);
    const inT = x => !x.targetType || ids.has(x.targetType + x.targetId);
    return {
      ...state,
      businesses: biz, networks: net,
      cards: state.cards.filter(c => !c.linkType || ids.has(c.linkType + c.linkId)),
      activities: state.activities.filter(a => staffInScope(a.staff) || (a.targetType && ids.has(a.targetType + a.targetId))),
      events: state.events.filter(inT),
    };
  }

  /* ---------- 파생 조회 ---------- */
  const actsOf = (kind, id) => state.activities.filter(a => a.targetType === kind && a.targetId === id).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const eventsOf = (kind, id) => state.events.filter(e => e.targetType === kind && e.targetId === id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const cardsOf = (kind, id) => state.cards.filter(c => c.linkType === kind && c.linkId === id);
  const lastAct = (kind, id) => actsOf(kind, id)[0] || null;
  const nextEvent = (kind, id) => eventsOf(kind, id).find(e => !e.done) || null;
  const targetOf = x => (x.targetType && x.targetId ? find(x.targetType, x.targetId) : null);
  const linkOf = c => (c.linkType && c.linkId ? find(c.linkType, c.linkId) : null);

  function stats(v = view()) {
    const ym = U.today().slice(0, 7);
    const b = v.businesses;
    const byStage = Object.fromEntries(D.STAGES.map(s => [s.key, 0]));
    b.forEach(x => { byStage[x.stage] = (byStage[x.stage] || 0) + 1; });
    const placedPeople = b.reduce((s, x) => s + (Number(x.placements) || 0), 0);
    const newThisMonth = b.filter(x => (x.discoveredAt || '').startsWith(ym)).length;
    const active = D.ACTIVE_STAGES.reduce((s, k) => s + (byStage[k] || 0), 0);
    const mandatoryBiz = b.filter(x => D.mandatoryCount(x.employees) > 0).length;
    const netActive = v.networks.filter(n => n.status === '활발').length;
    const cardsThisMonth = v.cards.filter(c => (c.metAt || c.createdAt || '').startsWith(ym)).length;
    return { total: b.length, byStage, placedPeople, newThisMonth, active, mandatoryBiz, netTotal: v.networks.length, netActive, cardTotal: v.cards.length, cardsThisMonth, placedBiz: byStage['채용연계'] || 0 };
  }

  /** 직원별·소속별 실적 (전체 팀 기준) */
  function staffStats() {
    const ym = U.today().slice(0, 7);
    const row = name => {
      const b = state.businesses.filter(x => x.staff === name);
      return {
        biz: b.length,
        active: b.filter(x => D.ACTIVE_STAGES.includes(x.stage)).length,
        placedBiz: b.filter(x => x.stage === '채용연계').length,
        placed: b.reduce((s, x) => s + (Number(x.placements) || 0), 0),
        net: state.networks.filter(x => x.staff === name).length,
        actsMonth: state.activities.filter(a => a.staff === name && a.date.startsWith(ym)).length,
      };
    };
    const people = staff().map(s => ({ ...s, ...row(s.name) }));
    const sum = list => list.reduce((t, r) => { for (const k of ['biz', 'active', 'placedBiz', 'placed', 'net', 'actsMonth']) t[k] = (t[k] || 0) + r[k]; return t; }, {});
    const groups = [...D.PROGRAMS.map(p => p.key), ''].map(key => ({ key, people: people.filter(p => (p.program || '') === key) })).filter(g => g.people.length).map(g => ({ ...g, total: sum(g.people) }));
    const known = new Set(staff().map(s => s.name));
    const orphan = state.businesses.filter(b => !known.has(b.staff)).length;
    return { groups, total: sum(people), orphan };
  }

  /** 최근 12개월: 신규 발굴 수, 채용연계 활동 수 */
  function monthly(v = view()) {
    const T = U.parse(U.today());
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(T.getFullYear(), T.getMonth() - i, 1);
      months.push({ key: `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}월`, discovered: 0, placed: 0 });
    }
    const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
    v.businesses.forEach(b => { const i = idx[(b.discoveredAt || '').slice(0, 7)]; if (i != null) months[i].discovered++; });
    v.activities.forEach(a => { if (a.type === '채용연계') { const i = idx[a.date.slice(0, 7)]; if (i != null) months[i].placed++; } });
    return months;
  }

  /** 오늘 확인할 일: 지난 미완료 일정, 7일 내 일정, 연락 공백이 긴 진행 중 사업체 */
  function priorities(v = view()) {
    const T = U.today();
    const out = [];
    v.events.filter(e => !e.done && U.diffDays(T, e.date) <= 7).forEach(e => {
      const t = targetOf(e);
      out.push({ kind: 'ev', id: e.id, date: e.date, name: t ? t.name : e.title, why: t ? `${e.type}${e.time ? ' · ' + e.time : ''}` : e.type, staff: t?.staff || '', target: t ? { kind: e.targetType, id: t.id } : null, sort: U.diffDays(T, e.date) });
    });
    v.businesses.filter(b => D.ACTIVE_STAGES.includes(b.stage) && !nextEvent('biz', b.id)).forEach(b => {
      const la = lastAct('biz', b.id);
      const gap = la ? U.diffDays(la.date, T) : 999;
      if (gap >= 21) out.push({ kind: 'gap', id: b.id, date: la?.date, name: b.name, why: `${b.stage} 단계 · 마지막 연락 ${gap}일 전`, staff: b.staff, gap, target: { kind: 'biz', id: b.id }, sort: 8 + (60 - Math.min(gap, 60)) / 100 });
    });
    return out.sort((a, b) => a.sort - b.sort);
  }

  function recentActs(n = 8, v = view()) {
    return [...v.activities].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, n);
  }

  /* ---------- 검색 (보기 범위와 관계없이 팀 전체) ---------- */
  function search(q) {
    const nq = U.norm(q);
    if (!nq) return { biz: [], net: [], card: [] };
    const hit = (...vals) => vals.some(v => U.norm(v).includes(nq));
    const biz = state.businesses.filter(b => hit(b.name, b.industry, b.ceo, b.address, b.area, b.bizNo, b.jobs, b.memo, b.staff) || cardsOf('biz', b.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const net = state.networks.filter(n => hit(n.name, n.category, n.address, n.area, n.relation, n.memo, n.staff) || cardsOf('net', n.id).some(c => hit(c.name, c.mobile, c.phone, c.email)));
    const card = state.cards.filter(c => hit(c.name, c.org, c.title, c.dept, c.phone, c.mobile, c.email, (c.tags || []).join(' '), c.memo));
    return { biz: biz.slice(0, 8), net: net.slice(0, 6), card: card.slice(0, 8) };
  }

  /* ---------- 엑셀 ---------- */
  function exportXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) {
      const [sheet, cols] = SHEETS[col];
      const ws = XLSX.utils.json_to_sheet(state[col].map(x => toRow(col, x)), { header: cols.map(c => c[1]) });
      ws['!cols'] = cols.map(([k]) => ({ wch: ['name', 'address', 'memo', 'content', 'relation', 'jobs', 'accessibility', 'title', 'org'].includes(k) ? 28 : 13 }));
      XLSX.utils.book_append_sheet(wb, ws, sheet);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.settings.staff.map(s => ({ '이름': s.name, '소속 사업': s.program })), { header: ['이름', '소속 사업'] }), STAFF_SHEET[0]);
    XLSX.writeFile(wb, `아르딤_취업지원_${U.today()}.xlsx`);
  }

  function parseXlsx(buf) {
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const next = D.empty();
    next.settings = { ...state.settings };
    const found = [];
    for (const col of COLS) {
      const ws = wb.Sheets[SHEETS[col][0]];
      if (!ws) continue;
      found.push(SHEETS[col][0]);
      next[col] = XLSX.utils.sheet_to_json(ws, { defval: '' }).map(r => fromRow(col, r)).filter(o => keepRow(col, o));
    }
    const sw = wb.Sheets[STAFF_SHEET[0]];
    if (sw) {
      const list = XLSX.utils.sheet_to_json(sw, { defval: '' }).map(r => ({ name: String(r['이름'] || '').trim(), program: String(r['소속 사업'] || '').trim() })).filter(s => s.name);
      if (list.length) { next.settings.staff = list; found.push(STAFF_SHEET[0]); }
    }
    // 사진은 엑셀에 없으므로 같은 ID의 기존 사진을 유지
    const old = Object.fromEntries(state.cards.filter(c => c.photo).map(c => [c.id, c.photo]));
    next.cards.forEach(c => { c.photo = old[c.id] || null; });
    return { next: normalize(next), found };
  }

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function exportJson() {
    const copy = { ...state, cards: state.cards.map(c => ({ ...c, photo: photo(c) || (REMOTE ? null : c.photo) })) };
    download(`아르딤_취업지원_백업_${U.today()}.json`, new Blob([JSON.stringify(copy)], { type: 'application/json' }));
  }
  function templateXlsx() {
    const wb = XLSX.utils.book_new();
    for (const col of COLS) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([SHEETS[col][1].map(c => c[1])]), SHEETS[col][0]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['이름', '소속 사업']]), STAFF_SHEET[0]);
    XLSX.writeFile(wb, '아르딤_취업지원_엑셀양식.xlsx');
  }

  return {
    REMOTE, init, get, commit, subscribe, replace, saveSettings, find, upsert, remove, photo,
    staff, programOf, getScope, setScope, scopeLabel, me, setMe, view,
    actsOf, eventsOf, cardsOf, lastAct, nextEvent, targetOf, linkOf, stats, staffStats, monthly, priorities, recentActs, search,
    exportXlsx, parseXlsx, exportJson, templateXlsx, refresh, SHEETS,
    sync, onSync: fn => { syncListeners.add(fn); return () => syncListeners.delete(fn); },
  };
})();

</script>
<script>
/* 지도: Leaflet + CARTO 기본지도 (인터넷 연결 필요) */
window.M = (() => {
  const TILE = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
  const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
  const maps = new Map();
  let warned = false;
  const pin = () => L.divIcon({ className: '', html: '<div class="pick-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 26] });

  function create(el, opts = {}) {
    if (!window.L) { el.innerHTML = '<div class="empty"><strong>지도를 불러오지 못했습니다</strong>페이지를 새로고침해 보세요.</div>'; return null; }
    const old = maps.get(el);
    if (old) old.remove();
    const map = L.map(el, { zoomControl: opts.zoomControl !== false, scrollWheelZoom: opts.scroll !== false, attributionControl: true })
      .setView(opts.center || D.CITY_CENTER, opts.zoom || 11);
    const layer = L.tileLayer(TILE, { attribution: ATTR, subdomains: 'abcd', maxZoom: 19 }).addTo(map);
    layer.on('tileerror', () => { if (!warned) { warned = true; App.toast('지도 배경을 불러오지 못했습니다. 인터넷 연결을 확인하세요.', 'error'); } });
    maps.set(el, map);
    setTimeout(() => map.invalidateSize(), 60);
    return map;
  }

  function bizMarker(b) {
    const st = D.STAGE[b.stage] || D.STAGE['발굴'];
    return L.circleMarker([b.lat, b.lng], {
      radius: b.stage === '채용연계' ? 8 : 7, color: '#fff', weight: 2, fillColor: st.hex, fillOpacity: b.stage === '보류' ? .75 : .95,
    });
  }
  function netMarker(n) {
    return L.marker([n.lat, n.lng], { icon: L.divIcon({ className: '', html: `<div class="net-pin" style="${n.status === '휴면' ? 'opacity:.55' : ''}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] }) });
  }
  const hasPos = x => x && x.lat != null && x.lng != null && !isNaN(x.lat) && !isNaN(x.lng) && x.lat !== '' && x.lng !== '';

  function popupHtml(kind, x) {
    const meta = kind === 'biz'
      ? `${U.esc(x.stage)} · ${U.esc(x.industry || '')} · ${U.esc(x.area || '')}`
      : `${U.esc(x.category)} · 관계 ${U.esc(x.status)} · ${U.esc(x.area || '')}`;
    return `<div class="pop-name">${U.esc(x.name)}</div><div class="pop-meta">${meta}${x.approx ? '<br>읍면동 중심의 대략적 위치' : ''}</div>
      <button class="btn btn-sm btn-primary" type="button" data-act="open" data-kind="${kind}" data-id="${x.id}">상세 보기</button>`;
  }

  /** 위치 지정용 지도: 클릭하면 핀 이동 */
  function picker(el, pos, onPick) {
    const has = pos && hasPos(pos);
    const map = create(el, { center: has ? [pos.lat, pos.lng] : D.CITY_CENTER, zoom: has ? 15 : 11 });
    if (!map) return null;
    let marker = has ? L.marker([pos.lat, pos.lng], { draggable: true, icon: pin() }).addTo(map) : null;
    const set = (lat, lng, zoom) => {
      lat = +lat.toFixed(6); lng = +lng.toFixed(6);
      if (!marker) { marker = L.marker([lat, lng], { draggable: true, icon: pin() }).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); }); }
      else marker.setLatLng([lat, lng]);
      if (zoom) map.setView([lat, lng], zoom);
      onPick(lat, lng);
    };
    if (marker) marker.on('dragend', () => { const p = marker.getLatLng(); onPick(+p.lat.toFixed(6), +p.lng.toFixed(6)); });
    map.on('click', e => set(e.latlng.lat, e.latlng.lng));
    return { map, set };
  }

  /** 주소 → 좌표 (OpenStreetMap Nominatim, 인터넷 필요. 한국 도로명 주소는 못 찾을 수 있음) */
  async function geocode(address) {
    const q = String(address || '').trim();
    if (!q) return null;
    const tries = [q, q.replace(/\s*\d+(-\d+)?\s*$/, ''), q.includes('화성') ? null : '화성시 ' + q].filter(Boolean);
    for (const t of tries) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(t)}`;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('geocode ' + res.status);
      const j = await res.json();
      if (j[0]) return { lat: +(+j[0].lat).toFixed(6), lng: +(+j[0].lon).toFixed(6), label: j[0].display_name };
    }
    return null;
  }

  const kakaoLink = x => `https://map.kakao.com/link/map/${encodeURIComponent(x.name)},${x.lat},${x.lng}`;
  const naverSearch = x => `https://map.naver.com/p/search/${encodeURIComponent(x.address || x.name)}`;

  return { create, bizMarker, netMarker, hasPos, popupHtml, picker, geocode, kakaoLink, naverSearch };
})();

</script>

  function chart(months) {
    const W = 640, H = 210, L = 30, R = 8, T = 16, B = 26;
    const max = Math.max(1, ...months.map(m => Math.max(m.discovered, m.placed)));
    const top = Math.max(2, Math.ceil(max / 2) * 2);
    const y = v => T + (H - T - B) * (1 - v / top);
    const gw = (W - L - R) / months.length;
    const bw = Math.min(14, gw / 3.2);
    const ticks = [0, top / 2, top];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12개월 신규 발굴 사업체 수와 채용연계 건수">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
      ${months.map((m, i) => {
        const cx = L + gw * i + gw / 2;
        const bar = (v, x, c, label) => v ? `<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="2" fill="${c}"><title>${m.label} ${label} ${v}</title></rect><text x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v}</text>` : '';
        return `${bar(m.discovered, cx - bw - 1, 'var(--accent)', '신규 발굴')}${bar(m.placed, cx + 1, 'var(--success)', '채용연계')}
          <text x="${cx}" y="${H - 8}" text-anchor="middle" ${i === months.length - 1 ? 'style="fill:var(--text);font-weight:700"' : ''}>${m.label}</text>`;
      }).join('')}
    </svg>`;
  }

  function bizFiltered() {
    const f = ui.biz;
    const nq = U.norm(f.q);
    let list = S.view().businesses.filter(b => {
      if (f.stage !== '전체' && b.stage !== f.stage) return false;
      if (f.area && b.area !== f.area) return false;
      if (f.industry && b.industry !== f.industry) return false;
      if (f.mandatory && !D.mandatoryCount(b.employees)) return false;
      if (nq) {
        const hay = [b.name, b.industry, b.jobs, b.address, b.ceo, b.memo, b.staff, ...S.cardsOf('biz', b.id).flatMap(c => [c.name, c.mobile, c.phone])].map(U.norm).join('|');
        if (!hay.includes(nq)) return false;
      }
      return true;
    }).map(b => ({ b, la: S.lastAct('biz', b.id), ne: S.nextEvent('biz', b.id), pc: primaryContact('biz', b.id) }));
    const sorters = {
      recent: (x, y) => (y.la?.date || '').localeCompare(x.la?.date || ''),
      next: (x, y) => (x.ne?.date || '9999').localeCompare(y.ne?.date || '9999'),
      found: (x, y) => (y.b.discoveredAt || '').localeCompare(x.b.discoveredAt || ''),
      name: (x, y) => x.b.name.replace(/^\(주\)/, '').localeCompare(y.b.name.replace(/^\(주\)/, ''), 'ko'),
    };
    return list.sort(sorters[f.sort] || sorters.recent);
  }

      .sort((x, y) => (y.la?.date || '').localeCompare(x.la?.date || ''));
    if (!rows.length) return `<div class="panel"><div class="empty"><strong>조건에 맞는 기관이 없습니다</strong>검색어나 분류를 바꿔 보세요.</div></div>`;
    return `<div class="panel">
      <div class="table-wrap has-mobile"><table class="tbl">
        <thead><tr><th>기관</th><th>관계</th><th>협력 내용</th><th>기관 담당자</th><th>우리 담당</th><th>최근 활동</th><th>다음 일정</th></tr></thead>
        <tbody>${rows.map(({ n, la, ne, pc }) => `
          <tr data-act="open" data-kind="net" data-id="${n.id}">
            <td><div class="name">${U.hl(n.name, f.q)}</div><div class="meta">${e(n.category)} · ${e(n.area || '')}</div></td>
            <td>${statusBadge(n.status)}</td>
            <td><div class="clip" title="${e(n.relation)}">${e(n.relation || '-')}</div><div class="meta clip">홍보: ${e(n.promo || '-')}</div></td>
            <td>${pc ? `<div>${e(pc.name)} <span class="meta">${e(pc.title || '')}</span></div><div class="meta num">${e(tel(pc))}</div>` : '<span class="meta">명함 없음</span>'}</td>
            <td class="nowrap">${staffTag(n.staff)}</td>
            <td class="nowrap">${la ? `<div class="num">${U.dateDot(la.date)}</div><div class="meta">${e(la.type)} · ${U.ago(la.date)}</div>` : '-'}</td>
            <td class="nowrap">${ne ? `${ddayBadge(ne.date)}<div class="meta">${e(ne.type)}</div>` : '<span class="meta">-</span>'}</td>
          </tr>`).join('')}</tbody></table></div>
      <div class="mlist">${rows.map(({ n, la, pc }) => `
        <div class="mrow" data-act="open" data-kind="net" data-id="${n.id}">
          <div class="mrow-top"><span class="name">${U.hl(n.name, f.q)}</span>${statusBadge(n.status)}</div>
          <div class="meta">${e(n.category)} · ${e(n.relation || '')}</div>
          <div class="meta">${pc ? `${e(pc.name)} ${e(tel(pc))}` : ''}${la ? ` · 최근 ${U.ago(la.date)}` : ''}</div>
        </div>`).join('')}</div>
      <div class="list-count num">${rows.length}곳 표시 · ${e(S.scopeLabel())} ${all.length}곳</div>
    </div>`;
  }

  /* ================= 명함 ================= */
  function cardsPage() {
    const f = ui.cards;
    const all = S.view().cards;
    const cnt = k => all.filter(c => k === 'all' ? true : k === 'none' ? !c.linkType : c.linkType === k).length;
    return `
      <div class="page-head">
        <div><h1 class="page-title">명함 관리</h1><div class="page-desc">받은 명함을 사업체·기관과 연결해 두면 상세 화면에서 바로 연락할 수 있습니다.</div></div>
        <button class="btn btn-primary" type="button" data-act="new-card">+ 명함 등록</button>
      </div>
      <div class="chips" style="margin-bottom:12px">${[['all', '전체'], ['biz', '사업체 담당자'], ['net', '네트워크 기관'], ['none', '연결 안 됨']].map(([k, l]) => `<button type="button" class="chip ${f.link === k ? 'on' : ''}" data-act="card-link" data-link="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
      <div class="toolbar">
        <input class="input" id="cardQ" type="search" placeholder="이름, 소속, 전화번호, 이메일, 태그" value="${e(f.q)}">
        <span class="spacer"></span>
        <select class="select" id="cardSort" aria-label="정렬">
          <option value="recent" ${f.sort === 'recent' ? 'selected' : ''}>최근 받은 순</option>
          <option value="name" ${f.sort === 'name' ? 'selected' : ''}>이름순</option>
          <option value="org" ${f.sort === 'org' ? 'selected' : ''}>소속순</option>
        </select>
      </div>
      <div id="cardResults"></div>`;
  }
  function cardResults() {
    const f = ui.cards;
    const nq = U.norm(f.q);
    const all = S.view().cards;
    if (!all.length) return `<div class="panel">${emptyState('등록된 명함이 없습니다', '명함 사진과 연락처를 등록해 보세요.', 'new-card', '+ 명함 등록')}</div>`;
    const rows = all.filter(c => (f.link === 'all' || (f.link === 'none' ? !c.linkType : c.linkType === f.link)) &&
      (!nq || [c.name, c.org, c.dept, c.title, c.mobile, c.phone, c.email, (c.tags || []).join(','), c.memo].map(U.norm).join('|').includes(nq)))
      .sort({
        recent: (a, b) => (b.metAt || '').localeCompare(a.metAt || ''),
        name: (a, b) => a.name.localeCompare(b.name, 'ko'),
        org: (a, b) => (a.org || '').replace(/^\(주\)/, '').localeCompare((b.org || '').replace(/^\(주\)/, ''), 'ko'),
      }[f.sort]);
    if (!rows.length) return `<div class="panel"><div class="empty"><strong>검색 결과가 없습니다</strong>이름 일부나 전화번호 뒷자리로도 찾을 수 있어요.</div></div>`;
    return `<div class="card-grid">${rows.map(c => {
      const link = S.linkOf(c);
      return `<article class="bcard" data-act="open" data-kind="card" data-id="${c.id}" tabindex="0">
        <div class="org">${c.linkType === 'biz' ? `<span class="badge stage-badge" style="--c:${D.STAGE[link?.stage]?.color || 'var(--muted)'}"><span class="dot"></span>사업체</span>` : c.linkType === 'net' ? '<span class="badge navy">기관</span>' : ''}<span>${U.hl(c.org || '소속 미기재', f.q)}</span></div>
        <div class="pname">${U.hl(c.name, f.q)}<span class="ptitle">${e([c.dept, c.title].filter(Boolean).join(' · '))}</span></div>
        <div class="contact">
          ${c.mobile ? `<div>M ${U.hl(c.mobile, f.q)}</div>` : ''}
          ${c.phone ? `<div>T ${U.hl(c.phone, f.q)}</div>` : ''}
          ${c.email ? `<div>${e(c.email)}</div>` : ''}
        </div>
        ${c.photo ? '<span class="tagline photo-flag">사진 있음</span>' : ''}${link && link.staff ? `<span class="card-staff">우리 담당 ${e(link.staff)}</span>` : ''}
      </article>`;
    }).join('')}</div><p class="sub num" style="margin-top:12px">${rows.length}장 표시 · ${e(S.scopeLabel())} ${all.length}장</p>`;
  }

  /* ================= 지도 ================= */
  function mapPage() {
    const f = ui.map;
    const st = S.view();
    const noPos = st.businesses.filter(b => !M.hasPos(b)).length + st.networks.filter(n => !M.hasPos(n)).length;
    return `
      <div class="page-head">
        <div><h1 class="page-title">화성시 지도</h1><div class="page-desc">발굴 사업체는 진행 단계별 색상 원, 네트워크 기관은 남색 마름모로 표시합니다.${scopeNote()}</div></div>
        <div class="inline"><button class="btn" type="button" data-act="new-net">+ 기관 등록</button><button class="btn btn-primary" type="button" data-act="new-biz">+ 사업체 발굴 등록</button></div>
      </div>
      <div class="chips" style="margin-bottom:12px" role="tablist">
        <button type="button" role="tab" class="chip ${f.mode === 'ours' ? 'on' : ''}" data-act="map-mode" data-mode="ours" aria-selected="${f.mode === 'ours'}">사업체·네트워크 지도</button>
        <button type="button" role="tab" class="chip ${f.mode === 'city' ? 'on' : ''}" data-act="map-mode" data-mode="city" aria-selected="${f.mode === 'city'}">화성시 대시보드</button>
      </div>
      ${f.mode === 'city' ? cityMap() : `<section class="panel map-layout">
        <div class="map-side">
          <div class="map-side-head">
            <input class="input" id="mapQ" type="search" placeholder="지도에서 이름 찾기" value="${e(f.q)}">
            <div class="chips">
              <button type="button" class="chip ${f.biz ? 'on' : ''}" data-act="map-layer" data-layer="biz">사업체 개발</button>
              <button type="button" class="chip ${f.net ? 'on' : ''}" data-act="map-layer" data-layer="net">네트워크</button>
            </div>
            <div class="map-legend">${D.STAGES.map(s => `<span><label class="check"><input type="checkbox" data-act="map-stage" data-stage="${s.key}" ${f.stages.has(s.key) ? 'checked' : ''} ${f.biz ? '' : 'disabled'}><i style="--c:${s.color}"></i>${s.key}</label></span>`).join('')}<span><i class="sq" style="--c:var(--navy)"></i>네트워크 기관</span></div>
            ${noPos ? `<div class="sub">위치가 없는 곳 ${noPos}곳은 지도에 표시되지 않습니다.</div>` : ''}
          </div>
          <div class="map-list" id="mapList"></div>
        </div>
        <div class="map-canvas"><div class="map-box" id="bigMap"></div></div>
      </section>`}`;
  }
  /** 화성시 통합 대시보드(공유 링크)를 그대로 보여준다. 사이트가 다른 곳 안에 표시되는 것을 막으면 새 창 링크를 쓴다. */
  function cityMap() {
    const url = S.get().settings.cityMapUrl || '';
    if (!url) return `<div class="panel">${emptyState('화성시 대시보드 주소가 없습니다', '데이터 관리 > 화성시 대시보드 주소에 공유 링크를 넣어 주세요.')}</div>`;
    return `<section class="panel" style="overflow:hidden">
      <div class="panel-pad" style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-block:12px">
        <span class="sub">화성시 통합 대시보드 공유 화면입니다. 화면이 비어 보이면 새 창에서 여세요.</span>
        <a class="btn btn-sm" href="${e(url)}" target="_blank" rel="noopener">새 창에서 열기</a>
      </div>
      <iframe class="city-frame" src="${e(url)}" title="화성시 통합 대시보드" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen; geolocation"></iframe>
    </section>`;
  }
  function mapItems() {
    const f = ui.map;
    const nq = U.norm(f.q);
    const st = S.view();
    const items = [];
    if (f.biz) st.businesses.filter(b => f.stages.has(b.stage)).forEach(b => items.push({ kind: 'biz', x: b }));
    if (f.net) st.networks.forEach(n => items.push({ kind: 'net', x: n }));
    return items.filter(({ x }) => !nq || U.norm(x.name + x.area + (x.industry || x.category)).includes(nq));
  }
  function mapList(items) {
    if (!items.length) return '<div class="empty"><strong>표시할 곳이 없습니다</strong>레이어나 단계 선택을 확인하세요.</div>';
    return items.map(({ kind, x }) => `
      <div class="map-item" data-act="map-focus" data-kind="${kind}" data-id="${x.id}">
        <span class="mk ${kind === 'net' ? 'sq' : ''}" style="--c:${kind === 'biz' ? D.STAGE[x.stage].color : 'var(--navy)'}"></span>
        <div style="min-width:0"><div class="name">${e(x.name)}</div><div class="meta">${kind === 'biz' ? `${e(x.stage)} · ${e(x.industry)}` : `${e(x.category)} · ${e(x.status)}`} · ${e(x.area || '')}${M.hasPos(x) ? '' : ' · 위치 없음'}</div></div>
      </div>`).join('');
  }

  /* ================= 일정 ================= */
  function schedPage() {
    return `
      <div class="page-head">
        <div><h1 class="page-title">일정</h1><div class="page-desc">사업체 방문, 면접 동행, 기관 행사 등 업무 일정을 관리합니다.</div></div>
        <button class="btn btn-primary" type="button" data-act="new-event">+ 일정 등록</button>
      </div>
      <div class="sched">
        <section class="panel" id="evList"></section>
        <section class="panel cal-panel" id="calBox"></section>
      </div>`;
  }
  function evRow(ev) {
    const t = S.targetOf(ev);
    const d = U.dday(ev.date);
    return `<div class="ev ${ev.done ? 'done' : ''}">
      <input type="checkbox" aria-label="완료 표시" data-act="ev-toggle" data-id="${ev.id}" ${ev.done ? 'checked' : ''}>
      <div class="ev-when">${U.md(ev.date)} ${e(ev.time || '')}</div>
      <div style="min-width:0"><div class="ev-title">${e(ev.title)}</div>
        <div class="ev-target">${t ? `<span data-act="open" data-kind="${ev.targetType}" data-id="${t.id}">${e(t.name)}</span> · ` : ''}${e(ev.type)}${ev.memo ? ' · ' + e(ev.memo) : ''}</div></div>
      <div class="inline">${ev.done ? '<span class="badge success">완료</span>' : `<span class="badge ${d.tone} num">${d.label}</span>`}<button class="icon-btn" type="button" aria-label="일정 수정" data-act="edit-event" data-id="${ev.id}">${I.edit}</button></div>
    </div>`;
  }
  function evList() {
    const f = ui.sched;
    const T = U.today();
    let evs = [...S.view().events].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    if (f.sel) evs = evs.filter(x => x.date === f.sel);
    const groups = f.sel ? [[U.dateKo(f.sel), evs.filter(x => f.showDone || !x.done)]] : [
      ['지난 일정 (완료 안 됨)', evs.filter(x => !x.done && x.date < T)],
      ['오늘', evs.filter(x => !x.done && x.date === T)],
      ['7일 이내', evs.filter(x => !x.done && x.date > T && U.diffDays(T, x.date) <= 7)],
      ['이후', evs.filter(x => !x.done && U.diffDays(T, x.date) > 7)],
      ...(f.showDone ? [['완료한 일정', evs.filter(x => x.done).reverse().slice(0, 30)]] : []),
    ];
    const body = groups.filter(([, l]) => l.length).map(([h, l]) => `<div class="ev-group"><h3>${e(h)} <span class="num">${l.length}</span></h3>${l.map(evRow).join('')}</div>`).join('');
    return `<div class="panel-pad" style="padding-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 class="section-title">${f.sel ? e(U.dateKo(f.sel)) + ' 일정' : '다가오는 일정'}</h2>
        <div class="inline">${f.sel ? '<button class="btn btn-sm" type="button" data-act="cal-clear">전체 일정 보기</button>' : ''}<label class="check"><input type="checkbox" data-act="ev-showdone" ${f.showDone ? 'checked' : ''}>완료 포함</label></div>
      </div>${body || `<div class="empty"><strong>${f.sel ? '이 날은 일정이 없습니다' : '예정된 일정이 없습니다'}</strong>사업체 방문이나 기관 행사를 등록해 보세요.<div><button class="btn btn-primary" type="button" data-act="new-event" data-date="${f.sel || ''}">+ 일정 등록</button></div></div>`}`;
  }
  function calendar() {
    const f = ui.sched;
    const [y, m] = f.month.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(y, m - 1, 1 - first.getDay());
    const T = U.today();
    const byDate = {};
    S.view().events.forEach(x => { (byDate[x.date] ||= []).push(x); });
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = U.fmt(d);
      const evs = (byDate[s] || []).filter(x => !x.done);
      cells += `<button type="button" class="cal-day ${d.getMonth() !== m - 1 ? 'out' : ''} ${s === T ? 'today' : ''} ${s === f.sel ? 'sel' : ''}" data-act="cal-pick" data-date="${s}" aria-label="${U.dateKo(s)} 일정 ${evs.length}건">
        ${d.getDate()}<span class="dots">${evs.slice(0, 3).map(x => `<i class="${x.date < T ? 'late' : ''}"></i>`).join('')}</span></button>`;
    }
    return `<div class="cal"><div class="cal-head"><button class="icon-btn" type="button" data-act="cal-move" data-d="-1" aria-label="이전 달">${I.back}</button><b class="num">${y}년 ${m}월</b><button class="icon-btn" type="button" data-act="cal-move" data-d="1" aria-label="다음 달" style="transform:scaleX(-1)">${I.back}</button></div>
      <div class="cal-grid">${U.WD.map(w => `<div class="cal-dow">${w}</div>`).join('')}${cells}</div></div>`;
  }

        <section class="panel panel-pad">
          <h2 class="section-title">엑셀에서 가져오기</h2>
          <p>내보내기 양식과 같은 시트·열 이름의 엑셀을 올리면 <b>현재 데이터 전체를 교체</b>합니다. 위도·경도가 비어 있으면 읍면동 중심 위치로 표시합니다.</p>
          <input type="file" id="xlsxFile" accept=".xlsx,.xls" hidden>
          <button class="btn" type="button" data-act="xlsx-import">엑셀 파일 선택</button>

        <section class="panel panel-pad">

          <input type="file" id="jsonFile" accept=".json,application/json" hidden>
