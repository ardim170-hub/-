<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아르딤 취업지원 CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 레이아웃: 좌측 사이드바 + 상단 검색바 + 본문, 상세/등록은 우측 Drawer (모바일은 전체 화면 + 하단 탭) */
:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface-2: #F1F3F7;
  --line: #E4E7EC;
  --line-strong: #D0D5DD;
  --text: #172033;
  --text-2: #667085;
  --navy: #132B4F;
  --accent: #2563EB;
  --accent-soft: #EAF1FE;
  --success: #2F7D57;
  --success-soft: #E7F3EC;
  --warning: #A86A0C;
  --warning-soft: #FBF1DF;
  --danger: #B42318;
  --danger-soft: #FBE9E7;
  --muted: #8A94A6;
  --muted-soft: #EEF0F4;

  --prog-a: #0F7B7B;
  --prog-b: #6A4FB8;

  --st-discover: #8A94A6;
  --st-contact: #6B9BEF;
  --st-visit: #2563EB;
  --st-negotiate: #C98A1B;
  --st-placed: #2F7D57;
  --st-hold: #B8BFCC;

  /* 종류별 색 (지도·목록·상세·대시보드 공통): 사업체 노랑, 지원고용·현장훈련 빨강, 기관 검정, 복지관 금색, 명함 청록, 중복 주황 */
  --k-biz: #F5B700;      --k-biz-soft: #FFF6D6;      --k-biz-ink: #7A5A00;
  --k-support: #E5383B;  --k-support-soft: #FDE8E8;  --k-support-ink: #A61B1E;
  --k-net: #1B1F24;      --k-net-soft: #ECEEF1;      --k-net-ink: #1B1F24;
  --k-home: #D4A017;     --k-home-soft: #FFF8E1;     --k-home-ink: #6B4E00;
  --k-card: #0E9384;     --k-card-soft: #E3F6F3;     --k-card-ink: #0B6B61;
  --k-ev: #2563EB;       --k-ev-soft: #EAF1FE;       --k-ev-ink: #1D4ED8;
  --k-dup: #EA580C;      --k-dup-soft: #FFF1E6;      --k-dup-ink: #C2410C;

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
  --sidebar: 236px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 12px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 16px;
}
.brand-name { font-weight: 700; font-size: 15px; color: var(--navy); }
.brand-sub { font-size: 11.5px; color: var(--text-2); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
  color: var(--text-2); font-weight: 500; text-decoration: none;
}
.side-nav a svg { width: 18px; height: 18px; flex: none; }
svg { stroke-linecap: round; stroke-linejoin: round; }
.side-nav svg, .bottom-nav svg, .icon-btn svg, .btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
.side-nav a:hover { background: var(--surface-2); color: var(--text); }
.side-nav a.active { background: var(--accent-soft); color: var(--navy); font-weight: 650; }
.side-nav a .count { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 28px; background: rgba(247, 248, 250, .92); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.search-trigger {
  flex: 1; min-width: 0; max-width: 560px; display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--text-2); cursor: text; text-align: left;
}
.search-trigger svg, .search-input-row svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }
.search-trigger span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font-family: inherit; font-size: 11.5px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.scope-select { width: auto; max-width: 210px; font-weight: 600; }
.scope-select.scoped { border-color: var(--accent); background: var(--accent-soft); color: var(--navy); }
.sync { font-size: 12.5px; color: var(--text-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--success); }
.sync.busy::before { background: var(--warning); }
.sync.err { color: var(--danger); font-weight: 600; }
.sync.err::before { background: var(--danger); }
.badge.prog { height: 19px; padding: 0 6px; font-size: 11px; background: transparent; border: 1px solid var(--c); color: var(--c); margin-left: 4px; }
.staff-tag { display: inline-flex; align-items: center; white-space: nowrap; }
.staff-tbl td, .staff-tbl th { padding: 8px 10px; white-space: nowrap; }
.staff-tbl tbody tr[data-act] { cursor: pointer; }
.prog-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 1px; }
.staff-tbl tr.grp td { background: var(--surface-2); }
.staff-tbl tr.total td { border-top: 1px solid var(--line-strong); }
.staff-tbl .indent { padding-left: 14px; display: inline-block; }
.staff-tbl .meta { margin-left: 2px; font-size: 12px; color: var(--text-2); }
.card-staff { position: absolute; right: 14px; bottom: 12px; font-size: 11.5px; color: var(--text-2); }
.staff-rows { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.staff-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; z-index: 30;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px; display: flex; flex-direction: column;
}
.menu button { text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; }
.menu button:hover { background: var(--surface-2); }

.demo-banner {
  margin: 14px 28px 0; padding: 10px 14px; border-radius: var(--radius);
  background: var(--warning-soft); color: #6B4A0B; font-size: 13.5px;
}
.view { padding: 22px 28px 48px; outline: none; min-width: 0; }

/* ---------- Buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #1D4FD0; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: #971D14; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.input, .select, .textarea {
  width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); font-size: 14px;
}
.textarea { height: auto; min-height: 76px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select { padding-right: 28px; }

/* ---------- Page header ---------- */
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.page-title { font-size: 23px; font-weight: 750; letter-spacing: -.01em; }
.page-desc { color: var(--text-2); margin-top: 2px; }
.section-title { font-size: 17.5px; font-weight: 650; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.sub { color: var(--text-2); font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel-pad { padding: 18px 20px; }

/* ---------- Badges & chips ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--muted-soft); color: #4A5467;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.navy { background: #E6EBF3; color: var(--navy); }
.badge.outline { background: transparent; border: 1px solid var(--line-strong); color: var(--text-2); }
.stage-badge { background: var(--surface-2); color: var(--text); }
.stage-badge .dot { background: var(--c); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 550; cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip-applied { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; }
.kpi { padding: 16px 20px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi-label { color: var(--text-2); font-size: 13px; font-weight: 550; }
.kpi-value { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 4px; }
.kpi-value small { font-size: 15px; font-weight: 600; margin-left: 2px; color: var(--text-2); }
.kpi-foot { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.kpi a { color: inherit; }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.prio { list-style: none; margin: 0; padding: 0; }
.prio li {
  display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.prio li:last-child { border-bottom: 0; }
.prio li:hover { background: var(--surface-2); }
.prio .who { font-weight: 650; }
.prio .why { color: var(--text-2); font-size: 13.5px; }
.prio .when { font-size: 13px; color: var(--text-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dday { justify-self: start; }

.pipeline { display: flex; flex-direction: column; gap: 9px; }
.pipe-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 42px; gap: 10px; align-items: center; font-size: 13.5px; cursor: pointer; }
.pipe-bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.pipe-bar span { display: block; height: 100%; background: var(--c); border-radius: 5px; }
.pipe-row .n { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.feed li:last-child { border-bottom: 0; }
.feed .d { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
.feed .t b { font-weight: 650; cursor: pointer; }
.feed .t b:hover { color: var(--accent); }
.feed .t .c { color: var(--text-2); }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-2); font-size: 11px; font-family: var(--font); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

/* ---------- Tables ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .input { max-width: 260px; }
.toolbar .select { width: auto; min-width: 128px; }
.toolbar .spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--text-2); font-size: 12.5px;
  padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
}
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: #FAFBFC; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .name { font-weight: 650; }
.tbl .meta { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
.tbl .nowrap { white-space: nowrap; }
.clip { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-count { font-size: 13px; color: var(--text-2); padding: 10px 14px; border-top: 1px solid var(--line); }

/* 모바일용 리스트 행 */
.mlist { display: none; }
.mrow { padding: 13px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 44px; }
.mrow:last-child { border-bottom: 0; }
.mrow-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mrow .name { font-weight: 650; }
.mrow .meta { color: var(--text-2); font-size: 13px; }

/* ---------- Empty / skeleton ---------- */
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }
.skel { background: linear-gradient(90deg, var(--surface-2), #F8F9FB, var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 6px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Map ---------- */
.map-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 0; height: calc(100vh - 190px); min-height: 480px; overflow: hidden; }
.map-side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.map-side-head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.map-list { overflow-y: auto; flex: 1; }
.map-item { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; }
.map-item:hover { background: var(--surface-2); }
.map-item .mk { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--c); }
.map-item .mk.sq { border-radius: 2px; transform: rotate(45deg); }
.map-item .name { font-weight: 650; }
.map-item .meta { color: var(--text-2); font-size: 12.5px; }
.map-canvas { min-height: 0; height: 100%; }
.map-box { width: 100%; height: 100%; background: #E9EEF3; }
.city-frame { display: block; width: 100%; height: calc(100vh - 250px); min-height: 520px; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); }
.mini-map { height: 190px; border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; background: #E9EEF3; }
.pick-map { height: 240px; border-radius: var(--radius); border: 1px solid var(--line-strong); overflow: hidden; background: #E9EEF3; cursor: crosshair; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--text-2); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.map-legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.map-legend i.sq { border-radius: 2px; transform: rotate(45deg); }
.map-legend i.dot-lg { width: 12px; height: 12px; box-sizing: border-box; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
.map-legend i.star, .map-item .mk.star { width: 14px; height: 14px; border-radius: 0; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); }
.map-key { color: var(--text); font-weight: 600; }
.map-stages { align-items: center; }
.pick-pin { width: 22px; height: 22px; background: var(--accent); border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.net-pin { width: 100%; height: 100%; box-sizing: border-box; background: var(--c, #1B1F24); border: 2px solid #fff; transform: rotate(45deg) scale(.86); border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.4); }
/* 지도 핀: 흰 테두리 + 진한 외곽선으로 일반 지도·위성 사진 어디서나 잘 보이게 */
.bz-pin { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.6), 0 2px 5px rgba(0,0,0,.4); }
.bz-pin.hot { border-width: 3px; box-shadow: 0 0 0 3px #111, 0 3px 8px rgba(0,0,0,.5); }
.home-pin { position: relative; width: 34px; height: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.home-pin svg { display: block; }
.home-pin span { position: absolute; left: 50%; top: 32px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; line-height: 1.5; color: #3B2A00; background: #FFF8E1; border: 1.5px solid #D4A017; border-radius: 10px; padding: 0 7px; }
.leaflet-popup-content { font-family: var(--font); font-size: 13px; margin: 12px 14px; }
.leaflet-popup-content .pop-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.leaflet-popup-content .pop-meta { color: var(--text-2); margin-bottom: 8px; }
.leaflet-container { font-family: var(--font); }

/* ---------- Cards (명함) ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.bcard {
  aspect-ratio: 9 / 5; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 16px 18px; display: flex; flex-direction: column; cursor: pointer; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.bcard:hover { border-color: var(--line-strong); box-shadow: 0 4px 14px rgba(16,24,40,.08); }
.bcard .org { font-size: 12.5px; color: var(--text-2); font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.bcard .org span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .pname { font-size: 18px; font-weight: 750; margin-top: 8px; letter-spacing: -.01em; }
.bcard .ptitle { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: 6px; }
.bcard .contact { margin-top: auto; font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.bcard .contact div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .tagline { position: absolute; top: 14px; right: 14px; }
.bcard .photo-flag { font-size: 11.5px; color: var(--text-2); }
.card-photo { width: 100%; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.photo-drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--text-2); font-size: 13px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.photo-drop img { max-height: 160px; border-radius: 6px; }

/* ---------- Schedule ---------- */
.sched { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.ev-group { margin-bottom: 6px; }
.ev-group h3 { font-size: 13px; color: var(--text-2); font-weight: 650; padding: 12px 16px 6px; }
.ev { display: grid; grid-template-columns: 28px 86px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); min-height: 48px; }
.ev.done .ev-title { text-decoration: line-through; color: var(--text-2); }
.ev input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
.ev-when { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ev-title { font-weight: 600; }
.ev-target { font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.ev-target:hover { color: var(--accent); }
.cal { padding: 14px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head b { font-size: 15px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 11.5px; color: var(--text-2); padding: 4px 0; }
.cal-day { aspect-ratio: 1 / .9; border: 0; background: none; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; gap: 3px; font-variant-numeric: tabular-nums; }
.cal-day:hover { background: var(--surface-2); }
.cal-day.out { color: #B6BCC8; }
.cal-day.today { font-weight: 800; color: var(--accent); }
.cal-day.sel { background: var(--accent-soft); }
.cal-day .dots { display: flex; gap: 2px; }
.cal-day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.cal-day .dots i.late { background: var(--danger); }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 40, .28); z-index: 1150; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 1200;
  background: var(--surface); box-shadow: var(--shadow-lg); transform: translateX(102%);
  transition: transform .22s ease; display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-inner { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.dr-head { padding: 16px 22px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dr-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dr-title { font-size: 21px; font-weight: 750; letter-spacing: -.01em; }
.dr-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dr-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.dr-body { overflow-y: auto; padding: 18px 22px 30px; flex: 1; display: flex; flex-direction: column; gap: 22px; }
.dr-foot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface); }
.dr-sec h3 { font-size: 15px; font-weight: 650; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.icon-btn { width: 36px; height: 36px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); }
.summary > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
.summary > div:last-child { border-right: 0; }
.summary .l { font-size: 12px; color: var(--text-2); }
.summary .v { font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; }
.summary .v small { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-left: 2px; }

.stepper { display: flex; gap: 4px; flex-wrap: wrap; }
.step { flex: 1 1 0; min-width: 72px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 4px; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer; text-align: center; }
.step:hover { border-color: var(--c); color: var(--text); }
.step.past { border-color: transparent; background: var(--surface-2); color: var(--text); }
.step.cur { background: var(--c); border-color: var(--c); color: #fff; }

.kv { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.people { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.person .pn { font-weight: 650; cursor: pointer; }
.person .pn:hover { color: var(--accent); }
.person .pm { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.timeline li:last-child { border-bottom: 0; }
.timeline .d { color: var(--text-2); font-variant-numeric: tabular-nums; }
.timeline .type { font-weight: 650; margin-right: 6px; }
.quick-log { display: grid; grid-template-columns: 130px 100px minmax(0, 1fr) auto; gap: 6px; margin-bottom: 8px; }
.memo-box { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; white-space: pre-wrap; font-size: 14px; }

/* ---------- Forms ---------- */
.form { display: flex; flex-direction: column; gap: 22px; }
.fsec { display: flex; flex-direction: column; gap: 12px; }
.fsec > h3 { font-size: 14px; font-weight: 700; color: var(--navy); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.frow.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: #344054; }
.field label .req { color: var(--danger); }
.field .hint { font-size: 12px; color: var(--text-2); }
.field.err .input { border-color: var(--danger); }
.field .errmsg { font-size: 12px; color: var(--danger); }
.inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inline .input { flex: 1; min-width: 160px; }

/* ---------- Search ---------- */
.modal-layer { position: fixed; inset: 0; z-index: 1300; background: rgba(16, 24, 40, .32); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 16px 16px; }
.search-panel { width: min(680px, 100%); background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
.search-input-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.search-input-row input { flex: 1; border: 0; outline: none; font-size: 16px; min-width: 0; color: var(--text); background: none; }
.search-results { overflow-y: auto; }
.sr-group { padding: 8px 0; }
.sr-group h4 { margin: 0; padding: 4px 16px; font-size: 12px; color: var(--text-2); font-weight: 650; }
.sr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 16px; cursor: pointer; align-items: center; }
.sr:hover, .sr.hi { background: var(--accent-soft); }
.sr .name { font-weight: 650; }
.sr .meta { font-size: 12.5px; color: var(--text-2); }
.sr .side { text-align: right; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.sr .phone { color: var(--text); font-weight: 600; font-size: 13.5px; }
mark { background: #FFF1B8; color: inherit; border-radius: 2px; }

.confirm-panel { width: min(420px, 100%); background: var(--surface); border-radius: 10px; padding: 22px; box-shadow: var(--shadow-lg); margin-top: 12vh; }
.confirm-panel h2 { font-size: 17px; }
.confirm-panel p { color: var(--text-2); margin: 8px 0 18px; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- Toast ---------- */
.toast-stack { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow-lg); pointer-events: auto; display: flex; gap: 10px; align-items: center; }
.toast.error { background: var(--danger); }
.toast button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; padding: 0; }

/* ---------- Data page ---------- */
.data-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.data-grid .panel-pad { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.data-grid p { margin: 0; color: var(--text-2); }
.stat-line { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.stat-line b { font-variant-numeric: tabular-nums; }

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav { display: none; }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-right: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar { padding: 10px 16px; }
  .search-trigger kbd { display: none; }
  .topbar { flex-wrap: wrap; }
  .search-trigger { flex: 1 1 100%; max-width: none; order: 2; }
  .topbar-actions { width: 100%; justify-content: space-between; }
  .scope-select { flex: 1; max-width: none; }
  .demo-banner { margin: 12px 16px 0; }
  .view { padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-right: 0; padding: 14px 16px; }
  .kpi:nth-child(odd) { border-right: 1px solid var(--line); }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .kpi:nth-child(3) { border-right: 1px solid var(--line); }
  .kpi-value { font-size: 26px; }
  .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; border-right: 0; }
  .prio li { grid-template-columns: 70px minmax(0, 1fr); }
  .prio .when { display: none; }
  .toolbar .input { max-width: none; flex: 1 1 100%; }
  .toolbar .select { flex: 1 1 40%; }
  .map-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55vh auto; height: auto; }
  .map-side { border-right: 0; border-top: 1px solid var(--line); order: 2; }
  .map-list { max-height: 50vh; }
  .sched { grid-template-columns: minmax(0, 1fr); }
  .sched .cal-panel { order: -1; }
  .data-grid { grid-template-columns: minmax(0, 1fr); }
  .drawer { width: 100%; }
  .dr-head, .dr-body, .dr-foot { padding-left: 16px; padding-right: 16px; }
  .dr-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary > div:nth-child(2) { border-right: 0; }
  .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .frow, .frow.three { grid-template-columns: minmax(0, 1fr); }
  .quick-log { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .quick-log .input.grow { grid-column: 1 / -1; }
  .quick-log .btn { grid-column: 1 / -1; }
  .kv { grid-template-columns: 96px minmax(0, 1fr); }
  .step { min-width: 0; padding: 7px 2px; font-size: 12px; }
  .stepper { flex-wrap: nowrap; }
  .btn, .chip, .icon-btn { min-height: 44px; }
  .btn-sm { min-height: 40px; }
  .ev { grid-template-columns: 28px minmax(0, 1fr) auto; }
  .ev .ev-when { grid-column: 2; grid-row: 2; }
  .toast-stack { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottom-nav a, .bottom-nav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px;
    font-size: 11.5px; color: var(--text-2); text-decoration: none; background: none; border: 0; cursor: pointer; font-weight: 550;
  }
  .bottom-nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .bottom-nav .active { color: var(--navy); font-weight: 700; }
  .more-sheet { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 36; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-lg); padding: 8px; display: flex; flex-direction: column; }
  .more-sheet a { padding: 14px 12px; color: var(--text); font-weight: 600; border-radius: 6px; }
}

/* ---------- 지도가 상세 창 위로 올라오지 않게: 지도 안의 z-index를 지도 상자 안에 가둔다 ---------- */
.map-box, .mini-map, .pick-map { position: relative; isolation: isolate; z-index: 0; }
.topbar { z-index: 1000; }
.more-sheet, .bottom-nav { z-index: 1100 !important; }

/* ---------- 대시보드 바로가기 ---------- */
.quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 16px; }
.qlink { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--navy); font-weight: 600; font-size: 13.5px; text-decoration: none; }
.qlink:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.qlink svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.qlink.empty { color: var(--text-2); border-style: dashed; }
.qlink.empty span { font-size: 12px; color: var(--accent); }
.qlink.edit { border-color: transparent; background: none; color: var(--text-2); font-weight: 500; }

/* ---------- 요약 · 기초 조사 ---------- */
.one-line { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); }
.ai-box { margin-top: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); white-space: pre-wrap; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.ai-tag { font-size: 11.5px; font-weight: 700; color: var(--accent); }
.memo-box.research { max-height: 320px; overflow-y: auto; font-size: 13.5px; line-height: 1.6; margin-bottom: 8px; overflow-wrap: anywhere; }
.research-actions { gap: 4px; }
.form-notice { padding: 10px 14px; border-radius: var(--radius); background: var(--accent-soft); color: var(--navy); font-size: 13.5px; }
.month-input { width: auto; }

/* ---------- 명함 색인 · 분류 대기 ---------- */
.index-bar { display: flex; flex-wrap: wrap; gap: 2px; margin: -2px 0 14px; }
.index-bar button { min-width: 34px; height: 30px; border: 0; background: none; border-radius: 6px; color: var(--text-2); font-weight: 600; cursor: pointer; font-size: 13px; }
.index-bar button:hover { background: var(--surface-2); color: var(--text); }
.index-bar button.on { background: var(--navy); color: #fff; }
.triage { margin-bottom: 16px; border-color: #D8E3F8; }
.triage-list { list-style: none; margin: 0; padding: 0; }
.triage-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.triage-list b { cursor: pointer; }
.triage-list b:hover { color: var(--accent); }

/* ---------- 지도: 구 · 월별 목록 ---------- */
.gu-chips .chip.on { background: var(--c, var(--navy)); border-color: var(--c, var(--navy)); }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav b { font-size: 15px; flex: 1; text-align: center; white-space: nowrap; }
.month-nav b::after { content: ' 발굴'; font-weight: 500; color: var(--text-2); font-size: 13px; }
.map-group h4 { margin: 0; padding: 8px 14px 6px; font-size: 12.5px; color: var(--text-2); background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
.card-pin { width: 12px; height: 12px; background: #9AA3B2; border: 2px solid #fff; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.map-legend i.ring { background: transparent; border: 2.5px solid #172033; width: 11px; height: 11px; }
.city-wrap { position: relative; overflow: hidden; border-top: 1px solid var(--line); background: var(--surface-2); }
.city-wrap .city-frame { border: 0; display: block; }
.city-wrap.full { overflow: auto; }
.city-wrap.full .city-frame { width: 100%; height: calc(100vh - 250px); min-height: 520px; }

/* ---------- 파일 일괄 등록 ---------- */
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 12px; }
.map-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #344054; }
.map-grid .req { color: var(--danger); }
.bulk-tbl td { font-size: 13px; padding: 8px 10px; }
.bulk-tbl tr.dup td { opacity: .5; }
.bulk-tbl tbody tr { cursor: default; }

/* ---------- 행정동·구 이름 · 배경 지도 없을 때 ---------- */
.area-label, .gu-label { pointer-events: none; }
.area-label span, .gu-label span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font); }
.area-label span { display: none; font-size: 12px; font-weight: 700; color: #2B3444; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; }
.gu-label span { display: block; font-size: 17px; font-weight: 800; color: var(--c); letter-spacing: .02em; text-shadow: 0 0 3px #fff, 0 0 4px #fff, 0 0 6px #fff; background: rgba(255,255,255,.55); padding: 1px 8px; border-radius: 6px; }
.z-high .area-label span { display: block; }
.z-high .gu-label span { display: none; }
.leaflet-container.offline { background: #F3F5F8; }
.map-note { background: rgba(255,255,255,.95); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text-2); max-width: 300px; font-family: var(--font); line-height: 1.45; }
.leaflet-control-layers { font-family: var(--font); font-size: 13px; }
.leaflet-control-layers-expanded { padding: 8px 12px; border-radius: 8px; }

/* ---------- 대시보드 달력 ---------- */
.dash-cal .cal { padding: 8px 14px 6px; }
.dash-cal .cal-day { aspect-ratio: auto; height: 42px; }
.dash-day { border-top: 1px solid var(--line); }
.dash-day-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px; }
.dash-day .ev { grid-template-columns: 28px 56px minmax(0, 1fr) auto; padding: 8px 16px; }

/* ---------- 중간 폭 화면(노트북·작은 모니터): 표 대신 카드 목록, 메뉴는 아이콘만 ---------- */
.mrow .name { font-size: 15.5px; }
.mrow .meta { font-size: 13.5px; line-height: 1.5; }
@media (max-width: 1360px) {
  .table-wrap.has-mobile { display: none; }
  .mlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; padding: 12px; background: var(--bg); }
  .mlist .mrow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }

}
@media (max-width: 1360px) and (min-width: 861px) {
  :root { --sidebar: 76px; }
  .sidebar { padding: 16px 10px; }
  .brand { justify-content: center; padding: 4px 0 16px; }
  .brand > div:last-child, .side-foot { display: none; }
  .side-nav a { justify-content: center; padding: 11px 0; flex-direction: column; gap: 3px; font-size: 11px; }
  .side-nav a span { display: block; text-align: center; line-height: 1.2; }
  .side-nav a .count { display: none; }
  .side-nav a svg { width: 22px; height: 22px; }
}
@media (max-width: 860px) {
  .mlist { display: block; padding: 0; background: none; }
  .mlist .mrow { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
}

/* 대시보드 첫 줄: 오늘 확인할 일 + 달력 (좁은 화면에서는 위아래) */
.dash-grid.dash-top { margin-bottom: 18px; align-items: stretch; }
.dash-grid.dash-top > .panel { min-width: 0; }
@media (max-width: 1180px) and (min-width: 900px) {
  .dash-grid.dash-top { grid-template-columns: minmax(0, 1fr) 330px; }
}

/* ---------- 실적 ---------- */
.perf-bar { justify-content: space-between; }
.perf-bar .month-nav b { font-size: 16px; min-width: 110px; }
.perf-bar .month-nav b::after { content: none; }
.perf-input { margin-bottom: 14px; }
.perf-input .section-title .sub { font-weight: 500; margin-left: 6px; }
.perf-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; }
.perf-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #344054; min-width: 110px; }
.perf-form label .input, .perf-form label .select { width: auto; min-width: 110px; }
.perf-form label.grow { flex: 1 1 200px; }
.perf-form label.grow .input { width: 100%; }
.perf-sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 14px; }
.perf-sum > div { padding: 12px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.perf-sum > div.zero { opacity: .5; }
.perf-sum .l { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.perf-sum b { font-size: 22px; }
.perf-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding-bottom: 6px; }
.perf-help { margin: 0; padding: 0 20px 12px; }
.perf-tbl td { padding: 9px 12px; }
.perf-tbl tbody tr { cursor: default; }
.perf-tbl .src .clip { max-width: 260px; color: var(--text-2); font-size: 12.5px; }
.perf-tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--success-soft); color: var(--success); font-size: 11.5px; font-weight: 700; }
.quick-perf { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
.quick-perf .select { width: auto; flex: 1; }
.quick-perf .input { width: 110px; }

/* ---------- 기초조사 양식 ---------- */
.sub-h { font-size: 13.5px; font-weight: 700; margin: 14px 0 8px; color: var(--navy); }
.sv-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
.sv-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sv-item:last-child { border-bottom: 0; }
.sv-item.add { background: var(--surface-2); }
.sv-form .flabel { font-size: 13px; font-weight: 600; color: #344054; }
.opt-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opt { display: inline-flex; align-items: center; cursor: pointer; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 13px; background: var(--surface); }
.opt input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-clear { border: 0; background: none; color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: underline; }
.req-tbl, .grid-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.req-tbl th, .req-tbl td, .grid-tbl th, .grid-tbl td { border: 1px solid var(--line); padding: 4px; vertical-align: middle; }
.req-tbl thead th, .grid-tbl thead th { background: var(--surface-2); font-weight: 600; }
.req-tbl tbody th { text-align: left; white-space: nowrap; background: var(--surface-2); padding: 6px 8px; }
.req-opt { display: block; cursor: pointer; }
.req-opt input { position: absolute; opacity: 0; }
.req-opt span { display: block; padding: 6px; border-radius: 6px; line-height: 1.35; min-height: 44px; }
.req-opt input:checked + span { background: var(--navy); color: #fff; }
.req-opt input:focus-visible + span { outline: 2px solid var(--accent); }
.req-tbl .input, .grid-tbl .input { height: 34px; font-size: 13px; min-width: 90px; }
.doc-wrap { gap: 12px; }
.doc { background: #fff; color: #111; border: 1px solid var(--line); padding: 24px; font-size: 12.5px; }
.doc h1 { text-align: center; font-size: 22px; letter-spacing: .4em; margin-bottom: 14px; }
.doc table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.doc caption { text-align: left; font-weight: 800; font-size: 13.5px; padding: 6px 0; }
.doc th, .doc td { border: 1px solid #444; padding: 5px 7px; vertical-align: middle; text-align: left; }
.doc th { background: #F0F2F5; width: 150px; font-weight: 700; }
.doc .req-doc th { width: auto; white-space: nowrap; }
.doc .req-doc td { font-size: 11px; text-align: center; }
.doc .req-doc td.on { background: #DCE7FB; font-weight: 700; }
.doc .req-doc .grp { writing-mode: vertical-rl; text-align: center; }
.doc .photo-cell { height: 60px; width: 90px; }
.doc-foot { text-align: right; color: #666; font-size: 11px; margin: 4px 0 0; }
#printRoot { display: none; }
@media print {
  body.printing > *:not(#printRoot) { display: none !important; }
  body.printing #printRoot { display: block; }
  body.printing { background: #fff; }
  .doc { border: 0; padding: 0; }
  .doc table { page-break-inside: auto; }
  .doc tr { page-break-inside: avoid; }
  @page { size: A4; margin: 12mm; }
}
.perf-tbl td, .perf-tbl th { white-space: nowrap; }
.perf-tbl td.clip { max-width: 190px; }

/* ---------- 연락이력 · 명령부 ---------- */
.report-kpi { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.perf-tbl td.wrap { white-space: normal; min-width: 220px; max-width: 360px; }
.select.sm, .input.sm { height: 32px; font-size: 13px; padding: 0 8px; }
.select.sm { padding-right: 24px; width: auto; }
.link { cursor: pointer; }
.link:hover { color: var(--accent); }
.od-tbl td { padding: 6px 6px; white-space: nowrap; }
.od-tbl .input.sm { min-width: 110px; }
.od-tbl td:nth-child(3) .input.sm, .od-tbl td:nth-child(8) .input.sm { min-width: 170px; }
.steps-help { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 13.5px; line-height: 1.8; }
.order-doc .order-head { display: flex; justify-content: flex-end; }
.order-doc .sign { width: auto; border-collapse: collapse; margin: 0; }
.order-doc .sign th, .order-doc .sign td { width: 70px; text-align: center; border: 1px solid #444; }
.order-doc .sign td { height: 48px; }
.order-doc .sign .sign-side { width: 24px; }
#printRoot .order-doc + .order-doc { page-break-before: always; break-before: page; }
.od-each { border-top: 1px solid var(--line, #E5E7EB); }
.od-each-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.od-each-head .inline { margin-left: auto; }
.od-each-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.od-each-item > span:first-child { white-space: nowrap; }
.od-each-item .inline { flex-wrap: nowrap; }
.od-each-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line, #E5E7EB); border-radius: 8px; }
.order-doc h1 { margin-top: 8px; }
.order-sub { text-align: center; margin: -6px 0 12px; color: #444; }
.order-doc .doc-tbl th { width: auto; text-align: center; }
.order-doc .doc-tbl td { text-align: center; }

/* 사용 권한 */
.notice { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--accent-soft); color: var(--text); font-size: 14px; }
label.field > span { font-size: 13px; font-weight: 600; color: var(--text); }
label.field .textarea { width: 100%; }

/* ================= 색으로 구분하기 =================
 * 메뉴·제목: 화면마다 고유 색 / 목록·명함·상세·지도 팝업: 종류(사업체·지원고용·기관·복지관·명함) 색 */
/* ---------- 메뉴별 퍼스널 컬러 ----------
 * 각 메뉴는 고유 색 하나를 가진다: --pc 본색, --ps 연한 바탕, --pi 글자용 진한 색, --pn 본색 위 아이콘 색
 * 옆 메뉴 아이콘 칸 · 선택된 메뉴 · 그 화면의 제목 띠 · 선택된 탭/필터가 모두 같은 색을 쓴다 */
.side-nav a[href="#/dashboard"], .bottom-nav a[href="#/dashboard"], body[data-route="dashboard"] { --pc: #132B4F; --ps: #E8EDF5; --pi: #132B4F; --pn: #fff; }
.side-nav a[href="#/biz"], .bottom-nav a[href="#/biz"], body[data-route="biz"] { --pc: #F5B700; --ps: #FFF6D6; --pi: #7A5A00; --pn: #3B2A00; }
.side-nav a[href="#/map"], .bottom-nav a[href="#/map"], body[data-route="map"] { --pc: #2F9E62; --ps: #E4F5EB; --pi: #1E6B42; --pn: #fff; }
.side-nav a[href="#/cards"], .bottom-nav a[href="#/cards"], body[data-route="cards"] { --pc: #0E9384; --ps: #E3F6F3; --pi: #0B6B61; --pn: #fff; }
.side-nav a[href="#/network"], .bottom-nav a[href="#/network"], body[data-route="network"] { --pc: #1B1F24; --ps: #ECEEF1; --pi: #1B1F24; --pn: #fff; }
.side-nav a[href="#/schedule"], body[data-route="schedule"] { --pc: #2563EB; --ps: #EAF1FE; --pi: #1D4ED8; --pn: #fff; }
.side-nav a[href="#/contacts"], body[data-route="contacts"] { --pc: #E8590C; --ps: #FFF0E6; --pi: #B03E05; --pn: #fff; }
.side-nav a[href="#/perf"], body[data-route="perf"] { --pc: #7C4DDB; --ps: #F1EAFD; --pi: #5B2FB5; --pn: #fff; }
.side-nav a[href="#/orders"], body[data-route="orders"] { --pc: #3B5BDB; --ps: #EAEEFC; --pi: #2A44B0; --pn: #fff; }
.side-nav a[href="#/data"], body[data-route="data"] { --pc: #667085; --ps: #EEF0F4; --pi: #475467; --pn: #fff; }

/* 옆 메뉴: 아이콘을 색 칸에 담고, 선택된 메뉴는 색을 꽉 채운다 */
.side-nav a { position: relative; padding: 6px 10px; }
.side-nav a svg { width: 30px; height: 30px; padding: 6px; border-radius: 9px; background: var(--ps, var(--surface-2)); color: var(--pi, var(--text-2)); transition: background .15s, color .15s; }
.side-nav a:hover { background: var(--ps, var(--surface-2)); color: var(--text); }
.side-nav a:hover svg { background: var(--surface); }
.side-nav a.active { background: var(--ps); color: var(--pi); font-weight: 700; }
.side-nav a.active svg { background: var(--pc); color: var(--pn); box-shadow: 0 2px 6px color-mix(in srgb, var(--pc) 40%, transparent); }
.side-nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--pc); }
.side-nav a.active .count { color: var(--pi); font-weight: 700; }
.bottom-nav a.active, .bottom-nav a[aria-current="page"] { color: var(--pi, var(--navy)); }

/* 화면 제목: 메뉴 색 띠 */
.page-head { position: relative; padding: 14px 18px; border-radius: 12px; background: linear-gradient(100deg, var(--ps, var(--surface)) 0%, var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--pc, var(--line)) 22%, var(--line)); border-left: 6px solid var(--pc, var(--navy)); align-items: center; }
.page-title { color: var(--pi, var(--text)); }
.page-desc { color: var(--text-2); }

/* 그 화면의 선택된 탭·필터도 메뉴 색 */
#view .chip.on { background: var(--pi, var(--navy)); border-color: var(--pi, var(--navy)); color: #fff; }
#view .section-title { color: var(--text); }

/* 대시보드 숫자 칸: 위쪽 색 띠 */
.kpi { position: relative; }
.kpi[class*="tone-"]::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc); }
.kpi.tone-biz { --tc: var(--k-biz); }
.kpi.tone-support { --tc: var(--k-support); }
.kpi.tone-net { --tc: var(--k-net); }
.kpi.tone-card { --tc: var(--k-card); }
.kpi[class*="tone-"] .kpi-label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tc); margin-right: 6px; vertical-align: 1px; }

/* 목록 줄: 왼쪽 색 띠 */
.tbl tr.row-biz td:first-child { box-shadow: inset 4px 0 0 var(--k-biz); }
.tbl tr.row-biz.is-support td:first-child { box-shadow: inset 4px 0 0 var(--k-support); }
.tbl tr.row-net td:first-child { box-shadow: inset 4px 0 0 var(--k-net); }
.tbl tr.row-net.is-home td:first-child { box-shadow: inset 4px 0 0 var(--k-home); }
.mrow.row-biz { border-left: 4px solid var(--k-biz); }
.mrow.row-biz.is-support { border-left-color: var(--k-support); }
.home-star { color: var(--k-home); margin-right: 4px; }

/* 명함: 위쪽 색 띠 = 연결된 곳의 종류 */
.bcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--kc, transparent); }
.bcard.k-biz { --kc: var(--k-biz); }
.bcard.k-support { --kc: var(--k-support); }
.bcard.k-net { --kc: var(--k-net); }
.bcard.k-home { --kc: var(--k-home); }
.bcard.k-none { border-style: dashed; border-color: var(--line-strong); }

/* 배지 */
.badge.dup { background: var(--k-dup-soft); color: var(--k-dup-ink); border: 1px solid #FDBA8C; cursor: help; }
.badge.support { background: var(--k-support-soft); color: var(--k-support-ink); font-weight: 700; }

/* 중복 안내 */
.dup-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 0 0 12px; padding: 10px 14px; border: 1px solid #FED7AA; border-left: 4px solid var(--k-dup); border-radius: 8px; background: var(--k-dup-soft); color: var(--k-dup-ink); font-size: 14px; }
.dup-sec { border: 1px solid #FED7AA; border-radius: 10px; background: #FFFBF5; padding: 12px 14px; }
.dup-sec h3 { color: var(--k-dup-ink); }

/* 상세·등록 창: 머리에 종류 색 띠와 이름표 */
#drawerInner[data-tone] { --dc: transparent; --ds: var(--surface); --di: var(--text-2); }
#drawerInner[data-tone="biz"] { --dc: var(--k-biz); --ds: var(--k-biz-soft); --di: var(--k-biz-ink); --dl: "사업체 개발"; }
#drawerInner[data-tone="support"] { --dc: var(--k-support); --ds: var(--k-support-soft); --di: var(--k-support-ink); --dl: "지원고용 · 현장훈련 사업체"; }
#drawerInner[data-tone="net"] { --dc: var(--k-net); --ds: var(--k-net-soft); --di: var(--k-net-ink); --dl: "네트워크 기관"; }
#drawerInner[data-tone="home"] { --dc: var(--k-home); --ds: var(--k-home-soft); --di: var(--k-home-ink); --dl: "★ 우리 복지관"; }
#drawerInner[data-tone="card"] { --dc: var(--k-card); --ds: var(--k-card-soft); --di: var(--k-card-ink); --dl: "명함"; }
#drawerInner[data-tone="ev"] { --dc: var(--k-ev); --ds: var(--k-ev-soft); --di: var(--k-ev-ink); --dl: "일정"; }
#drawerInner[data-tone]:not([data-tone=""]) .dr-head { border-top: 6px solid var(--dc); background: linear-gradient(var(--ds), var(--surface) 85%); }
#drawerInner[data-tone]:not([data-tone=""]) .dr-head::before { content: var(--dl); align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--di); background: var(--surface); border: 1px solid var(--dc); border-radius: 999px; padding: 1px 10px; }

/* 지도 팝업 */
.leaflet-popup-content .pop-kind { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; background: var(--ps); color: var(--pi); border: 1px solid var(--pc); }
.pop.tone-biz { --pc: var(--k-biz); --ps: var(--k-biz-soft); --pi: var(--k-biz-ink); }
.pop.tone-support { --pc: var(--k-support); --ps: var(--k-support-soft); --pi: var(--k-support-ink); }
.pop.tone-net { --pc: var(--k-net); --ps: var(--k-net-soft); --pi: var(--k-net-ink); }
.pop.tone-home { --pc: var(--k-home); --ps: var(--k-home-soft); --pi: var(--k-home-ink); }
.leaflet-popup-content .pop-cards { list-style: none; margin: 0 0 8px; padding: 8px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.leaflet-popup-content .pop-cards li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.leaflet-popup-content .pop-cards .pop-meta { margin: 0; }
.leaflet-popup-content .pop-cards li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--k-card); flex: none; align-self: center; }
.leaflet-popup-content .pop-nocard { border-top: 1px solid var(--line); padding-top: 6px; }
.leaflet-popup-content .pop-tel { font-variant-numeric: tabular-nums; font-size: 12.5px; }
.leaflet-popup-content .pop-actions { gap: 6px; flex-wrap: wrap; }
/* 구인공고 바로가기 */
.btn-job { background: var(--k-ev-soft); border-color: #BFD3FB; color: var(--k-ev-ink); font-weight: 700; }
.btn-job-inline { margin-left: 6px; font-size: 12.5px; font-weight: 700; color: var(--k-ev-ink); background: var(--k-ev-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.url-in { min-width: 150px; }
.linklike { border: 0; background: none; padding: 0; color: var(--k-card-ink); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.kpi, .kpi:hover { text-decoration: none; color: inherit; }

/* 취업 연계(주황): 지도 핀에 ✓, 목록 띠, 상세 창 */
:root { --k-placed: #FF7A00; --k-placed-soft: #FFF0E0; --k-placed-ink: #A94A00; }
.bz-pin.placed { position: relative; }
.bz-pin.placed::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 900; line-height: 1; }
.tbl tr.row-biz.is-placed td:first-child { box-shadow: inset 4px 0 0 var(--k-placed); }
.mrow.row-biz.is-placed { border-left-color: var(--k-placed); }
.bcard.k-placed { --kc: var(--k-placed); }
#drawerInner[data-tone="placed"] { --dc: var(--k-placed); --ds: var(--k-placed-soft); --di: var(--k-placed-ink); --dl: "취업 연계 사업체"; }
.pop.tone-placed { --pc: var(--k-placed); --ps: var(--k-placed-soft); --pi: var(--k-placed-ink); }

<script>
/* 공통 유틸: 날짜, 문자열, 포맷 */
window.U = (() => {
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => fmt(new Date());
  const parse = s => {
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  /** b - a (일) */
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  function dday(s) {
    const n = diffDays(today(), s);
    if (n === 0) return { label: '오늘', tone: 'warn', n };
    if (n > 0) return { label: `D-${n}`, tone: n <= 3 ? 'accent' : 'outline', n };
    return { label: `${-n}일 지남`, tone: 'danger', n };
  }
  function ago(s) {
    if (!isDate(s)) return '';
    const n = diffDays(s, today());
    if (n < 0) return `${-n}일 후`;
    if (n === 0) return '오늘';
    if (n === 1) return '어제';
    if (n < 30) return `${n}일 전`;
    if (n < 365) return `${Math.floor(n / 30)}개월 전`;
    return `${Math.floor(n / 365)}년 전`;
  }
  const md = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}.${pad(d.getDate())}`; };
  const dateKo = s => { if (!isDate(s)) return ''; const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
  const dateDot = s => isDate(s) ? s.replace(/-/g, '.') : '';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('ko-KR');
  const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);
  const norm = s => String(s ?? '').toLowerCase().replace(/[\s\-().]/g, '');
  /** 회사 이름 비교용: (주)·㈜·주식회사 같은 회사 형태 표기를 지우고 norm (norm이 괄호를 먼저 지우므로 순서가 중요) */
  const orgKey = s => norm(String(s ?? '').replace(/[(（]\s*(주|유|재|사|합|의)\s*[)）]|㈜|주식회사|유한회사|유한책임회사|재단법인|사단법인|합자회사|의료법인|사회복지법인/g, ''));

  /** 검색어를 강조 표시 (이스케이프 후) */
  function hl(text, q) {
    const t = esc(text);
    if (!q) return t;
    const i = String(text ?? '').toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t;
    const raw = String(text);
    return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + q.length)) + '</mark>' + esc(raw.slice(i + q.length));
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  /** 엑셀 날짜(숫자·Date·문자열)를 YYYY-MM-DD로 */
  function toDateStr(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return fmt(v);
    if (typeof v === 'number') {
      const d = new Date(Math.round((v - 25569) * 86400000));
      return fmt(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    }
    const s = String(v).trim().replace(/[./]/g, '-');
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
  }

  /* 초성 검색: 'ㄱㅈㅂ' → '김정배' */
  const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const cho = s => String(s ?? '').replace(/[가-힣]/g, ch => CHO[Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)]).replace(/\s/g, '');
  const isCho = q => /^[ㄱ-ㅎ]+$/.test(q);
  /** 여러 값 중 하나라도 검색어를 포함하는지 (띄어쓰기·하이픈 무시, 초성 검색 지원) */
  function match(q, ...vals) {
    const nq = norm(q);
    if (!nq) return true;
    if (isCho(nq)) return vals.some(v => cho(v).includes(nq));
    return vals.some(v => norm(v).includes(nq));
  }
  /** 가나다 색인용 첫 자음 (ㄲ→ㄱ 등으로 묶음) */
  const indexOf = s => {
    const c = cho(String(s ?? '').replace(/^\(주\)|^주식회사\s*/, '').trim()).charAt(0);
    return ({ 'ㄲ': 'ㄱ', 'ㄸ': 'ㄷ', 'ㅃ': 'ㅂ', 'ㅆ': 'ㅅ', 'ㅉ': 'ㅈ' })[c] || (/[ㄱ-ㅎ]/.test(c) ? c : (c ? 'A-Z' : ''));
  };

  return { orgKey, cho, isCho, match, indexOf, pad, fmt, today, parse, isDate, addDays, diffDays, WD, dday, ago, md, dateKo, dateDot, esc, num, uid, norm, hl, debounce, toDateStr };
})();

  const SOURCES = ['현장 발굴', '구인 공고', '네트워크 소개', '고용센터 의뢰', '기존 사업체 추천', '박람회·행사'];

  /** 장애인고용촉진법: 상시근로자 50인 이상 민간 사업주 의무고용률 3.1% (소수점 이하 버림) */
  const MANDATORY = { threshold: 50, rate: 0.031 };

  /* ---------------- 예시 데이터 ---------------- */
  function demo(seed = 20260929) {
    let s = seed;
    const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

    const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));

    const place = () => {
      const a = pick(AREAS);

      for (let t = 0; t < 30; t++) {
        const la = +(a.lat + (rnd() - .5) * .03).toFixed(5), ln = +(a.lng + (rnd() - .5) * .03).toFixed(5);
        if (!BOUNDS.length || areaAt(la, ln) === a.name) { lat = la; lng = ln; break; }
      }
      return { area: a.name, lat, lng, address: `경기도 화성시 ${a.name} ${pick(['산단로', '공단로', '중앙로', '시청로', '삼성로', '효행로', '상신하길로', '남양로'])} ${int(10, 480)}` };
    };

    const businesses = [], networks = [], cards = [], activities = [], events = [];
    let cardN = 0, actN = 0, evN = 0;
    const addCard = (o) => { cards.push({ id: 'C' + String(++cardN).padStart(3, '0'), tags: [], photo: null, memo: '', ...o }); };
    const addAct = (o) => activities.push({ id: 'A' + String(++actN).padStart(4, '0'), ...o });
    const addEv = (o) => events.push({ id: 'E' + String(++evN).padStart(3, '0'), done: false, memo: '', time: '', ...o });

    const stagePlan = [['발굴', 10], ['접촉', 9], ['방문상담', 7], ['채용협의', 5], ['채용연계', 8], ['보류', 4]];
    let bN = 0;
    for (const [stage, count] of stagePlan) {
      for (let k = 0; k < count; k++) {
        const industry = pick(INDUSTRY_LIST);
        const info = INDUSTRIES[industry];

        const id = 'B' + String(++bN).padStart(3, '0');

        const si = STAGE[stage].i;
        const staff = pick(STAFF);
        // 발굴일: 단계가 진행될수록 더 오래전
        const discoveredAt = U.addDays(T, -int(10 + si * 25, 60 + si * 55));
        const jobs = [...new Set([pick(info.jobs), pick(info.jobs)])].join(', ');
        const b = {
          id, name: coName(industry), industry, bizNo: `${int(120, 699)}-${int(10, 99)}-${int(10000, 99999)}`,
          ceo: person(), phone: `031-${int(350, 379)}-${d4()}`, employees: emp, ...p, stage, jobs,
          workConditions: pick(['주 5일, 09:00~16:00', '주 5일, 09:00~18:00', '주 3일, 10:00~15:00 (시간제)', '주 5일, 08:30~15:30', '평일 오전 4시간']),
          accessibility: info.acc, placements: stage === '채용연계' ? int(1, 3) : 0,
          source: pick(SOURCES), discoveredAt, staff,
          memo: pick(['', '', '대표님이 장애인 고용에 관심 많음. 지원금 제도 안내 필요.', '인사담당자 통화는 오후 2시 이후가 편하다고 함.', '작년에 다른 기관 통해 채용한 경험 있음.', '의무고용 부담금 문의 있었음.', '현장 견학 가능. 방문 전 전화 필수.']),
        };
        businesses.push(b);

        // 담당자 명함
        if (si >= 1 && stage !== '보류' || (stage === '보류' && rnd() < .7)) {
          const n = rnd() < .3 ? 2 : 1;
          for (let j = 0; j < n; j++) {
            addCard({
              name: person(), org: b.name, dept: pick(['경영지원팀', '인사팀', '총무팀', '생산관리팀', '']),
              title: j === 0 ? pick(['인사팀장', '관리부장', '총무과장', '공장장', '실장', '대표']) : pick(['주임', '대리', '매니저']),

              metAt: U.addDays(discoveredAt, int(3, 20)), metWhere: pick(['사업체 방문', '전화 후 명함 교환', '채용박람회']),
            });
          }
        }

        // 단계 흐름에 맞춘 활동 기록
        const steps = [['발굴', `${b.source}로 사업체 발굴. ${industry}, 상시근로자 ${emp}명`]];
        if (si >= 1) steps.push(['전화', '첫 연락. 장애인 채용 지원 제도와 복지관 직업지원 서비스 안내']);
        if (si >= 2) steps.push(['방문', `현장 방문. ${jobs} 직무 확인, 작업 환경 점검`]);
        if (si >= 3) steps.push(['미팅', '채용 조건 협의. 근무시간·급여·훈련 기간 논의']);
        if (stage === '채용연계') steps.push(['채용연계', `장애인 근로자 ${b.placements}명 채용 연계, 초기 적응 지원 시작`]);
        if (stage === '보류') steps.push(['전화', pick(['올해 채용 계획 없음. 하반기 재연락 요청', '업무 특성상 당분간 어렵다는 답변', '담당자 변경으로 보류'])]);
        let d = discoveredAt;
        const span = Math.max(1, U.diffDays(discoveredAt, T) - 2);
        steps.forEach(([type, content], idx) => {
          if (idx > 0) d = U.addDays(d, Math.max(1, Math.floor(span / steps.length) + int(-3, 3)));
          if (U.diffDays(d, T) < 0) d = T;
          addAct({ targetType: 'biz', targetId: id, date: d, type, content, staff });
        });

        // 다음 일정
        if (ACTIVE_STAGES.includes(stage) && rnd() < .8) {
          const off = rnd() < .18 ? -int(1, 5) : int(0, 20);
          const type = stage === '접촉' ? pick(['전화', '방문']) : stage === '방문상담' ? pick(['방문', '미팅']) : pick(['미팅', '면접 동행']);

    // 네트워크 기관 (가상)
    const NETS = [
      ['공공기관', '화성시 장애인일자리 협의체', '구인 정보 공유, 분기별 사례 회의', '협의체 회의 자료 배포'],
      ['공공기관', '서부권 고용복지 상담창구', '구직 장애인 의뢰 및 취업 알선 연계', '리플릿 비치'],
      ['공공기관', '향남 행정복지 민원센터', '복지 대상자 취업 상담 의뢰', '리플릿 비치, 게시판 홍보'],

      ['복지기관', '해솔 지역아동센터', '청소년 직업체험 프로그램 협력', '소식지 교환'],
      ['교육기관', '다온 특수학교 (예시)', '전공과 학생 현장실습처 연계', '학부모 대상 취업 설명회'],
      ['교육기관', '봉담 평생학습관', '직업훈련 강좌 공동 운영', '강좌 안내문 게시'],
      ['교육기관', '화성권 직업훈련학교 (예시)', '바리스타·제과 훈련 과정 연계', '훈련생 모집 공동 홍보'],
      ['기업·경제단체', '화성 서부 산업단지 협의회', '입주 기업 대상 장애인 고용 설명회', '협의회 소식지 게재'],
      ['기업·경제단체', '동탄 소상공인 연합회', '소규모 사업장 채용 발굴', '회원사 단체 문자 안내'],
      ['기업·경제단체', '향남 사회적경제 네트워크', '사회적기업 일자리 연계', '공동 박람회 부스'],
      ['언론·홍보', '화성 생활정보 소식지 (예시)', '복지관 취업 성공 사례 기사 게재', '분기별 기사 게재'],
      ['언론·홍보', '지역 공동체 라디오 (예시)', '인터뷰 출연, 채용 캠페인', '캠페인 방송'],
      ['후원·자원봉사', '남양 로타리 봉사단 (예시)', '취업 준비물(면접 정장) 후원', '후원 감사 행사'],
      ['후원·자원봉사', '청명 기업 봉사 모임', '직무 멘토링 자원봉사', '봉사자 모집 공동 홍보'],
      ['의료기관', '동탄 재활의원 (예시)', '취업 전 건강 상담 협력', '대기실 리플릿 비치'],
      ['의료기관', '서부 정신건강 상담센터 (예시)', '정신장애 당사자 취업 연계 사례 협력', '공동 캠페인'],

    NETS.forEach(([category, name, relation, promo], i) => {

      const status = i % 5 === 3 ? '휴면' : i % 3 === 0 ? '활발' : pick(['활발', '보통']);
      const since = U.addDays(T, -int(90, 900));
      const staff = pick(STAFF);
      networks.push({ id, name, category, ...p, relation, promo, status, since, staff, memo: pick(['', '', '연말 감사 행사 초대 대상', '담당자 교체 잦음, 기관 대표번호로 연락', '분기 1회 방문 약속']) });
      addCard({

      let d = since;

  function normalize(next) {
    for (const k of COLS) next[k] ||= [];
    next.settings ||= {};
    next.settings.orgName ||= '화성시아르딤복지관 직업지원팀';

  let access = { me: '', owner: '', admin: true };

  async function refresh() {
