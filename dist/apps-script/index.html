        </section>
        <section class="panel panel-pad staff-editor">
          <h2 class="section-title">담당 직원과 소속 사업</h2>
          <p>같은 업무라도 장애인개발원·고용공단 소속을 나눠 두면 목록과 대시보드에서 구분해 볼 수 있습니다.</p>
          <div class="staff-rows" id="staffRows">${st.settings.staff.map(s => staffRow(s)).join('')}</div>
          <div class="inline"><button class="btn btn-sm" type="button" data-act="staff-add">+ 직원 추가</button><button class="btn btn-sm btn-primary" type="button" data-act="save-staff">저장</button></div>
        </section>
        <section class="panel panel-pad">
          <h2 class="section-title">이 PC를 쓰는 사람</h2>
          <p>활동 기록을 남길 때 기록한 사람으로 저장됩니다. PC마다 따로 기억합니다.</p>
          <div class="inline" style="width:100%"><select class="select" id="meSel" data-act-change="me-set">${st.settings.staff.map(s => `<option ${s.name === S.me() ? 'selected' : ''}>${e(s.name)}</option>`).join('')}</select></div>
        </section>
        <section class="panel panel-pad">
          <h2 class="section-title">화성시 대시보드 주소</h2>
          <p>지도 화면의 '화성시 대시보드' 탭에 보여줄 화성시 통합 대시보드 공유 링크입니다.</p>
          <div class="inline" style="width:100%"><input class="input" id="cityMapInput" type="url" value="${e(st.settings.cityMapUrl || '')}" placeholder="https://total.hscity.go.kr/..."><button class="btn" type="button" data-act="save-citymap">저장</button></div>
        </section>
        <section class="panel panel-pad">
          <h2 class="section-title">처음부터 시작</h2>
          <p>예시 데이터를 지우고 빈 상태로 시작하거나, 예시 데이터를 다시 불러옵니다. 되돌릴 수 없으니 먼저 백업하세요.</p>
          <div class="inline"><button class="btn btn-danger" type="button" data-act="data-clear">모든 데이터 지우기</button><button class="btn" type="button" data-act="data-demo">예시 데이터 불러오기</button></div>
        </section>
      </div>`;
  }

  const staffRow = (s = { name: '', program: '' }) => `<div class="staff-row"><input class="input" name="staffName" value="${e(s.name)}" placeholder="이름" aria-label="직원 이름"><select class="select" name="staffProg" aria-label="소속 사업"><option value="">소속 미지정</option>${D.PROGRAMS.map(p => `<option ${p.key === s.program ? 'selected' : ''}>${e(p.key)}</option>`).join('')}</select><button class="icon-btn" type="button" data-act="staff-del" aria-label="직원 삭제">${I.close}</button></div>`;

  /* ================= 상세 Drawer ================= */
  function drHead(title, badges, actions, canBack) {
    return `<div class="dr-head">
      <div class="dr-top">
        <div class="inline" style="min-width:0;flex-wrap:nowrap">${canBack ? `<button class="icon-btn" type="button" data-act="dr-back" aria-label="뒤로">${I.back}</button>` : ''}<h2 class="dr-title">${title}</h2></div>
        <button class="icon-btn" type="button" data-act="dr-close" aria-label="닫기">${I.close}</button>
      </div>
      ${badges ? `<div class="dr-badges">${badges}</div>` : ''}
      ${actions ? `<div class="dr-actions">${actions}</div>` : ''}
    </div>`;
  }
  const callBtn = c => (tel(c) ? `<a class="btn btn-sm" href="tel:${e(tel(c).replace(/[^0-9+]/g, ''))}">${I.phone}${e(c.name)} 전화</a>` : '');
  const people = (kind, id) => {
    const cs = S.cardsOf(kind, id);
    return `<section class="dr-sec"><h3>담당자 <button class="btn btn-ghost btn-sm" type="button" data-act="new-card" data-link="${kind}:${id}">+ 명함 추가</button></h3>
      ${cs.length ? `<div class="people">${cs.map(c => `<div class="person"><div style="min-width:0"><div class="pn" data-act="open" data-kind="card" data-id="${c.id}">${e(c.name)} <span class="pm">${e([c.dept, c.title].filter(Boolean).join(' · '))}</span></div>
        <div class="pm">${[c.mobile && `휴대 ${e(c.mobile)}`, c.phone && `사무실 ${e(c.phone)}`, c.email && e(c.email)].filter(Boolean).join(' · ')}</div></div>
        <div class="inline">${tel(c) ? `<a class="icon-btn" href="tel:${e(tel(c).replace(/[^0-9+]/g, ''))}" aria-label="전화">${I.phone}</a>` : ''}${c.email ? `<a class="icon-btn" href="mailto:${e(c.email)}" aria-label="이메일">${I.mail}</a>` : ''}</div></div>`).join('')}</div>`
        : '<p class="sub" style="margin:0">연결된 명함이 없습니다. 담당자 명함을 등록하면 여기서 바로 전화할 수 있어요.</p>'}</section>`;
  };
  const eventsSec = (kind, id) => {
    const evs = S.eventsOf(kind, id).filter(x => !x.done);
    return `<section class="dr-sec"><h3>다가오는 일정 <button class="btn btn-ghost btn-sm" type="button" data-act="new-event" data-target="${kind}:${id}">+ 일정</button></h3>
      ${evs.length ? `<div class="people">${evs.map(x => `<div class="person"><div><div style="font-weight:600">${e(x.title)}</div><div class="pm">${U.dateKo(x.date)} ${e(x.time || '')} · ${e(x.type)}</div></div>
        <div class="inline"><span class="badge ${U.dday(x.date).tone} num">${U.dday(x.date).label}</span><input type="checkbox" aria-label="완료 표시" data-act="ev-toggle" data-id="${x.id}" style="width:18px;height:18px"></div></div>`).join('')}</div>` : '<p class="sub" style="margin:0">예정된 일정이 없습니다.</p>'}</section>`;
  };
  const actsSec = (kind, id) => {
    const acts = S.actsOf(kind, id);
    return `<section class="dr-sec"><h3>활동 기록</h3>
      <form class="quick-log" data-form="quick-log" data-kind="${kind}" data-id="${id}">
        <input class="input" type="date" name="date" value="${U.today()}" aria-label="날짜" required>
        <select class="select" name="type" aria-label="유형">${opts(D.ACT_TYPES.filter(t => t !== '발굴'), '전화')}</select>
        <input class="input grow" name="content" id="quickLogContent" placeholder="예: 인사팀장 통화, 다음 주 방문 약속" aria-label="내용" required>
        <button class="btn btn-primary" type="submit">기록</button>
        <input type="hidden" name="staff" value="${e(S.me())}">
      </form>
      ${acts.length ? `<ul class="timeline">${acts.map(a => `<li><span class="d">${U.dateDot(a.date)}</span><span><span class="type">${e(a.type)}</span>${e(a.content)}${a.staff ? ` <span class="sub">· ${e(a.staff)}</span>${progBadge(S.programOf(a.staff))}` : ''}</span><button class="icon-btn" type="button" aria-label="기록 삭제" data-act="act-del" data-id="${a.id}" style="width:28px;height:28px">${I.close}</button></li>`).join('')}</ul>` : '<p class="sub" style="margin:0">아직 기록이 없습니다.</p>'}</section>`;
  };
  const locSec = x => `<section class="dr-sec"><h3>위치 ${M.hasPos(x) ? `<span class="inline"><a class="btn btn-ghost btn-sm" href="${M.kakaoLink(x)}" target="_blank" rel="noopener">카카오맵</a><a class="btn btn-ghost btn-sm" href="${M.naverSearch(x)}" target="_blank" rel="noopener">네이버지도</a></span>` : ''}</h3>
    <div class="sub" style="margin-bottom:8px">${e(x.address || '주소 미입력')}${x.approx ? ' · 읍면동 중심의 대략적 위치' : ''}</div>
    ${M.hasPos(x) ? '<div class="mini-map" id="miniMap"></div>' : '<p class="sub" style="margin:0">위치가 지정되지 않았습니다. 수정에서 지도를 클릭해 위치를 지정하세요.</p>'}</section>`;
  const kv = pairs => `<dl class="kv">${pairs.filter(([, v]) => v !== undefined).map(([k, v]) => `<dt>${e(k)}</dt><dd>${v === '' || v == null ? '<span class="sub">-</span>' : v}</dd>`).join('')}</dl>`;

  function detailBiz(b, canBack) {
    const st = D.STAGE[b.stage];
    const mand = D.mandatoryCount(b.employees);
    const la = S.lastAct('biz', b.id);
    const pc = primaryContact('biz', b.id);
    const steps = D.STAGES.filter(s => s.key !== '보류');
    return {
      html: drHead(e(b.name),
        `${stageBadge(b.stage)}<span class="badge outline">${e(b.industry || '업종 미입력')}</span><span class="badge outline">${e(b.area || '지역 미지정')}</span>${mand ? '<span class="badge navy">의무고용 대상</span>' : ''}${b.staff ? `<span class="badge outline">담당 ${e(b.staff)}</span>${progBadge(S.programOf(b.staff))}` : ''}`,
        `${callBtn(pc)}<button class="btn btn-sm" type="button" data-act="focus-log">활동 기록</button><button class="btn btn-sm" type="button" data-act="new-event" data-target="biz:${b.id}">일정 추가</button><button class="btn btn-sm" type="button" data-act="edit" data-kind="biz" data-id="${b.id}">${I.edit}수정</button>`, canBack) +
        `<div class="dr-body">
          <section class="dr-sec"><h3>진행 단계 <button class="btn btn-ghost btn-sm" type="button" data-act="stage-set" data-id="${b.id}" data-stage="${b.stage === '보류' ? '접촉' : '보류'}">${b.stage === '보류' ? '보류 해제' : '보류로 변경'}</button></h3>
            <div class="stepper">${steps.map(s => `<button type="button" class="step ${s.key === b.stage ? 'cur' : st.i > s.i && b.stage !== '보류' ? 'past' : ''}" style="--c:${s.color}" data-act="stage-set" data-id="${b.id}" data-stage="${s.key}" title="${e(s.desc)}">${s.key}</button>`).join('')}</div>
            ${b.stage === '보류' ? '<p class="sub" style="margin:8px 0 0">현재 보류 상태입니다. 단계를 누르면 다시 진행합니다.</p>' : ''}
          </section>
          <div class="summary">
            <div><div class="l">상시근로자</div><div class="v">${b.employees ? U.num(b.employees) : '-'}<small>명</small></div></div>
            <div><div class="l">의무고용 인원</div><div class="v">${mand ? mand + '<small>명</small>' : '<small>대상 아님</small>'}</div></div>
            <div><div class="l">채용 연계</div><div class="v">${Number(b.placements) || 0}<small>명</small></div></div>
            <div><div class="l">최근 연락</div><div class="v" style="font-size:16px">${la ? U.ago(la.date) : '-'}</div></div>
          </div>
          ${b.memo ? `<div class="memo-box">${e(b.memo)}</div>` : ''}
          ${people('biz', b.id)}
          ${eventsSec('biz', b.id)}
          ${actsSec('biz', b.id)}
          <section class="dr-sec"><h3>채용 정보</h3>${kv([['가능 직무', e(b.jobs)], ['근무 조건', e(b.workConditions)], ['편의시설·고려사항', e(b.accessibility)]])}</section>
          ${locSec(b)}
          <section class="dr-sec"><h3>기본 정보</h3>${kv([['사업자등록번호', e(b.bizNo)], ['대표자', e(b.ceo)], ['주소', e(b.address)], ['발굴 경로', e(b.source)], ['발굴일', U.dateDot(b.discoveredAt)], ['담당 직원', staffTag(b.staff)]])}</section>
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="biz" data-id="${b.id}" style="color:var(--danger)">이 사업체 삭제</button></div>
        </div>`,
      after: () => miniMap(b, 'biz'),
    };
  }

  function detailNet(n, canBack) {
    const la = S.lastAct('net', n.id);
    const pc = primaryContact('net', n.id);
    return {
      html: drHead(e(n.name), `<span class="badge navy">${e(n.category)}</span>${statusBadge(n.status)}<span class="badge outline">${e(n.area || '지역 미지정')}</span>${n.staff ? `<span class="badge outline">담당 ${e(n.staff)}</span>${progBadge(S.programOf(n.staff))}` : ''}`,
        `${callBtn(pc)}<button class="btn btn-sm" type="button" data-act="focus-log">활동 기록</button><button class="btn btn-sm" type="button" data-act="new-event" data-target="net:${n.id}">일정 추가</button><button class="btn btn-sm" type="button" data-act="edit" data-kind="net" data-id="${n.id}">${I.edit}수정</button>`, canBack) +
        `<div class="dr-body">
          <div class="summary">
            <div><div class="l">협력 시작</div><div class="v" style="font-size:16px">${n.since ? U.dateDot(n.since) : '-'}</div></div>
            <div><div class="l">최근 활동</div><div class="v" style="font-size:16px">${la ? U.ago(la.date) : '-'}</div></div>
            <div><div class="l">활동 기록</div><div class="v">${S.actsOf('net', n.id).length}<small>건</small></div></div>
            <div><div class="l">담당자 명함</div><div class="v">${S.cardsOf('net', n.id).length}<small>장</small></div></div>
          </div>
          ${n.memo ? `<div class="memo-box">${e(n.memo)}</div>` : ''}
          <section class="dr-sec"><h3>협력 · 홍보</h3>${kv([['협력 내용', e(n.relation)], ['홍보 방식', e(n.promo)], ['관계 상태', e(n.status)], ['담당 직원', staffTag(n.staff)]])}</section>
          ${people('net', n.id)}
          ${eventsSec('net', n.id)}
          ${actsSec('net', n.id)}
          ${locSec(n)}
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="net" data-id="${n.id}" style="color:var(--danger)">이 기관 삭제</button></div>
        </div>`,
      after: () => miniMap(n, 'net'),
    };
  }

  function detailCard(c, canBack) {
    const link = S.linkOf(c);
    const copy = v => v ? `<span class="inline" style="gap:4px"><span class="num">${e(v)}</span><button class="icon-btn" type="button" style="width:30px;height:30px" aria-label="복사" data-act="copy" data-v="${e(v)}">${I.copy}</button></span>` : '';
    return {
      html: drHead(`${e(c.name)} <span class="sub" style="font-size:14px;font-weight:500">${e(c.title || '')}</span>`,
        `${c.linkType === 'biz' && link ? stageBadge(link.stage) : ''}${c.linkType === 'net' ? '<span class="badge navy">네트워크 기관</span>' : ''}${(c.tags || []).map(t => `<span class="badge outline">${e(t)}</span>`).join('')}`,
        `${tel(c) ? `<a class="btn btn-sm btn-primary" href="tel:${e(tel(c).replace(/[^0-9+]/g, ''))}">${I.phone}전화</a>` : ''}${c.mobile ? `<a class="btn btn-sm" href="sms:${e(c.mobile.replace(/[^0-9+]/g, ''))}">문자</a>` : ''}${c.email ? `<a class="btn btn-sm" href="mailto:${e(c.email)}">${I.mail}이메일</a>` : ''}<button class="btn btn-sm" type="button" data-act="vcard" data-id="${c.id}">연락처 파일(vcf)</button><button class="btn btn-sm" type="button" data-act="edit" data-kind="card" data-id="${c.id}">${I.edit}수정</button>`, canBack) +
        `<div class="dr-body">
          ${c.photo ? (S.photo(c) ? `<img class="card-photo" src="${S.photo(c)}" alt="${e(c.name)} 명함 사진">` : '<div class="skel" style="height:180px"></div>') : ''}
          <section class="dr-sec"><h3>연락처</h3>${kv([['소속', e(c.org)], ['부서', e(c.dept)], ['휴대전화', copy(c.mobile)], ['사무실 전화', copy(c.phone)], ['이메일', copy(c.email)], ['주소', e(c.address)]])}</section>
          <section class="dr-sec"><h3>연결된 곳</h3>${link ? `<div class="people"><div class="person"><div><div class="pn" data-act="open" data-kind="${c.linkType}" data-id="${link.id}">${e(link.name)}</div><div class="pm">${c.linkType === 'biz' ? `사업체 개발 · ${e(link.stage)}` : `네트워크 · ${e(link.category)}`}</div></div><button class="btn btn-sm" type="button" data-act="open" data-kind="${c.linkType}" data-id="${link.id}">열기</button></div></div>` : '<p class="sub" style="margin:0">연결된 사업체나 기관이 없습니다. 수정에서 연결할 수 있어요.</p>'}</section>
          <section class="dr-sec"><h3>받은 정보</h3>${kv([['받은 날', U.dateDot(c.metAt)], ['받은 곳', e(c.metWhere)]])}</section>
          ${c.memo ? `<section class="dr-sec"><h3>메모</h3><div class="memo-box">${e(c.memo)}</div></section>` : ''}
          <div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="card" data-id="${c.id}" style="color:var(--danger)">이 명함 삭제</button></div>
        </div>`,
    };
  }

  function miniMap(x, kind) {
    const el = document.getElementById('miniMap');
    if (!el || !M.hasPos(x)) return;
    const map = M.create(el, { center: [x.lat, x.lng], zoom: x.approx ? 13 : 15, scroll: false });
    if (!map) return;
    (kind === 'biz' ? M.bizMarker(x) : M.netMarker(x)).addTo(map);
    // 주변 1.5km 이내 다른 곳도 흐리게 표시
    const st = S.get();
    [...st.businesses.map(b => ['biz', b]), ...st.networks.map(n => ['net', n])].forEach(([k, o]) => {
      if (o.id === x.id || !M.hasPos(o)) return;
      if (Math.abs(o.lat - x.lat) < .014 && Math.abs(o.lng - x.lng) < .017) {
        const m = (k === 'biz' ? M.bizMarker(o) : M.netMarker(o)).addTo(map);
        if (m.setStyle) m.setStyle({ fillOpacity: .45 }); else m.setOpacity(.5);
        m.bindTooltip(o.name);
      }
    });
  }

  return { I, ui, progBadge, staffRow, dashboard, bizPage, bizResults, netPage, netResults, cardsPage, cardResults, mapPage, mapItems, mapList, schedPage, evList, calendar, dataPage, detailBiz, detailNet, detailCard, drHead, stageBadge, opts };
})();

</script>
<script>
/* 등록·수정 폼 (Desktop: 우측 Drawer, Mobile: 전체 화면) */
window.F = (() => {
  const e = U.esc;
  const field = (label, input, opt = {}) => `<div class="field ${opt.full ? 'full' : ''}" data-f="${opt.name || ''}"><label ${opt.for ? `for="${opt.for}"` : ''}>${label}${opt.req ? ' <span class="req">*</span>' : ''}</label>${input}${opt.hint ? `<span class="hint">${opt.hint}</span>` : ''}</div>`;
  const inp = (name, v, attrs = '') => `<input class="input" id="f_${name}" name="${name}" value="${e(v ?? '')}" ${attrs}>`;
  const ta = (name, v, attrs = '') => `<textarea class="textarea" id="f_${name}" name="${name}" ${attrs}>${e(v ?? '')}</textarea>`;
  const staffSel = v => `<select class="select" id="f_staff" name="staff"><option value="">선택</option>${S.staff().map(st => `<option value="${e(st.name)}" ${st.name === v ? 'selected' : ''}>${e(st.name)}${st.program ? ' · ' + e(st.program) : ''}</option>`).join('')}${v && !S.staff().some(st => st.name === v) ? `<option selected>${e(v)}</option>` : ''}</select>`;
  const sel = (name, list, v, blank) => `<select class="select" id="f_${name}" name="${name}">${V.opts(list, v, blank)}</select>`;
  const foot = (label) => `<div class="dr-foot"><button class="btn" type="button" data-act="dr-cancel">취소</button><button class="btn btn-primary" type="submit" form="entityForm">${label}</button></div>`;
  const head = (title) => `<div class="dr-head"><div class="dr-top"><h2 class="dr-title">${title}</h2><button class="icon-btn" type="button" data-act="dr-cancel" aria-label="닫기">${V.I.close}</button></div></div>`;

  function linkOptions(value) {
    const st = S.get();
    const byName = (a, b) => a.name.replace(/^\(주\)/, '').localeCompare(b.name.replace(/^\(주\)/, ''), 'ko');
    return `<option value="">연결 안 함</option>
      <optgroup label="사업체 개발">${[...st.businesses].sort(byName).map(b => `<option value="biz:${b.id}" ${value === 'biz:' + b.id ? 'selected' : ''}>${e(b.name)} (${e(b.stage)})</option>`).join('')}</optgroup>
      <optgroup label="네트워크">${[...st.networks].sort(byName).map(n => `<option value="net:${n.id}" ${value === 'net:' + n.id ? 'selected' : ''}>${e(n.name)}</option>`).join('')}</optgroup>`;
  }

  function locationSection(x) {
    const has = M.hasPos(x);
    return `<div class="fsec"><h3>위치</h3>
      <div class="frow">
        ${field('주소', `<div class="inline">${inp('address', x.address, 'placeholder="경기도 화성시 ..."')}<button class="btn" type="button" data-act="geocode">주소로 찾기</button></div>`, { full: true, for: 'f_address', hint: '주소로 못 찾으면 읍면동을 고른 뒤 아래 지도를 클릭해 정확한 위치를 찍어 주세요.' })}
        ${field('읍·면·동', sel('area', D.AREAS.map(a => a.name), x.area, '선택'), { for: 'f_area' })}
        ${field('좌표', `<div class="input num" id="posLabel" style="display:flex;align-items:center;color:var(--text-2)">${has ? `${x.lat}, ${x.lng}${x.approx ? ' (대략)' : ''}` : '지도를 클릭해 지정'}</div>`)}
      </div>
      <div class="pick-map" id="pickMap" aria-label="지도를 클릭해 위치 지정"></div>
      <input type="hidden" name="lat" value="${has ? x.lat : ''}"><input type="hidden" name="lng" value="${has ? x.lng : ''}"><input type="hidden" name="approx" value="${x.approx ? '1' : ''}">
    </div>`;
  }

  function bindLocation(form) {
    const lat = form.elements.lat, lng = form.elements.lng, approx = form.elements.approx;
    const label = form.querySelector('#posLabel');
    const show = () => { label.textContent = lat.value ? `${lat.value}, ${lng.value}${approx.value ? ' (대략)' : ''}` : '지도를 클릭해 지정'; };
    const pk = M.picker(form.querySelector('#pickMap'), lat.value ? { lat: +lat.value, lng: +lng.value } : null, (a, b) => { lat.value = a; lng.value = b; approx.value = ''; show(); });
    form.elements.area.addEventListener('change', () => {
      const a = D.AREA_BY_NAME[form.elements.area.value];
      if (a && (!lat.value || approx.value) && pk) { pk.set(a.lat, a.lng, 14); approx.value = '1'; show(); }
    });
    form._geocode = async () => {
      const q = form.elements.address.value;
      if (!q.trim()) { App.toast('주소를 먼저 입력하세요.', 'error'); return; }
      const btn = form.querySelector('[data-act="geocode"]');
      btn.disabled = true; btn.textContent = '찾는 중…';
      try {
        const r = await M.geocode(q);
        if (r && pk) { pk.set(r.lat, r.lng, 16); App.toast('위치를 찾았습니다. 핀이 맞는지 확인하고, 다르면 지도를 클릭해 옮기세요.'); }
        else App.toast('주소로 위치를 찾지 못했습니다. 읍면동을 고르고 지도를 클릭해 지정하세요.', 'error');
      } catch { App.toast('위치 검색 서비스에 연결하지 못했습니다. 인터넷 연결을 확인하거나 지도를 클릭해 지정하세요.', 'error'); }
      finally { btn.disabled = false; btn.textContent = '주소로 찾기'; }
    };
  }

  /* ---------- 사업체 ---------- */
  function biz(b) {
    const x = b || { stage: '발굴', discoveredAt: U.today(), staff: S.me(), source: '현장 발굴', placements: 0 };
    return {
      html: head(b ? '사업체 정보 수정' : '사업체 발굴 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="biz" data-id="${b ? b.id : ''}" novalidate>
        <div class="fsec"><h3>기본 정보</h3><div class="frow">
          ${field('사업체명', inp('name', x.name, 'required autocomplete="off"'), { req: true, full: true, name: 'name', for: 'f_name' })}
          ${field('업종', `<input class="input" id="f_industry" name="industry" list="indList" value="${e(x.industry || '')}"><datalist id="indList">${D.INDUSTRY_LIST.map(i => `<option value="${e(i)}">`).join('')}</datalist>`, { for: 'f_industry' })}
          ${field('상시근로자 수', inp('employees', x.employees || '', 'type="number" min="0" inputmode="numeric"'), { for: 'f_employees', hint: '50명 이상이면 장애인 의무고용 대상(3.1%)으로 표시됩니다.' })}
          ${field('사업자등록번호', inp('bizNo', x.bizNo, 'placeholder="000-00-00000"'), { for: 'f_bizNo' })}
          ${field('대표자', inp('ceo', x.ceo), { for: 'f_ceo' })}
        </div></div>
        ${locationSection(x)}
        <div class="fsec"><h3>채용 정보</h3><div class="frow">
          ${field('진행 단계', sel('stage', D.STAGES.map(s => s.key), x.stage), { for: 'f_stage' })}
          ${field('채용 연계 인원', inp('placements', x.placements || 0, 'type="number" min="0" inputmode="numeric"'), { for: 'f_placements' })}
          ${field('가능 직무', inp('jobs', x.jobs, 'placeholder="예: 포장, 검수, 사무 보조"'), { full: true, for: 'f_jobs' })}
          ${field('근무 조건', inp('workConditions', x.workConditions, 'placeholder="예: 주 5일, 09:00~16:00"'), { full: true, for: 'f_workConditions' })}
          ${field('편의시설·고려사항', ta('accessibility', x.accessibility, 'rows="2" placeholder="예: 엘리베이터 있음, 서서 하는 작업, 통근버스 운영"'), { full: true, for: 'f_accessibility' })}
        </div></div>
        <div class="fsec"><h3>운영 정보</h3><div class="frow">
          ${field('발굴 경로', sel('source', D.SOURCES, x.source, '선택'), { for: 'f_source' })}
          ${field('발굴일', inp('discoveredAt', x.discoveredAt, 'type="date"'), { for: 'f_discoveredAt' })}
          ${field('담당 직원', staffSel(x.staff), { for: 'f_staff' })}
          ${field('메모', ta('memo', x.memo, 'rows="3" placeholder="예: 인사팀장 통화는 오후 2시 이후"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(b ? '저장' : '등록'),
      after: form => bindLocation(form),
    };
  }

  /* ---------- 네트워크 ---------- */
  function net(n) {
    const x = n || { category: '복지기관', status: '활발', since: U.today(), staff: S.me() };
    return {
      html: head(n ? '기관 정보 수정' : '네트워크 기관 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="net" data-id="${n ? n.id : ''}" novalidate>
        <div class="fsec"><h3>기본 정보</h3><div class="frow">
          ${field('기관명', inp('name', x.name, 'required autocomplete="off"'), { req: true, full: true, name: 'name', for: 'f_name' })}
          ${field('분류', sel('category', D.NET_CATEGORIES, x.category), { for: 'f_category' })}
          ${field('관계 상태', sel('status', D.NET_STATUS, x.status), { for: 'f_status' })}
        </div></div>
        ${locationSection(x)}
        <div class="fsec"><h3>협력 · 홍보</h3><div class="frow">
          ${field('협력 내용', ta('relation', x.relation, 'rows="2" placeholder="예: 구직 장애인 의뢰, 채용박람회 공동 개최"'), { full: true, for: 'f_relation' })}
          ${field('홍보 방식', inp('promo', x.promo, 'placeholder="예: 리플릿 비치, 소식지 게재, SNS 공동 홍보"'), { full: true, for: 'f_promo' })}
          ${field('협력 시작일', inp('since', x.since, 'type="date"'), { for: 'f_since' })}
          ${field('담당 직원', staffSel(x.staff), { for: 'f_staff' })}
          ${field('메모', ta('memo', x.memo, 'rows="3"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(n ? '저장' : '등록'),
      after: form => bindLocation(form),
    };
  }

  /* ---------- 명함 ---------- */
  function card(c, preset = {}) {
    const x = c || { metAt: U.today(), tags: [], linkType: '', linkId: '', ...preset };
    const linkVal = x.linkType && x.linkId ? `${x.linkType}:${x.linkId}` : '';
    return {
      html: head(c ? '명함 수정' : '명함 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="card" data-id="${c ? c.id : ''}" novalidate>
        <div class="fsec"><h3>명함 사진</h3>
          <div class="photo-drop" id="photoDrop">
            <img id="photoPreview" ${S.photo(x) ? `src="${S.photo(x)}"` : 'hidden'} alt="명함 사진 미리보기">
            <span id="photoHint">${x.photo ? '' : '명함을 찍은 사진을 올려 두면 원본을 다시 확인할 수 있어요.'}</span>
            <div class="inline"><label class="btn btn-sm" for="f_photoFile">사진 선택</label>${x.photo ? '<button class="btn btn-ghost btn-sm" type="button" data-act="photo-clear">사진 삭제</button>' : ''}</div>
            <input type="file" id="f_photoFile" accept="image/*" capture="environment" hidden>
          </div>
          <input type="hidden" name="photo" value="">
        </div>
        <div class="fsec"><h3>인적 정보</h3><div class="frow">
          ${field('이름', inp('name', x.name, 'required autocomplete="off"'), { req: true, name: 'name', for: 'f_name' })}
          ${field('직함', inp('title', x.title, 'placeholder="예: 인사팀장"'), { for: 'f_title' })}
          ${field('소속', inp('org', x.org), { for: 'f_org' })}
          ${field('부서', inp('dept', x.dept), { for: 'f_dept' })}
        </div></div>
        <div class="fsec"><h3>연락처</h3><div class="frow">
          ${field('휴대전화', inp('mobile', x.mobile, 'type="tel" inputmode="tel" placeholder="010-0000-0000"'), { for: 'f_mobile' })}
          ${field('사무실 전화', inp('phone', x.phone, 'type="tel" inputmode="tel" placeholder="031-000-0000"'), { for: 'f_phone' })}
          ${field('이메일', inp('email', x.email, 'type="email" inputmode="email"'), { full: true, for: 'f_email' })}
          ${field('주소', inp('address', x.address), { full: true, for: 'f_address' })}
        </div></div>
        <div class="fsec"><h3>연결 · 메모</h3><div class="frow">
          ${field('연결할 사업체·기관', `<select class="select" id="f_link" name="link">${linkOptions(linkVal)}</select>`, { full: true, for: 'f_link', hint: '연결하면 그 사업체·기관 상세 화면의 담당자로 표시됩니다.' })}
          ${field('받은 날', inp('metAt', x.metAt, 'type="date"'), { for: 'f_metAt' })}
          ${field('받은 곳', inp('metWhere', x.metWhere, 'placeholder="예: 사업체 방문, 채용박람회"'), { for: 'f_metWhere' })}
          ${field('태그', inp('tags', (x.tags || []).join(', '), 'placeholder="쉼표로 구분. 예: 인사 담당, 행사 명함"'), { full: true, for: 'f_tags' })}
          ${field('메모', ta('memo', x.memo, 'rows="3"'), { full: true, for: 'f_memo' })}
        </div></div>
      </form></div>` + foot(c ? '저장' : '등록'),
      after: form => {
        form.elements.photo.value = 'keep';
        const file = form.querySelector('#f_photoFile');
        const prev = form.querySelector('#photoPreview');
        file.addEventListener('change', async () => {
          const f = file.files[0];
          if (!f) return;
          try {
            const data = await resizeImage(f, 1000, .72);
            form.elements.photo.value = data; prev.src = data; prev.hidden = false;
            form.querySelector('#photoHint').textContent = '';
          } catch { App.toast('사진을 읽지 못했습니다. JPG나 PNG 파일인지 확인하세요.', 'error'); }
        });
        form.elements.link.addEventListener('change', () => {
          const [k, id] = form.elements.link.value.split(':');
          const t = k ? S.find(k, id) : null;
          if (t && !form.elements.org.value) form.elements.org.value = t.name;
          if (t && !form.elements.address.value && t.address) form.elements.address.value = t.address;
        });
      },
    };
  }

  function resizeImage(file, max, q) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = rej;
      r.onload = () => {
        const img = new Image();
        img.onerror = rej;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', q));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  /* ---------- 일정 ---------- */
  function event(ev, preset = {}) {
    const x = ev || { date: U.today(), time: '', type: '방문', targetType: '', targetId: '', ...preset };
    const tval = x.targetType && x.targetId ? `${x.targetType}:${x.targetId}` : '';
    return {
      html: head(ev ? '일정 수정' : '일정 등록') + `<div class="dr-body"><form class="form" id="entityForm" data-form="ev" data-id="${ev ? ev.id : ''}" novalidate>
        <div class="fsec"><div class="frow">
          ${field('관련 사업체·기관', `<select class="select" id="f_link" name="link">${linkOptions(tval)}</select>`, { full: true, for: 'f_link' })}
          ${field('유형', sel('type', D.EVENT_TYPES, x.type), { for: 'f_type' })}
          ${field('제목', inp('title', x.title, 'placeholder="비워 두면 \'유형 - 사업체명\'으로 저장"'), { for: 'f_title' })}
          ${field('날짜', inp('date', x.date, 'type="date" required'), { req: true, name: 'date', for: 'f_date' })}
          ${field('시간', inp('time', x.time, 'type="time"'), { for: 'f_time' })}
          ${field('메모', ta('memo', x.memo, 'rows="3" placeholder="예: 구직자 2명 동행, 이력서 지참"'), { full: true, for: 'f_memo' })}
        </div></div>
        ${ev ? `<div><button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-kind="ev" data-id="${ev.id}" style="color:var(--danger)">이 일정 삭제</button></div>` : ''}
      </form></div>` + foot(ev ? '저장' : '등록'),
    };
  }

  /* ---------- 수집 + 검증 ---------- */
  function collect(form) {
    const kind = form.dataset.form;
    const fd = Object.fromEntries(new FormData(form).entries());
    const errs = [];
    form.querySelectorAll('.field.err').forEach(f => { f.classList.remove('err'); f.querySelector('.errmsg')?.remove(); });
    const need = (k, msg) => { if (!String(fd[k] || '').trim()) errs.push([k, msg]); };
    let obj;
    const pos = () => ({ lat: fd.lat ? +fd.lat : null, lng: fd.lng ? +fd.lng : null, approx: !!fd.approx });
    if (kind === 'biz') {
      need('name', '사업체명을 입력하세요.');
      obj = { name: fd.name.trim(), industry: fd.industry.trim(), employees: fd.employees ? +fd.employees : 0, bizNo: fd.bizNo.trim(), ceo: fd.ceo.trim(), address: fd.address.trim(), area: fd.area, ...pos(), stage: fd.stage, placements: fd.placements ? +fd.placements : 0, jobs: fd.jobs.trim(), workConditions: fd.workConditions.trim(), accessibility: fd.accessibility.trim(), source: fd.source, discoveredAt: fd.discoveredAt, staff: fd.staff, memo: fd.memo.trim() };
    } else if (kind === 'net') {
      need('name', '기관명을 입력하세요.');
      obj = { name: fd.name.trim(), category: fd.category, status: fd.status, address: fd.address.trim(), area: fd.area, ...pos(), relation: fd.relation.trim(), promo: fd.promo.trim(), since: fd.since, staff: fd.staff, memo: fd.memo.trim() };
    } else if (kind === 'card') {
      need('name', '이름을 입력하세요.');
      const [lt, li] = (fd.link || '').split(':');
      obj = { name: fd.name.trim(), title: fd.title.trim(), org: fd.org.trim(), dept: fd.dept.trim(), mobile: fd.mobile.trim(), phone: fd.phone.trim(), email: fd.email.trim(), address: fd.address.trim(), linkType: lt || '', linkId: li || '', metAt: fd.metAt, metWhere: fd.metWhere.trim(), tags: fd.tags.split(',').map(t => t.trim()).filter(Boolean), memo: fd.memo.trim(), photo: fd.photo === 'keep' ? undefined : (fd.photo || null) };
    } else if (kind === 'ev') {
      need('date', '날짜를 입력하세요.');
      const [lt, li] = (fd.link || '').split(':');
      const t = lt ? S.find(lt, li) : null;
      obj = { targetType: lt || '', targetId: li || '', type: fd.type, title: fd.title.trim() || (t ? `${fd.type} - ${t.name}` : fd.type), date: fd.date, time: fd.time, memo: fd.memo.trim() };
    }
    errs.forEach(([k, msg]) => {
      const f = form.querySelector(`[data-f="${k}"]`);
      if (f) { f.classList.add('err'); f.insertAdjacentHTML('beforeend', `<span class="errmsg">${msg}</span>`); }
    });
    if (errs.length) form.querySelector(`[name="${errs[0][0]}"]`)?.focus();
    return errs.length ? null : { kind, obj };
  }

  return { biz, net, card, event, collect };
})();

</script>
<script>
/* 앱 셸: 라우팅, Drawer, 검색, 액션 처리 */
window.App = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const view = $('#view');
  const NAV = [
    ['dashboard', '대시보드', 'dash'],
    ['biz', '사업체 개발', 'biz', () => S.get().businesses.length],
    ['map', '지도', 'map'],
    ['cards', '명함 관리', 'card', () => S.get().cards.length],
    ['network', '네트워크', 'net', () => S.get().networks.length],
    ['schedule', '일정', 'cal', () => S.get().events.filter(x => !x.done && U.diffDays(U.today(), x.date) <= 7).length || ''],
    ['data', '데이터 관리', 'data'],
  ];
  const MOBILE = [['dashboard', '홈', 'dash'], ['biz', '사업체', 'biz'], ['map', '지도', 'map'], ['cards', '명함', 'card']];
  const route = () => (location.hash.replace(/^#\/?/, '').split('?')[0] || 'dashboard');

  /* ---------- Toast / Confirm ---------- */
  function toast(msg, type = '', opt = {}) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `<span>${U.esc(msg)}</span>`;
    if (opt.undo) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = '되돌리기';
      b.onclick = () => { opt.undo(); el.remove(); toast('되돌렸습니다.'); };
      el.appendChild(b);
    }
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), opt.undo ? 6000 : type === 'error' ? 5000 : 2600);
  }
  function confirmBox(title, body, ok = '확인') {
    return new Promise(res => {
      const layer = $('#confirmLayer');
      $('#confirmTitle').textContent = title;
      $('#confirmBody').textContent = body;
      $('#confirmOk').textContent = ok;
      layer.hidden = false;
      $('#confirmOk').focus();
      const done = v => { layer.hidden = true; $('#confirmOk').onclick = $('#confirmCancel').onclick = null; res(v); };
      $('#confirmOk').onclick = () => done(true);
      $('#confirmCancel').onclick = () => done(false);
    });
  }

  /* ---------- Nav ---------- */
  function renderNav() {
    const r = route();
    $('#sideNav').innerHTML = NAV.map(([k, l, ic, cnt]) => `<a href="#/${k}" class="${r === k ? 'active' : ''}" ${r === k ? 'aria-current="page"' : ''}>${V.I[ic]}<span>${l}</span>${cnt ? `<span class="count">${cnt()}</span>` : ''}</a>`).join('');
    const moreActive = ['network', 'schedule', 'data'].includes(r);
    $('#bottomNav').innerHTML = MOBILE.map(([k, l, ic]) => `<a href="#/${k}" class="${r === k ? 'active' : ''}">${V.I[ic]}${l}</a>`).join('') +
      `<button type="button" class="${moreActive ? 'active' : ''}" data-act="more">${V.I.more}더보기</button>`;
    $('#sideFoot').innerHTML = `${U.esc(S.get().settings.orgName)}<br>${S.REMOTE ? '팀 공유 모드 · 구글 시트에 저장' : '이 브라우저에만 저장됩니다.'}<br>사용자: <b>${U.esc(S.me())}</b>`;
    $('#demoBanner').hidden = !S.get().isDemo;
    renderScope();
  }

  /* ---------- 보기 범위 · 동기화 상태 ---------- */
  function renderScope() {
    const sel = $('#scopeSel');
    const staff = S.staff();
    const cur = S.getScope();
    const progs = D.PROGRAMS.filter(p => staff.some(s => s.program === p.key));
    sel.innerHTML = `<option value="all">전체 팀 (${staff.length}명)</option>` +
      progs.map(p => `<option value="p:${U.esc(p.key)}">${U.esc(p.key)} (${staff.filter(s => s.program === p.key).length}명)</option>`).join('') +
      `<optgroup label="직원별">${staff.map(s => `<option value="s:${U.esc(s.name)}">${U.esc(s.name)}${s.name === S.me() ? ' (나)' : ''}</option>`).join('')}</optgroup>`;

  function renderSync(sync) {
    const el = $('#syncState');

    el.hidden = false;
    const t = sync.at ? `${U.pad(sync.at.getHours())}:${U.pad(sync.at.getMinutes())}` : '';
    const map = { loading: ['불러오는 중', ''], saving: ['저장 중…', 'busy'], saved: [`저장됨 ${t}`, 'ok'], error: ['저장 오류', 'err'] };
    const [label, cls] = map[sync.status] || ['', ''];

  /* ---------- Pages ---------- */
  let bigMap = null, markerIndex = {}, markerGroup = null;
  function render() {
    const r = route();
    closeMore();
    const pages = {
      dashboard: [V.dashboard],
      biz: [V.bizPage, bindBiz],
      map: [V.mapPage, bindMap],
      cards: [V.cardsPage, bindCards],
      network: [V.netPage, bindNet],
      schedule: [V.schedPage, bindSched],
      data: [V.dataPage, bindData],

    }
    renderNav();

  function bindList(inputId, target, fn, setter) {
    const box = $(target);
    const draw = () => { box.innerHTML = fn(); };
    draw();
    const q = $(inputId);
    if (q) q.addEventListener('input', U.debounce(() => { setter(q.value.trim()); draw(); }, 120));
    return draw;
  }
  function bindBiz() {
    const f = V.ui.biz;
    const draw = bindList('#bizQ', '#bizResults', V.bizResults, v => { f.q = v; });
    $('#bizArea').onchange = ev => { f.area = ev.target.value; draw(); };
    $('#bizInd').onchange = ev => { f.industry = ev.target.value; draw(); };
    $('#bizMand').onchange = ev => { f.mandatory = ev.target.checked; draw(); };
    $('#bizSort').onchange = ev => { f.sort = ev.target.value; draw(); };
  }
  function bindNet() {
    const draw = bindList('#netQ', '#netResults', V.netResults, v => { V.ui.net.q = v; });
    $('#netStatus').onchange = ev => { V.ui.net.status = ev.target.value; draw(); };
  }
  function bindCards() {
    const draw = bindList('#cardQ', '#cardResults', V.cardResults, v => { V.ui.cards.q = v; });
    $('#cardSort').onchange = ev => { V.ui.cards.sort = ev.target.value; draw(); };
  }
  function bindMap() {
    bigMap = null;
    if (V.ui.map.mode === 'city') return;
    bigMap = M.create($('#bigMap'));
    refreshMap(true);
    $('#mapQ').addEventListener('input', U.debounce(ev => { V.ui.map.q = ev.target.value.trim(); refreshMap(false); }, 150));
  }
  function refreshMap(fit) {
    const items = V.mapItems();
    $('#mapList').innerHTML = V.mapList(items);
    if (!bigMap) return;
    if (markerGroup) markerGroup.remove();
    markerIndex = {};
    markerGroup = L.featureGroup();
    items.filter(i => M.hasPos(i.x)).forEach(({ kind, x }) => {
      const m = (kind === 'biz' ? M.bizMarker(x) : M.netMarker(x)).bindPopup(M.popupHtml(kind, x)).bindTooltip(x.name, { direction: 'top', offset: [0, -6] });
      m.addTo(markerGroup);
      markerIndex[kind + x.id] = m;
    });
    markerGroup.addTo(bigMap);
    if (fit && markerGroup.getLayers().length) bigMap.fitBounds(markerGroup.getBounds(), { padding: [30, 30], maxZoom: 14 });
  }
  function bindSched() {
    $('#evList').innerHTML = V.evList();
    $('#calBox').innerHTML = V.calendar();
  }
  function bindData() {
    $('#xlsxFile').onchange = async ev => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      try {
        const { next, found } = S.parseXlsx(await file.arrayBuffer());
        if (!found.length) { toast('알맞은 시트를 찾지 못했습니다. 시트 이름이 사업체·네트워크·명함·활동기록·일정인지 확인하세요.', 'error'); return; }
        const ok = await confirmBox('엑셀 데이터로 교체할까요?', `${found.join(', ')} 시트에서 사업체 ${next.businesses.length}곳, 기관 ${next.networks.length}곳, 명함 ${next.cards.length}장, 활동 ${next.activities.length}건, 일정 ${next.events.length}건을 읽었습니다. 지금 데이터는 모두 교체됩니다.`, '교체');
        if (!ok) return;
        next.isDemo = false;
        await S.replace(next);
        toast('엑셀 데이터를 불러왔습니다.');
      } catch (err) { console.error(err); toast('엑셀 파일을 읽지 못했습니다. 내보내기 양식과 같은 형식인지 확인하세요.', 'error'); }
    };
    $('#jsonFile').onchange = async ev => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      try {
        const next = JSON.parse(await file.text());
        if (!next.version || !Array.isArray(next.businesses)) throw new Error('형식 오류');
        if (!(await confirmBox('백업 파일로 복원할까요?', `사업체 ${next.businesses.length}곳, 명함 ${next.cards.length}장이 들어 있습니다. 지금 데이터는 모두 교체됩니다.`, '복원'))) return;
        next.isDemo = false;
        await S.replace(next);
        toast('백업에서 복원했습니다.');
      } catch { toast('백업 파일을 읽지 못했습니다. 이 프로그램에서 받은 JSON 파일인지 확인하세요.', 'error'); }
    };
    $('#meSel').onchange = ev => { S.setMe(ev.target.value); toast(`이 PC 사용자를 ${ev.target.value}(으)로 정했습니다.`); };
  }

  /* ---------- Drawer ---------- */
  let stack = [];
  const drawer = $('#drawer');
  function drawerOpen() { return drawer.classList.contains('open'); }
  function showDrawer() {
    drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
    $('#scrim').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    stack = [];
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true');
    $('#scrim').hidden = true;
    document.body.style.overflow = '';
    setTimeout(() => { if (!drawerOpen()) $('#drawerInner').innerHTML = ''; }, 250);
  }
  function renderDrawer(keepScroll) {
    const top = stack[stack.length - 1];
    if (!top) return closeDrawer();
    const inner = $('#drawerInner');
    const oldScroll = keepScroll ? inner.querySelector('.dr-body')?.scrollTop : 0;
    let v;
    if (top.type === 'detail') {
      const x = S.find(top.kind, top.id);
      if (!x) { stack.pop(); return renderDrawer(); }
      v = { biz: V.detailBiz, net: V.detailNet, card: V.detailCard }[top.kind](x, stack.length > 1);
    } else {
      const x = top.id ? S.find(top.kind, top.id) : null;
      v = { biz: () => F.biz(x), net: () => F.net(x), card: () => F.card(x, top.preset), ev: () => F.event(x, top.preset) }[top.kind]();
    }
    inner.innerHTML = v.html;
    showDrawer();
    const form = inner.querySelector('#entityForm');
    if (v.after) v.after(form);
    const body = inner.querySelector('.dr-body');
    if (body && oldScroll) body.scrollTop = oldScroll;
    if (!keepScroll) (form ? form.querySelector('input:not([type=hidden]):not([type=file]), select') : inner.querySelector('.dr-title'))?.focus?.({ preventScroll: true });
  }
  function push(entry, fromDrawer) {
    if (!fromDrawer) stack = [];
    stack.push(entry);
    renderDrawer();
  }
  const openDetail = (kind, id, fromDrawer) => (kind === 'ev' ? push({ type: 'form', kind: 'ev', id }, fromDrawer) : push({ type: 'detail', kind, id }, fromDrawer));

  function onSubmit(form) {
    const res = F.collect(form);
    if (!res) return;
    const { kind, obj } = res;
    const id = form.dataset.id;
    if (id) obj.id = id;
    const saved = S.upsert(kind, obj);
    if (!id && kind === 'biz') S.upsert('act', { targetType: 'biz', targetId: saved.id, date: saved.discoveredAt || U.today(), type: '발굴', content: `${saved.source || '발굴'}로 사업체 등록`, staff: saved.staff || S.me() });
    toast(id ? '저장했습니다.' : '등록했습니다.');
    stack.pop();
    if (!id && kind !== 'ev' && !stack.length) stack.push({ type: 'detail', kind, id: saved.id });
    renderDrawer();
  }

  /* ---------- Search ---------- */
  let srIndex = 0, srItems = [];
  function openSearch() {
    $('#searchLayer').hidden = false;
    const q = $('#searchInput');
    q.value = ''; drawSearch('');
    setTimeout(() => q.focus(), 10);
  }
  function closeSearch() { $('#searchLayer').hidden = true; }
  function drawSearch(q) {
    const box = $('#searchResults');
    if (!q.trim()) { box.innerHTML = '<div class="empty">사업체명, 담당자 이름, 전화번호 뒷자리, 기관명으로 찾을 수 있습니다.</div>'; srItems = []; return; }
    const r = S.search(q);
    srItems = [];
    const row = (kind, x, main, meta, side) => { srItems.push([kind, x.id]); return `<div class="sr ${srItems.length - 1 === srIndex ? 'hi' : ''}" data-act="sr-open" data-i="${srItems.length - 1}"><div style="min-width:0"><div class="name">${main}</div><div class="meta">${meta}</div></div><div class="side">${side}</div></div>`; };
    const contactSide = (kind, id, la) => { const c = S.cardsOf(kind, id)[0]; return `${c ? `<div class="phone">${U.esc(c.name)} ${U.esc(c.mobile || c.phone || '')}</div>` : ''}${la ? `<div>최근 ${U.esc(la.type)} ${U.dateDot(la.date)}</div>` : ''}`; };
    let html = '';
    if (r.biz.length) html += `<div class="sr-group"><h4>사업체 개발</h4>${r.biz.map(b => row('biz', b, U.hl(b.name, q), `${U.esc(b.stage)} · ${U.esc(b.industry)} · ${U.esc(b.area || '')}`, contactSide('biz', b.id, S.lastAct('biz', b.id)))).join('')}</div>`;
    if (r.card.length) html += `<div class="sr-group"><h4>명함</h4>${r.card.map(c => row('card', c, `${U.hl(c.name, q)} <span class="meta">${U.esc(c.title || '')}</span>`, U.hl(c.org || '', q), `<div class="phone">${U.hl(c.mobile || c.phone || '', q)}</div>`)).join('')}</div>`;
    if (r.net.length) html += `<div class="sr-group"><h4>네트워크</h4>${r.net.map(n => row('net', n, U.hl(n.name, q), `${U.esc(n.category)} · 관계 ${U.esc(n.status)}`, contactSide('net', n.id, S.lastAct('net', n.id)))).join('')}</div>`;
    box.innerHTML = html || `<div class="empty"><strong>'${U.esc(q)}' 검색 결과가 없습니다</strong>이름 일부나 전화번호 뒷자리 4자리로 다시 찾아보세요.</div>`;
  }

  /* ---------- More sheet (mobile) ---------- */
  function closeMore() { document.querySelector('.more-sheet')?.remove(); }
  function toggleMore() {
    if (document.querySelector('.more-sheet')) return closeMore();
    const el = document.createElement('div');
    el.className = 'more-sheet';
    el.innerHTML = '<a href="#/network">네트워크</a><a href="#/schedule">일정</a><a href="#/data">데이터 관리</a>';
    document.body.appendChild(el);
  }

  /* ---------- vCard ---------- */
  function vcard(c) {
    const esc = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${esc(c.name.slice(0, 1))};${esc(c.name.slice(1))};;;`, `FN:${esc(c.name)}`];
    if (c.org) lines.push(`ORG:${esc(c.org)}${c.dept ? ';' + esc(c.dept) : ''}`);
    if (c.title) lines.push(`TITLE:${esc(c.title)}`);
    if (c.mobile) lines.push(`TEL;TYPE=CELL:${c.mobile}`);
    if (c.phone) lines.push(`TEL;TYPE=WORK:${c.phone}`);
    if (c.email) lines.push(`EMAIL;TYPE=WORK:${c.email}`);
    if (c.address) lines.push(`ADR;TYPE=WORK:;;${esc(c.address)};;;;`);
    if (c.memo) lines.push(`NOTE:${esc(c.memo)}`);
    lines.push('END:VCARD');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' }));
    a.download = `${c.name}.vcf`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------- Actions ---------- */

    go: el => { location.hash = el.dataset.href; },

    'sr-open': el => { const [k, id] = srItems[+el.dataset.i]; closeSearch(); openDetail(k, id, false); },
    'close-search': closeSearch,
    'new-biz': (el, fd) => push({ type: 'form', kind: 'biz' }, fd),
    'new-net': (el, fd) => push({ type: 'form', kind: 'net' }, fd),
    'new-card': (el, fd) => {
      const [lt, li] = (el.dataset.link || '').split(':');
      const t = lt ? S.find(lt, li) : null;
      push({ type: 'form', kind: 'card', preset: t ? { linkType: lt, linkId: li, org: t.name, address: t.address || '' } : {} }, fd);
    },
    'new-event': (el, fd) => {
      const [lt, li] = (el.dataset.target || '').split(':');

    'edit-event': (el, fd) => push({ type: 'form', kind: 'ev', id: el.dataset.id }, fd),
    delete: async el => {
      const { kind, id } = el.dataset;
      const x = S.find(kind, id);
      if (!x) return;
      const label = { biz: '사업체', net: '기관', card: '명함', ev: '일정' }[kind];
      const extra = kind === 'biz' || kind === 'net' ? ' 이곳의 활동 기록과 일정도 함께 지워지고, 연결된 명함은 연결만 해제됩니다.' : '';

    },
    'data-clear': async () => {
      if (!(await confirmBox('모든 데이터를 지울까요?', '사업체, 명함, 기관, 활동 기록, 일정이 모두 삭제됩니다. 되돌릴 수 없으니 먼저 엑셀이나 백업 파일로 저장해 두세요.', '모두 지우기'))) return;
      const next = D.empty();
      next.settings = { ...S.get().settings };
      await S.replace(next);
      toast('모든 데이터를 지웠습니다. 새로 등록을 시작하세요.');
    },
    'data-demo': async () => {
      if (!(await confirmBox('예시 데이터를 불러올까요?', '지금 데이터가 예시 데이터로 교체됩니다.', '불러오기'))) return;
      await S.replace(D.demo());
      toast('예시 데이터를 불러왔습니다.');
    },
  };

  function bindGlobal() {
    document.addEventListener('click', ev => {
      if (!ev.target.closest('.menu-wrap')) $('#quickMenu').hidden = true;
      if (!ev.target.closest('.more-sheet, [data-act="more"]')) closeMore();
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      if (!A[act]) return;
      if (el.tagName === 'A' && act !== 'map-net-only') ev.preventDefault();
      if (el.closest('.menu')) $('#quickMenu').hidden = true;
      A[act](el, !!el.closest('#drawer'));
    });
    document.addEventListener('keydown', ev => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); openSearch(); return; }
      if (ev.key === 'Escape') {
        if (!$('#confirmLayer').hidden) return $('#confirmCancel').click();
        if (!$('#searchLayer').hidden) return closeSearch();
        if (drawerOpen()) return (stack.length > 1 ? A['dr-back']() : closeDrawer());
      }
      if (ev.key === 'Enter' && ev.target.matches('[data-act][tabindex]')) ev.target.click();
    });
    $('#searchTrigger').onclick = openSearch;
    $('#scopeSel').onchange = ev => S.setScope(ev.target.value);
    S.onSync(renderSync);
    renderSync(S.sync);
    $('#searchLayer').addEventListener('click', ev => { if (ev.target.id === 'searchLayer') closeSearch(); });
    $('#searchInput').addEventListener('input', ev => { srIndex = 0; drawSearch(ev.target.value); });
    $('#searchInput').addEventListener('keydown', ev => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        if (!srItems.length) return;
        srIndex = (srIndex + (ev.key === 'ArrowDown' ? 1 : -1) + srItems.length) % srItems.length;
        drawSearch(ev.target.value);
        $('.sr.hi')?.scrollIntoView({ block: 'nearest' });
      } else if (ev.key === 'Enter' && srItems[srIndex]) {
        const [k, id] = srItems[srIndex]; closeSearch(); openDetail(k, id, false);
      }
    });
    $('#scrim').onclick = closeDrawer;
    document.addEventListener('submit', ev => {
      const form = ev.target;
      ev.preventDefault();
      if (form.id === 'entityForm') return onSubmit(form);
      if (form.dataset.form === 'quick-log') {
        const fd = Object.fromEntries(new FormData(form).entries());
        if (!fd.content.trim()) { form.elements.content.focus(); return toast('기록할 내용을 입력하세요.', 'error'); }
        S.upsert('act', { targetType: form.dataset.kind, targetId: form.dataset.id, date: fd.date || U.today(), type: fd.type, content: fd.content.trim(), staff: fd.staff });
        toast('활동을 기록했습니다.');
      }
    });
    window.addEventListener('hashchange', () => { if (drawerOpen()) closeDrawer(); render(); view.focus({ preventScroll: true }); window.scrollTo(0, 0); });
    S.subscribe(() => {
      if (route() !== 'map' || !drawerOpen()) render(); else { refreshMap(false); renderNav(); }
      if (drawerOpen() && stack[stack.length - 1]?.type === 'detail') renderDrawer(true);
    });
  }

  async function start() {
    view.innerHTML = `<div class="skel" style="height:28px;width:180px;margin-bottom:18px"></div><div class="skel" style="height:110px;margin-bottom:18px"></div><div class="skel" style="height:320px"></div>`;
    try {
      await S.init();
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="panel"><div class="empty"><strong>데이터를 불러오지 못했습니다</strong>브라우저 저장소에 접근할 수 없습니다. 시크릿 창이라면 일반 창에서 열어 주세요.<div><button class="btn" type="button" onclick="location.reload()">다시 시도</button></div></div></div>`;
      return;
    }
    bindGlobal();
    render();
  }

  return { start, toast, confirm: confirmBox, render };
})();

App.start();

</script>
</body>
</html>
