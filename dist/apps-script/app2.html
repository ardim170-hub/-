          <button class="btn btn-primary" type="submit">추가</button>
          <datalist id="ctBizList">${names.map(n => `<option value="${e(n)}">`).join('')}</datalist>
        </form>
      </section>
      <div id="ctResults"></div>`;
  }

  /* ---------- 담당자별 연락 현황 (상급자 보기용): 사람마다 한 줄, 방식별로 나눈 막대 + 숫자 ---------- */
  const TYPE_COLOR = { '전화': '#2a78d6', '방문': '#eb6834', '이메일': '#1baf7a', '미팅': '#eda100' }; // 검증한 순서 (색맹 구분 통과)
  function staffChart(rows, month) {
    const names = [...new Set([...S.staffHere().map(x => x.name), ...rows.map(r => r.a.staff).filter(Boolean)])];
    if (!names.length) return '';
    const by = names.map(n => {
      const mine = rows.filter(r => r.a.staff === n);
      const t = Object.fromEntries(CONTACT_TYPES.map(k => [k, mine.filter(r => r.a.type === k).length]));
      return { n, t, total: mine.length, biz: new Set(mine.map(r => r.b.id)).size, willing: new Set(mine.filter(r => r.a.result === '채용의향 있음').map(r => r.b.id)).size, days: new Set(mine.map(r => r.a.date)).size };
    });
    const max = Math.max(1, ...by.map(x => x.total));
    const legend = CONTACT_TYPES.map(k => `<span><i style="background:${TYPE_COLOR[k]}"></i>${k}</span>`).join('');
    const bar = x => CONTACT_TYPES.filter(k => x.t[k]).map(k => `<i class="scb-seg" style="width:${x.t[k] / max * 100}%;background:${TYPE_COLOR[k]}" title="${e(x.n)} · ${k} ${x.t[k]}건"></i>`).join('');
    return `<section class="panel panel-pad staff-chart">
      <div class="sc-head"><h2 class="section-title">👥 담당자별 연락 현황 <span class="sub">${V.monthLabel(month)} · 누가 얼마나 연락했는지</span></h2><div class="scb-legend">${legend}</div></div>
      <div class="scb-rows">${by.map(x => `<div class="scb-row">
        <span class="scb-name">${e(x.n)}</span>
        <div class="scb-track" role="img" aria-label="${e(x.n)} ${x.total}건: ${CONTACT_TYPES.map(k => `${k} ${x.t[k]}`).join(', ')}">${bar(x) || '<span class="scb-zero">이 달 기록 없음</span>'}</div>
        <span class="scb-total"><b class="num">${x.total}</b>건</span>
        <span class="scb-meta">${CONTACT_TYPES.filter(k => x.t[k]).map(k => `${k} ${x.t[k]}`).join(' · ') || '-'}<br>사업체 ${x.biz}곳 · ${x.days}일${x.willing ? ` · 채용의향 ${x.willing}곳` : ''}</span>
      </div>`).join('')}</div>
      <details class="scb-table"><summary>표로 보기</summary><div class="table-wrap"><table class="tbl"><thead><tr><th>담당자</th>${CONTACT_TYPES.map(k => `<th class="r">${k}</th>`).join('')}<th class="r">합계</th><th class="r">사업체</th><th class="r">연락한 날</th><th class="r">채용의향</th></tr></thead>
        <tbody>${by.map(x => `<tr><th>${e(x.n)}</th>${CONTACT_TYPES.map(k => `<td class="r num">${x.t[k]}</td>`).join('')}<td class="r num"><b>${x.total}</b></td><td class="r num">${x.biz}</td><td class="r num">${x.days}</td><td class="r num">${x.willing}</td></tr>`).join('')}</tbody></table></div></details>
    </section>`;
  }

  /** 예전에 연락이력(입력·가져오기)으로 자동 등록된 사업체: 연락 기록만 있고 명함·일정·실적·지원 진행이 없는 곳 */
  function autoBiz() {
    const st = S.get();
    const by = new Map();
    st.activities.forEach(a => { if (a.targetType === 'biz') { const l = by.get(a.targetId) || []; l.push(a); by.set(a.targetId, l); } });
    const evIds = new Set(st.events.filter(x => x.targetType === 'biz').map(x => x.targetId));
    const cardIds = new Set(st.cards.filter(c => c.linkType === 'biz').map(c => c.linkId));
    return st.businesses.filter(b => !S.isPending(b) && (b.source === '현장 발굴' || b.source === '연락이력') && b.stage !== '채용연계' && !S.supportOf(b).types.length && !cardIds.has(b.id) && !evIds.has(b.id) && S.inScope(b.staff)
      && (by.get(b.id) || []).length && (by.get(b.id) || []).every(a => a.fromPerf !== 'Y' && (CONTACT_TYPES.includes(a.type) || (a.type === '발굴' && /연락이력/.test(a.content || '')))))
      .map(b => ({ b, acts: (by.get(b.id) || []).filter(a => a.type !== '발굴') })).sort((x, y) => (x.b.discoveredAt || '').localeCompare(y.b.discoveredAt || ''));
  }
  function autoBizPanel() {
    if (ui.contacts.autoHide) return '';
    const list = autoBiz();
    if (!list.length) return '';
    return `<details class="panel-pad reg-clean" ${ui.contacts.autoOpen ? 'open' : ''}><summary data-act="ct-auto-open"><b>🧹 연락이력으로 자동 등록됐던 사업체 ${list.length}곳 정리</b> <span class="sub">연락만 한 곳이 사업체 개발·지도에 올라가 있어요. 뺄 곳을 골라 미등록으로 돌리세요 (연락 기록은 그대로)</span></summary>
      <div class="inline" style="margin:8px 0"><button class="btn btn-sm" type="button" data-act="ct-auto-all" data-v="1">모두 고르기</button><button class="btn btn-sm" type="button" data-act="ct-auto-all" data-v="0">모두 풀기</button><button class="btn btn-sm btn-primary" type="button" data-act="ct-unreg">고른 곳 미등록으로 (사업체·지도에서 빼기)</button><button class="btn btn-sm btn-ghost" type="button" data-act="ct-auto-hide">이대로 두기</button></div>
      <div class="table-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th></th><th>사업체명</th><th>단계</th><th>처음 연락</th><th class="r">연락</th><th>최근 결과</th><th>담당</th></tr></thead><tbody>
        ${list.map(({ b, acts }) => { const last = acts.slice().sort((x, y) => y.date.localeCompare(x.date))[0] || {}; return `<tr><td><input type="checkbox" class="reg-pick" value="${b.id}" checked aria-label="${e(b.name)} 미등록으로"></td><td><b class="link" data-act="open" data-kind="biz" data-id="${b.id}">${e(b.name)}</b></td><td>${e(b.stage || '')}</td><td class="num nowrap">${e(b.discoveredAt || '')}</td><td class="r num">${acts.length}</td><td class="clip" title="${e(last.content || '')}">${e(last.result || last.content || '')}</td><td>${e(b.staff || '')}</td></tr>`; }).join('')}
      </tbody></table></div></details>`;

  /** 이미 네트워크에 있는 같은 기관 (이름·전화로) */
  function sameNet(b) {
    const o = resolveOrg(b.name, b.phone, orgIndex().filter(x => x.kind === 'net'));
    return o ? o.x : null;
  }
  /** 미등록 → 사업체(그대로 보이게) 또는 기관(네트워크로 옮기고 연락 기록도 기관 기록으로) */
  function registerBiz(id, kind) {
    const b = S.find('biz', id);
    if (!b) return null;
    if (kind !== 'net') { S.upsert('biz', { id, pending: '' }); return { kind: 'biz', x: b }; }
    // 네트워크에 같은 기관이 이미 있으면 새로 만들지 않고 그 기관으로 옮긴다
    const same = sameNet(b);
    const n = same || S.upsert('net', { name: b.name, category: D.guessCategory(b.name) || '복지기관', status: '보통', phone: b.phone || '', address: b.address || '', since: b.discoveredAt || U.today(), staff: b.staff || S.me(), programs: b.programs || [], relation: '', promo: '', memo: b.memo || '' });
    const moves = S.get().activities.filter(a => a.targetType === 'biz' && a.targetId === id).map(a => ({ id: a.id, targetType: 'net', targetId: n.id }));
    if (moves.length) S.putMany('act', moves);
    const cards = S.get().cards.filter(c => c.linkType === 'biz' && c.linkId === id).map(c => ({ id: c.id, linkType: 'net', linkId: n.id }));
    if (cards.length) S.putMany('card', cards);
    S.remove('biz', id);
    return { kind: 'net', x: n };
  }
  function contactsResults() {

        ${visits.length ? `<div class="table-wrap"><table class="tbl perf-tbl"><thead><tr><th>날짜</th><th>업체명</th><th>주소</th><th>연락처/담당자</th><th>결과</th><th>현장훈련 유/무</th><th>절차</th></tr></thead><tbody>
          ${visits.map(({ a, b }) => `<tr class="sc-row" style="--sc:${V.staffColor(a.staff)}" title="${e(a.staff || '')}"><td class="num">${U.dateDot(a.date)}</td><td><b class="link" data-act="open" data-kind="biz" data-id="${b.id}">${e(b.name)}</b></td><td class="clip" title="${e(b.address)}">${e(b.address || '')}</td>
            <td>${e(phoneOf(b))}<div class="meta">${e(a.contactName || contactOf(b))}</div></td><td class="wrap">${e(a.content)}</td>
            <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="training">${opts(['유', '무'], a.training, '-')}</select></td>
            <td><select class="select sm" data-chg="act-field" data-id="${a.id}" data-field="procedure">${opts(D.PROCEDURES, a.procedure, '-')}</select></td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty"><strong>${V.monthLabel(f.month)}에 방문 기록이 없습니다</strong>방식을 '방문'으로 골라 기록하면 여기에 나옵니다.</div>`}
      </section>`;
    }
    const all = rows, ocN = k => all.filter(r => outcomeOf(r.a) === k).length;
    const shown = f.oc ? all.filter(r => outcomeOf(r.a) === f.oc) : all;
    const ocBar = `<div class="oc-bar"><div class="chips" role="tablist" aria-label="진행 결과로 거르기"><button type="button" class="chip ${!f.oc ? 'on' : ''}" data-act="ct-ocf" data-v="">전체 <span class="n">${all.length}</span></button>${OUTCOMES.map(([k, c, ic]) => `<button type="button" class="chip oc-chip ${c} ${f.oc === k ? 'on' : ''}" data-act="ct-ocf" data-v="${k}"><i class="oc-dot ${c}"></i>${k} <span class="n">${ocN(k)}</span></button>`).join('')}</div>
      <span class="sub">줄 오른쪽 <b>✔ 완료 · … 진행중 · ✕ 실패</b>를 눌러 체크하세요. 체크하지 않은 줄은 연락결과가 채용안함·채용마감이면 실패, 나머지는 진행중으로 보여요.</span></div>`;
    return kpi + staffChart(rows, f.month) + `<section class="panel">
      <div class="panel-pad perf-actions"><h2 class="section-title">${V.monthLabel(f.month)} 연락이력 <span class="sub num">${rows.length}건</span> <span class="oc-sum"><i class="oc-dot done"></i>완료 ${ocN('완료')} · <i class="oc-dot going"></i>진행중 ${ocN('진행중')} · <i class="oc-dot fail"></i>실패 ${ocN('실패')}</span></h2>
        <button class="btn btn-primary" type="button" data-act="ct-copy" ${rows.length ? '' : 'disabled'}>${V.I.copy}연락이력 시트용 복사</button></div>
      <p class="sub perf-help">공유 시트 <b>○월 연락이력</b> 탭에서 새 줄의 <b>날짜</b> 칸을 누르고 Ctrl+V 하세요. (날짜 · 사업체명 · 주소 · 전화번호 · 담당자 · 직종 · 결과 · 연락결과 · 상태 · 상담자)</p>
      ${rows.length ? ocBar : ''}
      ${(() => { const pend = [...new Map(all.filter(r => S.isPending(r.b)).map(r => [r.b.id, r.b])).values()]; return pend.length ? `<div class="reg-bar"><span><span class="badge reg-no">미등록</span> 이 달 연락한 곳 중 <b>${pend.length}곳</b>은 사업체·지도에 안 올라가 있어요. 올릴 곳만 줄의 <b>✏️ 사업체 등록</b> / <b>✏️ 기관 등록</b>을 눌러 직접 입력하세요. (연락 기록은 등록한 곳으로 이어져요)</span></div>` : ''; })()}

          <td class="num">${e(phoneOf(b))}</td><td>${e(a.contactName || contactOf(b))}</td><td class="clip">${e(a.jobType || b.jobs || '')}</td><td class="wrap"><textarea class="input sm ct-txt" rows="1" data-chg="act-field" data-id="${a.id}" data-field="content" aria-label="결과">${e(a.content)}</textarea></td>

          <td class="nowrap">${jobLink(a.jobUrl) ? `<a class="btn btn-sm btn-job" href="${e(jobLink(a.jobUrl))}" target="_blank" rel="noopener" title="${e(a.jobUrl)}">공고 보기 · ${e(siteName(a.jobUrl))}</a><button class="icon-btn" type="button" style="width:28px;height:28px" aria-label="공고 주소 바꾸기" data-act="ct-url" data-id="${a.id}">${V.I.edit}</button>`

          <td><button class="icon-btn" type="button" aria-label="이 연락 기록 삭제" title="삭제" data-act="act-del" data-id="${a.id}">${V.I.close}</button></td></tr>`).join('')}
      </tbody></table></div>` : rows.length ? `<div class="empty"><strong>'${e(f.oc)}'인 연락이 없습니다</strong>위에서 전체를 눌러 보세요.</div>` : `<div class="empty"><strong>${V.monthLabel(f.month)} 연락이력이 없습니다</strong>위 칸에 기록하거나, 공유 시트의 연락이력을 복사해 <b>시트에서 붙여넣어 가져오기</b>로 옮겨 오세요.</div>`}

  function commitPaste(rows, fallback) {
    const me = fallback || S.me(), key = n => U.orgKey(n);

    const bizSpecs = new Map(), netSpecs = new Map();
    list.filter(r => !r.match).forEach(r => {
      const k = key(r.name), who = r.who || me;
      if (false) {
        const x = netSpecs.get(k) || { name: r.name, category: D.guessCategory(r.name) || '복지기관', status: '보통', phone: '', address: '', since: r.date, staff: who, programs: progs, relation: '', memo: '' };
        if (!x.phone && r.phone) x.phone = r.phone;
        if (!x.address && r.address) x.address = r.address;
        if (r.date < x.since) x.since = r.date;

        return;
      }
      const x = bizSpecs.get(k) || { name: r.name, phone: '', address: '', stage: '접촉', discoveredAt: r.date, source: '연락이력', staff: who, placements: 0, jobs: '', programs: progs, pending: 'Y' };
      if (!x.phone && r.phone) x.phone = r.phone;
      if (!x.address && r.address) x.address = r.address;
      if (!x.jobs && r.jobType) x.jobs = r.jobType;
      if (r.type === '방문' || /방문|실적|직무분석/.test(r.progress || '')) x.stage = '방문상담';

    if (!one) per.filter(([, d]) => d.contact.length).forEach(([m, d]) => XLSX.utils.book_append_sheet(wb, sheetOf(d.contact, headOf('contact')), `${label(m)} 연락이력`));
    const file = one ? `아르딤_월별정리_${months[0]}.xlsx` : `아르딤_월별정리_${months[0].slice(0, 4)}년_${label(months[0])}-${label(months[months.length - 1])}.xlsx`;
    XLSX.writeFile(wb, file);
    return { file, rows: per.reduce((a, [, d]) => a + BOOK.reduce((b, [k]) => b + d[k].length, 0), 0) };
  }

  /* ---------- 구글 드라이브 달별 정리: 구역 / 분류 폴더 / 'YYYY-MM 분류' 파일 ---------- */
  const ARCHIVE_SECTIONS = [{ section: '현장중심', scope: 'p:장애인개발원' }];
  const toAoa = rows => { const head = rows[0] ? Object.keys(rows[0]) : null; return { head, rows: rows.map(r => Object.values(r).map(x => (x == null ? '' : String(x)))) }; };
  const sheet = (name, rows, head) => { const t = toAoa(rows); return { name, head: t.head || head, rows: t.rows }; };
  function archiveFiles(month, sc) {
    const v = S.view(sc), d = monthData(month, v, sc);
    const bizActs = v.activities.filter(a => a.targetType === 'biz' && (a.date || '').startsWith(month)).map(a => ({ a, b: S.find('biz', a.targetId) })).filter(r => r.b)
      .sort((x, y) => x.a.date.localeCompare(y.a.date)).map(({ a, b }) => ({ '날짜': a.date, '유형': a.type, '사업체명': b.name, '진행 단계': b.stage || '', '내용': a.content || '', '실적 세부사업': (S.perfOf(a) || {}).item || '', '담당 직원': a.staff || '' }));
    const status = v.businesses.map(b => { const la = S.lastAct('biz', b.id); return { '사업체명': b.name, '진행 단계': b.stage || '', '최초 등록일': S.bizFirst(b) || b.discoveredAt || '', '업종': b.industry || '', '주소': b.address || '', '대표 전화': b.phone || '', '사업체 담당자': contactOf(b), '가능 직무': b.jobs || '', '발굴 경로': b.source || '', '담당 직원': b.staff || '', '최근 활동': la ? `${la.date} ${la.type}` : '' }; }).sort((x, y) => x['최초 등록일'].localeCompare(y['최초 등록일']));
    const sheetRows = window.GL ? S.perfTable(month, GL.SET, true, v).map(r => ({ '사업날짜': r.date, '대분류': r.big, '중분류': r.mid, '세부사업명': r.item, '비고': r.note, '출처': r.src })) : [];
    const ym = month;
    const files = [
      { folder: '사업체 개발', name: `${ym} 사업체 개발`, has: d.newBiz.length + bizActs.length, sheets: [sheet('신규 등록 사업체', d.newBiz, ['최초 등록일', '사업체명']), sheet('사업체 활동', bizActs, ['날짜', '유형', '사업체명']), sheet('사업체 현황(만든 날 기준)', status, ['사업체명'])] },
      { folder: '연락이력', name: `${ym} 연락이력`, has: d.contact.length, sheets: [sheet('연락이력', d.contact, ['날짜', '사업체명']), sheet('방문 사업체(보고용)', d.visit, ['날짜', '사업체명'])] },
      { folder: '실적', name: `${ym} 실적`, has: d.perf.length, sheets: [sheet('실적 목록', d.perf, ['날짜', '세부사업']), sheet('구글 시트용(실적 기타)', sheetRows, ['사업날짜', '세부사업명'])] },
      { folder: '일정·명함', name: `${ym} 일정·명함`, has: d.ev.length + d.cards.length, sheets: [sheet('일정', d.ev, ['날짜', '제목']), sheet('받은 명함', d.cards, ['받은 날', '이름'])] },
    ];
    return files.filter(f => f.has).map(({ has, ...f }) => f); // eslint-disable-line no-unused-vars
  }
  /** 기록이 있는 달 (가장 이른 달부터 이번 달까지) */
  function archiveMonths(sc) {
    const v = S.view(sc);
    const ds = [...v.activities.map(a => a.date), ...v.perfs.map(p => p.date), ...v.trips.map(t => t.date), ...v.events.map(x => x.date), ...v.cards.map(c => c.metAt), ...v.businesses.map(b => S.bizFirst(b) || b.discoveredAt)].filter(x => /^\d{4}-\d{2}/.test(x || '')).sort();
    if (!ds.length) return [];
    const out = []; let [y, m] = ds[0].slice(0, 7).split('-').map(Number); const end = U.today().slice(0, 7);
    while (`${y}-${U.pad(m)}` <= end && out.length < 60) { out.push(`${y}-${U.pad(m)}`); if (++m > 12) { m = 1; y++; } }
    return out;
  }

  return { ARCHIVE_SECTIONS, archiveFiles, archiveMonths, monthData, monthBook, ui, bulkState, bulkSummary, bulkDocs, bulkFile, jobLink, siteName, contactsPage, contactsResults, contactRows, secStaffBar, contactTsv, reportTsv, addContact, registerBiz, parsePaste, parseCells, parseSheets, readFileSheets, pasteDialog, commitPaste, ordersPage, ordersResults, importVisits, ordersTsv, orderDoc, orderDocsEach, orderFile, parseOrderTables, markDup, hwpDialog, commitHwp, ledgerTsv, progressOf };
})();

<script>
/* 출장 여비 계산 (중증장애인직업재활지원사업 규정집 2026 여비 기준 + 복지관 정산 기준)
   - 근무지 내(관내, 화성시 안): 일비 4시간 미만 5천원 · 4시간 이상 1만원 (기관차량·자차 같음) + 유류비 + 통행료 + 주차료
   - 식비: 한 사람 하루 최대 2만원 (출장·특근 식비를 합쳐서)
   - 근무지 외(관외): 운임 + 숙박비(상한) + 식비(1일 2만원 이내) + 일비(1일 2만원 이내)
   - 하루에 여러 번 나가면 출장시간을 모두 더해 계산하되 1일 기준 금액을 넘지 않는다
   - 하루에 관내·관외를 같이 가면 관외 기준으로 준다 */
window.TV = (() => {
  const e = U.esc;
  const RULE = {
    daily: { long: { car: 10000, nocar: 10000 }, short: { car: 5000, nocar: 5000 } }, // 관내 일비: 4시간 이상 1만원 / 미만 5천원 (복지관 정산 기준: 기관차량·자차 같음)
    outDaily: 20000, // 관외 일비 1일 상한
    meal: 20000, // 식비 1일 상한 (관외는 안 적으면 상한으로 잡음, 관내·특근은 적은 금액을 같이 계산)
    lodge: { 특별시: 70000, 광역시: 60000, '그 외': 50000 }, // 숙박비 1박 상한
    ot: { short: 5000, long: 10000 }, // 특근비 1일: 4시간 미만 / 4시간 이상 (데이터 관리 없이 출장·특근 화면에서 관리자가 바꿀 수 있음)
  };
  /** 특근비 단가 (설정값이 있으면 그것) */
  const otRate = () => ({ short: num((S.get().settings || {}).otShort) || RULE.ot.short, long: num((S.get().settings || {}).otLong) || RULE.ot.long });
  const LODGE_REGIONS = Object.keys(RULE.lodge);
  const METRO = /서울|인천|대전|대구|광주광역|울산|부산/;
  // 화성시 밖 지명 (관외 자동 판단용). 화성시 안 지명은 D.AREAS에서 본다
  const OTHER_CITY = /서울|인천|대전|대구|광주|울산|부산|세종|수원|오산|평택|안산|용인|시흥|안양|군포|의왕|광명|부천|성남|과천|하남|이천|안성|여주|김포|고양|파주|의정부|남양주|구리|천안|아산|당진|청주|춘천|원주|강릉|전주|제주|창원|포항|경주|양평|가평|포천|동두천|양주|연천|충청|전라|경상|강원/;
  const num = v => { const n = Number(String(v ?? '').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; };
  const won = n => `${Math.round(n).toLocaleString('ko-KR')}`;

  /** "9 ~ 12시", "09:00~12:30", "14시~18시", "1~5시"(오후) → 분. 모르면 0 */
  function minutesOf(text) {
    const s = String(text || '').replace(/\s/g, '');
    const m = s.match(/(오전|오후)?(\d{1,2})(?:[:시.](\d{2}))?(?:분)?(?:시)?[~\-–〜](오전|오후)?(\d{1,2})(?:[:시.](\d{2}))?/);
    if (!m) return 0;
    let a = +m[2] + (+m[3] || 0) / 60, b = +m[5] + (+m[6] || 0) / 60;
    if (m[1] === '오후' && a < 12) a += 12;
    if ((m[4] === '오후' || (m[1] === '오후' && !m[4])) && b < 12) b += 12;
    if (!m[1] && a >= 1 && a <= 7) a += 12; // 1~7시는 오후로 본다 (근무시간)
    if (!m[4] && !m[1] && b >= 1 && b <= 8 && b < a) b += 12;
    if (b <= a && b + 12 > a) b += 12;
    const min = Math.round((b - a) * 60);
    return min > 0 && min <= 24 * 60 ? min : 0;
  }
  const hm = min => (min ? `${Math.floor(min / 60)}시간${min % 60 ? ` ${min % 60}분` : ''}` : '');

  /** 출장지 이름으로 지도에 있는 사업체·기관을 찾는다 */
  function placeOf(t) {
    const key = U.orgKey(t.place || '');
    if (key.length < 2) return null;
    const st = S.view();
    const all = [...st.businesses, ...st.networks];
    return all.find(x => U.orgKey(x.name) === key) || all.find(x => { const k = U.orgKey(x.name); return k.length >= 2 && (k.includes(key) || key.includes(k)); }) || null;
  }
  const homeOf = () => S.get().networks.find(n => S.isHome(n) && M.hasPos(n)) || null;
  /** 관내·관외: 직접 고른 값이 먼저, 없으면 출장지·주소로 판단 (모르면 관내 = 관내출장 명령부) */
  function zoneOf(t) {
    if (t.zone === '관내' || t.zone === '관외') return t.zone;
    const p = placeOf(t);
    const text = [t.place, p && p.address].filter(Boolean).join(' ');
    if (/화성/.test(text)) return '관내';
    if (p && p.area && D.AREA_BY_NAME && D.AREA_BY_NAME[p.area]) return '관내';
    return OTHER_CITY.test(text) ? '관외' : '관내';
  }
  function regionOf(t) {
    if (LODGE_REGIONS.includes(t.lodgeRegion)) return t.lodgeRegion;
    const p = placeOf(t);
    const text = [t.place, p && p.address].filter(Boolean).join(' ');
    return /서울/.test(text) ? '특별시' : METRO.test(text) ? '광역시' : '그 외';
  }
  const hasCar = t => /복지관|기관|관용|공용/.test(t.method || '');
  const ownCar = t => /개인|자가|본인/.test(t.method || '');
  /** 왕복 거리(km): 적은 값이 먼저, 없으면 복지관↔출장지 직선거리 × 1.35(도로 보정) × 2 로 어림 */
  function kmOf(t) {
    if (num(t.km)) return { km: num(t.km), est: false };
    const p = placeOf(t), h = homeOf();
    if (!p || !h || !M.hasPos(p)) return { km: 0, est: true };
    return { km: Math.round(M.distKm(h, p) * 1.35 * 2 * 10) / 10, est: true };
  }
  const settings = () => S.get().settings || {};
  const effOf = t => num(t.fuelEff) || num(settings().fuelEff);
  const priceOf = t => num(t.fuelPrice) || num(settings().fuelPrice);
  /** 한 줄(출장 1건)의 실비: 유류비·통행료·주차료·운임·숙박비 */
  function rowCost(t) {
    const zone = zoneOf(t);
    const { km, est } = kmOf(t);
    const eff = effOf(t), price = priceOf(t);
    const fuel = ownCar(t) && km && eff && price ? Math.round(km * price / eff) : 0;
    const need = ownCar(t) ? [!km && '거리', !price && '유가', !eff && '연비'].filter(Boolean) : [];
    const lodgeCap = RULE.lodge[regionOf(t)] * Math.max(1, num(t.lodgeNights) || 1);
    const lodge = zone === '관외' ? Math.min(num(t.lodging), lodgeCap) : 0;
    const fare = zone === '관외' ? num(t.fare) : 0;
    return { zone, km, est, fuel, need, toll: num(t.toll), parking: num(t.parking), fare, lodge, lodgeCap, lodgeOver: zone === '관외' && num(t.lodging) > lodgeCap };
  }
  /** 담당자·날짜별로 묶어 일비·식비를 하루 단위로 계산 */
  function days(list) {
    const map = new Map();
    list.forEach(t => { const k = `${t.staff || ''}|${t.date || ''}`; if (!map.has(k)) map.set(k, []); map.get(k).push(t); });
    return [...map.values()].map(g => {
      const rows = g.map(t => ({ t, c: rowCost(t), min: minutesOf(t.time) }));
      const out = rows.some(r => r.c.zone === '관외');
      const min = rows.reduce((s, r) => s + r.min, 0);
      const car = rows.some(r => hasCar(r.t));
      let daily, why;
      if (out) { daily = RULE.outDaily; why = '관외 1일 정액'; } else {
        const long = min >= 240;
        daily = RULE.daily[long ? 'long' : 'short'][car ? 'car' : 'nocar'];
        why = `관내 ${min ? hm(min) : '시간 미입력'}${min ? (long ? ' (4시간 이상)' : ' (4시간 미만)') : ''}`;
      }
      // 식비는 관외 출장일에만. 적은 금액이 없으면 상한(2만원)으로 잡는다
      // 식비: 그날 줄마다 적은 금액을 더해 1일 2만원까지. 관외인데 아무것도 안 적었으면 2만원
      const mealTyped = rows.some(r => String(r.t.meal ?? '').trim() !== '');
      const mealSum = rows.reduce((a, r) => a + num(r.t.meal), 0);
      const meal = Math.min(RULE.meal, mealTyped ? mealSum : out ? RULE.meal : 0);
      const sum = k => rows.reduce((s, r) => s + r.c[k], 0);
      const actual = sum('fuel') + sum('toll') + sum('parking') + sum('fare') + sum('lodge');
      return { staff: g[0].staff || '(담당자 없음)', date: g[0].date, rows, out, min, car, daily, why, meal, actual, total: daily + meal + actual, noTime: !out && !min };
    }).sort((a, b) => (a.staff).localeCompare(b.staff) || (a.date || '').localeCompare(b.date || ''));
  }
  /** 특근: 담당자·날짜별 특근비(하루 특근시간 합: 4시간 미만·이상) + 식비(적은 금액, 1일 2만원까지) */
  function otDays(list) {
    const map = new Map();
    const rate = otRate();
    list.forEach(t => { const k = `${t.staff || ''}|${t.date || ''}`; if (!map.has(k)) map.set(k, []); map.get(k).push(t); });
    return [...map.values()].map(g => {
      const sum = g.reduce((a, t) => a + num(t.meal), 0);
      const meal = Math.min(RULE.meal, sum);
      const min = g.reduce((a, t) => a + minutesOf(t.time), 0);
      const pay = min >= 240 ? rate.long : rate.short;
      return { staff: g[0].staff || '(담당자 없음)', date: g[0].date, rows: g, meal, pay, noTime: !min, over: sum > RULE.meal, total: pay + meal, min };
    });
  }
  /** 한 달 정산: 사람마다 관내 출장 · 관외 출장 · 특근(식비) 묶음. 식비는 출장·특근 합쳐 하루 2만원까지 */
  function settle(month) {
    const ds = days(monthTrips(month));
    const ots = S.get().trips.filter(t => t.kind === '특근' && (t.date || '').startsWith(month));
    const people = new Map();
    const P = name => { if (!people.has(name)) people.set(name, { name, in: [], out: [], ot: [], inTotal: 0, outTotal: 0, otTotal: 0, total: 0 }); return people.get(name); };
    const tripMeal = new Map();
    ds.forEach(d => {
      const p = P(d.staff);
      const c = k => d.rows.reduce((a, r) => a + r.c[k], 0);
      const row = { date: d.date, where: d.rows.map(r => r.t.place).filter(Boolean).join(', '), time: d.rows.map(r => r.t.time).filter(Boolean).join(', '), min: d.min, why: d.why, daily: d.daily, fuel: c('fuel'), tollPark: c('toll') + c('parking'), fareLodge: c('fare') + c('lodge'), meal: d.meal, total: d.total, noTime: d.noTime };
      (d.out ? p.out : p.in).push(row);
      tripMeal.set(`${d.staff}|${d.date}`, d.meal);
    });
    otDays(ots).forEach(o => {
      const p = P(o.staff);
      const left = Math.max(0, RULE.meal - (tripMeal.get(`${o.staff}|${o.date}`) || 0));
      const typed = o.rows.reduce((a, t) => a + num(t.meal), 0);
      const meal = Math.min(typed, left);
      p.ot.push({ date: o.date, where: o.rows.map(t => t.purpose).filter(Boolean).join(', '), time: o.rows.map(t => t.time).filter(Boolean).join(', '), min: o.min, pay: o.pay, noTime: o.noTime, meal, typed, capped: typed > meal, total: o.pay + meal, ids: o.rows.map(t => t.id) });
    });
    const byDate = (a, b) => (a.date || '').localeCompare(b.date || '');
    const list = [...people.values()].map(p => {
      p.in.sort(byDate); p.out.sort(byDate); p.ot.sort(byDate);
      p.inTotal = p.in.reduce((a, r) => a + r.total, 0); p.outTotal = p.out.reduce((a, r) => a + r.total, 0); p.otTotal = p.ot.reduce((a, r) => a + r.total, 0);
      p.total = p.inTotal + p.outTotal + p.otTotal;
      return p;
    });
    const order = S.staff().map(x => x.name);
    list.sort((a, b) => ((order.indexOf(a.name) + 1) || 99) - ((order.indexOf(b.name) + 1) || 99));
    const sum = k => list.reduce((a, p) => a + p[k], 0);
    return { month, people: list, inTotal: sum('inTotal'), outTotal: sum('outTotal'), otTotal: sum('otTotal'), total: sum('total') };
  }
  const PART = { in: '관내 출장', out: '관외 출장', ot: '특근 (특근비·식비)', all: '전체 정산' };
  /** 정산 판: 월 전체 합계 + 사람마다 관내·관외·특근 금액과 인쇄 버튼 */
  function settlePanel(month) {
    const st = settle(month);
    if (!st.people.length) return '';
    const cell = (rows, total) => rows.length ? `<b class="num">${won(total)}원</b><small>${rows.length}일</small>` : '<span class="sub">-</span>';
    const pbtn = (name, part, n) => `<button class="btn btn-sm" type="button" data-act="tv-print-part" data-staff="${e(name)}" data-part="${part}" ${n ? '' : 'disabled'}>${PART[part].replace(' (특근비·식비)', '')}</button>`;
    return `<div class="tv-settle">
      <div class="tv-settle-head"><h3>📋 ${V.monthLabel(month)} 현장중심센터 여비 정산</h3><span class="tv-settle-total">전 직원 합계 <b class="num">${won(st.total)}원</b></span></div>
      <div class="table-wrap"><table class="tbl tv-settle-tbl"><thead><tr><th>담당자</th><th>관내 출장<small>(화성시 안)</small></th><th>관외 출장<small>(화성시 밖)</small></th><th>특근<small>(특근비 + 식비)</small></th><th class="tot">정산 받을 금액</th><th>인쇄</th></tr></thead><tbody>
        ${st.people.map(p => `<tr class="sc-row" style="--sc:${V.staffColor(p.name)}"><th>${V.staffDot(p.name)}${e(p.name)}</th><td>${cell(p.in, p.inTotal)}</td><td>${cell(p.out, p.outTotal)}</td><td>${cell(p.ot, p.otTotal)}${p.ot.length ? `<small>특근비 ${won(p.ot.reduce((a, r) => a + r.pay, 0))} · 식비 ${won(p.ot.reduce((a, r) => a + r.meal, 0))}</small>` : ''}${p.ot.some(r => r.capped) ? '<small class="tv-over">하루 2만원까지만</small>' : ''}</td><td class="tot"><b class="num">${won(p.total)}원</b></td>
          <td class="nowrap">${pbtn(p.name, 'in', p.in.length)}${pbtn(p.name, 'out', p.out.length)}${pbtn(p.name, 'ot', p.ot.length)}<button class="btn btn-sm btn-primary" type="button" data-act="tv-print-part" data-staff="${e(p.name)}" data-part="all">전체</button></td></tr>`).join('')}
        <tr class="tot"><th>전 직원 합계</th><td><b class="num">${won(st.inTotal)}원</b></td><td><b class="num">${won(st.outTotal)}원</b></td><td><b class="num">${won(st.otTotal)}원</b></td><td class="tot"><b class="num">${won(st.total)}원</b></td>
          <td class="nowrap"><button class="btn btn-sm" type="button" data-act="tv-print-sum">전체 요약 인쇄</button><button class="btn btn-sm btn-primary" type="button" data-act="tv-print-all">전원 정산서 인쇄</button></td></tr>
      </tbody></table></div>
      <p class="sub" style="margin:4px 0 0">관내: 4시간 미만 5천원 · 4시간 이상 1만원(기관차량·자차 같음) + 유류비·통행료·주차료 / 관외: 일비 2만원 + 운임·숙박비 / 하루에 관내·관외를 같이 가면 관외 / 식비는 출장·특근 합쳐 한 사람 하루 최대 2만원 / 특근비: 그날 특근시간 4시간 미만 ${won(otRate().short)}원 · 4시간 이상 ${won(otRate().long)}원 (특근 명령부의 시간 칸 기준, 시간이 없으면 4시간 미만). 특근 식비는 특근 명령부의 식비 칸에서 적어요.</p>
    </div>`;
  }
  /** 정산서 한 장: part = in | out | ot | all */
  function settleDoc(month, name, part, scale = 1) {
    const p = settle(month).people.find(x => x.name === name) || { name, in: [], out: [], ot: [], inTotal: 0, outTotal: 0, otTotal: 0, total: 0 };
    const parts = part === 'all' ? ['in', 'out', 'ot'] : [part];
    const rowsOf = k => p[k];
    const nRows = parts.reduce((a, k) => a + Math.max(3, rowsOf(k).length) + 2, 0);
    const rowMm = +(Math.min(9, 190 / Math.max(14, nRows)) * scale).toFixed(2);
    const fs = +((rowMm >= 8 ? 10 : rowMm >= 6.5 ? 9 : 8) * Math.min(1, scale + 0.08)).toFixed(2);
    const COLS = { in: [['날짜', 9], ['출장지', 25], ['출장시간', 14], ['일비', 11], ['유류·통행·주차', 14], ['식비', 11], ['합계', 16]], out: [['날짜', 9], ['출장지', 25], ['출장시간', 14], ['일비', 11], ['운임·숙박', 14], ['식비', 11], ['합계', 16]], ot: [['날짜', 9], ['특근 업무', 31], ['특근시간', 15], ['특근비', 14], ['식비', 14], ['합계', 17]] };
    const sec = k => {
      const rows = rowsOf(k), cols = COLS[k];
      const body = rows.map(r => `<tr style="height:${rowMm}mm"><td>${U.md(r.date)}</td><td class="l">${e(r.where)}</td><td>${e(r.time)}</td>${k === 'ot' ? `<td class="r">${won(r.pay)}</td><td class="r">${won(r.meal)}${r.capped ? '*' : ''}</td>` : `<td class="r">${won(r.daily)}</td><td class="r">${won(k === 'in' ? r.fuel + r.tollPark : r.fareLodge + r.fuel + r.tollPark)}</td><td class="r">${won(r.meal)}</td>`}<td class="r"><b>${won(r.total)}</b></td></tr>`);
      while (body.length < 3) body.push(`<tr style="height:${rowMm}mm">${cols.map(() => '<td>&nbsp;</td>').join('')}</tr>`);
      return `<h2 class="tv-doc-sec">${PART[k]}</h2><table class="doc-tbl order-tbl" style="font-size:${fs}pt"><colgroup>${cols.map(([, w]) => `<col style="width:${w}%">`).join('')}</colgroup>
        <thead><tr>${cols.map(([h]) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body.join('')}
        <tr class="tv-doc-total"><th colspan="${cols.length - 1}">${PART[k]} 소계 (${rows.length}일)</th><th class="r">${won(p[k + 'Total'])}</th></tr></tbody></table>`;
    };
    const total = parts.reduce((a, k) => a + p[k + 'Total'], 0);
    const sign = '<table class="sign"><tr><th rowspan="2" class="sign-side">결<br>재</th><th>담 당</th><th>팀 장</th></tr><tr><td></td><td></td></tr></table>';
    return `<article class="doc order-doc tv-settle-doc" style="font-size:${fs}pt">
      <div class="order-head">${sign}</div>
      <h1>${part === 'all' ? '여비 정산서' : `${PART[part]} 정산서`}</h1>
      <p class="order-sub">${V.monthLabel(month)} · 화성시아르딤복지관 직업지원팀 (현장중심직업재활센터) · <b>${e(name)}</b></p>
      ${parts.map(sec).join('')}
      <table class="doc-tbl tv-grand"><tr><th>정산 받을 금액${part === 'all' ? ' (관내 + 관외 + 특근)' : ''}</th><td class="r"><b>${won(total)}원</b></td></tr></table>
      <p class="order-sub tv-doc-note">관내 일비 4시간 미만 5천원·이상 1만원(기관차량·자차 같음), 관외 일비 2만원, 하루에 관내·관외를 같이 가면 관외. 특근비 4시간 미만 ${won(otRate().short)}원·이상 ${won(otRate().long)}원. 식비는 출장·특근 합쳐 1인 1일 2만원 이내${p.ot.some(r => r.capped) ? ' (*표시: 상한 적용)' : ''}. 유류비·통행료·주차료·운임·숙박비는 영수증 첨부.</p>
    </article>`;
  }
  /** 전 직원 월 합계 한 장 */
  function settleSumDoc(month) {
    const st = settle(month);
    return `<article class="doc order-doc" style="font-size:10pt">
      <div class="order-head"><table class="sign"><tr><th rowspan="2" class="sign-side">결<br>재</th><th>담 당</th><th>팀 장</th></tr><tr><td></td><td></td></tr></table></div>
      <h1>여비 정산 총괄표</h1>
      <p class="order-sub">${V.monthLabel(month)} · 화성시아르딤복지관 직업지원팀 (현장중심직업재활센터)</p>
      <table class="doc-tbl order-tbl"><colgroup><col style="width:16%"><col style="width:10%"><col style="width:14%"><col style="width:10%"><col style="width:14%"><col style="width:10%"><col style="width:12%"><col style="width:14%"></colgroup>
        <thead><tr><th>담당자</th><th>관내 일수</th><th>관내 금액</th><th>관외 일수</th><th>관외 금액</th><th>특근 일수</th><th>특근비·식비</th><th>정산 금액</th></tr></thead><tbody>
        ${st.people.map(p => `<tr style="height:10mm"><td><b>${e(p.name)}</b></td><td>${p.in.length}</td><td class="r">${won(p.inTotal)}</td><td>${p.out.length}</td><td class="r">${won(p.outTotal)}</td><td>${p.ot.length}</td><td class="r">${won(p.otTotal)}</td><td class="r"><b>${won(p.total)}</b></td></tr>`).join('')}
        <tr class="tv-doc-total" style="height:11mm"><th>합계</th><th></th><th class="r">${won(st.inTotal)}</th><th></th><th class="r">${won(st.outTotal)}</th><th></th><th class="r">${won(st.otTotal)}</th><th class="r">${won(st.total)}원</th></tr>
      </tbody></table>
      <p class="order-sub tv-doc-note">관내 일비 4시간 미만 5천원·이상 1만원(기관차량·자차 같음) + 유류비·통행료·주차료 / 관외 일비 2만원 + 운임·숙박비 / 특근비 4시간 미만 ${won(otRate().short)}원·이상 ${won(otRate().long)}원 / 식비 1인 1일 2만원 이내(출장·특근 합산).</p>
    </article>`;
  }
  const monthTrips = month => S.get().trips.filter(t => t.kind === '출장' && (t.date || '').startsWith(month));

  /* ---------- 화면 ---------- */
  function page(month) {

    const inp = (t, k, ph = '', w = 78, type = 'text') => `<input class="input sm tv-in" style="width:${w}px" data-chg="trip-field" data-id="${t.id}" data-field="${k}" value="${e(t[k] ?? '')}" placeholder="${ph}" ${type === 'num' ? 'inputmode="numeric"' : ''}>`;
    const sel = (t, k, list, auto) => `<select class="select sm tv-in" data-chg="trip-field" data-id="${t.id}" data-field="${k}"><option value="">자동(${auto})</option>${list.map(v => `<option ${t[k] === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
    const staffTotal = s => ds.filter(d => d.staff === s).reduce((a, d) => a + d.total, 0);
    const warn = ds.filter(d => d.noTime).length;
    const fuelNeed = ds.reduce((n, d) => n + d.rows.filter(r => r.c.need.length).length, 0);
    return `<section class="panel">
      ${settlePanel(month)}

        <details class="tv-rule"><summary><b>여비 지급 기준</b> <span class="sub">규정집 2026 · 누르면 펼쳐져요</span></summary>
          <div class="tv-rule-body">
            <table class="tbl tv-rule-tbl"><thead><tr><th>구분</th><th>일비</th></tr></thead>
              <tbody><tr><td>근무지 내 (화성시 안) 4시간 미만</td><td>${won(RULE.daily.short.car)}원</td></tr><tr><td>근무지 내 4시간 이상</td><td>${won(RULE.daily.long.car)}원</td></tr><tr><td>근무지 외 (화성시 밖)</td><td>${won(RULE.outDaily)}원</td></tr><tr><td>식비 (출장·특근 합쳐 1인 1일)</td><td>최대 ${won(RULE.meal)}원</td></tr><tr><td>특근비 (하루 특근시간) 4시간 미만</td><td>${won(otRate().short)}원</td></tr><tr><td>특근비 4시간 이상</td><td>${won(otRate().long)}원</td></tr></tbody></table>
            <ul class="sub">

              <li><b>근무지 외</b>: 운임(실비) + 숙박비(1박 상한 특별시 7만 · 광역시 6만 · 그 외 5만원) + 식비(1일 2만원 이내) + 일비(1일 2만원 이내)</li>
              <li>하루에 여러 번 나가면 <b>출장시간을 모두 더해</b> 계산하고, 1일 기준 금액을 넘지 않아요. 하루에 관내·관외를 같이 가면 <b>관외 기준</b>으로 줘요.</li>
              <li>관내 일비는 <b>기관차량·자차 상관없이</b> 4시간 미만 5천원, 4시간 이상 1만원이에요. 자차는 유류비를 따로 더해요.</li>
              <li>식비는 출장 식비와 특근 식비를 합쳐 <b>한 사람 하루 최대 2만원</b>이에요.</li>
            </ul>
          </div>
        </details>
        <div class="tv-set">
          <span class="sub">개인 차량 유류비 기본값</span>
          <label>연비 <input class="input sm" style="width:64px" id="tvEff" value="${e(st.fuelEff || '')}" placeholder="km/L" inputmode="decimal" ${admin ? '' : 'disabled'}> km/L</label>
          <label>유가 <input class="input sm" style="width:76px" id="tvPrice" value="${e(st.fuelPrice || '')}" placeholder="원/L" inputmode="numeric" ${admin ? '' : 'disabled'}> 원/L</label>

          ${admin ? '<button class="btn btn-sm" type="button" data-act="tv-save-set">저장</button>' : '<span class="sub">(관리자가 정해요 · 줄마다 따로 적을 수 있어요)</span>'}

          <button class="btn btn-sm btn-primary" type="button" data-act="tv-print" ${list.length ? '' : 'disabled'}>여비 명세 인쇄</button>

        ${warn || fuelNeed ? `<p class="tv-warn">${warn ? `⏰ 출장시간이 없는 날 <b>${warn}</b>일은 4시간 미만으로 계산했어요. 시간 칸에 <b>9~12시</b>처럼 적어 주세요. ` : ''}${fuelNeed ? `⛽ 개인 차량 <b>${fuelNeed}</b>건은 거리·유가·연비가 모자라 유류비가 0원이에요.` : ''}</p>` : ''}
      </div>
      ${list.length ? `<h3 class="tv-detail-h">출장 날짜별 계산 <span class="sub">시간·방법·영수증 금액을 여기서 고치면 위 정산에 바로 반영돼요</span></h3>
      <div class="table-wrap"><table class="tbl tv-tbl"><thead><tr>
        <th>날짜·성명</th><th>출장지</th><th>출장시간</th><th>방법 · 구분</th><th>유류비 계산<small>개인 차량</small></th><th>통행료 · 주차료</th><th>관외 비용<small>운임·숙박·식비</small></th>
